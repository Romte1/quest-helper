# Quest Helper - SPANISH translations (messages_es.properties) - UTF-8
#
# FORMAT - "English-as-key" pattern:
#   <English text exactly as it appears in the code>=<Spanish translation>
#   Example:  Get a bucket=Consigue un Bucket
#
# The English text lives in the CODE (translationService.t("...")). This file
# only needs an entry once a translation exists. If an entry is missing, the
# plugin automatically falls back to English - never to an ugly internal key.
#
# Everything before the first '=' is the key, the rest is the value. Spaces in
# keys do NOT need escaping. Blank lines and lines starting with '#' or '!'
# are ignored.
#
# HOW TO TRANSLATE A FUTURE QUEST:
#   1. The code already calls t("English text"): English works without touching
#      anything here.
#   2. Add a line HERE with that exact English text on the left.
#   3. Done. messages.properties does not need to be touched and no keys are
#      generated.
#
# RULES:
#   - Quest names (Cook's Assistant, Imp Catcher, ...) are NEVER translated:
#     do not add entries for them.
#   - Game entity names (items, NPCs, locations: Bucket, Wizards' Tower,
#     Grand Exchange, Lumbridge, ...) stay in English in the translations too.
#   - Dialog choices (addDialogStep) and requirement checks that match live
#     game text are NEVER translated.

# Quest: Cook's Assistant (the quest name is not translated)
Necessary if you do not have a pot / bucket=Necesario si no tienes una Pot / Bucket
Purchase a bucket from the Lumbridge General Store.=Compra un Bucket en la General Store de Lumbridge.
Purchase a pot from the Lumbridge General Store.=Compra una Pot en la General Store de Lumbridge.
Grab an egg from the farm north of Lumbridge.=Coge un Egg de la granja al norte de Lumbridge.
Pick some wheat north of Lumbridge.=Recoge un poco de Wheat al norte de Lumbridge.
Climb up the ladder in the Mill north of Lumbridge to the top floor.=Sube la escalera del Mill al norte de Lumbridge hasta el piso superior.
Fill the hopper with your grain.=Llena la Hopper con tu Grain.
Operate the hopper controls.=Opera los controles de la Hopper.
Climb down the ladder in the Mill to the ground floor.=Baja la escalera del Mill hasta la planta baja.
Collect the flour in the bin.=Recoge el Flour del contenedor.
Milk the dairy cow north of Lumbridge.=Ordeña la vaca lechera al norte de Lumbridge.
Give the Cook in Lumbridge Castle's kitchen the required items to finish the quest.=Entrega al Cook en la cocina del Castillo de Lumbridge los items requeridos para terminar la misión.
Permission to use The Cook's range.=Permiso para usar la range del Cook.
Starting off=Empezando
Getting the Egg=Consiguiendo el Egg
Getting the Flour=Consiguiendo el Flour
Getting the Milk=Consiguiendo el Milk
Finishing up=Finalizando

# Quest: Imp Catcher (the quest name is not translated)
Bring Mizgog his beads=Lleva las beads a Mizgog
Collect one of each bead. You can kill imps for these beads, or buy them on the Grand Exchange.=Consigue una bead de cada color. Puedes matar imps para conseguir estas beads, o comprarlas en el Grand Exchange.
Head to the Wizards' Tower and climb up the staircase with the required beads.=Ve a la Wizards' Tower y sube la escalera con las beads requeridas.
Talk to Wizard Mizgog with the required beads to finish the quest.=Habla con Wizard Mizgog con las beads requeridas para terminar la misión.
Imps (level 2) if you plan on collecting the beads yourself=Imps (nivel 2) si planeas conseguir las beads tú mismo

# Quest: The Restless Ghost (the quest name is not translated)
If you've lost it you can get another from Father Urhney in his hut in the south east of Lumbridge Swamp=Si lo perdiste puedes conseguir otro de Father Urhney en su cabaña al sureste de Lumbridge Swamp
Check your bank if you don't have this item on you.=Revisa tu bank si no tienes este item encima.
Talk to Father Aereck in the Lumbridge Church.=Habla con Father Aereck en la Lumbridge Church.
Talk to Father Urhney, west of the Lumbridge Swamp.=Habla con Father Urhney, al oeste de Lumbridge Swamp.
Open the coffin in the Lumbridge Graveyard to spawn the ghost.=Abre el coffin en el Lumbridge Graveyard para hacer aparecer al ghost.
Search the coffin in the Lumbridge Graveyard to spawn the ghost.=Busca en el coffin del Lumbridge Graveyard para hacer aparecer al ghost.
Speak to the Ghost that appears whilst wearing your Ghostspeak Amulet.=Habla con el Ghost que aparece mientras llevas tu Ghostspeak Amulet.
Enter the Wizards' Tower basement, south of Draynor village.=Entra al sótano de la Wizards' Tower, al sur de Draynor village.
Search the Altar. A skeleton (level 13) will appear and attack you, but you can just run away.=Busca en el Altar. Un skeleton (nivel 13) aparecerá y te atacará, pero puedes simplemente huir.
Leave the basement.=Sal del sótano.
Open the ghost's coffin in the Lumbridge graveyard.=Abre el coffin del ghost en el Lumbridge graveyard.
Search the coffin to put the skull back and finish the quest.=Busca en el coffin para devolver el skull y terminar la misión.
A skeleton (level 13) you can run away from=Un skeleton (nivel 13) del que puedes huir
Talk to Father Aereck=Habla con Father Aereck
Get a ghostspeak amulet=Consigue un ghostspeak amulet
Talk to the ghost=Habla con el ghost
Return the ghost's skull=Devuelve el skull del ghost

# Quest: Pirate's Treasure (the quest name is not translated)
You can get another one from Redbeard Frank=Puedes conseguir otro de Redbeard Frank
Talk to Redbeard Frank in Port Sarim.=Habla con Redbeard Frank en Port Sarim.
Read the Pirate message.=Lee el Pirate message.
Climb up the stairs in The Blue Moon Inn in Varrock.=Sube las escaleras de The Blue Moon Inn en Varrock.
Open the chest by using the key on it.=Abre el chest usando la key encima.
Dig in the middle of the cross in Falador Park, and kill the Gardener (level 4) who appears. Once killed, dig again.=Cava en el centro de la cross en Falador Park, y mata al Gardener (nivel 4) que aparece. Tras matarlo, cava de nuevo.
Kill the Gardener (level 4).=Mata al Gardener (nivel 4).
Gardener (level 4)=Gardener (nivel 4)
Talk to Redbeard Frank=Habla con Redbeard Frank
Discover the treasure=Descubre el treasure
Please open Pirate Treasure's Quest Journal to sync the current quest state.=Abre el Quest Journal de Pirate Treasure para sincronizar el estado actual de la misión.
Talk to one of the Seamen on the docks in Port Sarim to go to Musa Point.=Habla con uno de los Seamen en los muelles de Port Sarim para ir a Musa Point.
Talk to Zembo in the Karamja Wines, Spirits and Beers bar. Buy one Karamjan rum.=Habla con Zembo en el bar Karamja Wines, Spirits and Beers. Compra un Karamjan rum.
Pick 10 bananas nearby, and then talk to Luthas about working for him.=Coge 10 bananas cerca, y luego habla con Luthas sobre trabajar para él.
Put the Karamjan rum into the crate.=Pon el Karamjan rum en el crate.
Right-click fill the rest of the crate with bananas, then talk to Luthas.=Haz right-click en fill para llenar el crate con bananas, luego habla con Luthas.
Talk to Luthas and tell him you finished filling the crate.=Habla con Luthas y dile que terminaste de llenar el crate.
Head back to Port Sarim. Pay the Customs Officer to sail there.=Regresa a Port Sarim. Paga al Customs Officer para zarpar hacia allá.
Grab the white apron from the Fishing Shop.=Coge el white apron de la Fishing Shop.
Search the crate in the back room of the Port Sarim food shop. Make sure you're wearing your white apron.=Busca el crate en la trastienda de la food shop de Port Sarim. Asegúrate de llevar tu white apron.
Bring the Karamjan rum to Redbeard Frank in Port Sarim.=Lleva el Karamjan rum a Redbeard Frank en Port Sarim.
Rum smuggling=Contrabando de rum
Back to Port Sarim=De vuelta a Port Sarim

