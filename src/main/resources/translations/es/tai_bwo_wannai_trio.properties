# Spanish translations for Tai Bwo Wannai Trio.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Timfraku upstairs in his house in Tai Bwo Wannai.=Habla con Timfraku en el piso de arriba de su casa en Tai Bwo Wannai.
Open your quest journal to sync your current state.=Abre tu diario de misiones para sincronizar tu estado actual.
Using your small fishing net, catch atleast 23 raw karambwanji just south of Tai Bwo Wannai.=Con tu small fishing net, pesca al menos 23 raw karambwanji justo al sur de Tai Bwo Wannai.
Go to Brimhaven and talk to Lubufu. You have to talk to him multiple times. You'll need to ask him twice about what he does, then talk to him to give him the karambwanji.=Ve a Brimhaven y habla con Lubufu. Tendrás que hablar con él varias veces. Deberás preguntarle dos veces sobre lo que hace y luego hablar con él para darle los karambwanji.
Get a Vessel from Lubufu by asking what he uses to catch them multiple times. Drop it, and talk to him go get another, then pick up the one you dropped. You can get as many as you want but you need 2 to complete this quest.=Consigue un Vessel de Lubufu preguntándole varias veces qué usa para pescarlos. Suéltalo, habla con él para conseguir otro y recoge el que soltaste. Puedes conseguir tantos como quieras, pero necesitas 2 para completar esta misión.
Drop the vessel, then get another from Lubufu.=Suelta el vessel y consigue otro de Lubufu.
Get another Vessel from Lubufu.=Consigue otro Vessel de Lubufu.
Pick up the vessel you dropped.=Recoge el vessel que soltaste.
Use a karambwanji on a karambwan Vessel to fill it.=Usa un karambwanji en un karambwan Vessel para llenarlo.
Go east to Musa point to buy some Karamjan rum from Zembo.=Ve al este, a Musa point, para comprar Karamjan rum a Zembo.
Slice a banana with a knife. You can get a banana from one of the trees in the plantation.=Corta una banana con un knife. Puedes conseguir una banana de uno de los árboles de la plantación.
Add banana slices to the karamjan rum to make Karamjan rum with banana slices.=Añade banana slices al karamjan rum para hacer Karamjan rum with banana slices.
Talk to Tiadeche in east Karamja, near the fairy ring DKP. You can teleport off Karamja; the Karamjan rum with banana will not break.=Habla con Tiadeche en el este de Karamja, cerca del fairy ring DKP. Puedes teletransportarte fuera de Karamja; el Karamjan rum with banana no se romperá.
Use a filled vessel on Tiadeche. Make sure to finish the dialogue with him and accept the karambwan he offers!=Usa un filled vessel en Tiadeche. Asegúrate de terminar el diálogo con él y aceptar el karambwan que te ofrece.
Talk to Tiadeche more.=Habla más con Tiadeche.
Pickup some seaweed from Karamja's coast.=Coge seaweed de la costa de Karamja.
Get some jogre bones. You can kill the jogres south of Tiadeche.=Consigue unos jogre bones. Puedes matar a los jogres al sur de Tiadeche.
Pickup the jogre bones.=Coge los jogre bones.
Kill a monkey to get its corpse, there are plenty of monkeys around Karamja and you will need either magic or range to kill one.=Mata a un monkey para conseguir su cadáver; hay muchos monkeys por Karamja y necesitarás magic o range para matar a uno.
Pickup the monkey corpse.=Coge el monkey corpse.
Talk to Tamayu, he is located north of Shilo Village near the mining sign on the map, after watching him use your tinder box on your jogre bones and pick up the burnt jogre bones.=Habla con Tamayu, que está al norte de Shilo Village, cerca del símbolo de minería del mapa, después de verle usar tu tinder box en tus jogre bones y recoger los burnt jogre bones.
Use the paste on an iron or better spear.=Usa la paste en una iron spear o mejor.
Use an agility potion (4) on Tamayu.=Usa una agility potion (4) en Tamayu.
Use a poisoned spear on Tamayu.=Usa una poisoned spear en Tamayu.
Fish raw Karambwan next to Tiadeche with a loaded vessel or buy them from the GE.=Pesca raw Karambwan junto a Tiadeche con un loaded vessel o cómpralos en el GE.
Use a pestle and mortar on a karambwanji.=Usa un pestle and mortar en un karambwanji.
Use the karambwanji paste on the burnt jogre bones.=Usa la karambwanji paste en los burnt jogre bones.
Use a pestle and mortar on a poison karambwan.=Usa un pestle and mortar en un poison karambwan.
Use the karambwan paste on a iron or better spear.=Usa la karambwan paste en una iron spear o mejor.
Wait for the bones to burn, then pick them up.=Espera a que los huesos se quemen y luego recógelos.
Cook the karambwan for a poison karambwan. Note you may fail this and need to try again.=Cocina el karambwan para obtener un poison karambwan. Ten en cuenta que puedes fallar y tener que intentarlo de nuevo.
Use a tinderbox on the jogre bones to set them on fire.=Usa un tinderbox en los jogre bones para prenderles fuego.
Go on a hunt with Tamayu.=Ve de caza con Tamayu.
RIGHT-CLICK use the bones on a fire. You can either make one yourself, or use them on the fire south of Tai Bwo Wannai.=HAZ CLIC DERECHO para usar los huesos en un fuego. Puedes hacer uno tú mismo o usarlos en el fuego al sur de Tai Bwo Wannai.
Use your monkey corpse on Tamayu to have him skin it for you.=Usa tu monkey corpse en Tamayu para que te lo desuelle.
Use your seaweed on your monkey skin to make a seaweed sandwich.=Usa tu seaweed en tu monkey skin para hacer un seaweed sandwich.
Talk to Tinsay on Cairn Isle west of Shilo Village, south of fairy ring CKR. Keep talking to him, giving him the items he asks for.=Habla con Tinsay en Cairn Isle, al oeste de Shilo Village, al sur del fairy ring CKR. Sigue hablando con él y dándole los objetos que te pida.
Use the vessel on Tinsay.=Usa el vessel en Tinsay.
Go back to Tiadeche located north of fairy ring DKP and use the crafting manual on him.=Vuelve con Tiadeche, al norte del fairy ring DKP, y usa el crafting manual en él.
Go to Timfraku's house to finish the quest.=Ve a la casa de Timfraku para terminar la misión.
Talk to Timfraku to end the quest, the option chosen here does not matter. NOTE: you will need to talk to each of the brothers individually in Tai Bwo Wannai to receive experience rewards as well as the ability to cook karambwans properly.=Habla con Timfraku para terminar la misión; la opción que elijas aquí no importa. NOTA: tendrás que hablar con cada uno de los hermanos individualmente en Tai Bwo Wannai para recibir las recompensas de experiencia, así como la capacidad de cocinar karambwans correctamente.
There's one on the counter in the Musa Point general store=Hay uno en el mostrador de la tienda general de Musa Point
Bone and black spear does NOT work=Bone spear y black spear NO funcionan
You can obtain during quest with 65 Fishing.=Puedes obtenerlo durante la misión con 65 de Fishing.
Ability to catch and cook Karambwans (after talking to Tinsay after the quest)=Capacidad de pescar y cocinar Karambwans (tras hablar con Tinsay después de la misión)
Ability to use Tai Bwo Wannai teleport scrolls=Capacidad de usar los pergaminos de teletransporte a Tai Bwo Wannai
Ability to complete the smithing section of Barbarian Training=Capacidad de completar la sección de herrería del Barbarian Training
Starting Off=Empezando
Gathering quest materials=Reuniendo materiales para la misión
Helping Tiadeche=Ayudando a Tiadeche
Collecting final items=Recogiendo los objetos finales
Helping Tamayu and Tinsay=Ayudando a Tamayu y Tinsay
Finishing the quest=Terminando la misión
Any logs to make a fire=Cualquier tipo de logs para hacer un fuego
Iron spear or better (You will lose the spear)=Iron spear o mejor (perderás la spear)
Iron spear or better (kp) (You will lose the spear)=Iron spear o mejor (kp) (perderás la spear)
Ranged or Magic equipment to kill a level 3 monkey=Equipo de rango o Magic para matar un monkey de nivel 3
Extra Raw Karambwans in case you burn the one given=Raw Karambwans extra por si quemas el que te dan
Dramen staff if you have access to fairy rings=Dramen staff si tienes acceso a los fairy rings
Sliced Banana (Use a knife on a banana)=Sliced Banana (usa un knife con un banana)
65 Fishing for Raw Karambwan if any type of Ironman account, if you burn the one given to you.=65 de Fishing para Raw Karambwan en cualquier tipo de cuenta Ironman, por si quemas el que te dan.


