Kill an Earth Warrior (lvl 51) and a Mammoth (lvl 80).=Mata un Earth Warrior (nivel 51) y un Mammoth (nivel 80).
Wilderness lever can teleport you to either Edgeville or Ardougne=La palanca del Wilderness puede teletransportarte a Edgeville o a Ardougne
40 random free runes from Lundail once per day=40 runas aleatorias gratis de Lundail una vez al día
