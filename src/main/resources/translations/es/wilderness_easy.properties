# Spanish translations for Wilderness Easy Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Kill a Mammoth in the Wilderness.=Mata un Mammoth en el Wilderness.
Enter the Edgeville dungeon.=Entra en la mazmorra de Edgeville.
Enter the Wilderness.=Entra en el Wilderness.
Equip a team cape. If you already have one on, re-equip it.=Equipa una team cape. Si ya llevas una puesta, vuelve a equiparla.
Enter the chaos altar north of Edgeville with a chaos talisman/tiara, or enter it through the Abyss.=Entra en el chaos altar al norte de Edgeville con un chaos talisman/tiara, o entra a través del Abyss.
Go to the Fountain of Rune with an item you can cast Low Alchemy on.=Ve a la Fountain of Rune con un objeto al que puedas lanzar Low Alchemy.
Cast Low Alchemy on anything.=Lanza Low Alchemy sobre cualquier cosa.
Speak with the Mage of Zamorak in Varrock and ask him about the Abyss.=Habla con el Mage of Zamorak en Varrock y pregúntale por el Abyss.
Speak with the Mage of Zamorak in the Wilderness to teleport to the Abyss.=Habla con el Mage of Zamorak en el Wilderness para teletransportarte al Abyss.
Mine iron in the Wilderness.=Mina hierro en el Wilderness.
Pickup 5 red spider eggs in the Edgeville Wilderness Dungeon.=Recoge 5 red spider eggs en el Edgeville Wilderness Dungeon.
Kill an Earth warrior in the north of the Edgeville Wilderness Dungeon.=Mata un Earth warrior en el norte del Edgeville Wilderness Dungeon.
Pull the Lever in Edgeville. This will take you to DEEP Wilderness, bank anything you aren't willing to lose.=Tira de la palanca en Edgeville. Te llevará al Wilderness PROFUNDO; guarda en el banco lo que no estés dispuesto a perder.
Stand in the Demonic Ruins until the ruins automatically restore a prayer point for you. You must be at less than your max prayer points.=Quédate en las Demonic Ruins hasta que las ruinas te restauren automáticamente un punto de prayer. Debes tener menos que tus puntos de prayer máximos.
Pray at the Chaos Altar.=Reza en el Chaos Altar.
Climb down the ladder that leads to the King Black Dragon Lair.=Baja por la escalera que lleva a la King Black Dragon Lair.
Pull the lever to enter the King Black Dragon lair.=Tira de la palanca para entrar en la guarida del King Black Dragon.
Talk to the Lesser Fanatic in Edgeville to claim your reward!=Habla con el Lesser Fanatic en Edgeville para reclamar tu recompensa.
Access to the Chaos altar=Acceso al Chaos altar
Chaos Talisman/Tiara, Catalytic Talisman/Tiara, RC-skill cape or travel through Abyss=Chaos Talisman/Tiara, Catalytic Talisman/Tiara, la cape de Runecraft o viajar a través del Abyss
