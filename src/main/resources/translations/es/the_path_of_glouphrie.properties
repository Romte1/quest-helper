# Spanish translations for The Path of Glouphrie.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Unlock Yewnock's machine room in the Tree Gnome Village dungeon.=Desbloquea la sala de máquinas de Yewnock en la mazmorra de Tree Gnome Village.
Push the monolith north once.=Empuja el monolito al norte una vez.
Open the chest for some shapes.=Abre el cofre para conseguir formas.
Push the south-west monolith north once.=Empuja el monolito suroeste al norte una vez.
Push the north-west monolith east once.=Empuja el monolito noroeste al este una vez.
Open the chest for some more shapes. If the chest doesn't give you any shapes, drop the shapes in your inventory first, then click the chest, then pick up the shapes from the ground.=Abre el cofre para conseguir más formas. Si el cofre no te da formas, tira primero las formas de tu inventario, luego haz clic en el cofre y después recoge las formas del suelo.
Picklock the chest for a key.=Abre el cofre con ganzúa para conseguir una llave.
Push the small monolith south once.=Empuja el monolito pequeño al sur una vez.
Push the north-west monolith west once.=Empuja el monolito noroeste al oeste una vez.
Search the chest for the strongroom key and crystal chime seed.=Busca en el cofre la strongroom key y la crystal chime seed.
You can get another one from the golden chest in Yewnock's storeroom=Puedes conseguir otra en el cofre dorado del storeroom de Yewnock
Inspect the Singing bowl, then click it again to create the Crystal chime.=Inspecciona el Singing bowl y luego haz clic de nuevo en él para crear la Crystal chime.
Push the south-east monolith west once.=Empuja el monolito sureste al oeste una vez.
Unlock the gate to Yewnock's machine room.=Desbloquea la puerta de la sala de máquinas de Yewnock.
Any crossbow=Cualquier crossbow
Combat equipment=Equipo de combate
Earmuffs or a Slayer helmet=Earmuffs o un Slayer helmet
You will take a lot more damage without these=Recibirás mucho más daño sin esto
Teleport to Castle Wars (Fairy Ring BKP or Ring of Dueling [2])=Teletransporte a Castle Wars (Fairy Ring BKP o Ring of Dueling [2])
Several run restore items=Varios objetos para restaurar run
Spirit tree to Tree Gnome Village [1]=Spirit tree a Tree Gnome Village [1]
You can get a new one by going back to the storeroom in the Tree Gnome Village dungeon=Puedes conseguir uno nuevo volviendo al storeroom de la mazmorra de Tree Gnome Village
3 Warped Terrorbirds (level 138)=3 Warped Terrorbirds (nivel 138)
Evil Creature (level 1)=Evil Creature (nivel 1)
Access to the Poison Waste Dungeon=Acceso a la Poison Waste Dungeon
Ability to unlock warped creatures as a Slayer task=Habilidad de desbloquear warped creatures como tarea de Slayer
Access to a new spirit tree destination in the Poison Waste=Acceso a un nuevo destino de spirit tree en Poison Waste
Starting off=Empezando
Unveil the Evil creature=Desvela la Evil creature
Inform King Bolren=Informa al King Bolren
Find Longramble=Encuentra a Longramble
Operate Yewnock's machine & solve the puzzle. All items left on the ground are lost.=Opera la máquina de Yewnock y resuelve el puzle. Todos los objetos que dejes en el suelo se pierden.
Get more discs from the chests outside. You can drop discs before you get more. You can also use the exchanger next to Yewnock's machine.=Consigue más discos de los cofres de fuera. Puedes tirar discos antes de conseguir más. También puedes usar el exchanger junto a la máquina de Yewnock.
A solution has been calculated, exit the machine interface & click Yewnock's exchanger.=Se ha calculado una solución; sal de la interfaz de la máquina y haz clic en el exchanger de Yewnock.
A solution has been found, click Yewnock's machine and insert the discs as prompted.=Se ha encontrado una solución; haz clic en la máquina de Yewnock e inserta los discos como se indica.
Operate Yewnock's machine to calculate a solution.=Opera la máquina de Yewnock para calcular una solución.
Insert the highlighted disc into the highlighted slot.=Inserta el disco marcado en la ranura marcada.
An incorrect disc has been inserted into the machine, click the reset button & follow the instructions.=Se ha insertado un disco incorrecto en la máquina; haz clic en el botón de reinicio y sigue las instrucciones.
Click the submit button.=Haz clic en el botón de enviar.
Click the confirm button.=Haz clic en el botón de confirmar.
Found unexpected disc(s) in the exchange input, reset & follow the instructions.=Se han encontrado discos inesperados en la entrada del intercambio; reinicia y sigue las instrucciones.
Click the exchange button until a %s appears.=Haz clic en el botón de intercambio hasta que aparezca un %s.
A partial solution has been calculated, exit the machine interface & click Yewnock's exchanger.=Se ha calculado una solución parcial; sal de la interfaz de la máquina y haz clic en el exchanger de Yewnock.
A partial solution has been calculated, click Yewnock's exchanger to start exchanging discs.=Se ha calculado una solución parcial; haz clic en el exchanger de Yewnock para empezar a intercambiar discos.
A solution has been calculated, click Yewnock's exchanger to start exchanging discs.=Se ha calculado una solución; haz clic en el exchanger de Yewnock para empezar a intercambiar discos.
Fairy Ring BKP or Ring of Dueling to Castle Wars=Fairy Ring BKP o Ring of Dueling a Castle Wars
Go to Longramble, make sure to head to a bank & gear up first. You can drop all leftover discs.=Ve a Longramble; asegúrate de pasar antes por un banco y equiparte. Puedes tirar todos los discos que te sobren.
Talk to the Spirit Tree.=Habla con el Spirit Tree.
Use the Crystal Chime on the Spirit Tree.=Usa la Crystal Chime en el Spirit Tree.
Talk to the Spirit Tree again.=Habla con el Spirit Tree de nuevo.
Exit the storeroom.=Sal del storeroom.
Exit the dungeon.=Sal de la mazmorra.
Kill the Evil Creature next to King Bolren.=Mata a la Evil Creature junto al King Bolren.
Talk to King Bolren about your next step.=Habla con el King Bolren sobre tu siguiente paso.
Spirit tree to Gnome Stronghold [2]=Spirit tree a Gnome Stronghold [2]
Talk to Gianne jnr. in Tree Gnome Stronghold to ask for Longramble's whereabouts.=Habla con Gianne jnr. en Tree Gnome Stronghold para preguntar por el paradero de Longramble.
Talk to King Bolren in the Tree Gnome Village to start the quest.=Habla con el King Bolren en Tree Gnome Village para empezar la misión.
Talk to King Bolren again.=Habla con el King Bolren de nuevo.
Talk to Golrie in the Tree Gnome Village dungeon.=Habla con Golrie en la mazmorra de Tree Gnome Village.
You'll need to talk to Golrie again after giving him the key.=Tendrás que hablar con Golrie de nuevo después de darle la llave.
Get the Tree Gnome Village dungeon key from the crate to the north-east.=Consigue la llave de la mazmorra de Tree Gnome Village del cajón del noreste.
Enter the sewer to the west of the Spirit tree.=Entra en la alcantarilla al oeste del Spirit tree.
Climb up the ladder.=Sube la escalera.
Climb down the ladder to the east.=Baja la escalera al este.
Climb down the ladder to the north-west. Re-activate your run if you step in any puddles.=Baja la escalera al noroeste. Reactiva tu run si pisas algún charco.
Go to the boss room to the north. Re-activate your run if you step in any puddles.=Ve a la sala del jefe al norte. Reactiva tu run si pisas algún charco.
Kill the Terrorbirds. You can use the pillars around the room to only fight one at a time. They fight with both Melee and Ranged.=Mata a los Terrorbirds. Puedes usar los pilares de la sala para luchar contra uno a la vez. Luchan tanto cuerpo a cuerpo como a distancia.
Peek through the heavy door.=Mira por la puerta pesada.
Watch the final cutscene.=Mira la escena final.
Talk to Hazelmere. If you didn't have room for all 4 lamps, you can speak to Hazelmere after the quest to recover any lost lamps.=Habla con Hazelmere. Si no tenías espacio para las 4 lámparas, puedes hablar con Hazelmere después de la misión para recuperar las lámparas perdidas.
Enter the storeroom to the east in the Tree Gnome Village dungeon.=Entra en el storeroom al este de la mazmorra de Tree Gnome Village.
Click the lectern.=Haz clic en el lectern.
Click Chapter 1 to learn about the mysterious stranger.=Haz clic en el Chapter 1 para saber sobre el misterioso desconocido.
Click Chapter 2 to learn about the great king's death.=Haz clic en el Chapter 2 para saber sobre la muerte del gran rey.
Click Chapter 3 to learn about the old foe.=Haz clic en el Chapter 3 para saber sobre el viejo enemigo.
Watch the cutscene.=Mira la escena.
Learn about the lore. All items left on the ground are lost.=Aprende sobre la historia. Todos los objetos que dejes en el suelo se pierden.
Squeeze through the loose railing.=Pasa por el hueco de la barandilla suelta.
Climb down the ladder to the Tree Gnome Village dungeon.=Baja la escalera hacia la mazmorra de Tree Gnome Village.
Get to Yewnock's storeroom.=Llega al storeroom de Yewnock.
Solve the disc puzzle.=Resuelve el puzle de discos.
