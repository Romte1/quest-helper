# Spanish translations for Morytania Hard Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Any pickaxe=Cualquier pickaxe
Nose protection=Protección nasal
Any axe=Cualquier axe
Light source=Fuente de luz
Combat gear=Equipo de combate
Food=Comida
Access to the fairy ring system=Acceso al sistema de fairy rings
Enter the haunted mine.=Entra en la Haunted Mine.
Mine the mithril ore in the north-east of the area.=Mina el mineral de mithril en el noreste de la zona.
Enter the mine cart shaft by the entrance, directly south of you.=Entra en el pozo de la vagoneta junto a la entrada, directamente al sur de ti.
Enter the grotto tree in Mort Myre Swamp.=Entra en el árbol de la gruta en Mort Myre Swamp.
Pray at the altar with Piety activated.=Reza en el altar con Piety activado.
Complete a Hard Temple Trek. Alternatively complete a Hard Burgh de Rott Ramble. You can use Route 1 to evade combat events.=Completa un Hard Temple Trek. Alternativamente, completa un Hard Burgh de Rott Ramble. Puedes usar la Route 1 para evitar los eventos de combate.
Use the shortcut to get to the bridge. This achievement only works one-way, so you must go from top-down.=Usa el atajo para llegar al puente. Este logro solo funciona en un sentido, así que debes ir de arriba abajo.
Plant and harvest the bittercap mushrooms in Canifis. It takes 4 hours to fully grow.If you're waiting for it to grow and want to complete further tasks, use the tick box on panel.=Planta y cosecha los bittercap mushrooms en Canifis. Tardan 4 horas en crecer del todo. Si estás esperando a que crezcan y quieres completar más tareas, usa la casilla del panel.
Climb up the chain to get to the second floor of the slayer tower.=Sube por la cadena para llegar al segundo piso del Slayer Tower.
Climb the advanced spike chain. Go down and back up if you rip your hands as you climb.=Sube por la cadena de pinchos avanzada. Baja y vuelve a subir si te rasgas las manos al trepar.
Cross the gangplank to Bill Teach's ship.=Cruza la pasarela hasta el barco de Bill Teach.
Talk to Bill Teach to travel to Mos Le'Harmless.=Habla con Bill Teach para viajar a Mos Le'Harmless.
Enter the Mos Le'Harmless Cave.=Entra en la Mos Le'Harmless Cave.
Kill a Cave horror.=Mata un Cave horror.
Climb the staircase in the north east of the Cave Horror dungeon.=Sube las escaleras en el noreste de la mazmorra de Cave Horror.
Burn mahogany logs on the island.=Quema mahogany logs en la isla.
Chop mahogany logs on the island.=Tala mahogany logs en la isla.
Talk to Brother Tranquility to travel to Harmony Island.=Habla con Brother Tranquility para viajar a Harmony Island.
Plant and harvest watermelon on Harmony Island. It takes 80 minutes to fully grow. If you're waiting for it to grow and want to complete further tasks, use the tick box on panel.=Planta y cosecha watermelon en Harmony Island. Tardan 80 minutos en crecer del todo. Si estás esperando a que crezcan y quieres completar más tareas, usa la casilla del panel.
Enter the Kharyrll portal in your POH. Through a Portal Chamber or Portal Nexus. Either make or construct a Portal Chamber / Kharyrll Portal.=Entra en el portal de Kharyrll de tu POH. Mediante un Portal Chamber o un Portal Nexus. Fabrica o construye un Portal Chamber / Kharyrll Portal.
Talk to Le-Sabre near Canifis to claim your reward!=Habla con Le-Sabre cerca de Canifis para reclamar tu recompensa.
Kill a cave horror (lvl 80)=Mata un cave horror (nivel 80)
Unlimited teleports to Burgh de Rott from Morytania legs=Teletransportes ilimitados a Burgh de Rott desde las Morytania legs
Bonecrusher - an item that automatically buries bones of monsters killed when carried=Bonecrusher: un objeto que entierra automáticamente los bones de los monstruos que matas cuando lo llevas encima
Robin offers 26 free buckets of slime and 26 pots of bonemeal in exchange for bones each day=Robin ofrece 26 buckets of slime y 26 pots of bonemeal gratis a cambio de bones cada día
Double Mort myre fungi when casting Bloom=El doble de Mort myre fungi al lanzar Bloom
50% more Prayer experience from burning shade remains=50% más de experiencia de Prayer al quemar shade remains
50% more runes from the Barrows chest=50% más de runas del cofre de Barrows
7.5% more Slayer experience in the Slayer Tower while on a Slayer task=7,5% más de experiencia de Slayer en el Slayer Tower mientras tienes una tarea de Slayer
