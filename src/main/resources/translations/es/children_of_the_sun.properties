# Spanish translations for Children of the Sun.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Alina east of Varrock Square.=Habla con Alina al este de Varrock Square.
Follow the guard slowly behind them, hiding in the marked locations to avoid him spotting you. Do not let him get too far from you or you'll fail.=Sigue al guardia despacio por detrás, escondiéndote en las zonas marcadas para que no te vea. No dejes que se aleje demasiado o fracasarás.
Follow the guard, keeping out of sight whilst also not letting them get too far away.=Sigue al guardia sin ser visto y sin dejar que se aleje demasiado.
Attempt to enter the house in the south-east of Varrock, north of the Zamorak Temple, and watch the cutscene.=Intenta entrar en la casa al sureste de Varrock, al norte del Zamorak Temple, y mira la cinemática.
Talk to Sergeant Tobyn in Varrock Square.=Habla con Sergeant Tobyn en Varrock Square.
Mark the guard outside Aris's tent.=Marca al guardia que está fuera de la tienda de Aris.
Mark the suspect guards.=Marca a los guardias sospechosos.
Mark the guard south east of Benny's news stand, who isn't wearing a helmet and has long hair.=Marca al guardia al sureste del puesto de periódicos de Benny, que no lleva casco y tiene el pelo largo.
Mark the guard with a mace north-west of the Varrock East Bank.=Marca al guardia con una mace al noroeste del Varrock East Bank.
Mark the guard leaning on the north wall of Lowe's Archery Emporium, east of the square.=Marca al guardia apoyado en la pared norte de Lowe's Archery Emporium, al este de la plaza.
One of the guards is incorrectly marked, unmark the one as indicated by the overlay.=Uno de los guardias está marcado incorrectamente; desmarca el que indique la superposición.
Unmark the guard east of Eliza.=Desmarca al guardia al este de Eliza.
Unmark the guard next to Eliza.=Desmarca al guardia que está junto a Eliza.
Unmark the guard roaming south of Horvik.=Desmarca al guardia que deambula al sur de Horvik.
Unmark the guard outside Zaff's Superior Staffs.=Desmarca al guardia que está fuera de Zaff's Superior Staffs.
Unmark the guard next to the small fountain east of Horvik.=Desmarca al guardia que está junto a la pequeña fuente al este de Horvik.
Unmark the guard next to Baraek.=Desmarca al guardia que está junto a Baraek.
Report back to Sergeant Tobyn.=Vuelve a informar a Sergeant Tobyn.
Climb up to the roof of Varrock Castle and talk to Tobyn there.=Sube al tejado de Varrock Castle y habla con Tobyn allí.
Talk to Tobyn on the Varrock Castle's roof to finish the quest.=Habla con Tobyn en el tejado de Varrock Castle para terminar la misión.
Access to Varlamore to the east of Varrock with a Quetzal.=Acceso a Varlamore, al este de Varrock, con un Quetzal.
Intrigue=Intriga
