# Spanish translations for Below Ice Mountain.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Willow outside Falador, south of the Ice Mountain dwarves.=Habla con Willow fuera de Falador, al sur de los enanos de Ice Mountain.
Attempt to recruit Checkal to your team in Barbarian Village.=Intenta reclutar a Checkal para tu equipo en Barbarian Village.
Speak to Atlas in the Barbarian Village Inn to learn how to Flex. Pick up a cooked meat if you need one.=Habla con Atlas en la Barbarian Village Inn para aprender a hacer Flex. Coge un cooked meat si necesitas uno.
Talk to Checkal and flex your muscles to prove your worth.=Habla con Checkal y flexiona tus músculos para demostrar tu valía.
Speak to Marley in the Edgeville Ruins. Pick up the cooked meat from the Barbarian longhall if you don't have it already.=Habla con Marley en las Edgeville Ruins. Coge el cooked meat del longhall bárbaro si aún no lo tienes.
Ask the Cook at the Blue Moon Inn for a steak sandwich.=Pídele al Cook en el Blue Moon Inn un steak sandwich.
Collect meat, bread and a knife to make a steak sandwich.=Consigue meat, bread y un knife para hacer un steak sandwich.
Use the knife on the bread to make a steak sandwich. Be careful not to eat it!=Usa el knife en el bread para hacer un steak sandwich. ¡Ten cuidado de no comértelo!
Return to Marley and give him the steak sandwich. Be careful not to eat it!=Vuelve con Marley y entrégale el steak sandwich. ¡Ten cuidado de no comértelo!
Talk to Marley to send him off to the excavation site.=Habla con Marley para enviarlo al yacimiento de excavación.
Talk to Burntof in the Falador Inn.=Habla con Burntof en el Falador Inn.
Buy an Asgarnian Ale for Burntof.=Compra una Asgarnian Ale para Burntof.
Give Burntof the Asgarnian Ale.=Entrega la Asgarnian Ale a Burntof.
Beat Burntof in a match of Rock-Paper-Scissors. Your choices of Rock, Paper and Scissors do not matter.=Gana a Burntof en una partida de piedra, papel o tijera. Tus elecciones de Rock, Paper y Scissors no importan.
Talk with Willow at the dungeon entrance on the west side of Ice Mountain.=Habla con Willow en la entrada de la mazmorra en el lado oeste de Ice Mountain.
Re-enter the dungeon to finish the quest.=Vuelve a entrar en la mazmorra para terminar la misión.
Defeat the Lvl-25 Ancient Guardian. Alternatively, with Level 10 Mining, mine the 4 pillars in the corners.=Derrota al Ancient Guardian de nivel 25. Alternativamente, con nivel 10 de Mining, mina los 4 pilares de las esquinas.
Watch the cutscene to finish the quest.=Mira la cinemática para terminar la misión.
Ancient Guardian (level 25), or 10 mining + a pickaxe=Ancient Guardian (nivel 25), o 10 de mining + un pickaxe
Access to the Ruins of Camdozaal.=Acceso a las Ruins of Camdozaal.
Flex Emote=Emote Flex
The ability to make a steak sandwich=La capacidad de hacer un steak sandwich
Starting Off=Empezando
Recruit Checkal=Recluta a Checkal
Recruit Marley=Recluta a Marley
Recruit Burntof=Recluta a Burntof
Excavation!=¡Excavación!
Combat gear or a pickaxe if you don't want to fight=Combat gear o un pickaxe si no quieres luchar
