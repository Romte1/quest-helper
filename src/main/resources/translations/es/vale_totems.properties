# Spanish translations for Vale Totems.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
There's a knife upstairs in the General Store south of the miniquest start point=Hay un knife en la planta de arriba del General Store al sur del punto de inicio de la misión.
You can also use Willow, Maple, Yew, Magic, or Redwood logs, but it needs to match the decorative items you're bringing.=También puedes usar logs de Willow, Maple, Yew, Magic o Redwood, pero deben coincidir con los decorative items que lleves.
You can also use Willow, Maple, Yew, Magic, or Redwood decorative items, but it needs to match the logs you used to build the totem.=También puedes usar decorative items de Willow, Maple, Yew, Magic o Redwood, pero deben coincidir con los logs que usaste para construir el totem.
Talk to Ranulph in the west part of Auburnvale to start the quest.=Habla con Ranulph en la parte oeste de Auburnvale para empezar la misión.
Build the totem site.=Construye el sitio del totem.
Talk to Isadora to learn about carving.=Habla con Isadora para aprender sobre el tallado.
Return to Isadora after carving the spirit animals into the totem.=Vuelve con Isadora después de tallar los spirit animals en el totem.
Carve a Buffalo into the totem base.=Talla un Buffalo en la base del totem.
Carve a Jaguar into the totem base.=Talla un Jaguar en la base del totem.
Carve a Eagle into the totem base.=Talla un Eagle en la base del totem.
Carve a Snake into the totem base.=Talla un Snake en la base del totem.
Carve a Scorpion into the totem base.=Talla un Scorpion en la base del totem.
Carve spirit animals you see into the totem.=Talla los spirit animals que veas en el totem.
Decorate the totem with one decorative item (shield, longbow, or shortbow) of the same wood type you used to build/carve the totem.=Decora el totem con un decorative item (shield, longbow o shortbow) del mismo tipo de madera que usaste para construir/tallar el totem.
Decorate the totem with two decorative items (shield, longbow, or shortbow) of the same wood type you used to build/carve the totem.=Decora el totem con dos decorative items (shield, longbow o shortbow) del mismo tipo de madera que usaste para construir/tallar el totem.
Decorate the totem with three decorative items (shield, longbow, or shortbow) of the same wood type you used to build/carve the totem.=Decora el totem con tres decorative items (shield, longbow o shortbow) del mismo tipo de madera que usaste para construir/tallar el totem.
Decorate the totem with four decorative items (shield, longbow, or shortbow) of the same wood type you used to build/carve the totem.=Decora el totem con cuatro decorative items (shield, longbow o shortbow) del mismo tipo de madera que usaste para construir/tallar el totem.
Return to Isadora to talk after decorating the totem.=Vuelve con Isadora para hablar después de decorar el totem.
Claim the offering the Ent left next to your totem.=Reclama la ofrenda que el Ent dejó junto a tu totem.
Return to Isadora to finish the quest.=Vuelve con Isadora para terminar la misión.
Unlocks the Auburnvale fletching minigame=Desbloquea el minijuego de fletching de Auburnvale
Repair the totem=Repara el totem
