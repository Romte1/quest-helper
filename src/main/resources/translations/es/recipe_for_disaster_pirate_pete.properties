# Spanish translations for Recipe for Disaster: Pirate Pete.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Go inspect Pirate Pete.=Ve a inspeccionar a Pirate Pete.
Inspect Pirate Pete.=Inspecciona a Pirate Pete.
Talk to the Lumbridge Cook.=Habla con el Lumbridge Cook.
Talk to the Lumbridge Cook and ask him all the options about Pirate Pete.=Habla con el Lumbridge Cook y pregúntale por todas las opciones sobre Pirate Pete.
Use a pestle and mortar on a raw cod.=Usa un pestle and mortar en un raw cod.
Use a knife on some bread and make BREADCRUMBS.=Usa un knife en algo de bread y haz BREADCRUMBS.
Talk to Murphy in Port Khazard.=Habla con Murphy en Port Khazard.
Talk to Murphy again.=Habla con Murphy de nuevo.
Talk to Murphy again to go diving.=Habla con Murphy de nuevo para ir a bucear.
Pick some kelp. Get 3 or so in case you burn a fishcake or two.=Coge algo de kelp. Consigue unos 3 por si quemas uno o dos fishcakes.
Talk to Nung in the north of the area.=Habla con Nung en el norte de la zona.
Pick up 5 rocks in the west of the area.=Coge 5 rocks en el oeste de la zona.
Enter the underwater cave entrance.=Entra en la entrada de la cueva submarina.
Kill mudskippers for 5 hides.=Mata a los mudskippers para conseguir 5 hides.
Bring the hides to Nung.=Lleva los hides a Nung.
Talk to Nung again.=Habla con Nung de nuevo.
Bring bronze wire and a needle to Nung.=Lleva bronze wire y una needle a Nung.
Pick up 5 rocks so you can kill the crabs.=Coge 5 rocks para poder matar a los crabs.
Kill the crabs for some crab meat. Get 2-3 to be safe.=Mata a los crabs para conseguir algo de crab meat. Consigue 2 o 3 por si acaso.
Use a pestle and mortar on the kelp.=Usa un pestle and mortar en el kelp.
Use a pestle and mortar on the crab.=Usa un pestle and mortar en el crab.
Climb the anchor to the south to return to the surface.=Sube por el anchor al sur para volver a la superficie.
Talk to the Lumbridge Cook about Pirate Pete again.=Habla con el Lumbridge Cook sobre Pirate Pete de nuevo.
Use the ingredients together to make the cake.=Usa los ingredientes juntos para hacer el cake.
Cook the fishcake. It's possible to burn it.=Cocina el fishcake. Es posible quemarlo.
Go give the fishcake to Pirate Pete to finish the quest.=Ve a darle el fishcake a Pirate Pete para terminar la misión.
Give the fishcake to Pirate Pete to finish the quest. BE CAREFUL NOT TO EAT IT.=Dale el fishcake a Pirate Pete para terminar la misión. TEN CUIDADO DE NO COMÉRTELO.
You can make this by using a knife on bread=Puedes hacerlo usando un knife en bread
Costume needle cannot be used as a substitute=La costume needle no sirve como sustituto
You will need to kill another underwater crab and grind its meat=Tendrás que matar otro underwater crab y moler su carne
You will need to go underwater with Murphy and pick more kelp to grind=Tendrás que ir bajo el agua con Murphy y coger más kelp para moler
You can make this by use a pestle and mortar on a raw cod=Puedes hacerlo usando un pestle and mortar en un raw cod
Have an additional empty slot for each additional kelp beyond the minimum of 1=Ten una casilla vacía adicional por cada kelp adicional por encima del mínimo de 1
5 Mudskippers (level 30/31)=5 Mudskippers (nivel 30/31)
Crab (level 21/23)=Crab (nivel 21/23)
Access to the Mogre Camp=Acceso al Mogre Camp
Increased access to the Culinaromancer's Chest=Mayor acceso al Culinaromancer's Chest
Starting off=Empezando
