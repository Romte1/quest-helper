# Spanish translations for Misthalin Mystery.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Abigale in the south east corner of Lumbridge Swamp.=Habla con Abigale en la esquina sureste de Lumbridge Swamp.
Board the rowboat south of Abigale.=Sube a la rowboat al sur de Abigale.
Pick up the bucket near the fountain.=Coge el bucket cerca del fountain.
Search the barrel of rainwater north of the fountain to trigger a cutscene.=Busca en el barrel of rainwater al norte del fountain para activar un cutscene.
Use the bucket on the barrel of rainwater.=Usa el bucket en el barrel of rainwater.
Search the barrel of rainwater for the manor key.=Busca en el barrel of rainwater la manor key.
Enter the manor.=Entra en el manor.
Take the knife from the table.=Coge la knife de la mesa.
Try to open the door with the pink handle.=Intenta abrir la puerta con la manilla rosa.
Pick up the note that appeared.=Coge la note que apareció.
Read the notes.=Lee las notes.
Use a knife on the marked painting.=Usa una knife en el painting marcado.
Search the painting for a ruby key.=Busca en el painting la ruby key.
Go through the door with the ruby handle.=Pasa por la puerta con la manilla ruby.
Search the shelves for a tinderbox.=Busca en los shelves un tinderbox.
Light the unlit candles in the room.=Enciende las candles sin encender de la habitación.
Light the fuse on the barrel.=Enciende la fuse del barrel.
Leave the room to trigger the explosion.=Sal de la habitación para provocar la explosion.
Climb over the damaged wall.=Salta por encima del muro dañado.
Observe Lacey through the trees.=Observa a Lacey a través de los árboles.
Pick up the note that appeared by the fence.=Coge la note que apareció junto a la valla.
Play the D key.=Pulsa la tecla D.
Play the E key.=Pulsa la tecla E.
Play the A key.=Pulsa la tecla A.
Play the D key again.=Pulsa la tecla D de nuevo.
Unfortunately you've played an incorrect key. Restart.=Desgraciadamente has pulsado una tecla incorrecta. Reinicia.
Play the piano in the room to the south for the emerald key.=Toca el piano de la habitación del sur para conseguir la emerald key.
Find the emerald key in the room to the south.=Encuentra la emerald key en la habitación del sur.
Right-click search the piano for the emerald key.=Haz right-click en search en el piano para conseguir la emerald key.
Climb back over the damaged wall into the manor.=Salta de nuevo por encima del muro dañado hasta el manor.
Go through the door with the green handle.=Pasa por la puerta con la manilla verde.
Try to enter the room containing the Bandos godsword.=Intenta entrar en la habitación que contiene el Bandos godsword.
Pick up the note that appeared by the door.=Coge la note que apareció junto a la puerta.
Use a knife on the unlit fireplace in the eastern room.=Usa una knife en el fireplace sin encender de la habitación del este.
You've clicked a gem in the wrong order. Try restarting.=Has hecho click en una gem en el orden incorrecto. Intenta reiniciar.
Click the sapphire.=Haz click en el sapphire.
Click the diamond.=Haz click en el diamond.
Click the zenyte.=Haz click en el zenyte.
Click the emerald.=Haz click en el emerald.
Click the onyx.=Haz click en el onyx.
Click the ruby.=Haz click en el ruby.
Search the fireplace again for the sapphire key.=Busca de nuevo en el fireplace la sapphire key.
Search the fireplace and solve the puzzle for the sapphire key.=Busca en el fireplace y resuelve el puzzle para conseguir la sapphire key.
Find the sapphire key in the room to the east.=Encuentra la sapphire key en la habitación del este.
Go through the sapphire door.=Pasa por la sapphire door.
This puzzle requires you to move the mirror to reflect the knives the murderer throws. You can tell which wardrobe the murderer will throw from by a black swirl that'll surround it.=Este puzzle requiere que muevas el mirror para reflejar los knives que lanza el asesino. Puedes saber desde qué wardrobe lanzará el asesino por un remolino negro que lo rodeará.
Go through the sapphire door to continue.=Pasa por la sapphire door para continuar.
Watch the killer's reveal cutscene.=Mira el cutscene de la revelación del asesino.
Pick up the killer's knife.=Coge la knife del asesino.
Equip the killer's knife, then select Fight on Abigale (no actual combat will occur).=Equipa la knife del asesino y luego selecciona Fight en Abigale (no habrá combate real).
Attempt to go through the sapphire door.=Intenta pasar por la sapphire door.
Talk to Mandy just outside the manor to complete the quest.=Habla con Mandy justo fuera del manor para terminar la misión.
