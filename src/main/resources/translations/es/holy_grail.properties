# Spanish translations for Holy Grail.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
For travel from Ardougne to Brimhaven twice=Para viajar de Ardougne a Brimhaven dos veces
For travel from Ardougne to Brimhaven=Para viajar de Ardougne a Brimhaven
If you're below Combat level 41, the poisonous scorpions on Karamja are aggressive=Si tienes un nivel de combate inferior a 41, los escorpiones venenosos de Karamja son agresivos
Talk to King Arthur in Camelot Castle to start the quest.=Habla con King Arthur en el Camelot Castle para empezar la misión.
Go upstairs and talk to Merlin.=Sube las escaleras y habla con Merlin.
Head to Port Sarim and talk to a monk of Entrana for passage to Entrana. Bank all combat gear.=Ve a Port Sarim y habla con un monje de Entrana para que te lleve a la isla. Mete todo el equipo de combate en el banco.
Talk to the High Priest on Entrana.=Habla con el High Priest en Entrana.
Talk to Galahad in his house west of McGrubor's Woods.=Habla con Galahad en su casa al oeste de McGrubor's Woods.
Travel to Draynor Manor.=Ve a Draynor Manor.
Enter Draynor Manor.=Entra en Draynor Manor.
Go up the stairs in Draynor Manor.=Sube las escaleras de Draynor Manor.
Go up the second set of stairs in Draynor Manor.=Sube la segunda escalera de Draynor Manor.
Open the door to the Magic Whistles.=Abre la puerta de los Magic Whistles.
Pickup 2 Magic Whistles.=Coge 2 Magic Whistles.
Go retrieve Excalibur from your bank. If you do not own Excalibur, you can retrieve it from the Lady of the Lake in Taverley for 500 coins.=Ve a por Excalibur a tu banco. Si no tienes Excalibur, puedes conseguirlo de la Lady of the Lake en Taverley por 500 coins.
Go to the tower on Karamja near gold mine west of Brimhaven.=Ve a la torre de Karamja, cerca de la mina de oro al oeste de Brimhaven.
Blow the whistle once you are underneath of the tower.=Sopla el silbato cuando estés debajo de la torre.
Kill the Black Knight Titan with Excalibur. Melee is recommended as it has high Ranged and Magic defence. (You only need to deal the killing blow with excalibur!)=Mata al Black Knight Titan con Excalibur. Se recomienda melé, ya que tiene una defensa alta contra Ranged y Magic. (¡Solo tienes que dar el golpe final con Excalibur!)
Talk to the fisherman by the river. After talking to him walk West to the castle.=Habla con el pescador junto al río. Después de hablar con él, camina al oeste hasta el castillo.
Pickup the grail bell outside of the castle. If it's not there, return to the fisherman and finish the conversation.=Coge la grail bell fuera del castillo. Si no está, vuelve con el pescador y termina la conversación.
Ring the grail bell while standing directly north of the broken castle wall (Where you picked up the bell)=Toca la grail bell de pie justo al norte del muro derruido del castillo (donde cogiste la campana)
Go up the stairs inside of the castle.=Sube las escaleras dentro del castillo.
Talk to The Fisher King.=Habla con The Fisher King.
Go back to Camelot.=Vuelve a Camelot.
Return to Camelot and talk to King Arthur.=Vuelve a Camelot y habla con King Arthur.
Travel to the Goblin Village, north of Falador. Right click and open the sacks.=Ve a Goblin Village, al norte de Falador. Haz clic derecho y abre los sacos.
Open the door to the castle and enter.=Abre la puerta del castillo y entra.
Go up the stairs to the east.=Sube las escaleras hacia el este.
Climb the ladder on the second floor.=Sube la escalera de mano del segundo piso.
Pickup the Holy grail.=Coge el Holy grail.
Return to Camelot and talk to King Arthur=Vuelve a Camelot y habla con King Arthur
Black Knight Titan (level 120)=Black Knight Titan (nivel 120)
Access to the Fisher Realm.=Acceso al Fisher Realm.
Ability to put King Arthur picture on the wall in the POH.=Habilidad de colgar el cuadro de King Arthur en la pared de la POH.
Starting off=Empezando
Getting the Napkin=Consiguiendo la Napkin
Getting the Magic Whistles=Consiguiendo los Magic Whistles
Fisher King Realm Pt.1=Fisher King Realm, parte 1
Finding Percival=Encontrando a Percival
Fisher King Realm Pt.2=Fisher King Realm, parte 2
Finishing up=Terminando
