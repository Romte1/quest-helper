# Spanish translations for Ethically Acquired Antiquities.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Only needed if you charter a ship from Civitas illa Fortis to Port Sarim.=Solo es necesario si fletas un barco desde Civitas illa Fortis a Port Sarim.
You can get another from one of the trader crewmembers in the Fortis Cothon=Puedes conseguir otras de uno de los trader crewmembers del Fortis Cothon
Talk to Betty in Port Sarim for them=Habla con Betty en Port Sarim para conseguirlas
Inspect the empty display case at the Grand Museum in Civitas illa Fortis to start the quest.=Inspecciona la vitrina vacía del Grand Museum de Civitas illa Fortis para empezar la misión.
Speak to Curator Herminius in the centre of the Grand Museum.=Habla con Curator Herminius en el centro del Grand Museum.
Investigate the tools behind the empty display case.=Investiga las herramientas que hay detrás de la vitrina vacía.
Inspect the empty display case again.=Inspecciona la vitrina vacía de nuevo.
Talk to any citizen in the room.=Habla con cualquier citizen de la sala.
Talk to any academic in the room.=Habla con cualquier academic de la sala.
Talk to any tourist in the room.=Habla con cualquier tourist de la sala.
Speak to Regulus Cento south of the Grand Museum.=Habla con Regulus Cento al sur del Grand Museum.
Head east to the docks and speak to any Trader Crewmember.=Ve al este, a los muelles, y habla con cualquier Trader Crewmember.
Head south of the Fortis Cothon to Artima's crafting store and speak to her.=Ve al sur del Fortis Cothon, a la tienda de artesanía de Artima, y habla con ella.
Return up north and speak to any Trader Crewmember.=Vuelve al norte y habla con cualquier Trader Crewmember.
Head to Port Sarim and speak to Trader Stan or any Trader Crewmember on the southern deck. To get to Port Sarim quickly, you can charter a ship.=Ve a Port Sarim y habla con Trader Stan o con cualquier Trader Crewmember de la cubierta sur. Para llegar rápido a Port Sarim, puedes fletar un barco.
Head to the Rune Shop in north western Port Sarim and speak to Betty.=Ve a la Rune Shop del noroeste de Port Sarim y habla con Betty.
Read Betty's notes.=Lee las notas de Betty.
Right-click pickpocket Curator Haig Halen.=Haz clic derecho para robar con carterismo a Curator Haig Halen.
Head to Varrock Museum and speak to Curator Haig Halen.=Ve al Varrock Museum y habla con Curator Haig Halen.
Open the door to the room in the north east and search the crate.=Abre la puerta de la sala del noreste y registra la caja.
Go speak to Curator Haig Halen again.=Ve a hablar con Curator Haig Halen de nuevo.
Shame Curator Haig Halen, get the meter to 100%.=Avergüenza a Curator Haig Halen hasta llenar el medidor al 100%.
Work out how to shame Curator Haig Halen, get the meter to 100%.=Averigua cómo avergonzar a Curator Haig Halen y llena el medidor al 100%.
Speak to Curator before a cutscene.=Habla con el Curator antes de una escena cinemática.
Watch cutscene.=Mira la escena cinemática.
Speak to the Curator in the centre of the Grand Museum to complete the quest.=Habla con el Curator en el centro del Grand Museum para completar la misión.
Grand Museum=Grand Museum
Done with museum visit=Listo con la visita al museo
Nevermind, another one=Da igual, otro más
