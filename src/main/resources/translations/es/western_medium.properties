# Spanish translations for Western Provinces Medium Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Travel to the Gnome Stronghold by spirit tree.=Viaja al Gnome Stronghold en spirit tree.
Climb the ladder at the Grand Tree.=Sube la escalera del Grand Tree.
Make a chocolate bomb.=Prepara un chocolate bomb.
Complete your training by talking to Blurberry and Aluft Gianne snr.=Completa tu entrenamiento hablando con Blurberry y Aluft Gianne snr.
Complete a delivery for the Gnome Restaurant.=Completa una entrega para el Gnome Restaurant.
Open the trapdoor to enter the underground of the Grand Tree.=Abre la trampilla para entrar en el subsuelo del Grand Tree.
Mine some gold ore underneath the Grand Tree.=Mina un poco de gold ore bajo el Grand Tree.
Enter Brimstail's cave.=Entra en la cueva de Brimstail.
Turn your crystal saw seed into a crystal saw.=Convierte tu crystal saw seed en una crystal saw.
Take the agility shortcut from the Grand Tree to Otto's Grotto.=Toma el atajo de agilidad del Grand Tree a Otto's Grotto.
Enter the cave at the top of Eagles' Peak. You can use a fairy ring to (AKQ), then head south to get there easily.=Entra en la cueva en la cima de Eagles' Peak. Puedes usar un fairy ring (AKQ) y luego ir al sur para llegar fácilmente.
Use a rope on the Jungle Eagle to travel to the Feldip Hills area.=Usa una rope en el Jungle Eagle para viajar a la zona de Feldip Hills.
Place logs over a pit in the Feldip hunter area, and poke a larupia with a teasing stick. Jump over the pits until the larupia falls in and loot it.=Coloca logs sobre un foso en la zona de caza de Feldip y pincha a un larupia con un teasing stick. Salta los fosos hasta que el larupia caiga y saquéalo.
Travel to the Feldip Hills by Gnome Glider.=Viaja a Feldip Hills en Gnome Glider.
Travel to Ape Atoll.=Viaja a Ape Atoll.
Fish some bass on Ape Atoll.=Pesca unos bass en Ape Atoll.
Chop some teak logs on Ape Atoll.=Tala unos teak logs en Ape Atoll.
Burn some teak logs on Ape Atoll.=Quema unos teak logs en Ape Atoll.
Talk to the squire to travel to the Void Knights' Outpost. Alternatively, use the pest control minigame teleport.=Habla con el squire para viajar al Void Knights' Outpost. Como alternativa, usa el teletransporte del minijuego de Pest Control.
Complete an intermediate game of Pest Control.=Completa una partida de Pest Control en nivel intermedio.
Claim any Chompy bird hat from Rantz. Kill chompy birds until you have 125 kills. \n \nYou can check your kill count by right clicking 'Check Kills' on an ogre bow.=Reclama cualquier sombrero de Chompy bird a Rantz. Mata Chompy birds hasta tener 125 muertes. \n \nPuedes consultar tu número de muertes haciendo clic derecho en 'Check Kills' con un ogre bow.
Talk to the Elder gnome child in Gnome Stronghold to claim your reward!=Habla con el Elder gnome child en Gnome Stronghold para reclamar tu recompensa.
