Can be created by using a sardine on Doogle leaves(South of Gertrudes House)=Se puede crear usando una sardine sobre Doogle leaves (al sur de la casa de Gertrude)
Talk to Gertrude west of Varrock to start the quest.=Habla con Gertrude al oeste de Varrock para empezar la misión.
Pickup some Doogle Leaves south of Gertrude's house.=Coge unas Doogle Leaves al sur de la casa de Gertrude.
Use your Doogle Leaves on  the Sardine.=Usa tus Doogle Leaves en la Sardine.
Talk to Shilop or Wilough in the Varrock Square.=Habla con Shilop o Wilough en Varrock Square.
Climb up the ladder in the Lumberyard.=Sube por la escalera del Lumberyard.
Use a bucket of milk on Gertrude's cat upstairs in the Lumberyard north east of Varrock.=Usa un Bucket of milk en el gato de Gertrude en el piso de arriba del Lumberyard, al noreste de Varrock.
Use a seasoned sardine on Gertrude's cat upstairs in the Lumberyard north east of Varrock.=Usa una Seasoned Sardine en el gato de Gertrude en el piso de arriba del Lumberyard, al noreste de Varrock.
Search different crates downstairs in the Lumberyard until you find the kitten.=Busca en distintas cajas de la planta baja del Lumberyard hasta que encuentres al gatito.
Climb down ladder in the Lumberyard.=Baja por la escalera del Lumberyard.
Return the kitten to Gertrude's cat.=Devuelve el gatito al gato de Gertrude.
Return to Gertrude west of Varrock to complete the quest.=Vuelve con Gertrude al oeste de Varrock para completar la misión.
Ability to raise kittens.=Habilidad de criar gatitos.
Starting out=Empezando
The secret playground (Lumber Yard)=El patio de juegos secreto (Lumber Yard)
