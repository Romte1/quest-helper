# Spanish translations for The Blood Moon Rises.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can buy another Blisterwood Flail from Ivan in the Myreque Hideout in Old Man Ral's basement, or during the quest from Old Man Ral just outside the hideout=Puedes comprar otro Blisterwood Flail a Ivan en el Myreque Hideout del sótano de Old Man Ral, o durante la misión a Old Man Ral justo fuera del hideout
Can be obtained during the quest in the chest next to Ivan=Se puede obtener durante la misión en el cofre junto a Ivan
Drakan's medallion to Ver Sinhaza=Drakan's medallion a Ver Sinhaza
Drakan's medallion to Castle Drakan=Drakan's medallion a Castle Drakan
Leave Castle Drakan.=Sal de Castle Drakan.
Pick up the crank wheel from the house east of the altar, north-west of where you started after the cutscene.=Coge la crank wheel de la casa al este del altar, al noroeste de donde empezaste tras la cinemática.
Pick up the crank wheel from where you died!=¡Coge la crank wheel de donde moriste!
Spam click the crank base outside the house to the north west. Drakan will start chasing you. Run away if he gets too close.=Haz clic repetidamente en la base de la manivela fuera de la casa al noroeste. Drakan empezará a perseguirte. Huye si se acerca demasiado.
Enter the house north of the crank base.=Entra en la casa al norte de la base de la manivela.
Search the bookshelf in the house north of the crank base for a dusty book, then read it to retrieve the vitur key.=Busca en la estantería de la casa al norte de la base de la manivela un libro polvoriento, luego léelo para obtener la vitur key.
Read the dusty book and retrieve the vitur key.=Lee el libro polvoriento y obtén la vitur key.
Pick up the vitur key from where you died!=¡Coge la vitur key de donde moriste!
Leave the bookcase house and enter the north-eastern vitur manor.=Sal de la casa de la estantería y entra en el vitur manor del noreste.
Enter the north-eastern vitur manor.=Entra en el vitur manor del noreste.
Pick up the bolt cutters from where you died!=¡Coge los bolt cutters de donde moriste!
Enter the north-eastern vitur manor and search the shed in the north-eastern room for a pair of bolt cutters.=Entra en el vitur manor del noreste y busca en el cobertizo de la sala noreste unos bolt cutters.
Solve the shed puzzle.=Resuelve el puzle del cobertizo.
Enter the building east of the altar and pick up the tooth half of key from the table.=Entra en el edificio al este del altar y coge la tooth half of key de la mesa.
Enter the house with the chained door, south of the well, and pick up the loop half of key from the table.=Entra en la casa con la puerta encadenada, al sur del pozo, y coge la loop half of key de la mesa.
Combine the loop and tooth half of key into the myrmel key.=Combina la loop y la tooth half of key para crear la myrmel key.
Pick up the bucket from the house with the myrmel door, east of the well.=Coge el bucket de la casa con la puerta myrmel, al este del pozo.
Use the bucket on the well outside the house.=Usa el bucket en el pozo fuera de la casa.
Return to the myrmel house with the bucket of water.=Vuelve a la casa myrmel con el bucket of water.
Use the bucket of water on the northern barrel to retrieve the shadum key.=Usa el bucket of water en el barril del norte para obtener la shadum key.
Pick up the trapdoor key from where you died!=¡Coge la trapdoor key de donde moriste!
Enter the shadum door south-west of the drawbridge and pick up the trapdoor key.=Entra por la puerta shadum al suroeste del puente levadizo y coge la trapdoor key.
Pick up the trapdoor key from the shadum house south-west of the drawbridge.=Coge la trapdoor key de la casa shadum al suroeste del puente levadizo.
Enter the bank north-west of the well.=Entra en el banco al noroeste del pozo.
Spam click the crank base in the bank.=Haz clic repetidamente en la base de la manivela del banco.
Enter the trapdoor.=Entra por la trampilla.
Pick up the jovkai key from where you died!=¡Coge la jovkai key de donde moriste!
Search the chest in the western room of the altar house.=Busca en el cofre de la sala oeste de la casa del altar.
Solve the chest puzzle.=Resuelve el puzle del cofre.
Leave the altar room, then head to the smithy in the south-west.=Sal de la sala del altar y dirígete a la herrería del suroeste.
Enter the smithy in the south-west.=Entra en la herrería del suroeste.
Pick up the old cog from where you died!=¡Coge la old cog de donde moriste!
Pick up the old cog from the table in the smithy in the south-west.=Coge la old cog de la mesa de la herrería del suroeste.
Return to Vanescula by the drawbridge to the south-east. Drakan will chase you when you leave the smithy.=Vuelve con Vanescula junto al puente levadizo al sureste. Drakan te perseguirá cuando salgas de la herrería.
Return to Vanescula by the drawbridge and talk to Ivan Strom for some supplies. You can drop the bucket.=Vuelve con Vanescula junto al puente levadizo y habla con Ivan Strom para conseguir suministros. Puedes soltar el bucket.
Return to Vanescula by the drawbridge to the south-east when you're ready to leave. Drakan will chase you through the woods. Dodge his attacks, protect from melee.=Vuelve con Vanescula junto al puente levadizo al sureste cuando estés listo para irte. Drakan te perseguirá por el bosque. Esquiva sus ataques y usa Protect from melee.
Learn to fight Lowerniel Drakan. Protect from melee and dodge his attacks.\n\nDuring this tutorial segment, there will be glimmering sparks that attempt to show you where to click to dodge his attacks.=Aprende a luchar contra Lowerniel Drakan. Usa Protect from melee y esquiva sus ataques.\n\nDurante este segmento tutorial aparecerán destellos que intentarán mostrarte dónde hacer clic para esquivar sus ataques.
Learn to fight Lowerniel Drakan. Protect from melee and dodge his attacks. More info in sidebar.=Aprende a luchar contra Lowerniel Drakan. Usa Protect from melee y esquiva sus ataques. Más información en la barra lateral.
Resupply at the shelter remains in the middle. When you've resupplied, click the trees around you to continue.=Reabastécete en los restos del refugio del centro. Cuando lo hayas hecho, haz clic en los árboles que te rodean para continuar.
Resupply at the shelter remains in the middle. When you've resupplied, click the trees to continue.=Reabastécete en los restos del refugio del centro. Cuando lo hayas hecho, haz clic en los árboles para continuar.
Kill the ancient feral vyres. They swap positions and heal, so try to focus one at a time.=Mata a los ancient feral vyres. Cambian de posición y se curan, así que intenta centrarte en uno a la vez.
Enter Darkwood trees to continue.=Entra en los Darkwood trees para continuar.
Take the axe from the stump at the beginning.=Coge el hacha del tocón del principio.
Turn off run before continuing.=Desactiva correr antes de continuar.
Make your way through the tangle of trees to the darkwood trees in the north-east, chopping down and climbing over trees on the way. Trees can only be chopped once per direction.=Abrete camino entre la maraña de árboles hasta los darkwood trees del noreste, talando y trepando por los árboles por el camino. Solo se puede talar cada árbol una vez por dirección.
Turn off run. Avoid the Maxilla beasts. Running nearby, walking within 2 tiles, or standing on the maxilla beast will cause them to attack you and probably kill you.=Desactiva correr. Evita a las Maxilla beasts. Correr cerca, caminar a 2 casillas o ponerte encima de la maxilla beast hará que te ataquen y probablemente te maten.
The first and third follow predetermined paths, while the second one moves randomly. Be extra careful when passing it.=La primera y la tercera siguen caminos predeterminados, mientras que la segunda se mueve al azar. Ten mucho cuidado al pasar junto a ella.
Leave through the cave in the south-east.=Sal por la cueva del sureste.
Continue through the cave.=Continúa por la cueva.
Kill the nylocas. Gray ones with melee, yellow ones with a ranged weapon. You can pick up the Spine near the Venator corpse to use as darts. If you do not kill them fast enough, they explode dealing 15 damage.=Mata a los nylocas. A los grises con melé y a los amarillos con un arma a distancia. Puedes coger la Spine cerca del cadáver del Venator para usarla como dardos. Si no los matas lo bastante rápido, explotan y causan 15 de daño.
When all nylocas are dead, leave through the trees.=Cuando todos los nylocas estén muertos, sal por los árboles.
Kill the nylocas. Gray ones with melee, yellow ones with a ranged weapon. You can pick up the Spine near the Venator corpse to use as darts. If you do not kill them fast enough, they explode dealing 15 damage. When all are dead, leave through the trees.=Mata a los nylocas. A los grises con melé y a los amarillos con un arma a distancia. Puedes coger la Spine cerca del cadáver del Venator para usarla como dardos. Si no los matas lo bastante rápido, explotan y causan 15 de daño. Cuando todos estén muertos, sal por los árboles.
Wrangle the snakes, then combine them into one long snake. You must stand behind the snake when attempting to wrangle it.=Enlaza a las serpientes y luego combínalas en una sola serpiente larga. Debes colocarte detrás de la serpiente al intentar enlazarla.
Combine the snakes into one long snake.=Combina las serpientes en una sola serpiente larga.
Use the serpent rope on the long branched tree.=Usa la serpent rope en el árbol de ramas largas.
Swing across the water with your newly created swing.=Balanceate sobre el agua con el columpio que acabas de crear.
Leave through the trees.=Sal por los árboles.
Talk to the Mysterious Woman.=Habla con la Mysterious Woman.
Talk to Efaritay Hallow in the west room to help her with her son.=Habla con Efaritay Hallow en la sala oeste para ayudarla con su hijo.
Pick some amitire leaves from the amitire plant outside the palace.=Recoge unas amitire leaves de la planta de amitire fuera del palacio.
Enter the palace with the amitire leaves.=Entra en el palacio con las amitire leaves.
Search the shelves next to the sink for a bowl.=Busca en las estanterías junto al fregadero un bowl.
Fill the bowl with water.=Llena el bowl con agua.
Take a potato from the cupboard.=Coge una potato de la alacena.
Put the potato in the bowl of water.=Pon la potato en el bowl of water.
Take some raw meat the cupboard.=Coge algo de raw meat de la alacena.
Cook the raw meat on the range.=Cocina la raw meat en el fogón.
Put the cooked meat in the incomplete stew.=Pon la cooked meat en el incomplete stew.
Cook the stew on the range.=Cocina el stew en el fogón.
Put the amitire leaves into the stew.=Pon las amitire leaves en el stew.
Give the amitire stew to Safalaan Hallow.=Entrega el amitire stew a Safalaan Hallow.
Talk to Safalaan Hallow after feeding him the stew.=Habla con Safalaan Hallow tras darle el stew.
Talk to Efaritay Hallow after feeding Safalaan the stew.=Habla con Efaritay Hallow tras darle el stew a Safalaan.
Search the workbench in the east room for a hammer.=Busca en el banco de trabajo de la sala este un hammer.
Search the workbench in the east room for a chisel.=Busca en el banco de trabajo de la sala este un chisel.
Search the workbench in the east room for a knife.=Busca en el banco de trabajo de la sala este un knife.
Search the northern-most crate for some blisterwood logs.=Busca en la caja más al norte unos blisterwood logs.
Search the eastern-most crate for a blessed silver sickle.=Busca en la caja más al este una blessed silver sickle.
Search the eastern-most chest for a diamond.=Busca en el cofre más al este un diamond.
Put the unenchanted diamond on the blessed silver sickle.=Pon el diamond sin encantar en la blessed silver sickle.
Search the western-most chest for a diamond tablet.=Busca en el cofre más al oeste un diamond tablet.
Enchant the diamond sickle with the enchant diamond tablet.=Encanta la diamond sickle con el enchant diamond tablet.
Combine the blisterwood logs with your newly created enchanted diamond sickle to create an enhanced blisterwood sickle.=Combina los blisterwood logs con tu enchanted diamond sickle recién creada para crear una enhanced blisterwood sickle.
Smith a hallowed flail at the anvil.=Forja un hallowed flail en el yunque.
Talk to Ivan Strom after smithing the hallowed flail.=Habla con Ivan Strom tras forjar el hallowed flail.
Search the workbench for a knife.=Busca en el banco de trabajo un knife.
Search the northern-most crate for some blisterwood logs to craft stakes.=Busca en la caja más al norte unos blisterwood logs para fabricar stakes.
Fletch the logs into stakes.=Talla los logs para convertirlos en stakes.
Return to  Ivan Strom after crafting some stakes. You can craft more before continuing if you want to use them during the upcoming fights.=Vuelve con  Ivan Strom tras fabricar algunas stakes. Puedes fabricar más antes de continuar si quieres usarlas en las próximas peleas.
Talk to Veliaf in the dungeon downstairs.=Habla con Veliaf en la mazmorra de abajo.
Talk to Veliaf in the dungeon.=Habla con Veliaf en la mazmorra.
Talk to Vanescula Drakan.=Habla con Vanescula Drakan.
Talk to Veliaf in the dungeon again.=Habla con Veliaf en la mazmorra de nuevo.
Climb upstairs.=Sube las escaleras.
Talk to Sugadinti Vitur after helping out Ivan and Veliaf.=Habla con Sugadinti Vitur tras ayudar a Ivan y Veliaf.
Get ready for combat. Resupply at the supply table in the kitchen if needed. Speak to the Aranei next to the table if you want to deposit any items into your bank. Then leave the palace.=Prepárate para el combate. Reabastécete en la mesa de suministros de la cocina si lo necesitas. Habla con la Aranei junto a la mesa si quieres depositar objetos en tu banco. Luego sal del palacio.
Protect the palace.\nAttack the portals in the sky.=Protege el palacio.\nAtaca los portales del cielo.
Leave the palace.=Sal del palacio.
Heal fallen Aranei, repair damaged windows, and repair damaged pillars.=Cura a las Aranei caídas y repara las ventanas y los pilares dañados.
Pass through barricade to return to the guarding step.=Atraviesa la barricada para volver al paso de protección.
Pass through the barricade, ready to fight Lowerniel Drakan. You can resupply at the supply table in the kitchen.=Atraviesa la barricada, listo para luchar contra Lowerniel Drakan. Puedes reabastecerte en la mesa de suministros de la cocina.
Fight Lowerniel Drakan. Protect from melee and dodge his attacks.\n\nDodge at least one tile opposite of the telegraphed motion.\n\nWhen he holds his spear back, step to his side.=Lucha contra Lowerniel Drakan. Usa Protect from melee y esquiva sus ataques.\n\nEsquiva al menos una casilla en dirección opuesta al movimiento anunciado.\n\nCuando eche la lanza hacia atrás, colócate a su lado.
Fight Lowerniel Drakan. Protect from melee and dodge his attacks. More info in sidebar.=Lucha contra Lowerniel Drakan. Usa Protect from melee y esquiva sus ataques. Más información en la barra lateral.
Watch the cutscene.=Mira la cinemática.
Talk to Ivan Strom in the haunted woods.=Habla con Ivan Strom en el bosque encantado.
Enter the Burgh de Rott Myreque base.=Entra en la base Myreque de Burgh de Rott.
Talk to Veliaf Hurtz in the Burgh de Rott Myreque base.=Habla con Veliaf Hurtz en la base Myreque de Burgh de Rott.
Talk to Sugadinti Vitur in Burgh de Rott.=Habla con Sugadinti Vitur en Burgh de Rott.
Gear up for theatre of blood. Bring melee gear with a range and mage switch, some food & potions, then talk to Sugadinti Vitur in front of the theatre of blood.=Equípate para el theatre of blood. Lleva equipo de melé con cambio a distancia y magia, comida y pociones, y luego habla con Sugadinti Vitur frente al theatre of blood.
Kill Nylocas with the correct fighting style. Fight the Maiden of Sugadinti, killing healers when they spawn. Avoid blood puddles on the ground.=Mata a los Nylocas con el estilo de combate correcto. Lucha contra la Maiden of Sugadinti y mata a los sanadores cuando aparezcan. Evita los charcos de sangre del suelo.
Talk to Sugadinti Vitur.=Habla con Sugadinti Vitur.
Head to the abandoned building north-east of Burgh de Rott and talk to Veliaf.=Dirígete al edificio abandonado al noreste de Burgh de Rott y habla con Veliaf.
Head to the abandoned building north-east of Burgh de Rott and enter the entry.=Dirígete al edificio abandonado al noreste de Burgh de Rott y entra por la entrada.
Fight the Wyrd. Protect from melee against the normal attacks, and turn it off when it screeches similar to a Venator.\n\nFirst phase:\nHe will punch twice, then unleash a screech attack. After screeching twice, he will smash the ground matching which hand he hit you with the two most recent punches.\n\nSecond phase:\nInstead of the screech attach, he will use a lightning attack that spawns blood pools around you. These pools disappear over time. Turn off your protection prayer and leave his area, avoiding any pools.=Lucha contra el Wyrd. Usa Protect from melee contra los ataques normales y desactívalo cuando chille de forma similar a un Venator.\n\nPrimera fase:\nDará dos puñetazos y luego lanzará un ataque de chillido. Tras chillar dos veces, golpeará el suelo según la mano con la que te haya dado en los dos últimos puñetazos.\n\nSegunda fase:\nEn lugar del ataque de chillido, usará un ataque de rayos que crea charcos de sangre a tu alrededor. Estos charcos desaparecen con el tiempo. Desactiva tu plegaria de protección y sal de su zona, evitando los charcos.
Fight the Wyrd. Protect from melee against the normal attacks, and turn it off when it screeches similar to a Venator. More info in sidebar.=Lucha contra el Wyrd. Usa Protect from melee contra los ataques normales y desactívalo cuando chille de forma similar a un Venator. Más información en la barra lateral.
Search for the escaped wyrd. Inspect the fence north of barrows.=Busca al wyrd fugado. Inspecciona la valla al norte de barrows.
Talk to Veliaf Hurtz in the Burgh de Rott hideout.=Habla con Veliaf Hurtz en el escondite de Burgh de Rott.
Talk to Sugadinti Vitur in the Burgh de Rott hideout, ready for another fight against Drakan.=Habla con Sugadinti Vitur en el escondite de Burgh de Rott, listo para otra pelea contra Drakan.
Talk to Veliaf Hurtz.=Habla con Veliaf Hurtz.
Fight Lowerniel Drakan. More info in sidebar.=Lucha contra Lowerniel Drakan. Más información en la barra lateral.
Talk to Ivan Strom inside Castle Drakan.=Habla con Ivan Strom dentro de Castle Drakan.
Talk to Sugadinti Vitur inside Castle Drakan.=Habla con Sugadinti Vitur dentro de Castle Drakan.
Talk to Efaritay Hallow in Icyene Graveyard.=Habla con Efaritay Hallow en Icyene Graveyard.
Enter the portal in Icyene Graveyard to get to Vampyrium, ready for the final confrontation.=Entra en el portal de Icyene Graveyard para llegar a Vampyrium, listo para la confrontación final.
Enter the door, ready to fight Drakan. You can get supplies and deposit items at the chest next to the door.=Entra por la puerta, listo para luchar contra Drakan. Puedes conseguir suministros y depositar objetos en el cofre junto a la puerta.
Fight Lowerniel Drakan. Protect from melee and dodge his attacks.\n\nDodge at least one tile opposite of the telegraphed motion.\n\nWhen he holds his spear back, step to his side.\n\nDodge over the blood waves.\n\nProtect from magic when he shoots his blood spears.\n\nAvoid shadows and blood pools on the ground.\n\nStep behind him when he raises his spear above his shoulder.\n\nWhen he rushes around you, dodge in the direction of his first cloud.=Lucha contra Lowerniel Drakan. Usa Protect from melee y esquiva sus ataques.\n\nEsquiva al menos una casilla en dirección opuesta al movimiento anunciado.\n\nCuando eche la lanza hacia atrás, colócate a su lado.\n\nSalta por encima de las olas de sangre.\n\nUsa Protect from magic cuando dispare sus lanzas de sangre.\n\nEvita las sombras y los charcos de sangre del suelo.\n\nColócate detrás de él cuando levante la lanza por encima del hombro.\n\nCuando corra a tu alrededor, esquiva en la dirección de su primera nube.
Talk to Efaritay Hallow in the icyene graveyard.=Habla con Efaritay Hallow en el cementerio icyene.
Congratulations on finishing the quest!=¡Enhorabuena por terminar la misión!
Talk to Sarius Guile in the Icyene Graveyard to start the quest.=Habla con Sarius Guile en Icyene Graveyard para empezar la misión.
Look for Ivan in the Myreque Hideout below Old Man Ral's home in Meiyerditch.=Busca a Ivan en el Myreque Hideout bajo la casa de Old Man Ral en Meiyerditch.
Inspect the makeshift shrine in the Myreque Hideout below Old Man Ral's home in Meiyerditch.=Inspecciona el santuario improvisado en el Myreque Hideout bajo la casa de Old Man Ral en Meiyerditch.
Talk to Ivan in the Myreque Hideout below Old Man Ral's home in Meiyerditch while wearing the vyre noble outfit, ready for a fight.=Habla con Ivan en el Myreque Hideout bajo la casa de Old Man Ral en Meiyerditch llevando el vyre noble outfit puesto, listo para luchar.
Talk to Ivan in the Myreque Hideout below Old Man Ral's home in Meiyerditch to return to the Castle Drakan courtyard.=Habla con Ivan en el Myreque Hideout bajo la casa de Old Man Ral en Meiyerditch para volver al patio de Castle Drakan.
Kill the vyrewatches and defend Ivan Strom until he can teleport you both out. Kill the approaching acidic bloodvelds with a ranged weapon. Prioritize the Vyrewatch Sentinels.=Mata a los vyrewatches y defiende a Ivan Strom hasta que pueda teleportaros a ambos fuera. Mata a los acidic bloodvelds que se acerquen con un arma a distancia. Da prioridad a los Vyrewatch Sentinels.
Talk to Ivan in the Myreque Hideout below Old Man Ral's home in Meiyerditch after escaping.=Habla con Ivan en el Myreque Hideout bajo la casa de Old Man Ral en Meiyerditch tras escapar.
Talk to Ivan Strom in the graveyard outside the Slepe church.=Habla con Ivan Strom en el cementerio fuera de la iglesia de Slepe.
Talk to Roy the bartender in Slepe and ask him about Veliaf's whereabouts.=Habla con Roy el camarero en Slepe y pregúntale por el paradero de Veliaf.
Head to the Crombwick Manor through the church dungeon.=Dirígete a Crombwick Manor a través de la mazmorra de la iglesia.
Help Veliaf kill the vampyres in Crombwick Manor.=Ayuda a Veliaf a matar a los vampyres en Crombwick Manor.
Talk to Veliaf after helping him kill the vampyres in Crombwick Manor.=Habla con Veliaf tras ayudarle a matar a los vampyres en Crombwick Manor.
Talk with Ivan Strom in the Paterdomus dungeon.=Habla con Ivan Strom en la mazmorra de Paterdomus.
Talk with Ivan in the Paterdomus dungeon.=Habla con Ivan en la mazmorra de Paterdomus.
Read the Squire's journal Ivan just gave you.=Lee el diario del Squire que Ivan acaba de darte.
Talk with Ivan again after reading the Squire's journal.=Habla con Ivan de nuevo tras leer el diario del Squire.
Kill the monks of zamorak on the ground floor of the Paterdomus temple.=Mata a los monjes de zamorak en la planta baja del templo de Paterdomus.
Talk to Ivan Storm on the first floor of the Paterdomus temple.=Habla con Ivan Storm en el primer piso del templo de Paterdomus.
Climb up the temple and solve the puzzle.=Sube al templo y resuelve el puzle.
Find the writings on the first floor of the Paterdomus temple for Ivan Strom.=Encuentra los escritos en el primer piso del templo de Paterdomus para Ivan Strom.
Get Sarl's journal and The Life of Friar from the bookcase.=Consigue el diario de Sarl y The Life of Friar de la estantería.
Get Pious proceedings from the bookcase.=Consigue Pious proceedings de la estantería.
Get Misthalin to Morytania from the bookcase.=Consigue Misthalin to Morytania de la estantería.
Get the scruffy notebook and Essiandar's notes from the bookcase.=Consigue el scruffy notebook y las Essiandar's notes de la estantería.
You have placed all the books correctly, continue in the dialog to proceed.=Has colocado todos los libros correctamente; continúa en el diálogo para seguir.
Talk to Ivan Strom after solving the puzzle.=Habla con Ivan Strom tras resolver el puzle.
Read Ivandis' writings.=Lee los escritos de Ivandis.
Talk to Ivan Strom after reading Ivandis' writings.=Habla con Ivan Strom tras leer los escritos de Ivandis.
Stock up on combat gear and supplies, then head to Ivandis' tomb with Ivan Strom.=Abastécete de equipo de combate y suministros y luego dirígete a la tumba de Ivandis con Ivan Strom.
Investigate the blockage just south west of Ivandis' coffin.=Investiga el bloqueo justo al suroeste del ataúd de Ivandis.
Ask Ivan Strom for a pickaxe.=Pide un pickaxe a Ivan Strom.
Mine the blockage just south west of Ivandis' coffin.=Mina el bloqueo justo al suroeste del ataúd de Ivandis.
Head through the cave entrance just south west of Ivandis' coffin, ready for a fight.=Entra por la entrada de la cueva justo al suroeste del ataúd de Ivandis, listo para luchar.
Head into the daeyalt processing room through the tunnel to the north-east.=Entra en la sala de procesamiento de daeyalt por el túnel del noreste.
Kill vampyres. Focus on the Vyrewatch Sentinels. Avoid the Blood orb. Lure Vyrewatches into the Blood orbs to deal massive damage to them.=Mata a los vampyres. Céntrate en los Vyrewatch Sentinels. Evita el Blood orb. Atrae a los Vyrewatches hacia los Blood orbs para infligirles daño masivo.
Talk to Ivan after killing the vampyres.=Habla con Ivan tras matar a los vampyres.
Enter the Castle Drakan cellars through the entry to the north.=Entra en las bodegas de Castle Drakan por la entrada del norte.
Climb up the stairs to the Castle Drakan lobby.=Sube las escaleras hasta el vestíbulo de Castle Drakan.
Pray at the shrine to let your Drakan's Medallion teleport you here.=Reza en el santuario para que tu Drakan's Medallion te teletransporte aquí.
Enter the ominous red portal in the Castle Drakan lobby.=Entra en el siniestro portal rojo del vestíbulo de Castle Drakan.
Climb up the stairs to the north.=Sube las escaleras hacia el norte.
Enter Crombwick Manor through the church dungeon.=Entra en Crombwick Manor a través de la mazmorra de la iglesia.
Stock up on combat gear and supplies, then return to Ivan Strom in Paterdomus.=Abastécete de equipo de combate y suministros y luego vuelve con Ivan Strom en Paterdomus.
Enter the trapdoor behind Canifis's pub.=Entra por la trampilla detrás del pub de Canifis.
Enter Ivandis' Tomb.=Entra en Ivandis' Tomb.
Find the old cog for the drawbridge.=Encuentra la old cog para el puente levadizo.
You have successfully repaired the bridge!=¡Has reparado el puente con éxito!
Help Efaritay Hallow and the Aranei defend the palace.=Ayuda a Efaritay Hallow y a las Aranei a defender el palacio.
