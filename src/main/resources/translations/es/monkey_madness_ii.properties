# Spanish translations for Monkey Madness II.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to King Narnode Shareen in the Tree Gnome Stronghold.=Habla con King Narnode Shareen en el Tree Gnome Stronghold.
Climb up into Glough's house south of the Grand Tree.=Sube a la casa de Glough, al sur del Grand Tree.
Climb up to the next floor in Glough's house.=Sube al siguiente piso de la casa de Glough.
Right-click investigate the tree.=Haz clic derecho para investigar el árbol.
Climb up the tree.=Sube al árbol.
Investigate the nearby statue and turn it.=Investiga la estatua cercana y gírala.
Search the cupboard.=Busca en el armario.
Search the crates.=Busca en las cajas.
Search the fire remains.=Busca entre los restos del fuego.
Use a pestle and mortar on a lemon=Usa un pestle and mortar en un lemon
Use the notes on the candles.=Usa las notas en las velas.
Use a pestle and mortar on some grapes.=Usa un pestle and mortar en unas grapes.
Use the brush on the note.=Usa el brush en la nota.
Read the note.=Lee la nota.
Climb down the tree.=Baja del árbol.
Use the translation book on the scrawled note.=Usa el translation book en la scrawled note.
Read the translated note.=Lee la translated note.
Talk to Auguste on Entrana. You can take the hot air balloon there from south of the Grand Tree with a log, or travel from Port Sarim.=Habla con Auguste en Entrana. Puedes ir en globo aerostático desde el sur del Grand Tree con un log, o viajar desde Port Sarim.
Return to King Narnode Shareen.=Vuelve con King Narnode Shareen.
Talk to Garkor on Ape Atoll.=Habla con Garkor en Ape Atoll.
Talk to Awowogei.=Habla con Awowogei.
Talk to Garkor again.=Habla con Garkor de nuevo.
Talk to a monkey archer on the west of Ape Atoll. Buy a monkey talisman for 1000 coins now if you need one.=Habla con un monkey archer en el oeste de Ape Atoll. Compra un monkey talisman por 1000 coins ahora si necesitas uno.
Enter the trapdoor under some grass in the north west of Ape Atoll.=Entra por la trampilla bajo la hierba del noroeste de Ape Atoll.
Pick up your greegree!=¡Recoge tu greegree!
Search Kruk's Corpse.=Busca en Kruk's Corpse.
Leave the dungeon up the rope to the west.=Sal de la mazmorra por la cuerda del oeste.
Enter the dungeon in south Ape Atoll.=Entra en la mazmorra del sur de Ape Atoll.
Talk to Zooknock in the north east of the dungeon.=Habla con Zooknock en el noreste de la mazmorra.
Talk to Awowogei as Kruk.=Habla con Awowogei como Kruk.
Enter the Troll Stronghold, ready to fight Kob.=Entra en el Troll Stronghold, preparado para luchar contra Kob.
Talk to Kob with Protect from Melee on, ready to fight.=Habla con Kob con Protect from Melee activo, preparado para luchar.
Fight Kob. He can be safespotted from the doorway.=Lucha contra Kob. Se puede hacer safespot desde la puerta.
Talk to Keef in Gu'Tanoth. Get to him via the agility shortcut next to him. Be prepared to fight him and pray Protect from Melee.=Habla con Keef en Gu'Tanoth. Llega hasta él por el atajo de agility que tiene al lado. Prepárate para luchar y reza Protect from Melee.
Talk to Keef in Gu'Tanoth. Be prepared to fight him and pray Protect from Melee.=Habla con Keef en Gu'Tanoth. Prepárate para luchar y reza Protect from Melee.
Fight Keef. He can be safespotted.=Lucha contra Keef. Se puede hacer safespot.
Search around the various rooftops in Ape Atoll for Assistant Le Smith.=Busca por los distintos tejados de Ape Atoll a Assistant Le Smith.
Talk to Assistant Le Smith.=Habla con Assistant Le Smith.
Talk to Garkor.=Habla con Garkor.
Talk to the monkey guard on the north west of Ape Atoll.=Habla con el monkey guard del noroeste de Ape Atoll.
Return to Garkor on Ape Atoll.=Vuelve con Garkor en Ape Atoll.
Climb across the monkey bars to the north as Kruk.=Cruza las monkey bars hacia el norte como Kruk.
Enter the passage to the north.=Entra en el pasaje del norte.
Climb onto the stunted gorilla.=Súbete al gorila raquítico.
Fight the tortured gorillas. When you're done, be careful NOT to click out of the cutscene or you'll need to do this again.=Lucha contra los tortured gorillas. Cuando termines, ten cuidado de NO hacer clic fuera de la escena o tendrás que repetirlo.
Dismount the gorilla in the holding area.=Bájate del gorila en la zona de retención.
Search the crates nearby for a chisel and hammer.=Busca en las cajas cercanas un chisel y un hammer.
Dismount the gorilla on a holding area and tamper with the device to the north.=Bájate del gorila en una zona de retención y manipula el dispositivo del norte.
Use a chisel on the charged onyx.=Usa un chisel en el charged onyx.
Use the onyx back on the device.=Usa el onyx de nuevo en el dispositivo.
Investigate one of the incubation chambers in the room.=Investiga una de las cámaras de incubación de la sala.
Return to Garkor.=Vuelve con Garkor.
Talk to King Narnode Shareen in the Tree Gnome Stronghold. Be prepared for fighting, and bring 2 combat styles.=Habla con King Narnode Shareen en el Tree Gnome Stronghold. Prepárate para luchar y lleva 2 estilos de combate.
Talk to Nieve south of the Grand Tree. Be prepared to fight with 2 combat styles.=Habla con Nieve al sur del Grand Tree. Prepárate para luchar con 2 estilos de combate.
Roam around with Nieve killing the gorillas within the Gnome Stronghold. If you lose Nieve, you can get her again from the Grand Tree.=Recorre el Gnome Stronghold con Nieve matando a los gorillas. Si pierdes a Nieve, puedes volver a conseguirla en el Grand Tree.
Enter the breach north west of the Grand Tree with Nieve.=Entra en la brecha al noroeste del Grand Tree con Nieve.
Enter the cavern to the north east.=Entra en la caverna del noreste.
Talk to Glough in the north of the cavern. After, defeat the tortured and demonic gorillas.=Habla con Glough en el norte de la caverna. Después, derrota a los tortured y demonic gorillas.
Enter the breach north west of the Grand Tree.=Entra en la brecha al noroeste del Grand Tree.
Defeat Glough. He has 3 phases, changing rooms each time. You can safe spot the first 2 phases. Protect from Melee if you're next to him, or Protect from Magic if not in the third phase.=Derrota a Glough. Tiene 3 fases y cambia de sala cada vez. Puedes hacer safespot en las 2 primeras fases. Usa Protect from Melee si estás a su lado, o Protect from Magic si no estás en la tercera fase.
The easiest way to do phase 3 is to attack him from 1 tile away, have Protect from Magic on, and step away a tile whenever he pulls you closer.=La forma más fácil de hacer la fase 3 es atacarle desde 1 casilla de distancia, con Protect from Magic activo, y apartarte una casilla cada vez que te atraiga.
Talk to Zooknock to teleport to the Grand Tree.=Habla con Zooknock para teletransportarte al Grand Tree.
Talk to Narnode to finish the madness!=¡Habla con Narnode para terminar con esta locura!
Investigate the tree in the 2nd floor of Glough's house.=Investiga el árbol del segundo piso de la casa de Glough.
Go talk to Anita in the west of the Tree Gnome Stronghold.=Ve a hablar con Anita en el oeste del Tree Gnome Stronghold.
Return to Glough's house and climb to the 3rd floor.=Vuelve a la casa de Glough y sube al tercer piso.
Go talk to Narnode.=Ve a hablar con Narnode.
Return to Narnode with the translation.=Vuelve con Narnode con la traducción.
You can buy one from the Ape Atoll magic shop for 1000 coins=Puedes comprar uno en la tienda de magia de Ape Atoll por 1000 coins
If it's not in your bank you can get another from Narnode during the quest=Si no está en tu banco, puedes conseguir otro de Narnode durante la misión
If you've lost it you'll need to go through the process of revealing the text again=Si lo has perdido, tendrás que volver a hacer el proceso para revelar el texto
You can get another from Anita=Puedes conseguir otra de Anita
You can get another from where you fought Kruk=Puedes conseguir otra donde luchaste contra Kruk
If you've lost this you can get another from Zooknock=Si has perdido esto, puedes conseguir otro de Zooknock
Hammer (obtainable in quest)=Hammer (se puede obtener durante la misión)
Chisel (obtainable in quest)=Chisel (se puede obtener durante la misión)
No combat items to travel to Entrana=Sin objetos de combate para viajar a Entrana
2 styles of combat gear=2 estilos de equipo de combate
It is beneficial to have a high Combat and Agility level=Es recomendable tener un nivel alto de Combate y Agility
Kruk (level 149, flinchable)=Kruk (nivel 149, se puede flinchear)
Keef (level 178, safespottable)=Keef (nivel 178, se puede hacer safespot)
Kob (level 185, safespottable)=Kob (nivel 185, se puede hacer safespot)
9 Tortured gorillas (level 141)=9 Tortured gorillas (nivel 141)
2 Demonic Gorillas (level 275)=2 Demonic Gorillas (nivel 275)
Glough (level 431)=Glough (nivel 431)
Access to Demonic Gorillas=Acceso a los Demonic Gorillas
A new Gnome Glider location=Una nueva ubicación de Gnome Glider
Access to a bank on Ape Atoll=Acceso a un banco en Ape Atoll
Ability to wield the Heavy Ballista=Habilidad de empuñar la Heavy Ballista
Access to Maniacal Monkey hunting area=Acceso a la zona de caza de Maniacal Monkey
Starting off=Empezando
Going undercover=Infiltrarse
Defeating trolls and ogres=Derrotar a trolls y ogros
Sabotage=Sabotaje
Glough's experiments=Los experimentos de Glough
Defending the tree=Defender el árbol
Navigate through the platform, avoiding the monkey guards, to the east side and climb the ladder there.=Avanza por la plataforma, evitando a los monkey guards, hasta el lado este y sube la escalera de allí.
Make your way south then west, and go down the ladder there.=Ve al sur y luego al oeste, y baja la escalera de allí.
Follow the path around and search the crates there for 6 satchels. There are no monkeys here to avoid.=Sigue el camino y busca en las cajas de allí para conseguir 6 satchels. Aquí no hay monos que evitar.
Climb back up the ladder.=Vuelve a subir la escalera.
Make your way east then north, and go down the ladder there.=Ve al este y luego al norte, y baja la escalera de allí.
Go down a floor.=Baja un piso.
Navigate through the platform, avoiding the monkey guards, to the north east side and climb the ladder there.=Avanza por la plataforma, evitando a los monkey guards, hasta el lado noreste y sube la escalera de allí.
Go back and fill up your satchels with gunpowder.=Vuelve y llena tus satchels con gunpowder.
Make your way east then south and go down the ladder there. Avoid the monkey on the way.=Ve al este y luego al sur y baja la escalera de allí. Evita al mono por el camino.
Fill your satchels with gunpowder from the barrel to the north.=Llena tus satchels con gunpowder del barril del norte.
Go back up the ladder to the first floor.=Vuelve a subir la escalera al primer piso.
Place a satchel to the south.=Coloca un satchel al sur.
Go down the ladder to the north west.=Baja la escalera del noroeste.
Place a satchel on the support to the south.=Coloca un satchel en el soporte del sur.
Go to the east side and climb the ladder there.=Ve al lado este y sube la escalera de allí.
Make your way to the west across the vine, then north then east. Place a satchel here.=Ve al oeste cruzando la liana, luego al norte y luego al este. Coloca un satchel aquí.
Return to the east side where you came from and go up to the 2nd floor.=Vuelve al lado este por donde viniste y sube al segundo piso.
Place a satchel on the gas cylinder to the south.=Coloca un satchel en el gas cylinder del sur.
Make your way to the west then north and place a satchel on the gas cylinder there.=Ve al oeste y luego al norte y coloca un satchel en el gas cylinder de allí.
Go back to the bottom floor.=Vuelve al piso inferior.
Place the final satchel in the centre of the platform.=Coloca el último satchel en el centro de la plataforma.
Leave the platform via the boat. DON'T teleport away. You can shortcut here by getting caught.=Sal de la plataforma en el barco. NO te teletransportes. Puedes tomar un atajo aquí dejándote atrapar.
You can fill another satchel from the gunpowder barrels in the north east of the platform=Puedes llenar otro satchel en los barriles de gunpowder del noreste de la plataforma
Go up the rope to the west.=Sube por la cuerda del oeste.
Climb up the rope to the south east and use Protect from Ranged.=Sube por la cuerda del sureste y usa Protect from Ranged.
Climb up the rope to the north west and use Protect from Melee.=Sube por la cuerda del noroeste y usa Protect from Melee.
Traverse the next section of the dungeon. Protect from Melee if you fall.=Recorre la siguiente sección de la mazmorra. Usa Protect from Melee si caes.
Traverse the next section of the dungeon. PROTECT FROM MISSILE if you fall.=Recorre la siguiente sección de la mazmorra. Usa PROTECT FROM MISSILE si caes.
Right-click unlock the chest in the cavern to the east for a bronze key.=Haz clic derecho para abrir el cofre de la caverna del este y conseguir una bronze key.
Make your way north then through the bronze door.=Ve al norte y cruza la bronze door.
Continue through the dungeon until you reach a shortcut to open. PROTECT FROM MELEE if you fall.=Sigue por la mazmorra hasta llegar a un atajo que abrir. Usa PROTECT FROM MELEE si caes.
Enter the shortcut near the entrance.=Entra en el atajo cerca de la entrada.
Prepare to fight Kruk, then enter the hole to the south.=Prepárate para luchar contra Kruk y entra en el agujero del sur.
Kill Kruk. He can be flinched on a corner in the room by keeping him on a north east tile to you.=Mata a Kruk. Se puede flinchear en una esquina de la sala manteniéndolo en una casilla al noreste de ti.
