# Spanish translations for Ardougne Hard Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Requirements and tooltips
Death Talisman/Tiara, Catalytic Talisman/Tiara, RC-skill cape or via Abyss=Death Talisman/Tiara, Catalytic Talisman/Tiara, skillcape de RC o vía Abyss
Another can be found on the desk in the south-east room of the Mourner HQ basement.=Puedes encontrar otra en el escritorio de la sala sureste del sótano del Mourner HQ.
Another set can be obtained at the north entrance to Arandar.=Puedes conseguir otro conjunto en la entrada norte de Arandar.
Skills necklace or Combat bracelet under 4 charges=Skills necklace o Combat bracelet con menos de 4 cargas
Access to the Death Altar=Acceso al Death Altar
Full mourners' outfit=Conjunto completo de mourners

# Steps
Teleport to the Watchtower.=Teletranspórtate al Watchtower.
Talk to an Estate agent and relocate your house to Yanille.=Habla con un Estate agent y traslada tu casa a Yanille.
Enter your house from the portal in Yanille.=Entra en tu casa desde el portal de Yanille.
Enter the Magic Guild.=Entra en el Magic Guild.
Smith a Mithril platebody in Yanille.=Forja una Mithril platebody en Yanille.
Catch a Red Salamander.=Pesca un Red Salamander.
Recharge some jewellery at the Totem pole in the Legends' Guild.=Recarga algo de jewellery en el Totem pole del Legends' Guild.
Talk to a Monkey minder with the Karamja monkey greegree equipped.=Habla con un Monkey minder con la Karamja monkey greegree equipada.
Climb the stairs in the Ardougne Castle.=Sube las escaleras del Ardougne Castle.
Attempt to steal from a chest in Ardougne Castle.=Intenta robar de un cofre del Ardougne Castle.
Smith a Dragon sq shield in West Ardougne.=Forja un Dragon sq shield en West Ardougne.
Enter the Mourner HQ, or enter the Death Altar via the Abyss.=Entra en el Mourner HQ o en el Death Altar a través del Abyss.
Enter the Mourner HQ basement.=Entra en el sótano del Mourner HQ.
Go up the stairs to the first floor.=Sube las escaleras al primer piso.
Go up the south staircase to the second floor.=Sube por las escaleras del sur al segundo piso.
Go down to the first floor.=Baja al primer piso.
Go down to the ground floor.=Baja a la planta baja.
Enter the central area, and turn the pillar's mirror west.=Entra en la zona central y gira el espejo del pilar hacia el oeste.
Enter the Death altar.=Entra en el Death altar.
Craft some death runes from essence. TURN THE MIDDLE PILLAR TO POINT BACK EAST OR YOU'LL HAVE TO RETURN VIA THE UNDERGROUND PASS.=Fabrica unas death runes con essence. GIRA EL PILAR CENTRAL PARA QUE VUELVA A APUNTAR AL ESTE O TENDRÁS QUE VOLVER POR EL UNDERGROUND PASS.
Plant and harvest poison ivy in the Ardougne Monastery bush patch. If you're waiting for it to grow and want to complete further tasks, use the tick box on panel.=Planta y cosecha poison ivy en el bancal de arbustos del Ardougne Monastery. Si estás esperando a que crezca y quieres completar otras tareas, usa la casilla del panel.
Check the health of a palm tree near Tree Gnome Village. If you're waiting for it to grow and want to complete further tasks, use the tick box on panel.=Comprueba la salud de una palm tree cerca de Tree Gnome Village. Si estás esperando a que crezca y quieres completar otras tareas, usa la casilla del panel.
Talk to Two-pints in the Flying Horse Inn at East Ardougne to claim your reward!=¡Habla con Two-pints en el Flying Horse Inn de East Ardougne para reclamar tu recompensa!

