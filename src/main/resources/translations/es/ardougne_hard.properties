Ability to toggle Watchtower Teleport to the centre of Yanille=Puedes alternar el Watchtower Teleport al centro de Yanille
10% increased chance of succeeding when pickpocketing around Gielinor=10% más de probabilidad de éxito al robar por Gielinor

