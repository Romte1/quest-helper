# Spanish translations for Recipe for Disaster: Finale.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Restore potions for Karamel=Restore potions para Karamel
Combat gear, food and potions=Equipo de combate, comida y pociones
Enter the portal in Lumbridge Castle, ready to fight. You can leave between fights to re-gear. Have your ice gloves pre-equipped for the second fight against Flambeed to avoid them making you drop your weapon on the floor.=Entra en el portal de Lumbridge Castle, listo para luchar. Puedes salir entre combates para cambiar de equipo. Lleva tus ice gloves ya equipadas para el segundo combate contra Flambeed y evitar que te hagan tirar el arma al suelo.
Kill Agrith-Na-Na. He uses magic at ranged, and melee up close.=Mata a Agrith-Na-Na. Usa magia a distancia y melee de cerca.
Enter the portal in Lumbridge Castle, ready to fight kill Flambeed. Water spells are especially effective. If you have a full inventory and no ice gloves on Flambeed can make you drop your weapon, so it's recommended you keep a free inventory slot.=Entra en el portal de Lumbridge Castle, listo para luchar contra Flambeed. Los water spells son especialmente eficaces. Si tienes el inventario lleno y no llevas ice gloves, Flambeed puede hacerte tirar el arma, así que se recomienda dejar un hueco libre en el inventario.
Equip ice gloves and kill Flambeed. Water spells are especially effective. FLAMBEED WILL MAKE YOU DROP YOUR WEAPON ON THE FLOOR if you do not have ice gloves on and have a full inventory.=Equipa ice gloves y mata a Flambeed. Los water spells son especialmente eficaces. FLAMBEED TE HARÁ TIRAR EL ARMA AL SUELO si no llevas ice gloves y tienes el inventario lleno.
Enter the portal to fight Karamel. Stand in melee distance, and bring restore potions to as they drain your stats. Fire spells are especially effective.=Entra en el portal para luchar contra Karamel. Ponte a distancia de melee y lleva restore potions, ya que drenan tus stats. Los fire spells son especialmente eficaces.
Kill Karamel. Stand in melee distance, and bring restore potions to as they drain your stats. Fire spells are especially effective.=Mata a Karamel. Ponte a distancia de melee y lleva restore potions, ya que drenan tus stats. Los fire spells son especialmente eficaces.
Enter the portal in Lumbridge Castle, ready to fight Dessourt.=Entra en el portal de Lumbridge Castle, listo para luchar contra Dessourt.
Kill Dessourt.=Mata a Dessourt.
Enter the portal in Lumbridge Castle, ready to fight the Gelatinnoth mother. You'll need to use air spells when she's white, earth when brown, fire when red and water when blue.=Entra en el portal de Lumbridge Castle, listo para luchar contra la Gelatinnoth mother. Tendrás que usar air spells cuando esté blanca, earth cuando esté marrón, fire cuando esté roja y water cuando esté azul.
Kill the Gelatinnoth mother. You'll need to use air spells when she's white, earth when brown, fire when red and water when blue, melee when orange and ranged when green.=Mata a la Gelatinnoth mother. Tendrás que usar air spells cuando esté blanca, earth cuando esté marrón, fire cuando esté roja y water cuando esté azul, melee cuando esté naranja y ranged cuando esté verde.
Enter the portal in Lumbridge Castle, ready to fight the Culinaromancer. Try to keep your distance.=Entra en el portal de Lumbridge Castle, listo para luchar contra el Culinaromancer. Intenta mantener la distancia.
Kill the Culinaromancer. Try to keep your distance.=Mata al Culinaromancer. Intenta mantener la distancia.
