Any axe=Cualquier axe
Combat gear=Equipo de combate
Catch a Cerulean Twitch in the Rellekka Hunter area.=Pesca un Cerulean Twitch en la zona de caza de Rellekka.
Kill 5 Rock crabs.=Mata 5 Rock crabs.
Chop some oak logs in Rellekka.=Tala algunos oak logs en Rellekka.
Burn the oak logs you've chopped.=Quema los oak logs que has talado.
Fill a bucket at the Rellekka well.=Llena un cubo en el pozo de Rellekka.
Mine a silver ore in Rellekka.=Mina un silver ore en Rellekka.
Smelt a silver bar in Rellekka.=Funde un silver bar en Rellekka.
Craft a tiara in Rellekka.=Fabrica una tiara en Rellekka.
Change your boots at Yrsa's Shoe Store.=Cámbiate las botas en Yrsa's Shoe Store.
