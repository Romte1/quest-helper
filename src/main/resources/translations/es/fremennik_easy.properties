Enter the Troll Stronghold.=Entra en el Troll Stronghold.
Enter the tunnel that leads to Keldagrim. Alternatively Teleport to Varrock and take a minecart near the Grand Exchange.=Entra en el túnel que lleva a Keldagrim. Como alternativa, teletranspórtate a Varrock y toma un minecart cerca del Grand Exchange.
Go through the cave entrance.=Pasa por la entrada de la cueva.
Speak with the Dwarven Boatman to go to Keldagrim.=Habla con el Dwarven Boatman para ir a Keldagrim.
Enter the trapdoor near the Grand Exchange.=Entra por la trampilla cerca del Grand Exchange.
Steal from the bakery stall.=Roba del puesto de panadería.
Browse the Stonemason's Shop.=Explora la Stonemason's Shop.
