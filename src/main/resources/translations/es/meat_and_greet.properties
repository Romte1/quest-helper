# Spanish translations for Meat and Greet.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Emelio in Outer Fortis at the south-eastern entrance of Civitas illa Fortis to start the quest.=Habla con Emelio en Outer Fortis, en la entrada sureste de Civitas illa Fortis, para empezar la misión.
Talk to the Spice Merchant in the Bazaar in the middle of Civitas illa Fortis about the missing delivery.=Habla con el Spice Merchant del Bazaar en el centro de Civitas illa Fortis sobre el envío perdido.
Submit the code.=Envía el código.
Reset the code.=Reinicia el código.
Click 2.=Haz clic en 2.
Click 5.=Haz clic en 5.
Click 4.=Haz clic en 4.
Click 6.=Haz clic en 6.
Enter the code 2546 to unlock the box.=Introduce el código 2546 para abrir la caja.
Figure out the correct code to unlock the box of spices.=Averigua el código correcto para abrir la caja de especias.
Talk to Alba in the farmhouse west of Civitas illa Fortis.=Habla con Alba en la granja al oeste de Civitas illa Fortis.
Head west from the farm and enter the Wolf Den, prepared to kill the Dire Wolf Alpha.=Ve al oeste desde la granja y entra en la Wolf Den, preparado para matar al Dire Wolf Alpha.
Kill the Dire Wolf Alpha. Use Protect from Melee to avoid most damage. His pups deal ranged damage.=Mata al Dire Wolf Alpha. Usa Protect from Melee para evitar la mayor parte del daño. Sus cachorros hacen daño a distancia.
Exit the wolf den, then head back to Alba in the farmhouse west of Civitas illa Fortis.=Sal de la wolf den y vuelve con Alba en la granja al oeste de Civitas illa Fortis.
Return to Alba in the farmhouse west of Civitas illa Fortis to tell them about the Dire Wolf Alpha's demise.=Vuelve con Alba en la granja al oeste de Civitas illa Fortis para contarle la muerte del Dire Wolf Alpha.
Return to Emelio in Outer Fortis at the south-eastern entrance of Civitas illa Fortis to find the perfect ratio of ingredients for the kebab.=Vuelve con Emelio en Outer Fortis, en la entrada sureste de Civitas illa Fortis, para encontrar la proporción perfecta de ingredientes del kebab.
Tell Emelio the recipe is perfect.=Dile a Emelio que la receta es perfecta.
Adjust the recipe with Emelio. Four portions of meat, two portions of salad, one portion of spice, and three portions of sauce.=Ajusta la receta con Emelio. Cuatro porciones de carne, dos de ensalada, una de especias y tres de salsa.
Configure the kebab recipe with Emelio.=Configura la receta del kebab con Emelio.
Talk to Renata to have them test your test kebab.=Habla con Renata para que pruebe tu test kebab.
Figure out the correct ratio of meat, salad, spice, and sauce by talking to the kebab connoisseurs outside then give the final recipe to Emelio.=Averigua la proporción correcta de carne, ensalada, especias y salsa hablando con los expertos en kebab de fuera y luego da la receta final a Emelio.
Return to Emelio with news of your kebab success!=¡Vuelve con Emelio con la noticia de tu éxito con el kebab!
Head into the Fortis Colosseum and talk to Lelia about kebab sales.=Entra en el Fortis Colosseum y habla con Lelia sobre las ventas de kebab.
Head into the Fortis Colosseum, then into the southern room and talk to Lelia about kebab sales.=Entra en el Fortis Colosseum, ve a la sala sur y habla con Lelia sobre las ventas de kebab.
Talk to Lelia after letting her taste your test kebab.=Habla con Lelia después de dejarle probar tu test kebab.
Head into the Fortis Colosseum, ready to fight the Minotaur.=Entra en el Fortis Colosseum, listo para luchar contra el Minotaur.
Talk to Lelia in the southern room, ready to fight the Minotaur.=Habla con Lelia en la sala sur, listo para luchar contra el Minotaur.
Fight the Minotaur. Protect from Melee to avoid most damage. When it shouts Moo! switch to Protect from Magic for one attack.=Lucha contra el Minotaur. Usa Protect from Melee para evitar la mayor parte del daño. Cuando grite ¡Moo!, cambia a Protect from Magic para un ataque.
Talk to Emelio to get another test kebab.=Habla con Emelio para conseguir otro test kebab.
Talk to Emelio to get another test kebab before you can fight the Minotaur.=Habla con Emelio para conseguir otro test kebab antes de poder luchar contra el Minotaur.
Talk to Lelia in the southern room, ready to fight the Minotaur again.=Habla con Lelia en la sala sur, listo para luchar contra el Minotaur de nuevo.
Head into the Fortis Colosseum, ready to fight the Minotaur again.=Entra en el Fortis Colosseum, listo para luchar contra el Minotaur de nuevo.
Talk to Lelia in the southern room of the Fortis Colosseum after defeating the Minotaur.=Habla con Lelia en la sala sur del Fortis Colosseum tras derrotar al Minotaur.
Head into the Fortis Colosseum and talk to Lelia.=Entra en el Fortis Colosseum y habla con Lelia.
Exit the colosseum, then return to Emelio in Outer Fortis at the south-eastern entrance of Civitas illa Fortis and tell him about your success.=Sal del colosseum y vuelve con Emelio en Outer Fortis, en la entrada sureste de Civitas illa Fortis, para contarle tu éxito.
Return to Emelio in Outer Fortis at the south-eastern entrance of Civitas illa Fortis and tell him about your success.=Vuelve con Emelio en Outer Fortis, en la entrada sureste de Civitas illa Fortis, y cuéntale tu éxito.
You can return to Emelio if you need a test kebab.=Puedes volver con Emelio si necesitas un test kebab.
