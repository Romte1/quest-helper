# Spanish translations for In Search of the Myreque.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Additional charges will be needed if a ghast hits you in the swamp=Se necesitarán cargas adicionales si un ghast te golpea en el pantano
Although Mort Myre fungus may be bought on the Grand Exchange, a sickle helps with ghast encounters in the swamp=Aunque el Mort Myre fungus se puede comprar en el Grand Exchange, una sickle ayuda con los encuentros con ghasts en el pantano
Talk to Vanstrom Klause in the Canifis pub.=Habla con Vanstrom Klause en el pub de Canifis.
Fill a druid pouch with at least 5 Mort Myre items. Try to have more in case a ghast hits you.=Llena un druid pouch con al menos 5 Mort Myre items. Intenta llevar más por si un ghast te golpea.
Talk to Cyreg in Mort'ton.=Habla con Cyreg en Mort'ton.
Board the swamp boaty in Mort'ton. If you forgot coins, you can obtain some by killing afflicted.=Sube al swamp boaty en Mort'ton. Si olvidaste las monedas, puedes conseguir algunas matando afflicted.
Climb the tree to the north of the boat.=Sube al árbol al norte del barco.
Repair the bridge.=Repara el puente.
Talk to Curpile Fyod.=Habla con Curpile Fyod.
Enter the wooden doors north of Curpile.=Entra por las puertas de madera al norte de Curpile.
Enter the cave to the north on the east side.=Entra en la cueva al norte, en el lado este.
Talk to Harold Evans.=Habla con Harold Evans.
Talk to Radigad Ponfit.=Habla con Radigad Ponfit.
Talk to Sani Piliu.=Habla con Sani Piliu.
Talk to Polmafi Ferdygris.=Habla con Polmafi Ferdygris.
Talk to Ivan Strom.=Habla con Ivan Strom.
Talk to each of the members of the Myreque.=Habla con cada uno de los miembros de los Myreque.
Talk to Veliaf Hurtz.=Habla con Veliaf Hurtz.
Talk to Veliaf Hurtz again and give him the steel weapons. Be ready to fight the Skeleton Hellhound=Habla con Veliaf Hurtz de nuevo y entrégale las steel weapons. Prepárate para luchar contra el Skeleton Hellhound
Kill the Skeleton Hellhound. To safespot the hellhound using Magic, position it on the south side of the chair in the eastern part of the room.=Mata al Skeleton Hellhound. Para safespotear al hellhound con Magic, colócalo en el lado sur de la silla en la parte este de la sala.
Talk to Veliaf Hurtz to learn the way out.=Habla con Veliaf Hurtz para aprender la salida.
Leave the cave.=Sal de la cueva.
Leave up the ladder in the north of the cave.=Sal por la escalera al norte de la cueva.
Talk to the Stranger in the Canifis pub to finish the quest!=¡Habla con el Stranger en el pub de Canifis para terminar la misión!
Whilst in Mort Myre, the Ghasts will occasionally rot the food in your inventory and steal charges from your Druid Pouch. To obtain pouch charges you can use Mort Myre fungi. A silver sickle (b) allows you to cast bloom which, at the expense of 1-6 prayer points, makes Mort Myre fungus spawn on rotting logs within the swamp. Additionally, the fungi can be purchased from the Grand Exchange. The Skeleton hellhound can be safe-spotted with magic attacks.=Mientras estés en Mort Myre, los Ghasts pudrirán ocasionalmente la comida de tu inventario y robarán cargas de tu Druid Pouch. Para obtener cargas del pouch puedes usar Mort Myre fungi. Una silver sickle (b) te permite lanzar bloom que, a costa de 1-6 prayer points, hace que aparezca Mort Myre fungus en los troncos podridos del pantano. Además, los fungi se pueden comprar en el Grand Exchange. El Skeleton hellhound se puede safespotear con ataques mágicos.
Skeleton hellhound (level 97)=Skeleton hellhound (nivel 97)
A quick route to Mort'ton=Una ruta rápida a Mort'ton
Helping the Myreque=Ayudando a los Myreque
