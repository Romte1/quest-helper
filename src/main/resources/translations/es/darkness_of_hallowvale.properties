Go use a knife on the fireplace near the Meiyerditch Myreque base.=Usa un knife en la chimenea cerca de la base Myreque de Meiyerditch.
Return to Safalaan in the Meiyerditch Myreque base.=Vuelve con Safalaan en la base Myreque de Meiyerditch.
Travel to the labs in Meiyerditch.=Ve a los laboratorios de Meiyerditch.
Return to Safalaan with the Haemalchemy book.=Vuelve con Safalaan con el Haemalchemy book.
Bring the letter to Veliaf in the Myreque base under Burgh de Rott to complete the quest.=Lleva la carta a Veliaf en la base Myreque bajo Burgh de Rott para completar la misión.
Able to survive 5 hits from Vanstrom Klause (level 169) or use Protect from Melee to negate all his damage.=Capacidad de sobrevivir a 5 golpes de Vanstrom Klause (nivel 169) o usar Protect from Melee para anular todo su daño.
