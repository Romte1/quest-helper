Go up to the surface.=Sube a la superficie.
Slash the tapestry in the building in north east Meiyerditch.=Corta el tapiz en el edificio del noreste de Meiyerditch.
Use the ornate key on the nearby statue.=Usa la large ornate key en la estatua cercana.
Go down the staircase to the lab.=Baja por la escalera al laboratorio.
Search the broken rune case.=Busca en la vitrina de runas rota.
Telegrab the Haemalchemy book.=Usa telegrab para coger el Haemalchemy book.
