Talk to Veliaf in the Myreque base under Burgh de Rott.=Habla con Veliaf en la base Myreque bajo Burgh de Rott.
Follow the path to the Meiyerditch Myreque base.=Sigue el camino hasta la base Myreque de Meiyerditch.
Bring the message to Veliaf in the Myreque base under Burgh de Rott.=Lleva el mensaje a Veliaf en la base Myreque bajo Burgh de Rott.
Talk to Drezel under the Paterdomus Temple.=Habla con Drezel bajo el Paterdomus Temple.
