# Spanish translations for Darkness of Hallowvale.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get one from one of the miners in the mine=Puedes conseguir uno de cualquiera de los miners de la mina
You can get another from Vertida in the Meiyerditch Myreque base=Puedes conseguir otro de Vertida en la base Myreque de Meiyerditch
You can get another from Safalaan=Puedes conseguir otro de Safalaan
Leave the Myreque base.=Sal de la base Myreque.
Fix the boat in south Burgh de Rott.=Repara el barco en el sur de Burgh de Rott.
Fix the boat chute.=Repara la rampa del barco.
Push the boat.=Empuja el barco.
Board the boat.=Sube al barco.
Climb up the walls and search the marked floor.=Sube por las murallas y busca en el suelo marcado.
Climb down the floorboard.=Baja por las tablas del suelo.
Climb over the wall rubble to the north.=Trepa por los escombros de la muralla hacia el norte.
Talk to a Meiyerditch citizen.=Habla con un ciudadano de Meiyerditch.
Talk to Old Man Ral in south western Meiyerditch.=Habla con Old Man Ral en el suroeste de Meiyerditch.
Follow the path to the Meiyerditch Myreque base. When you reach some pots, search them for a key to open the door.=Sigue el camino hasta la base Myreque de Meiyerditch. Cuando llegues a unas ollas, regístralas para encontrar una llave con la que abrir la puerta.
Continue until you reach a wall with a ladder piece, and take it.=Continúa hasta llegar a una pared con un trozo de escalera y cógelo.
Repair the ladder downstairs.=Repara la escalera de abajo.
Use a knife on the wall you eventually reach.=Usa un knife en la pared a la que llegues.
Press the decorated wall.=Pulsa la pared decorada.
Open the rug and enter the trapdoor.=Abre la alfombra y entra por la trampilla.
Talk to Vertida in the north room.=Habla con Vertida en la sala norte.
Go up the west ladder.=Sube por la escalera del oeste.
Search the bushes west of Paterdomus.=Busca en los arbustos al oeste de Paterdomus.
Talk to King Roald in Varrock Castle.=Habla con King Roald en Varrock Castle.
Talk to a Vyrewatch to be sent to the mines.=Habla con un Vyrewatch para que te envíe a las minas.
Mine Daeyalt ore from the walls and put them into the mine carts. If you have no pickaxe, talk to a miner to obtain a bronze one. Once you've mined 15, talk to the vampyres to leave.=Mina Daeyalt ore de las paredes y ponlo en las vagonetas. Si no tienes pickaxe, habla con un miner para conseguir una de bronze. Cuando hayas minado 15, habla con los vampyres para salir.
Press the decorated wall to unlock the base's entrance.=Pulsa la pared decorada para desbloquear la entrada de la base.
Climb down the ladder.=Baja por la escalera.
Climb over the wall rubble to the south.=Trepa por los escombros de la muralla hacia el sur.
Climb up to the floor in the wall to the south.=Sube al piso de la muralla hacia el sur.
Climb down the ladder to the north.=Baja por la escalera hacia el norte.
Search the rocky surface nearby.=Busca en la superficie rocosa cercana.
Open the barricade to the north.=Abre la barricada hacia el norte.
Climb up the ladder to the north.=Sube por la escalera hacia el norte.
Climb up the wall to the north.=Sube por la muralla hacia el norte.
Talk to Safalaan on the walls.=Habla con Safalaan en las murallas.
Tank Vanstrom for 5 hits or use Protect from Melee.=Aguanta 5 golpes de Vanstrom o usa Protect from Melee.
Talk to Safalaan in the north room.=Habla con Safalaan en la sala norte.
Read the message.=Lee el mensaje.
Use a knife on the portrait south of the fireplace.=Usa un knife en el retrato al sur de la chimenea.
