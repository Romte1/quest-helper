Climb along the western wall until you reach Safalaan.=Avanza por la muralla occidental hasta llegar a Safalaan.
Sketch the north side of Castle Drakan by using the charcoal on some papyrus.=Dibuja el lado norte de Castle Drakan usando charcoal en un papyrus.
Sketch the west side of Castle Drakan by using the charcoal on some papyrus.=Dibuja el lado oeste de Castle Drakan usando charcoal en un papyrus.
