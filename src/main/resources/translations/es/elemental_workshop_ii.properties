# Spanish translations for Elemental Workshop II.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another by searching the bookcase in the house south of the elemental workshop's entrance=Puedes conseguir otra buscando en la estantería de la casa al sur de la entrada del elemental workshop
You can get another from a bookcase in the Exam Center=Puedes conseguir otro de una estantería del Exam Center
You can get another by searching the beaten book=Puedes conseguir otro buscando en el beaten book
You can get another from the machinery in the north of the elemental workshop=Puedes conseguir otra de la maquinaria del norte del elemental workshop
If you've lost it you can get another by searching the bookcase in the building south of the odd wall=Si lo has perdido, puedes conseguir otro buscando en la estantería del edificio al sur de la odd wall
Search the marked bookcase in the Exam Centre in the Dig Site.=Busca en la estantería marcada del Exam Centre en the Dig Site.
Read the beaten book.=Lee el beaten book.
Read the scroll.=Lee el scroll.
Enter the elemental workshop.=Entra en el elemental workshop.
Enter the hatch the middle of the workshop.=Entra en la hatch del centro del workshop.
Take crane schematics from the crate to the south.=Coge los crane schematics de la caja del sur.
Go up the stairs.=Sube por las escaleras.
You need 2 elemental bars. Mine one of the elemental rocks in the west room, ready to fight a level 35.=Necesitas 2 elemental bars. Mina una de las elemental rocks de la sala oeste, preparado para luchar contra un nivel 35.
If you want to smith a mind shield after this quest, get a third elemental ore and also smelt it into a bar.=Si quieres forjar un mind shield después de esta misión, consigue un tercer elemental ore y funde también una barra más.
Kill the rock elemental that appeared.=Mata al rock elemental que aparezca.
Pick up the elemental ore.=Coge el elemental ore.
Use the elemental ores on the furnace in the south room.=Usa los elemental ores en el horno de la sala sur.
Use the bar on one of the workbenches in the central room to make a claw.=Usa la barra en uno de los bancos de trabajo de la sala central para hacer un claw.
Pull the south west lever to lower the claw.=Tira de la palanca suroeste para bajar el claw.
Use the claw on the crane to the south.=Usa el claw en la crane del sur.
Climb up to the catwalk.=Sube a la catwalk.
Climb down from the catwalk.=Baja de la catwalk.
Open the junction box.=Abre la junction box.
Search the marked crates on the catwalk AND DOWN THE STAIRS for 3 cogs and a pipe.=Busca en las cajas marcadas de la catwalk Y BAJANDO LAS ESCALERAS para conseguir 3 cogs y un pipe.
Place the small cog on the top left peg.=Coloca el small cog en la clavija superior izquierda.
Place the medium cog on the bottom left peg.=Coloca el medium cog en la clavija inferior izquierda.
Place the large cog on the right peg.=Coloca el large cog en la clavija derecha.
Place the elemental bar on the jig cart.=Coloca la elemental bar en el jig cart.
Pull the south west lever to raise the claw.=Tira de la palanca suroeste para subir el claw.
Pull the south east lever to rotate the claw.=Tira de la palanca sureste para girar el claw.
Pull the south west lever to lower the claw into the lava.=Tira de la palanca suroeste para bajar el claw a la lava.
Pull the south west lever to raise the claw out of the lava.=Tira de la palanca suroeste para subir el claw fuera de la lava.
Pull the south east lever to rotate the claw back.=Tira de la palanca sureste para girar el claw de vuelta.
Pull the south west lever to lower the bar back onto the jig.=Tira de la palanca suroeste para bajar la barra de vuelta al jig.
Pull the south west lever to raise the claw once more.=Tira de la palanca suroeste para subir el claw una vez más.
Pull the central lever to activate the press.=Tira de la palanca central para activar la press.
Pull the west lever to move the jig to the press.=Tira de la palanca oeste para mover el jig a la press.
Pull the central lever to move the jig to the water tank.=Tira de la palanca central para mover el jig al water tank.
Pull the north lever to open the water tank.=Tira de la palanca norte para abrir el water tank.
Turn the corkscrew.=Gira el corkscrew.
Turn the corkscrew again.=Gira el corkscrew de nuevo.
Pull the north lever to close the water tank.=Tira de la palanca norte para cerrar el water tank.
Turn the north west water valve.=Gira la water valve noroeste.
Turn the north east water valve.=Gira la water valve noreste.
Turn the north east water valve again.=Gira la water valve noreste de nuevo.
Turn the north west water valve again.=Gira la water valve noroeste de nuevo.
Pull the north lever to open the water tank again.=Tira de la palanca norte para abrir el water tank de nuevo.
Turn the corkscrew once more.=Gira el corkscrew una vez más.
Pull the central lever to move the jig to the wind tunnel.=Tira de la palanca central para mover el jig al wind tunnel.
Pull the east lever to start the wind tunnel.=Tira de la palanca este para iniciar el wind tunnel.
Pull the east lever to stop the wind tunnel.=Tira de la palanca este para detener el wind tunnel.
Pull the central lever to move the jig back to the start.=Tira de la palanca central para mover el jig de vuelta al inicio.
Pick up the primed bar.=Coge la primed bar.
If you want to smith a mind shield after this quest, repeat this process one more time.=Si quieres forjar un mind shield después de esta misión, repite este proceso una vez más.
Go down from the priming room.=Baja desde la priming room.
Use the primed bar on the extractor gun in the east room.=Usa la primed bar en la extractor gun de la sala este.
Sit in the extractor chair.=Siéntate en la extractor chair.
Take the mind bar.=Coge la mind bar.
Use the mind bar on one of the workbenches in the central room with the beaten book in your inventory.=Usa la mind bar en uno de los bancos de trabajo de la sala central con el beaten book en el inventario.
If you want to smith a mind shield after this quest, use the remaining mind bar on one of the workbenches with the slashed book in your inventory.=Si quieres forjar un mind shield después de esta misión, usa la mind bar restante en uno de los bancos de trabajo con el slashed book en el inventario.
Search the machinery in the north of the elemental workshop.=Busca en la maquinaria del norte del elemental workshop.
Unlock the hatch the middle of the workshop.=Desbloquea la hatch del centro del workshop.
Go back down to the deeper workshop and use the claw on the crane.=Vuelve a bajar al taller profundo y usa el claw en la crane.
Make a claw from an elemental bar.=Haz un claw con una elemental bar.
Sort the pipes in the junction box on the catwalk.=Ordena los pipes de la junction box en la catwalk.
Use the pipe on the broken pipe to the north of the catwalk.=Usa el pipe en el broken pipe al norte de la catwalk.
Place cogs on the pegs outside the wind tunnel.=Coloca los cogs en las clavijas fuera del wind tunnel.
Make the mind helm.=Haz el mind helm.
2 Earth elementals (level 35)=2 Earth elementals (nivel 35)
Ability to craft and equip Mind Elemental Equipment=Habilidad de fabricar y equipar equipo Mind Elemental
Starting off=Empezando
Unlocking the Hatch=Desbloqueando la hatch
Repairing the crane=Reparando la crane
Repairing the workshop=Reparando el workshop
Priming a bar=Preparando una barra
Making a Mind Helm=Haciendo un Mind Helm
Connect the pipes as marked..=Conecta los pipes como se indica..
Elemental metal. Bring an additional elemental metal if you want to smith a mind shield after this quest=Elemental metal. Trae un elemental metal adicional si quieres forjar un mind shield después de esta misión
Primed bar. Bring an additional primed bar if you want to smith a mind shield after this quest=Primed bar. Trae una primed bar adicional si quieres forjar un mind shield después de esta misión
Slashed book if you want to smith a mind shield after this quest=Slashed book si quieres forjar un mind shield después de esta misión
