# Spanish translations for Kandarin Hard Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Make your way through Taverley Dungeon to the end, and climb the ladder there. If you're 70+ Agility, use on of the shortcuts near the entrance to get there quickly.=Recorre la Taverley Dungeon hasta el final y sube por la escalera. Si tienes 70+ Agility, usa uno de los atajos cerca de la entrada para llegar antes.
You can get this by killing the Jailer in the Black Knights Base in Taverley Dungeon and using the key he drops to enter the jail cell there to talk to Velrak for the dusty key=Puedes conseguirla matando al Jailer en la Black Knights Base de la Taverley Dungeon y usando la llave que suelta para entrar en la celda y hablar con Velrak para conseguir la dusty key.
Enter the Taverley Dungeon to charge a water orb. Make sure you're on the normal spellbook.=Entra en la Taverley Dungeon para cargar un water orb. Asegúrate de usar el libro de hechizos normal.
Use the charge water orb spell on the obelisk.=Usa el hechizo charge water orb en el obelisco.
Complete a lap of the Seers' village Rooftop course.=Completa una vuelta al Rooftop course de Seers' Village.
Cut some yew logs near Seers' Village. Make sure to use the knife on the ones you cut.=Corta algunos yew logs cerca de Seers' Village. Asegúrate de usar el cuchillo en los que cortes.
Use knife on yew logs to make a yew longbow (u)=Usa el cuchillo en los yew logs para hacer un yew longbow (u)
String the bow.=Encorda el arco.
Activate piety then enter the Seers' Village courthouse.=Activa piety y entra en el juzgado de Seers' Village.
Go to Seers' Village.=Ve a Seers' Village.
Burn some maple logs with a bow.=Quema algunos maple logs con un arco.
TALK to the estate agent to redecorate your house to Fancy Stone. Must be done through dialog.=HABLA con el estate agent para redecorar tu casa con Fancy Stone. Debe hacerse mediante el diálogo.
Climb down the shadow ladder south of Glarial's Tomb.=Baja por la shadow ladder al sur de la Glarial's Tomb.
Kill a shadow hound.=Mata a un shadow hound.
Catch a leaping Sturgeon south of Barbarian Assault.=Pesca un leaping Sturgeon al sur de Barbarian Assault.
Smith an adamant spear on the barbarian anvil south of Barbarian Assault.=Forja una adamant spear en el yunque bárbaro al sur de Barbarian Assault.
Jump in the whirlpool south of Barbarian Assault.=Salta al remolino al sur de Barbarian Assault.
Go down the stairs.=Baja por las escaleras.
Go up the stairs in the east of the cavern.=Sube por las escaleras al este de la caverna.
Kill a mithril dragon.=Mata a un mithril dragon.
Buy and equip a granite body from Commander Connad. (Requires at least 1 Penance Queen kill)=Compra y equípate una granite body a Commander Connad. (Requiere al menos 1 victoria contra la Penance Queen)
Talk to the 'Wedge' in front of Camelot Castle to claim your reward!=Habla con 'Wedge' frente al Camelot Castle para reclamar tu recompensa.
