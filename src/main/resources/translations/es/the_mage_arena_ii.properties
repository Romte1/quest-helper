Food=Comida
Pull the lever in the building north of the Mage Arena. This is IN THE WILDERNESS, so don't bring anything you don't want to lose.=Tira de la palanca en el edificio al norte de la Mage Arena. Esto está EN EL WILDERNESS, así que no lleves nada que no quieras perder.
Talk to Kolodion.=Habla con Kolodion.
If he fires a blue wave at you, move off your tile to avoid it. If you don't, he will pull you into melee distance.=Si lanza una onda azul hacia ti, muévete de tu casilla para evitarla. Si no lo haces, te atraerá a distancia cuerpo a cuerpo.
If he spawns green orbs, destroy them to stop them healing him.=Si invoca orbes verdes, destrúyelos para evitar que lo curen.
If he fires an energy ball at you, move away away from the boss to reduce the damage you take.=Si lanza una bola de energía hacia ti, aléjate del jefe para reducir el daño que recibes.
Return with the hand to Kolodion.=Vuelve con la mano a Kolodion.
Return with the roots to Kolodion.=Vuelve con las raíces a Kolodion.
Return with the heart to Kolodion.=Vuelve con el corazón a Kolodion.
Use the Enchanted Symbol to locate the 3 bosses. It's recommended to find where a boss is with just food and the symbol, then once you have the location gear up and come fight it. Fight bosses with their respective god staff and spell, food, potions, and armour you're willing to risk. Protect from Magic, and once you've killed them take their drop to Kolodion.=Usa el Enchanted Symbol para localizar a los 3 jefes. Se recomienda encontrar dónde está un jefe solo con comida y el símbolo y, una vez que tengas la ubicación, equiparte y volver a luchar contra él. Lucha contra los jefes con su god staff y hechizo correspondientes, comida, pociones y armadura que estés dispuesto a arriesgar. Usa Protect from Magic y, una vez que los hayas matado, lleva su botín a Kolodion.
Use a god cape of your choice on Kolodion to have it imbued.=Usa la God cape que prefieras en Kolodion para que la imbuyan.
