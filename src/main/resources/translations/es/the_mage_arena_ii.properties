You can get another from Kolodion in the Mage Arena Cavern.=Puedes conseguir otro de Kolodion en la Mage Arena Cavern.
Unlocked by casting the Saradomin Strike 100 times within the mage arena=Se desbloquea lanzando Saradomin Strike 100 veces en la mage arena
Unlocked by casting the Claws of Guthix 100 times within the mage arena=Se desbloquea lanzando Claws of Guthix 100 veces en la mage arena
Unlocked by casting the Flames of Zamorak 100 times within the mage arena=Se desbloquea lanzando Flames of Zamorak 100 veces en la mage arena
