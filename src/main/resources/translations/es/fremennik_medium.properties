# Spanish translations for Fremennik Medium Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Any pickaxe=Cualquier pickaxe
Dramen or Lunar staff=Dramen o Lunar staff
Combat gear=Equipo de combate
Alternatively, use Magic Butterfly Net=Como alternativa, usa Magic Butterfly Net
Obtained from Askeladden in Rellekka=Se obtiene de Askeladden en Rellekka
Use a spade to enter the Brine Rat Cavern.=Usa una spade para entrar en la Brine Rat Cavern.
Kill a brine rat then roll the boulder and exit the cave..=Mata a un brine rat, luego empuja la roca y sal de la cueva..
Use a fairy ring and travel to (CIP).=Usa un fairy ring y viaja a (CIP).
Enter the cave at the top of Eagles' Peak. Use fairy ring and travel to (AKQ), then head south.=Entra en la cueva en la cima de Eagles' Peak. Usa el fairy ring y viaja a (AKQ), luego dirígete al sur.
Use rope on the Polar Eagle to travel to the Snowy Hunter area.=Usa una rope en el Polar Eagle para viajar a la zona de caza nevada.
Exit the cave.=Sal de la cueva.
Catch a Snowy Knight at the Fremennik Hunter Area.=Pesca un Snowy Knight en la zona de caza de Fremennik.
Steal from the Rellekka fish stall.=Roba del puesto de pescado de Rellekka.
Mine some coal.=Mina algo de carbón.
Enter the tunnel that leads to the Arzinian Mine.=Entra en el túnel que lleva a la Arzinian Mine.
Go through the cave entrance.=Pasa por la entrada de la cueva.
Speak with the Dwarven Ferryman to go to cross the river.=Habla con el Dwarven Ferryman para cruzar el río.
Speak with Dondakan to enter the mine.=Habla con Dondakan para entrar en la mina.
Mine the nearby gold. Remove helmet to escape area.=Mina el oro cercano. Quítate el casco para escapar de la zona.
Speak with Jarvald to travel to Waterbirth Island.=Habla con Jarvald para viajar a Waterbirth Island.
Enter the cave and pray melee. Make sure you are full stamina and prayer before entering.=Entra en la cueva y reza protección contra melé. Asegúrate de tener la stamina y la oración llenas antes de entrar.
Drop your pet rock on one pressure pad then stand on the other pad to open the gate.=Suelta tu pet rock en una pressure pad y luego ponte en la otra para abrir la verja.
Continue onwards until you reach the barrier.=Continúa hasta llegar a la barrera.
Activate special attack with the rune thrownaxes equipped.=Activa el ataque especial con las rune thrownaxes equipadas.
Attack the Door-Support with a rune thrownaxe special attack. If done correctly the axe should ricochet and lower all 3 barriers.=Ataca al Door-Support con el ataque especial de rune thrownaxe. Si se hace bien, el hacha debería rebotar y bajar las 3 barreras.
Enable magic protection then climb down the ladder.=Activa la protección contra magia y luego baja por la escalera.
Enable melee protection and continue through the cave.=Activa la protección contra melé y continúa por la cueva.
Keep current protection and continue through the cave.=Mantén la protección actual y continúa por la cueva.
Enable missile protection then continue through the cave.=Activa la protección contra proyectiles y luego continúa por la cueva.
Enable magic protection and continue through the cave.=Activa la protección contra magia y continúa por la cueva.
Keep current protection and continue through the cave. BE PREPARED TO EAT FOOD, YOU WILL GET HIT BY MISSILE / MAGIC.=Mantén la protección actual y continúa por la cueva. PREPÁRATE PARA COMER COMIDA, TE GOLPEARÁN PROYECTILES / MAGIA.
Use a pet rock on your pet house in your menagerie in your player owned house and then pick it up off the GROUND. You may need to re-enter your house after placing your pet rock in the pet house.=Usa una pet rock en tu pet house de la menagerie de tu casa y luego recógela del SUELO. Puede que tengas que volver a entrar en tu casa tras colocar la pet rock en la pet house.
Talk to Thorodin south of Rellekka to claim your reward!=¡Habla con Thorodin al sur de Rellekka para reclamar tu recompensa!
Brine rat (level 70) and tank many hits in the Waterbirth Island Dungeon=Brine rat (nivel 70) y aguanta muchos golpes en la Waterbirth Island Dungeon
Improved rate of gaining approval on Miscellania.=Mejor ritmo para ganar aprobación en Miscellania.
