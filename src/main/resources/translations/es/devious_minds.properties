# Spanish translations for Devious Minds.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Amulet of Glory (Teleports to Port Sarim and Edgeville)=Amulet of Glory (teletransporta a Port Sarim y Edgeville)
Large/Colossal Pouch (non-degraded)=Large/Colossal Pouch (sin degradar)
Banked all equipment and weapons=Todo el equipo y las armas guardados en el banco
Start by talking to the Monk outside the Paterdomus temple, east of Varrock.=Empieza hablando con el Monk fuera del templo de Paterdomus, al este de Varrock.
Use the Mithril 2H sword on Doric's Whetstone. (Doric is located north of Falador).=Usa la Mithril 2H sword en la Whetstone de Doric. (Doric está al norte de Falador).
Use the bow-string on the Slender blade to make the Bow-sword.=Usa la bow-string en la Slender blade para fabricar la Bow-sword.
Return to the monk near the Paterdomus temple with the bow-sword.=Vuelve con el monk cerca del templo de Paterdomus con la bow-sword.
Use the Orb on the Large/Colossal Pouch. You will also be going to Entrana via the Abyss, so you must bank all combat gear.=Usa el Orb en la Large/Colossal Pouch. También irás a Entrana por el Abyss, así que debes guardar en el banco todo el equipo de combate.
Teleport with the Mage of Zamorak IN THE WILDERNESS (other players can attack you here) to the Abyss. You will be attacked by monsters upon entering, and your prayer drained to 0!=Teletranspórtate con el Mage of Zamorak EN EL WILDERNESS (otros jugadores pueden atacarte aquí) al Abyss. Serás atacado por monstruos al entrar, ¡y tu prayer se drenará a 0!
Enter the central area through a gap/passage/eyes. Enter the Law Rift.=Entra en la zona central por un hueco/pasaje/ojos. Entra en el Law Rift.
Enter the portal to leave the Law Altar.=Entra en el portal para salir del Law Altar.
Use the illuminated pouch on the Altar in the Entrana Church.=Usa la illuminated pouch en el Altar de la iglesia de Entrana.
Go back to the monk near Paterdomus temple and search the dead monk's body.=Vuelve con el monk cerca del templo de Paterdomus y registra el cuerpo del monk muerto.
Talk to the Monk of Entrana to go to Entrana.=Habla con el Monk of Entrana para ir a Entrana.
Use the gangplank to disembark the boat.=Usa la gangplank para desembarcar del barco.
Talk to the High Priest in the Entrana Church (Rat Pits Port Sarim Minigame teleport is the closest teleport).=Habla con el High Priest en la iglesia de Entrana (el teletransporte del minijuego Rat Pits Port Sarim es el más cercano).
Talk to Sir Tiffy Cashien in Falador park to complete the quest.=Habla con Sir Tiffy Cashien en el parque de Falador para completar la misión.
Survive against Abyssal Creatures in multicombat in the Abyss=Sobrevive a las Abyssal Creatures en multicombate en el Abyss
You will need to enter the Wilderness briefly during the quest. Other players can attack and kill you here, so don't bring anything you're not willing to lose!=Tendrás que entrar brevemente en el Wilderness durante la misión. Otros jugadores pueden atacarte y matarte aquí, así que no lleves nada que no estés dispuesto a perder.
You will enter the Abyss briefly during this quest. This is full of aggressive monsters in multi-combat, and your prayer will be drained to 0 upon entering!=Entrarás brevemente en el Abyss durante esta misión. Está lleno de monstruos agresivos en multicombate, ¡y tu prayer se drenará a 0 al entrar!
Starting off=Empezando
Making the Bow-sword=Fabricando la Bow-sword
A Gift for Entrana=Un regalo para Entrana
Surprise!=¡Sorpresa!
