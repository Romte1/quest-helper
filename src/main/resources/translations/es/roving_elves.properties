# Spanish translations for Roving Elves.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Eluned=Puedes conseguir otra de Eluned
You can get another from Golrie under Tree Gnome Village=Puedes conseguir otra de Golrie, bajo Tree Gnome Village
You can get another from inside Baxtorian Falls=Puedes conseguir otra dentro de Baxtorian Falls
Talk to Islwyn in Isafdar. If he's not at the marked location, try hopping worlds to find him here.=Habla con Islwyn en Isafdar. Si no está en el lugar marcado, prueba a cambiar de mundo para encontrarlo aquí.
Talk to Eluned.=Habla con Eluned.
Bank everything besides the pebble, some potions, and some food. After, go use Glarial's pebble to Glarial's Tombstone east of Baxtorian Falls. Be prepared to fight a level 84 Moss Guardian bare-handed.=Guarda todo en el banco excepto el pebble, algunas potions y algo de food. Después, usa Glarial's pebble en Glarial's Tombstone, al este de Baxtorian Falls. Prepárate para luchar contra un Moss Guardian de nivel 84 con las manos desnudas.
Kill the Moss Guardian for a Consecration seed.=Mata al Moss Guardian para conseguir una Consecration seed.
Pick up the consecration seed.=Coge la consecration seed.
Return the seed to Eluned.=Devuelve la seed a Eluned.
Board the log raft on the top of Baxtorian Falls.=Súbete a la log raft en lo alto de Baxtorian Falls.
Use a rope on the rock to the south.=Usa una rope en la roca del sur.
Use a rope on the dead tree.=Usa una rope en el árbol muerto.
Enter the falls.=Entra en las cascadas.
Search the crate in the east room for a key.=Busca en la caja de la sala del este para encontrar una key.
Go through the doors from the west room.=Cruza las puertas desde la sala del oeste.
Plant the consecrated seed anywhere in the room.=Planta la consecrated seed en cualquier lugar de la sala.
Return to Islwyn in Isafdar to finish the quest.=Vuelve con Islwyn en Isafdar para terminar la misión.
Moss Guardian (level 84) without runes, weapons, or armour=Moss Guardian (nivel 84) sin runas, armas ni armadura
Starting off=Empezando
Get the seed=Consigue la seed
Plant the seed=Planta la seed
Key (obtainable in quest)=Key (se consigue durante la misión)
Glarial's pebble (obtainable in quest)=Glarial's pebble (se consigue durante la misión)
Teleport to Baxtorian Falls. Skills necklace (Fishing Guild [1]), Games necklace (Barbarian Outpost [2])=Teletranspórtate a Baxtorian Falls. Skills necklace (Fishing Guild [1]), Games necklace (Barbarian Outpost [2])
Teleport near to Elven Forest. Iorwerth camp teleport, Charter Ship to Port Tyras=Teletranspórtate cerca del Elven Forest. Iorwerth camp teleport, Charter Ship a Port Tyras

A few prayer potions=Unas pocas prayer potions
Food=Comida
