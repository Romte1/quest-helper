# Spanish translations for Shield of Arrav - Phoenix Gang.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Reldo in the Varrock Castle library.=Habla con Reldo en la biblioteca del Varrock Castle.
Search the marked bookcase for a book, then read it.=Busca un libro en el librero marcado y léelo.
Talk to Reldo again.=Habla con Reldo de nuevo.
Talk to Baraek in the Varrock Square.=Habla con Baraek en Varrock Square.
Head into the Phoenix Gang's base in south Varrock.=Entra en la base de la Phoenix Gang al sur de Varrock.
Talk to Straven.=Habla con Straven.
Go back up to the surface.=Sube de nuevo a la superficie.
Kill Jonny the Beard in the Blue Moon Inn in Varrock.=Mata a Jonny the Beard en el Blue Moon Inn de Varrock.
Pick up the Intel Report.=Coge el Intel Report.
Return to the Phoenix Gang's base.=Vuelve a la base de la Phoenix Gang.
Talk to Straven again.=Habla con Straven de nuevo.
Search the chest in the Phoenix base for half of the Shield of Arrav.=Busca en el cofre de la base de la Phoenix Gang la mitad del Shield of Arrav.
Trade your weapon store key to your partner. If you can't trade, use the key on them to drop it at their feet. AFTERWARDS, talk to Curator Haig in the Varrock Museum.=Intercambia tu weapon store key con tu compañero. Si no puedes intercambiar, usa la key sobre él para dejarla a sus pies. DESPUÉS, habla con Curator Haig en el Varrock Museum.
Talk to King Roald in Varrock Castle to finish the quest.=Habla con King Roald en el Varrock Castle para terminar la misión.
Trade one of your certificate halves for the other half with another player.  If you cannot trade, use the certificate on them to drop it at their feet. They can do the same for you.=Intercambia una de tus certificate halves por la otra mitad con otro jugador. Si no puedes intercambiar, usa la certificate sobre él para dejarla a sus pies. Él puede hacer lo mismo por ti.
Use the two certificate halves together to create the certificate.=Combina las dos certificate halves para crear la certificate.
Locating the Phoenix Gang=Localizando a la Phoenix Gang
Joining the gang=Uniéndose a la banda
Returning the shield=Devolviendo el escudo
Jonny the beard (level 2)=Jonny the beard (nivel 2)
You can also do this quest by joining the Black Arm Gang, which instead requires you to kill the weaponsmaster (level 23), or have another player kill them for you.=También puedes hacer esta misión uniéndote a la Black Arm Gang, que en su lugar requiere que mates al weaponsmaster (nivel 23), o que otro jugador lo mate por ti.
Once you're accepted into one of the gangs, you CANNOT change gang.=Una vez que te acepten en una de las bandas, NO PUEDES cambiar de banda.
This quest requires you to swap items with another player who's in the other gang, so it's recommended to either find a friend to help you, or you can use the friend's chat 'OSRS SOA' and find someone to help there.=Esta misión requiere intercambiar objetos con otro jugador que esté en la otra banda, así que se recomienda encontrar un amigo que te ayude, o usar el friend's chat 'OSRS SOA' y buscar a alguien que te ayude allí.
