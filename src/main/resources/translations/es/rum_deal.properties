# Spanish translations for Rum Deal.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Captain Braindeath=Puedes conseguir otro de Captain Braindeath
You can get more from Captain Braindeath=Puedes conseguir más de Captain Braindeath
You can get another from Captain Braindeath, or make it with a fishbowl and large net=Puedes conseguir otro de Captain Braindeath, o hacerlo con un fishbowl y una large net
Talk to Pirate Pete north east of the Ectofuntus.=Habla con Pirate Pete al noreste del Ectofuntus.
Talk to Captain Braindeath.=Habla con Captain Braindeath.
Go down the ladder.=Baja por la escalera.
Go up to the first floor.=Sube al primer piso.
Go down to the island's farming patch to plant the blindweed seed.=Baja a la parcela de cultivo de la isla para plantar la blindweed seed.
Rake the blindweed patch.=Rastrilla la parcela de blindweed.
Plant the seed in the blindweed patch.=Planta la semilla en la parcela de blindweed.
Wait 5 minutes for the blindweed to grow.=Espera 5 minutos a que crezca el blindweed.
Pick the blindweed on Braindeath Island.=Coge el blindweed en Braindeath Island.
Take the blindweed back to Captain Braindeath.=Lleva el blindweed de vuelta a Captain Braindeath.
Go to the top floor and put the blindweed into the hopper.=Ve al último piso y pon el blindweed en la hopper.
Return to Captain Braindeath.=Vuelve con Captain Braindeath.
Go to the north part of the island and get some stagnant water.=Ve a la parte norte de la isla y consigue agua estancada.
Take the water back to the hopper on the top floor.=Lleva el agua de vuelta a la hopper del último piso.
Talk to Davey south west of Captain Braindeath.=Habla con Davey al suroeste de Captain Braindeath.
Use the holy wrench on the brewing control. Be prepared to fight an evil spirit.=Usa la holy wrench en el control de elaboración. Prepárate para luchar contra un espíritu maligno.
Kill the Evil Spirit.=Mata al Evil Spirit.
Go up the ladder.=Sube por la escalera.
Go into the brewery's basement and kill a fever spider. If you're not wearing slayer gloves they'll afflict you with disease.=Entra en el sótano de la destilería y mata a una fever spider. Si no llevas slayer gloves, te causarán enfermedad.
Pick up the fever spider body.=Coge el fever spider body.
Add the spider body to the hopper on the top floor.=Añade el cuerpo de la araña a la hopper del último piso.
Fill a bucket from the output tap in the south west of the brewery.=Llena un bucket en el grifo de salida del suroeste de la destilería.
Bring the unsanitary swill to Captain Donnie south of the Brewery.=Lleva el unsanitary swill a Captain Donnie al sur de la destilería.
Return to Captain Braindeath to finish.=Vuelve con Captain Braindeath para terminar.
Talk to Captain Braindeath to finish.=Habla con Captain Braindeath para terminar.
