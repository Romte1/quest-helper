# Spanish translations for Enakhra's Lament.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Lazim=Puedes conseguir otro de Lazim
Before you begin, ensure that you have enough prayer points to use Protect from Melee for around five seconds (you will need this later in the temple). Talk to Lazim in the quarry south of the Bandit Camp.=Antes de empezar, asegúrate de tener suficientes puntos de oración para usar Protect from Melee durante unos cinco segundos (lo necesitarás más adelante en el templo). Habla con Lazim en la cantera al sur del Bandit's Camp.
Get 32kg of sandstone and give it to Lazim. This can be done in batches, and you can mine some nearby.=Consigue 32 kg de sandstone y entrégaselo a Lazim. Puedes hacerlo por tandas y minar algo cerca.
Use a chisel on the sandstone 32kg.=Usa un chisel en el sandstone 32kg.
Place the base on the flat ground nearby.=Coloca la base en el suelo llano que hay cerca.
Talk to Lazim again.=Habla con Lazim de nuevo.
Get 20kg of sandstone and give it to Lazim. This can be done in batches, and you can mine some nearby.=Consigue 20 kg de sandstone y entrégaselo a Lazim. Puedes hacerlo por tandas y minar algo cerca.
Use a chisel on the sandstone 20kg.=Usa un chisel en el sandstone 20kg.
Place the body on the sandstone base.=Coloca el cuerpo sobre la base de sandstone.
Talk to Lazim and choose the head you'd like the statue to have.=Habla con Lazim y elige la cabeza que quieres que tenga la estatua.
Get 2 x granite (5kg). You can mine some nearby.=Consigue 2 x granite (5kg). Puedes minar algo cerca.
Use a chisel on a piece of granite 5kg, and choose the head you decided on to craft.=Usa un chisel en un granite de 5 kg y elige la cabeza que hayas decidido crear.
Use a chisel on the headless statue.=Usa un chisel en la estatua sin cabeza.
Give Lazim the head.=Entrega la cabeza a Lazim.
Enter the temple south of the Bandit's Camp.=Entra en el templo al sur del Bandit's Camp.
Talk to Lazim in the temple.=Habla con Lazim en el templo.
Use a chisel on the fallen statue to get all its limbs.=Usa un chisel en la estatua caída para obtener todos sus miembros.
Take the M sigil from the pedestal in the room.=Coge el M sigil del pedestal de la sala.
Take the Z sigil from the pedestal in the north room.=Coge el Z sigil del pedestal de la sala norte.
Take the K sigil from the pedestal in the west room.=Coge el K sigil del pedestal de la sala oeste.
Take the R sigil from the pedestal in the south room.=Coge el R sigil del pedestal de la sala sur.
Talk to Lazim in the temple for the stone head.=Habla con Lazim en el templo para conseguir la stone head.
Enter the right arm door.=Entra en la puerta del brazo derecho.
Enter the left leg door.=Entra en la puerta de la pierna izquierda.
Enter the left arm door.=Entra en la puerta del brazo izquierdo.
Enter the right leg door.=Entra en la puerta de la pierna derecha.
Enter the door with a K.=Entra en la puerta con una K.
Enter the door with an R.=Entra en la puerta con una R.
Enter the door with an M.=Entra en la puerta con una M.
Enter the door with a Z.=Entra en la puerta con una Z.
Open the central room's doors using the metal letters. Go up the ladder in the central room.=Abre las puertas de la sala central usando las letras metálicas. Sube por la escalera de la sala central.
Use soft clay on the pedestal.=Usa soft clay en el pedestal.
Use a chisel on granite (5kg).=Usa un chisel en granite (5kg).
Use the camel stone head on the pedestal.=Usa la camel stone head en el pedestal.
Right-click use bread or cake on Pentyn.=Haz clic derecho para usar bread o cake en Pentyn.
Cast a fire spell on the frozen fountain.=Lanza un hechizo de fuego en la fuente congelada.
Cast an air spell on the furnace.=Lanza un hechizo de aire en el horno.
Use a normal log on the south west brazier.=Usa un log normal en el brasero suroeste.
Use an oak log on the south brazier.=Usa un oak log en el brasero sur.
Use a willow log on the south east brazier.=Usa un willow log en el brasero sureste.
Use a maple log on the north west brazier.=Usa un maple log en el brasero noroeste.
Use a candle on the north brazier.=Usa una candle en el brasero norte.
Use coal on the north east brazier.=Usa coal en el brasero noreste.
Pass through the magic barrier and go up the ladder.=Cruza la barrera mágica y sube por la escalera.
Go up the ladder.=Sube por la escalera.
Cast crumble undead on the Boneguard. Make sure you take off any armour or weapons which give you a negative magic attack bonus or else you might splash.=Lanza crumble undead sobre el Boneguard. Asegúrate de quitarte cualquier armadura o arma que te dé un bono de ataque mágico negativo o podrías fallar el hechizo.
Climb down the stone ladder past the Boneguard.=Baja por la escalera de piedra pasando junto al Boneguard.
Put on Protect from Melee, then talk to the Boneguard.=Activa Protect from Melee y luego habla con el Boneguard.
Take sandstone from the nearby rubble, and use it to repair the south wall. For each piece added, use a chisel on the wall.=Coge sandstone de los escombros cercanos y úsalo para reparar la pared sur. Por cada pieza añadida, usa un chisel en la pared.
Use a chisel on the wall.=Usa un chisel en la pared.
Talk to the Boneguard to finish the quest.=Habla con el Boneguard para terminar la misión.
Starting off=Empezando
Craft a statue=Fabrica una estatua
Explore the ground floor=Explora la planta baja
Solve the puzzles=Resuelve los puzles
Free Akthankos=Libera a Akthankos
Runes to cast Wind Bolt or stronger=Runes para lanzar Wind Bolt o un hechizo más fuerte
Runes to cast Fire Bolt or stronger=Runes para lanzar Fire Bolt o un hechizo más fuerte
Runes for crumble undead spell=Runes para el hechizo crumble undead
