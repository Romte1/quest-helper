Talk to Attala, stood south of Ralos' Rise.=Habla con Attala, al sur de Ralos' Rise.
Kill the sulphur nagua just atop the cliff north east of Attala. You can climb the rocks just to the east to reach it quickly with 47 Agility.=Mata a la sulphur nagua justo en lo alto del acantilado al noreste de Attala. Puedes subir por las rocas justo al este para llegar rápidamente con 47 Agility.
Return to Attala.=Vuelve con Attala.
