Talk to Attala near the Monolith.=Habla con Attala cerca del Monolith.
Use the talismans to find the correct location. Earth tells you if it's east/west, and the water talisman tells you north/south.=Usa los talismanes para encontrar la ubicación correcta. El de earth te dice si es este u oeste, y el water talisman te dice norte o sur.
Despite how the world map looks, the antechamber counts as being directly in the middle of the 4 areas, so if it says to go south and east when in there, you should go to the ancient shrine, accessed through the prison or the streambound cavern.=Aunque el mapa del mundo parezca indicar lo contrario, la antecámara cuenta como si estuviera directamente en el centro de las 4 áreas, así que si dice que vayas al sur y al este estando allí, deberías ir al ancient shrine, al que se accede a través de la prison o de la streambound cavern.
Use the talismans to find the correct location. More details in the sidebar.=Usa los talismanes para encontrar la ubicación correcta. Más detalles en la barra lateral.
Talk to Eyatlalli.=Habla con Eyatlalli.
Talk to Jessamine near the Monolith again.=Habla con Jessamine cerca del Monolith de nuevo.
Enter the north-east entrance to the streambound cavern.=Entra en la entrada noreste de la streambound cavern.
Collect a grub from the grubby sapling east of the camp.=Recoge un grub del grubby sapling al este del campamento.
Take herblore supplies from the supply crates in the camp. You only need the pestle and mortar.=Coge herblore supplies de las cajas de suministros del campamento. Solo necesitas el pestle and mortar.
Use a pestle and mortar on the moonlight grub.=Usa un pestle and mortar en el moonlight grub.
Take fishing supplies from the supply crates in the camp.=Coge fishing supplies de las cajas de suministros del campamento.
Fish a bream from the stream east of the camp.=Pesca un bream en el arroyo al este del campamento.
Use a knife on the raw bream.=Usa un knife en el raw bream.
Take hunter supplies from the supply crates in the camp. You only need the rope, and the knife from the fishing supplies.=Coge hunting supplies de las cajas de suministros del campamento. Solo necesitas la rope y el knife de los fishing supplies.
Enter the entrance north of the camp.=Entra en la entrada al norte del campamento.
Set up a trap by clicking two rocks near one another.=Coloca una trampa haciendo clic en dos rocas cercanas entre sí.
Rustle the nearby bush to trap a lizard.=Sacude el arbusto cercano para atrapar un lizard.
Pick up the raw moss lizard.=Coge el raw moss lizard.
Use a knife on the raw moss lizard.=Usa un knife en el raw moss lizard.
Leave the area back to the antechamber via the south-east entrance.=Sal del área de vuelta a la antecámara por la entrada sureste.
Talk to Eyatlalli with the items.=Habla con Eyatlalli con los objetos.
Enter the entrance to Cam Torum, ready to fight. You can make good food and potions inside Neypotzli.=Entra en la entrada de Cam Torum, listo para luchar. Puedes preparar buena comida y pociones dentro de Neypotzli.
Enter the Neypotzli entrance in the far north of Cam Torum, ready to fight.=Entra en la entrada de Neypotzli en el extremo norte de Cam Torum, listo para luchar.
Enter the north-west entrance to the earthbound cavern when you're ready for the blue moon fight. Make food and potions from the lizards, breams, and grubby saplings before the fights.=Entra en la entrada noroeste de la earthbound cavern cuando estés listo para la lucha contra el blue moon. Prepara comida y pociones con los lizards, breams y grubby saplings antes de las peleas.
Enter the entrance to the blue moon fight.=Entra en la entrada de la lucha contra el blue moon.
Defeat the blue moon. The sidebar has more details.=Derrota al blue moon. La barra lateral tiene más detalles.
Defeat the blue moon. Use a crush weapon. Protection prayers have no effect.=Derrota al blue moon. Usa un crush weapon. Las protection prayers no tienen efecto.
Remain inside of the highlighted circle on the floor to remain safe. It will move periodically.=Permanece dentro del círculo resaltado del suelo para estar a salvo. Se moverá periódicamente.
When the highlighted circle is the full or new moon, they will use a special attack:=Cuando el círculo resaltado sea la luna llena o la luna nueva, usarán un ataque especial:
Weapon freeze - Your weapon is unequipped and put into ice. Attack the ice to get it back.=Weapon freeze: te quitan el arma y la congelan en hielo. Ataca el hielo para recuperarla.
Brazier - two braziers will extinguish. Re-ignite them whilst avoiding the tornadoes.=Brazier: se apagarán dos braseros. Vuelve a encenderlos mientras esquivas los tornados.
Enter the ancient prison when you're ready for the blood moon fight. Make food and potions from the lizards, breams, and grubby saplings before the fights.=Entra en la ancient prison cuando estés listo para la lucha contra el blood moon. Prepara comida y pociones con los lizards, breams y grubby saplings antes de las peleas.
Enter the north-east entrance to the blood moon fight.=Entra en la entrada noreste de la lucha contra el blood moon.
Defeat the blood moon. The sidebar has more details.=Derrota al blood moon. La barra lateral tiene más detalles.
Defeat the blood moon. Use a slash weapon. Protection prayers have no effect.=Derrota al blood moon. Usa un slash weapon. Las protection prayers no tienen efecto.
Raining blood - Blood falls from the ceiling. Avoid the blood puddles.=Raining blood: cae sangre del techo. Evita los charcos de sangre.
Blood jaguar - Jaguars appear. Attack the highlighted jaguar, avoiding the blood square. Step away from the jaguar just before each of its attacks.=Blood jaguar: aparecen jaguares. Ataca al jaguar resaltado, evitando la casilla de sangre. Apártate del jaguar justo antes de cada uno de sus ataques.
Enter the streambound cavern when you're ready for the eclipse moon fight. Make food and potions from the lizards, breams, and grubby saplings before the fights.=Entra en la streambound cavern cuando estés listo para la lucha contra el eclipse moon. Prepara comida y pociones con los lizards, breams y grubby saplings antes de las peleas.
Enter the south entrance to the eclipse moon fight.=Entra en la entrada sur de la lucha contra el eclipse moon.
Defeat the eclipse moon. The sidebar has more details.=Derrota al eclipse moon. La barra lateral tiene más detalles.
Defeat the eclipse moon. Use a stab weapon. Protection prayers have no effect.=Derrota al eclipse moon. Usa un stab weapon. Las protection prayers no tienen efecto.
Only use food and potions made inside of Neypotzli.=Usa solo comida y pociones preparadas dentro de Neypotzli.
Eclipse shield - A moon shield appears. Keep behind the shield as it moves.=Eclipse shield: aparece un escudo lunar. Mantente detrás del escudo mientras se mueve.
Mimic - Clones of the moon will appear. Face the clones to avoid taking damage.=Mimic: aparecerán clones de la luna. Mira hacia los clones para evitar recibir daño.
Return to Jessamine near the Monolith again.=Vuelve con Jessamine cerca del Monolith de nuevo.
Talk to Zuma.=Habla con Zuma.
Talk to Eyatlalli to finish the quest.=Habla con Eyatlalli para terminar la misión.
