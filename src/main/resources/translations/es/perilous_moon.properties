Talk to Jessamine near the entrance.=Habla con Jessamine cerca de la entrada.
Take some building supplies from the crates near Jessamine.=Coge algunos building supplies de las cajas cerca de Jessamine.
Enter the south-west entrance.=Entra en la entrada suroeste.
