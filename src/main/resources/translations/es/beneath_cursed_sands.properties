# Spanish translations for Beneath Cursed Sands.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

Warm up Zahur's Chemistry Equipment.=Calienta el equipo de química de Zahur.
Any cooked or raw meat=Cualquier carne cocinada o cruda
Purchasable from a shop during the quest. Fish will NOT work=Se puede comprar en una tienda durante la misión. El pescado NO sirve
Used for protection against the desert heat=Sirve de protección contra el calor del desierto
Access to Fairy Rings=Acceso a los Fairy Rings
When visiting Necropolis during the quest, you can unlock the direct teleport by using 'Commune' on the Obelisk.=Al visitar Necropolis durante la misión, puedes desbloquear el teletransporte directo usando 'Commune' en el Obelisk.
Talk to Jamila in Sophanem to start the quest.=Habla con Jamila en Sophanem para empezar la misión.
Talk to Jamila to obtain a special item=Habla con Jamila para obtener un objeto especial
Read the message.=Lee el mensaje.
Talk to Maisa at the campsite east of Sophanem, and investigate the excavation.=Habla con Maisa en el campamento al este de Sophanem e investiga la excavación.
Inspect the blocked entry at the Jaltevas Pyramid.=Inspecciona la entrada bloqueada en la Jaltevas Pyramid.
Prepare to fight the Head Menaphite Guard, and talk to either a citizen or Menaphite Guard to start the fight.=Prepárate para luchar contra el Head Menaphite Guard y habla con un ciudadano o con un Menaphite Guard para empezar el combate.
Fight the Head Menaphite Guard. This boss uses melee, and can hit up to 16. DO NOT USE ANY OVERHEAD PROTECTION PRAYERS, OR YOU WILL GET HIT FOR 1/3RD OF YOUR HITPOINTS=Lucha contra el Head Menaphite Guard. Este jefe usa melee y puede golpear hasta 16. NO USES NINGÚN REZO DE PROTECCIÓN POR ENCIMA, O RECIBIRÁS 1/3 DE TUS HITPOINTS
Talk to Maisa to continue the quest.=Habla con Maisa para continuar la misión.
Go back to Maisa's camp and talk to her.=Vuelve al campamento de Maisa y habla con ella.
Inspect the furnace.=Inspecciona el horno.
Work out how to unlock the underground entrance west of the obelisk in Ullek.=Averigua cómo desbloquear la entrada subterránea al oeste del obelisco en Ullek.
Search the camping equipment by the tent for a tinderbox.=Busca en el equipo de acampada junto a la tienda para encontrar un tinderbox.
Pick up a spade south of the campsite.=Coge una spade al sur del campamento.
From the campsite, head south and then to the east, around the cliffs, where you will find a set of stairs to the Ruins of Ullek.=Desde el campamento, ve al sur y luego al este, rodeando los acantilados, donde encontrarás unas escaleras a las Ruins of Ullek.
Use coal on the furnace to refuel it.=Usa coal en el horno para rellenarlo de combustible.
Use your tinderbox on the furnace to light it.=Usa tu tinderbox en el horno para encenderlo.
Search the well to receive a stone tablet.=Busca en el pozo para recibir un stone tablet.
Read the stone tablet.=Lee el stone tablet.
Leave the Ruins of Ullek using the steps in the south-east.=Sal de las Ruins of Ullek usando las escaleras del sureste.
Dig in front of the southernmost ritual pillar=Cava delante del pilar ritual más al sur
Open the chest and input the passcode "1118513".=Abre el cofre e introduce el código "1118513".
Return to the Ruins of Ullek.=Vuelve a las Ruins of Ullek.
Craft a scarab emblem using the furnace.=Fabrica un scarab emblem usando el horno.
Inspect the pillar to the north to insert the emblem.=Inspecciona el pilar al norte para insertar el emblema.
Rotate the scarab on the emblem so it faces downwards.=Gira el escarabajo del emblema para que mire hacia abajo.
Enter the dungeon.=Entra en la mazmorra.
Use Protect from Magic and defeat the two Scarab Mages.=Usa Protect from Magic y derrota a los dos Scarab Mages.
Climb down the stairs.=Baja por las escaleras.
Avoid the projectiles, run west to the junction, run south, follow the corridor, and pull the lever at the end.=Evita los proyectiles, corre al oeste hasta la bifurcación, corre al sur, sigue el pasillo y tira de la palanca al final.
As fast as possible, run back to the juncture, then run north and pull the second lever.=Lo más rápido posible, vuelve corriendo a la bifurcación, luego corre al norte y tira de la segunda palanca.
With the traps disabled, go through the door west of the juncture.=Con las trampas desactivadas, cruza la puerta al oeste de la bifurcación.
Solve the tomb riddle.=Resuelve el acertijo de la tumba.
Enter the tomb.=Entra en la tumba.
Speak to the Spirit.=Habla con el Spirit.
Take the rusty key from the urn in the back of the room.=Coge la rusty key de la urna al fondo de la sala.
Leave the tomb.=Sal de la tumba.
Leave the riddle area.=Sal de la zona del acertijo.
Go back upstairs.=Vuelve a subir.
Prepare to fight the Champion of Scabaras, and unlock the door to start the fight.=Prepárate para luchar contra el Champion of Scabaras y desbloquea la puerta para empezar el combate.
Prepare to fight the Champion of Scabaras, and open the door to start the fight.=Prepárate para luchar contra el Champion of Scabaras y abre la puerta para empezar el combate.
Fight the Champion of Scabaras.=Lucha contra el Champion of Scabaras.
Protect from Magic, and keep 4+ tiles distance at all times.=Usa Protect from Magic y mantén siempre una distancia de 4+ casillas.
Whenever a rift or swarm appears, kill it.=Cada vez que aparezca una rift o un swarm, mátalo.
He is weak to ranged attacks, so bring your best ranged gear.=Es débil a los ataques a distancia, así que lleva tu mejor equipo de ranged.
Defeat the Swarm as soon as possible, to prevent shadow flames from hindering your movement.=Derrota al Swarm lo antes posible para evitar que las shadow flames dificulten tu movimiento.
Destroy the Shadow Rift as soon as possible, to prevent 35+ damage from occurring once it explodes.=Destruye la Shadow Rift lo antes posible para evitar recibir 35+ de daño cuando explote.
Go back to the Champion of Scabaras boss area, and talk to the High Priest of Scabaras.=Vuelve a la zona del jefe Champion of Scabaras y habla con el High Priest of Scabaras.
Talk to the High Priest of Scabaras.=Habla con el High Priest of Scabaras.
Leave the dungeon.=Sal de la mazmorra.
Talk to Maisa or Zahur in Nardah.=Habla con Maisa o Zahur en Nardah.
Purchase some meat from the General Store.=Compra algo de carne en la General Store.
Head west and attempt to jump to the stepping stones over the River Elid.=Ve al oeste e intenta saltar a las stepping stones sobre el River Elid.
Attempt to cross the stepping stones again, and pick the Lily of the Elid.=Intenta cruzar las stepping stones de nuevo y coge la Lily of the Elid.
Go back to Zahur in Nardah.=Vuelve con Zahur en Nardah.
Talk to Zahur in Nardah.=Habla con Zahur en Nardah.
Warm up the Chemistry Equipment.=Calienta el Chemistry Equipment.
