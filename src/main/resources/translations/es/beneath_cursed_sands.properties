Warm up the Chemistry Equipment. Increase the temperature of the second valve.=Calienta el Chemistry Equipment. Sube la temperatura de la segunda válvula.
Warm up the Chemistry Equipment. Decrease the temperature of the second valve.=Calienta el Chemistry Equipment. Baja la temperatura de la segunda válvula.
Warm up the Chemistry Equipment. Increase the temperature of the third valve.=Calienta el Chemistry Equipment. Sube la temperatura de la tercera válvula.
