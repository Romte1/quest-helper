# Spanish translations for Observatory Quest.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to the Observatory professor north of Castle Wars.=Habla con el profesor del Observatory al norte de Castle Wars.
Give the professor 3 planks.=Entrega 3 planks al profesor.
Give the professor a bronze bar.=Entrega un bronze bar al profesor.
Give the professor some molten glass.=Entrega molten glass al profesor.
Enter the dungeon east of the Professor.=Entra en la mazmorra al este del profesor.
Search only the marked chests in the dungeon. Unmarked chests contain monsters and may poison you.=Busca solo en los cofres marcados de la mazmorra. Los cofres sin marcar contienen monstruos y pueden envenenarte.
Prod the sleeping guard in the north of the dungeon. He'll attack you. You need to then either kill him, or get him in the marked spot to the north of the gate.=Pincha al guardia dormido del norte de la mazmorra. Te atacará. Después tendrás que matarlo o llevarlo a la zona marcada al norte de la puerta.
Either kill or trap the guard on the marked tile to the north, then search the goblin stove.=Mata o atrapa al guardia en la casilla marcada al norte y luego busca en el goblin stove.
Climb the stairs back to the surface.=Sube las escaleras de vuelta a la superficie.
Give the professor the lens mould. If you don't have it, check your bank.=Entrega el lens mould al profesor. Si no lo tienes, revisa tu banco.
Use the molten glass on the mould.=Usa el molten glass en el mould.
Give the professor the lens mould and lens.=Entrega el lens mould y el lens al profesor.
Follow the dungeon around anti-clockwise to a staircase, then climb it.=Recorre la mazmorra en sentido antihorario hasta una escalera y súbela.
Climb up the stairs in the observatory.=Sube las escaleras del observatory.
Use the telescope.=Usa el telescope.
Watch the cutscene.=Mira la cinemática.
Tell the professor which constellation you observed.=Dile al profesor qué constelación has observado.
Goblin Guard (level 42, or you can lure it/have someone else kill it)=Goblin Guard (nivel 42, o puedes atraerlo o hacer que otro lo mate)
A reward depending on which constellation you observed.=Una recompensa según la constelación que hayas observado.
Helping the Professor=Ayudando al profesor
Antipoison (there is a spawn of superantipoison near the Observatory)=Antipoison (hay un spawn de superantipoison cerca del Observatory)
