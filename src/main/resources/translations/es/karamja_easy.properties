# Spanish translations for Karamja Easy Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Swing on the ropeswing west of Brimhaven.=Balancéate en el ropeswing al oeste de Brimhaven.
Pick 5 bananas from the banana plantation.=Recoge 5 bananas de la plantación de bananas.
Mine a gold rock north west of Brimhaven.=Mina una gold rock al noroeste de Brimhaven.
Travel to Port Sarim from Musa Point with the Customs officer.=Viaja a Port Sarim desde Musa Point con el Customs officer.
Travel to Ardougne from Brimhaven with Captain Barnaby.=Viaja a Ardougne desde Brimhaven con Captain Barnaby.
Travel to Cairn Island by climbing up the rocks east of it, then crossing the bridge.=Ve a Cairn Island subiendo por las rocas al este y cruzando después el puente.
Fish north of the banana plantation.=Pesca al norte de la plantación de bananas.
Pick up 5 seaweed on Karamja's coast. You can just drop a piece and pick it up again 5 times.=Recoge 5 seaweed en la costa de Karamja. Puedes soltar una y volver a recogerla 5 veces.
Enter the fight pits or fight caves in Mor Ul Rek under the Karamja Volcano.=Entra en los fight pits o en las fight caves de Mor Ul Rek, bajo el Karamja Volcano.
Enter the dungeon east of Tai Bwo Wannai, and kill a Jogre in there.=Entra en la mazmorra al este de Tai Bwo Wannai y mata a un Jogre allí.
Kill a Jogre.=Mata a un Jogre.
Talk to Pirate Jackie the Fruit in Brimhaven to claim your reward!=Habla con Pirate Jackie the Fruit en Brimhaven para reclamar tu recompensa.
