# Spanish translations for Rag and Bone Man II.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Unknown state general.=Estado desconocido general.
Finish Rag and Bone Man I.=Termina Rag and Bone Man I.
Enter the hole to the Lumbridge Swamp caves.=Entra en el agujero a las cuevas de Lumbridge Swamp.
Enter the Lumbridge Swamp caves.=Entra en las cuevas de Lumbridge Swamp.
Kill bats south of the Odd Old Man.=Mata a los bats al sur del Odd Old Man.
Kill undead cows west of the Ectofuntus.=Mata a las undead cows al oeste del Ectofuntus.
Enter the Experiment Cave near Castle Fenkenstrain.=Entra en la Experiment Cave cerca de Castle Fenkenstrain.
Kill Experiments.=Mata a los Experiments.
Kill the citizens/werewolves in Canifis. (Do not use Wolfbane)=Mata a los citizens/werewolves de Canifis. (No uses Wolfbane)
Kill Ghouls west of Canifis.=Mata a los Ghouls al oeste de Canifis.
Go down into Varrock Sewer via the Manhole south east of Varrock Castle.=Baja a Varrock Sewer por la Manhole al sureste de Varrock Castle.
Kill zombies in the sewer.=Mata a los zombies en la cloaca.
Kill rats.=Mata a las rats.
Kill Moss Giants near the entrance.=Mata a los Moss Giants cerca de la entrada.
Kill Cave Goblins in the east of the Lumbridge Caves. Run between the marked tiles to avoid the Wall Beasts.=Mata a los Cave Goblins en el este de las Lumbridge Caves. Corre entre las casillas marcadas para evitar a los Wall Beasts.
Kill Jackals north of Nardah.=Mata a los Jackals al norte de Nardah.
Kill desert snakes north of Nardah.=Mata a las desert snakes al norte de Nardah.
Kill the giant lizards north of Nardah.=Mata a los giant lizards al norte de Nardah.
Kill vultures south west of Nardah.=Mata a los vultures al suroeste de Nardah.
Kill seagulls on the Port Sarim docks.=Mata a las seagulls en los muelles de Port Sarim.
Enter the Asgarnia Dungeon by Mudskipper Point.=Entra en el Asgarnia Dungeon junto a Mudskipper Point.
Kill Ice Giants at the end of the dungeon.=Mata a los Ice Giants al final de la mazmorra.
Throw a fishing explosive to attract a Mogre on Mudskipper Point.=Lanza un fishing explosive para atraer a un Mogre en Mudskipper Point.
Kill the Mogre.=Mata al Mogre.
Kill Jogres on Karamja.=Mata a los Jogres en Karamja.
Enter Brimhaven Dungeon.=Entra en Brimhaven Dungeon.
Kill fire giants deep in the dungeon.=Mata a los fire giants en lo profundo de la mazmorra.
Go to Taverley Dungeon. Bring an antifire shield if you can.=Ve a Taverley Dungeon. Lleva un antifire shield si puedes.
Go to Taverley Dungeon. Bring a dusty key if you have one, otherwise you can get one in the dungeon. Bring an antifire shield if you can.=Ve a Taverley Dungeon. Lleva una dusty key si tienes una; si no, puedes conseguir una en la mazmorra. Lleva un antifire shield si puedes.
Squeeze through the obstacle pipe.=Pasa por el obstacle pipe.
Travel through Taverley Dungeon until you reach the Black Knights' Base. Kill the Jailer in the east side of the base for a jail key.=Avanza por Taverley Dungeon hasta llegar a la Black Knights' Base. Mata al Jailer en el lado este de la base para conseguir una jail key.
Pick up the jail key.=Coge la jail key.
Use the jail key on the south door and talk to Velrak for a dusty key.=Usa la jail key en la puerta sur y habla con Velrak para conseguir una dusty key.
Enter the gate to the deeper Taverley dungeon.=Entra por la verja a la parte profunda del Taverley dungeon.
Kill baby blue dragons. South east near the lava is a good spot without any adult dragons.=Mata a los baby blue dragons. Al sureste, cerca de la lava, hay un buen sitio sin dragons adultos.
Enter the cave north east of Rellekka.=Entra en la cueva al noreste de Rellekka.
Kill trolls.=Mata a los trolls.
Kill bunnies south east of Rellekka.=Mata a los bunnies al sureste de Rellekka.
Enter the Fremennik Slayer Dungeon.=Entra en el Fremennik Slayer Dungeon.
Kill basilisks in the middle of the dungeon.=Mata a los basilisks en el centro de la mazmorra.
Travel to Waterbirth Island.=Viaja a Waterbirth Island.
Enter waterbirth dungeon.=Entra en el waterbirth dungeon.
Kill dagannoths.=Mata a los dagannoths.
Kill Terrorbirds in the Tree Gnome Stronghold.=Mata a los Terrorbirds en el Tree Gnome Stronghold.
Kill wolves in Feldip Hills.=Mata a los wolves en Feldip Hills.
Kill ogres in Feldip Hills.=Mata a los ogres en Feldip Hills.
Kill Zogres in Jiggig.=Mata a los Zogres en Jiggig.
Pickup the bone.=Coge el hueso.
Buy 27 jugs of vinegar from Fortunato in Draynor Village, then use them on pots.=Compra 27 jugs of vinegar a Fortunato en Draynor Village y luego úsalos en pots.
Use the bones on the pots of vinegar.=Usa los huesos en los pots of vinegar.
Place logs under the pot-boiler near the Odd Old Man. If you've already polished all the bones, hand them in to the Odd Old Man.=Coloca logs bajo el pot-boiler cerca del Odd Old Man. Si ya has pulido todos los huesos, entrégaselos al Odd Old Man.
Add a bone to the pot boiler.=Añade un hueso al pot boiler.
Light the logs under the pot-boiler.=Enciende los logs bajo el pot-boiler.
Wait for the bones to be cleaned. You can hop worlds to make this happen instantly.=Espera a que se limpien los huesos. Puedes cambiar de mundo para que ocurra al instante.
Take the pot from the pot-boiler.=Coge el pot del pot-boiler.
Give the Odd Old Man the bones.=Dale los huesos al Odd Old Man.
Talk to the Odd Old Man to finish.=Habla con el Odd Old Man para terminar.
Repeat the steps until all the bones are cleaned.=Repite los pasos hasta que todos los huesos estén limpios.
