# Spanish translations for The Tourist Trap.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another by killing the Mercenary Guard outside the Desert Mining Camp=Puedes conseguir otra matando al Mercenary Guard fuera del Desert Mining Camp
You can trade in a desert robe set for slave clothes with the Male Slave=Puedes cambiar un conjunto de desert robe por slave clothes con el Male Slave
You can get another from Al Shabim in the Bedabin Camp=Puedes conseguir otro con Al Shabim en el Bedabin Camp
You'll need to get another plan from Siad's chest=Tendrás que conseguir otro plan del chest de Siad
Talk to Irena south of the Shantay Pass.=Habla con Irena al sur del Shantay Pass.
Talk to the Mercenary Captain outside the Desert Mining Camp. When he attacks you, kill him for a key.=Habla con el Mercenary Captain fuera del Desert Mining Camp. Cuando te ataque, mátalo para conseguir una key.
Kill the Mercenary Captain outside the Desert Mining Camp.=Mata al Mercenary Captain fuera del Desert Mining Camp.
Bend the cell window and escape through it.=Dobla la ventana de la celda y escapa por ella.
Climb the rocks to escape.=Trepa por las rocas para escapar.
Climb the cliff.=Trepa por el acantilado.
Climb down the west of the cliff.=Baja por el oeste del acantilado.
UNEQUIP ALL COMBAT GEAR and enter the camp.=QUÍTATE TODO EL COMBAT GEAR y entra en el campamento.
Talk to the Male Slave to the east to trade your desert robes for his slave robes.=Habla con el Male Slave al este para cambiar tus desert robes por sus slave robes.
Equip the slave clothes, and enter the mine door in the north east of the camp.=Equípate la slave clothes y entra por la puerta de la mina en el noreste del campamento.
Follow the cave around and talk to a guard guarding the deeper cave.=Sigue la cueva y habla con el guard que vigila la cueva más profunda.
Return to the surface.=Vuelve a la superficie.
UNEQUIP THE SLAVE CLOTHES and leave the camp.=QUÍTATE LA SLAVE CLOTHES y sal del campamento.
Talk to Al Shabim in the Bedabin Camp.=Habla con Al Shabim en el Bedabin Camp.
Climb up the ladder in the building in the camp.=Sube por la escalera de mano del edificio del campamento.
Search the south west bookcase.=Busca en la estantería del suroeste.
Talk to Captain Siad about sailing to distract him.=Habla con Captain Siad sobre navegar para distraerlo.
Search the chest.=Busca en el cofre.
Return to Al Shabim in the Bedabin Camp with the plans.=Vuelve con Al Shabim al Bedabin Camp con los plans.
Enter the north tent and attempt to make a prototype dart tip on the anvil. Bring all 3 bars with you for this.=Entra en la tienda del norte e intenta fabricar una prototype dart tip en el yunque. Lleva contigo las 3 bars para esto.
Add 10 feathers to the prototype dart tip.=Añade 10 feathers a la prototype dart tip.
Bring the prototype dart to Al Shabim.=Lleva la prototype dart a Al Shabim.
Enter the deeper mines.=Entra en las minas más profundas.
Right-click search the barrel next to the mine cart for a barrel.=Haz clic derecho y busca en el barrel que hay junto al mine cart para conseguir un barrel.
Right-click search the mine cart to ride it to the next room.=Haz clic derecho y busca en el mine cart para viajar a la siguiente sala.
Follow the path west then north until you find Ana. Use the barrel on her.=Sigue el camino al oeste y luego al norte hasta encontrar a Ana. Usa el barrel en ella.
Use Ana on the mine cart you came in on.=Usa a Ana en el mine cart en el que llegaste.
Return in the mine cart you came in on.=Vuelve en el mine cart en el que llegaste.
Right-click search the barrel next to the mine cart for Ana.=Haz clic derecho y busca en el barrel que hay junto al mine cart para encontrar a Ana.
Right-click use the winch bucket to send Ana to the surface.=Haz clic derecho y usa el cubo del winch para enviar a Ana a la superficie.
Return to the surface. If Ana was captured again, search the barrel next to the mine cart for her.=Vuelve a la superficie. Si han capturado a Ana otra vez, busca en el barrel que hay junto al mine cart.
Right-click operate the winch in the south west of the camp.=Haz clic derecho y acciona el winch en el suroeste del campamento.
Right-click search the barrel west of the winch. If it's empty, operate the winch again.=Haz clic derecho y busca en el barrel al oeste del winch. Si está vacío, acciona el winch de nuevo.
Use Ana on the cart in the middle of the camp.=Usa a Ana en el cart en el centro del campamento.
Talk to the Mine Cart Driver to escape. Once he's agreed to take you, right-click search the wooden cart to escape.=Habla con el Mine Cart Driver para escapar. Cuando acepte llevarte, haz clic derecho y busca en el wooden cart para escapar.
Bring Ana to Irena south of the Shantay Pass.=Lleva a Ana con Irena al sur del Shantay Pass.
Talk to Ana outside the Shantay Pass.=Habla con Ana fuera del Shantay Pass.
Talk to Irena south of the Shantay Pass to finish the quest!=Habla con Irena al sur del Shantay Pass para terminar la misión!
Mine 15 rocks to be able to leave.=Mina 15 rocas para poder salir.
Almost any deviation from the steps listed here will often result in you being thrown into jail, or to an inconvenient location. If you'd wish to avoid this, try to follow the helper to the letter.=Casi cualquier desviación de los pasos indicados aquí hará que te encierren en la cárcel o te lleven a un lugar inconveniente. Si quieres evitarlo, intenta seguir el helper al pie de la letra.
Mercenary Captain (level 47)=Mercenary Captain (nivel 47)
Ability to smith darts.=Habilidad de forjar darts.
Investigating the trap=Investigando la trampa
Helping out=Echando una mano
Freeing Ana=Liberar a Ana
