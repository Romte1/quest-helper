# Spanish translations for The Giant Dwarf.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Bring more to be safe.=Lleva más para ir sobre seguro.
Most logs will work, however, arctic pine logs and redwood logs do not work.=Sirven casi todos los logs, pero los arctic pine logs y los redwood logs no funcionan.
There are rocks in the city, but you need 30 Mining.=Hay rocas en la ciudad, pero necesitas 30 de Minería.
Purchasable during the quest.=Se puede comprar durante la misión.
For Telekinetic Grab.=Para Telekinetic Grab.
Unless you have previously given Thurgo an extra pie with nothing in return.=A menos que antes le hayas dado a Thurgo un pie extra sin recibir nada a cambio.
Speak to the Dwarven Boatman.=Habla con el Dwarven Boatman.
Finish speaking to Commander Veldaban.=Termina de hablar con Commander Veldaban.
Talk to Blasidar the sculptor in the east of Keldagrim.=Habla con Blasidar the sculptor en el este de Keldagrim.
Talk to Vermundi west of Blasidar. If you already have, open the Quest Journal to re-sync.=Habla con Vermundi al oeste de Blasidar. Si ya lo has hecho, abre el Quest Journal para resincronizar.
Talk to the Librarian.=Habla con el Librarian.
Climb any bookcase to find a book on costumes.=Sube por cualquier bookcase para encontrar un book on costumes.
Talk to Vermundi with the book on costumes.=Habla con Vermundi con el book on costumes.
Talk to Vermundi again.=Habla con Vermundi de nuevo.
Use your coal on the spinning machine light it with a tinderbox.=Usa tu coal en la spinning machine y enciéndela con un tinderbox.
Start the spinning machine with a tinderbox.=Enciende la spinning machine con un tinderbox.
Talk to Vermundi again and pay 200gp.=Habla con Vermundi de nuevo y paga 200gp.
Talk to Saro in West Keldagrim.=Habla con Saro en West Keldagrim.
Talk to Dromund.=Habla con Dromund.
Take the Left boot when Dromund isn't looking.=Coge la Left boot cuando Dromund no esté mirando.
Take the Right boot from outside his window when he isn't looking using Telekinetic Grab.=Coge la Right boot desde fuera de su ventana cuando no esté mirando usando Telekinetic Grab.
Talk to Santiri.=Habla con Santiri.
Use the 3 sapphires on the axe.=Usa los 3 sapphires en el axe.
Talk to the Librarian about Imcando Dwarves. If you already have and no option appears for this, go talk to Reldo in Varrock Castle.=Habla con el Librarian sobre los Imcando Dwarves. Si ya lo has hecho y no aparece esta opción, ve a hablar con Reldo en Varrock Castle.
Talk to Reldo in Varrock Castle's library.=Habla con Reldo en la biblioteca de Varrock Castle.
Talk to Thurgo at Mudskipper Point.=Habla con Thurgo en Mudskipper Point.
Talk to Riki the sculptor's model to give him the clothes, axe and boots.=Habla con Riki the sculptor's model para darle la ropa, el axe y las boots.
Talk to Blasidar the sculptor.=Habla con Blasidar the sculptor.
Go to the upper floor of the market.=Sube al piso superior del mercado.
Keep talking to the same secretary and complete the tasks given. If you don't want to do one of the tasks, just talk to them again for a different one.=Sigue hablando con el mismo secretary y completa las tareas que te dé. Si no quieres hacer una de las tareas, vuelve a hablar con él para que te dé otra.
Keep talking to the director of the same secretary and complete the tasks given. If you don't want to do one of the task, just talk to them again for a different one.=Sigue hablando con el director del mismo secretary y completa las tareas que te dé. Si no quieres hacer una de las tareas, vuelve a hablar con él para que te dé otra.
Talk to the director to join the company.=Habla con el director para unirte a la compañía.
Talk to the director after joining the company.=Habla con el director después de unirte a la compañía.
Go down the stairs.=Baja por las escaleras.
Talk to Commander Veldaban.=Habla con Commander Veldaban.
This helper may occasionally go out of sync with the quest. If you think it is, open the Quest Journal to re-sync.=Este ayudante puede desincronizarse ocasionalmente con la misión. Si crees que ha pasado, abre el Quest Journal para resincronizar.
Starting out=Empezando
Clothes fit for a king=Ropa digna de un rey
Boots fit for a king=Botas dignas de un rey
An axe fit for a king=Un hacha digna de un rey
Halfway there=A mitad de camino
Joining the consortium=Uniéndose al consorcio
A house teleport if your house is in Rimmington and if you have no faster way to Mudskipper Point=Un teleport a tu casa si la tienes en Rimmington y no tienes una forma más rápida de llegar a Mudskipper Point
A Camelot/Rellekka teleport (for starting the quest)=Un teleport a Camelot/Rellekka (para empezar la misión)
Access to fairy rings=Acceso a fairy rings
Some stamina potions (when collecting the ores)=Algunas stamina potions (al recoger los minerales)
A ring of wealth/amulet of glory/Varrock teleport=Un ring of wealth, amulet of glory o teleport a Varrock
