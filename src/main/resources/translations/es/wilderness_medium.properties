# Spanish translations for Wilderness Medium Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Kill an Ent in the wilderness and cut yew logs from its trunk after killing it.=Mata un Ent en el Wilderness y corta yew logs de su tronco después de matarlo.
Enter the Wilderness Slayer Cave.=Entra en la Wilderness Slayer Cave.
Kill an Ankou in the Wilderness Slayer Cave.=Mata un Ankou en la Wilderness Slayer Cave.
Kill a Green dragon in the Wilderness Slayer Cave.=Mata un Green dragon en la Wilderness Slayer Cave.
Enter the Wilderness God Wars Dungeon.=Entra en la Wilderness God Wars Dungeon.
Use the crevice to enter the Wilderness God Wars Dungeon. The Strength entrance is to the West.=Usa la grieta para entrar en la Wilderness God Wars Dungeon. La entrada de Strength está al oeste.
Kill a Bloodveld in the Wilderness God Wars Dungeon.=Mata un Bloodveld en la Wilderness God Wars Dungeon.
Mine mithril in the Wilderness.=Mina mithril en el Wilderness.
Complete a lap of the Wilderness Agility Course.=Completa una vuelta al Wilderness Agility Course.
Enter to the Edgeville Dungeon.=Entra en la Edgeville Dungeon.
Cast charge earth orb on the Obelisk of Earth.=Lanza Charge Earth Orb en el Obelisk of Earth.
Speak with the Emblem Trader.=Habla con el Emblem Trader.
Smith the gold helmet in the Resource Area. =Forja el gold helmet en el Resource Area. 
Enter the Wilderness Resource Area. Check your bank to make sure you DO NOT have a gold helmet.=Entra en el Wilderness Resource Area. Revisa tu banco para asegurarte de que NO tienes un gold helmet.
Smelt the gold ore into gold bars.=Funde el gold ore en gold bars.
Mine gold ore.=Mina gold ore.
Use a Muddy key on the chest in the Lava Maze.=Usa una Muddy key en el cofre del Lava Maze.
Talk to Lesser Fanatic in Edgeville to claim your reward!=Habla con el Lesser Fanatic en Edgeville para reclamar tu recompensa.
