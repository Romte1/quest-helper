# Spanish translations for Crab Quest.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

Stand near the highlighted plant=Colócate cerca de la planta resaltada
Drink from the Bottle on the shore of Dognose Island.=Bebe de la Bottle en la orilla de Dognose Island.
Talk to the crab.=Habla con el cangrejo.
Pick up a nearby Shell.=Coge una Shell cercana.
Show the shells to the crab.=Muéstrale las conchas al cangrejo.
Pick up some nearby seashells. If your inventory fills up, you can talk to the crab to turn them in.=Coge algunas seashells cercanas. Si tu inventario se llena, puedes hablar con el cangrejo para entregarlas.
Pick up the nearby Big Fishing Net.=Coge el Big Fishing Net cercano.
Fish a Sea-soaked bowstring from the nearby Floatsam.=Pesca una Sea-soaked bowstring del Floatsam cercano.
Fish a Battered Barrel from the nearby Floatsam.=Pesca un Battered Barrel del Floatsam cercano.
Fish a Weathered Rosewood Plank from the nearby Floatsam.=Pesca un Weathered Rosewood Plank del Floatsam cercano.
Speak to the crab to reset the floatsam.=Habla con el cangrejo para reiniciar el floatsam.
Combine the instrument using the items in your inventory.=Combina el instrumento usando los objetos de tu inventario.
Show the instrument to the crab.=Muéstrale el instrumento al cangrejo.
Speak to the crab about the instrument.=Habla con el cangrejo sobre el instrumento.
Perform the sit emote on loop until the crab appears. You must interact with the plant before emoting.=Usa la emote de sentarse en bucle hasta que aparezca el cangrejo. Debes interactuar con la planta antes de hacer la emote.
Speak to the 'crab'.=Habla con el 'cangrejo'.
Check the palm near the center of the island, north of the bottle.=Revisa la palmera cerca del centro de la isla, al norte de la botella.
Talk to the shy female crab about the crab on the beach.=Habla con la cangreja tímida sobre el cangrejo de la playa.
Check the palm south of the magic tree.=Revisa la palmera al sur del magic tree.
Check the leafless bush closest to the bottle.=Revisa el arbusto sin hojas más cercano a la botella.
Check the palm northwest of the bottle.=Revisa la palmera al noroeste de la botella.
Check the eastern-most plant on the north of the island.=Revisa la planta más al este del norte de la isla.
Check the northern-most plant along the western coast of the island.=Revisa la planta más al norte de la costa oeste de la isla.
Check the magic tree.=Revisa el magic tree.
Check the northernmost palm.=Revisa la palmera más al norte.
Check the leafless bush southwest of the bottle.=Revisa el arbusto sin hojas al suroeste de la botella.
Check the avium tree on the western coast of the island.=Revisa el avium tree de la costa oeste de la isla.
Check the avium tree west of the northernmost palm.=Revisa el avium tree al oeste de la palmera más al norte.
Check the palm east of the westernmost palm.=Revisa la palmera al este de la palmera más al oeste.
Talk to the crab to recruit a bandmember.=Habla con el cangrejo para reclutar a un miembro de la banda.
Speak to the crab to finish the quest.=Habla con el cangrejo para terminar la misión.
Some colorful seashells=Unas conchas de mar coloridas
A nagging doubt that you might have just dreamt all of this=Una duda persistente de que quizá lo hayas soñado todo
Starting off=Empezando
Assembling an instrument=Montando un instrumento
Recruit some band members=Recluta a algunos miembros de la banda
Attend the concert=Asiste al concierto
