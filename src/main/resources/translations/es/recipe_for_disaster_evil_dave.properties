Have your cat catch Hell-Rats for spices, and add them to your stew. You will need to add a random number between 1-3 of each spice (red/orange/yellow/brown). Try adding 1 of a spice to a stew, then using the stew on Evil Dave to see if it's right. If not, try with 2 and then 3. Rinse and repeat until you know the right quantity of each spice, then use the perfect stew combination on Evil Dave.=Haz que tu gato cace Hell-Rats para conseguir especias y añádelas a tu stew. Tendrás que añadir un número aleatorio entre 1 y 3 de cada especia (red/orange/yellow/brown). Prueba a añadir 1 de una especia al stew y luego usa el stew en Evil Dave para ver si es correcto. Si no, prueba con 2 y luego con 3. Repite hasta saber la cantidad correcta de cada especia y luego usa la combinación perfecta de stew en Evil Dave.
Have your cat catch Hell-Rats for spices, and add them to your stew to match the required quantities.=Haz que tu gato cace Hell-Rats para conseguir especias y añádelas a tu stew hasta alcanzar las cantidades necesarias.
You've added too much of a spice. Eat your spicy stew and start again.=Has añadido demasiado de una especia. Cómete tu spicy stew y empieza de nuevo.
Use the spicy stew on Evil Dave.=Usa el spicy stew en Evil Dave.
Teleport to Lumbridge=Teletranspórtate a Lumbridge
