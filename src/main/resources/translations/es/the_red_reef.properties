# Spanish translations for The Red Reef.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Ranged/Mage combat gear to skip boat combat, or a boat with cannons to deal with pirates. An upgraded keel helps with survival. (Mithril is more than enough)=Equipo de combate a distancia/magia para saltarte el combate naval, o un barco con cañones para hacer frente a los piratas. Una quilla mejorada ayuda a sobrevivir. (Con mithril es más que suficiente)
Combat gear to fight Black Eye Bethel=Equipo de combate para luchar contra Black Eye Bethel
Any combat gear to fight a giant lobster=Cualquier equipo de combate para luchar contra una giant lobster
Talk to Elder Raley at his home in The Great Conch to start the quest.=Habla con Elder Raley en su casa de The Great Conch para empezar la misión.
Talk to Finn, south-east of Elder Raley's house, about Floopa's whereabouts.=Habla con Finn, al sureste de la casa de Elder Raley, sobre el paradero de Floopa.
Head to The Sacred Grove and talk to Elder Katt.=Dirígete a The Sacred Grove y habla con Elder Katt.
Enter The Sacred Grove and talk to Floopa.=Entra en The Sacred Grove y habla con Floopa.
Sail to Red Rock, north-west of The Great Conch.=Navega a Red Rock, al noroeste de The Great Conch.
Talk to the receptionist on Red Rock.=Habla con el recepcionista en Red Rock.
Familiarize yourself with the history of the Red Reef Trading Company by inspecting the display cases around the building.=Familiarízate con la historia de Red Reef Trading Company inspeccionando las vitrinas repartidas por el edificio.
Talk to Theodore Paxton.=Habla con Theodore Paxton.
Get ready for boat combat, then sail south towards Last Light and deal with Black Eye Bethel. Protect from Missiles to avoid most damage. Repair your ship. Combat is over when all boats are sunk or all pirates are killed.=Prepárate para el combate naval, navega al sur hacia Last Light y encárgate de Black Eye Bethel. Usa Protect from Missiles para evitar la mayor parte del daño. Repara tu barco. El combate termina cuando todos los barcos se hundan o todos los piratas mueran.
Disembark at Last Light.=Desembarca en Last Light.
Kill all six pirates at Last Light.=Mata a los seis piratas de Last Light.
Kill Black Eye Bethel. Use Protect from Melee to avoid some damage. Avoid her charge attack. Re-enable your prayers if she disables them.=Mata a Black Eye Bethel. Usa Protect from Melee para evitar parte del daño. Evita su ataque de carga. Vuelve a activar tus plegarias si las desactiva.
Sail to Red Rock, north of Last Light.=Navega a Red Rock, al norte de Last Light.
Climb down the tower.=Baja de la torre.
Board your boat.=Sube a tu barco.
Return to Theodore Paxton on Red Rock with the good news.=Vuelve con Theodore Paxton en Red Rock con las buenas noticias.
Sail to and board the Zenith, east of Red Rock. If you don't see the Zenith there, try hopping to a different world.=Navega hasta el Zenith, al este de Red Rock, y sube a bordo. Si no ves el Zenith allí, prueba a cambiar de mundo.
Talk to Spencer Brentwood aboard the Zenith.=Habla con Spencer Brentwood a bordo del Zenith.
Equip the deep sea diving gear and dive down to the bottom of the sea.=Equipa el equipo de buceo y sumérgete hasta el fondo del mar.
Talk to Spencer Brentwood again with the deep sea diving gear equipped to dive down to the bottom of the sea.=Habla con Spencer Brentwood de nuevo con el equipo de buceo equipado para sumergirte hasta el fondo del mar.
Listen to Spencer Brentwood's instructions.=Escucha las instrucciones de Spencer Brentwood.
Head north and repair the Coral dredger, ready to fight a Giant lobster.=Dirígete al norte y repara el Coral dredger, listo para luchar contra una Giant lobster.
Kill the Giant lobster. Avoid the blue particles on the floor.=Mata a la Giant lobster. Evita las partículas azules del suelo.
Repair the Coral dredger.=Repara el Coral dredger.
Talk to Spencer Brentwood near the eastern coral dredger.=Habla con Spencer Brentwood cerca del coral dredger del este.
Talk to Spencer Brentwood aboard the Zenith after repairing the coral dredgers.=Habla con Spencer Brentwood a bordo del Zenith tras reparar los coral dredgers.
Return to Spencer Brentwood to disembark onto your boat.=Vuelve con Spencer Brentwood para desembarcar en tu barco.
Sail to The Great Conch.=Navega a The Great Conch.
Return to Floopa at Elder Raley's house at The Great Conch.=Vuelve con Floopa en la casa de Elder Raley en The Great Conch.
2 pirate ships, or the crew on the ship with ranged combat gear=2 barcos pirata, o la tripulación del barco con equipo de combate a distancia
6 pirates (lvl 52)=6 piratas (nivel 52)
Black Eye Bethel (lvl 191)=Black Eye Bethel (nivel 191)
Giant lobster (lvl 112)=Giant lobster (nivel 112)
Access to the Great Conch sacred grove=Acceso al Great Conch sacred grove
Finding Floopa=Encontrar a Floopa
Infiltrating the Red Reef=Infiltrarse en the Red Reef
Dealing with Black Eye Bethel=Encargarse de Black Eye Bethel
Helping the Zenith=Ayudar al Zenith
Return to Floopa=Volver con Floopa
