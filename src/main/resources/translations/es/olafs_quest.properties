# Spanish translations for Olaf's Quest.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Olaf=Puedes conseguir otro de Olaf
Only need 4 slots free if bringing 6 rope with you.=Solo necesitas 4 espacios libres si llevas 6 rope contigo.
Talk to Olaf Hradson north east of Rellekka.=Habla con Olaf Hradson al noreste de Rellekka.
Chop a log from the Windswept Tree east of Olaf.=Tala un tronco del Windswept Tree al este de Olaf.
Bring the logs to Olaf Hradson north east of Rellekka.=Lleva los logs a Olaf Hradson al noreste de Rellekka.
Talk to Ingrid Hradson near the well in southeast Rellekka.=Habla con Ingrid Hradson cerca del pozo al sureste de Rellekka.
Talk to Volf Olafson north of the longhall in Rellekka.=Habla con Volf Olafson al norte del longhall de Rellekka.
Return to Olaf Hradson north east of Rellekka.=Vuelve a Olaf Hradson al noreste de Rellekka.
Use the damp planks on Olaf's embers.=Usa los damp planks en las brasas de Olaf.
Talk to Olaf again, and give him some food.=Habla con Olaf de nuevo y dale algo de comida.
Dig next to the Windswept Tree.=Cava junto al Windswept Tree.
Pick up the dropped key.=Coge la key que se ha caído.
Go deeper into the caverns and kill a Skeleton Fremennik for a key.=Adéntrate más en las cavernas y mata a un Skeleton Fremennik para conseguir una key.
Search the picture wall in the north room.=Busca en la pared con la imagen de la sala norte.
Pick up 2 rotten barrels and 6 ropes from around the room.=Coge 2 rotten barrels y 6 ropes de la sala.
Pick up 1 rotten barrels and 3 ropes from around the room.=Coge 1 rotten barrel y 3 ropes de la sala.
WALK onto the walkway to the east, and use a barrel on it to repair it.=CAMINA hasta la pasarela del este y usa un barrel en ella para repararla.
WALK on the walkway and repair the next hole in it.=CAMINA por la pasarela y repara el siguiente agujero.
Open the gate on the walkway, clicking the key hole which matches your key.=Abre la puerta de la pasarela haciendo clic en el ojo de la cerradura que coincida con tu key.
Click the square key hole.=Haz clic en el ojo de la cerradura cuadrado.
Click the cross key hole.=Haz clic en el ojo de la cerradura con forma de cruz.
Click the triangle key hole.=Haz clic en el ojo de la cerradura triangular.
Click the circle key hole.=Haz clic en el ojo de la cerradura circular.
Click the star key hole.=Haz clic en el ojo de la cerradura con forma de estrella.
WALK off the remaining walkway, and search the chest in the wreck. Be prepared to fight Ulfric.=CAMINA hasta el final de la pasarela y registra el cofre del naufragio. Prepárate para luchar contra Ulfric.
Kill Ulfric.=Mata a Ulfric.
Search the chest again to finish the quest.=Registra el cofre de nuevo para terminar la misión.
Skeleton fremennik (level 40)=Skeleton fremennik (nivel 40)
Ulfric (level 100)=Ulfric (nivel 100)
Access to Brine Rats and the ability to receive them as a slayer task.=Acceso a los Brine Rats y la posibilidad de recibirlos como tarea de slayer.
Starting off=Empezando
Finding treasure=Encontrar el tesoro
Click the highlighted boxes to turn the squares to solve the puzzle.=Haz clic en las casillas resaltadas para girar los cuadrados y resolver el puzle.
