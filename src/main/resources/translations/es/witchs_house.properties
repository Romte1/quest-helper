# Spanish translations for Witch's House.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to the Boy in Taverley to start the quest.=Habla con el Boy en Taverley para empezar la misión.
Look under the potted plant just outside the witch's house for the house key.=Busca debajo de la planta en maceta justo fuera de la casa de la bruja para encontrar la house key.
Enter the witch's house.=Entra en la casa de la bruja.
Go back downstairs.=Vuelve a bajar las escaleras.
Go down the ladder to the basement.=Baja por la escalera de mano al sótano.
Go through the gate whilst wearing gloves. If you don't have gloves, search the nearby boxes until you get a pair.=Cruza la puerta con guantes puestos. Si no tienes guantes, busca en las cajas cercanas hasta conseguir un par.
Open the cupboard and get a magnet from it=Abre el armario y coge un magnet de él
Climb back up the ladder.=Sube de nuevo por la escalera de mano.
Use the cheese on the mouse hole in the south room, then use the magnet on the mouse which emerges.=Usa el cheese en el agujero del ratón de la sala sur y luego usa el magnet en el ratón que salga.
Pick up the witch's diary from the table and read it to ensure the door stays unlocked. Check the "Checkpoint" section if you want to skip this step.=Coge el witch's diary de la mesa y léelo para asegurarte de que la puerta sigue desbloqueada. Consulta la sección "Checkpoint" si quieres saltarte este paso.
Enter the garden and sneak around the perimeter to search the fountain. If the witch spots you, you'll be teleported outside.=Entra en el jardín y rodea el perímetro sin que te vean para buscar en la fuente. Si la bruja te ve, te teletransportará fuera.
Use the shed key on the shed door to enter.=Usa la shed key en la puerta del cobertizo para entrar.
Enter the shed. If the door doesn't open, you need to get the shed key from the fountain again.=Entra en el cobertizo. Si la puerta no se abre, tendrás que conseguir la shed key de nuevo en la fuente.
If an experiment hasn't spawned, attempt to pick up the ball once.=Si no ha aparecido ningún experiment, intenta coger la ball una vez.
Kill all four forms of the Witch's experiment (levels 19, 30, 42, and 53). You can safe spot the last two forms from the crate in the south of the room.=Mata a las cuatro formas del Witch's experiment (niveles 19, 30, 42 y 53). Puedes atacar sin recibir daño las dos últimas formas desde la caja del sur de la sala.
Pick up the ball.=Coge la ball.
Return the ball to the boy. Make sure the witch doesn't spot you or you'll have to get the ball back again..=Devuelve la ball al Boy. Asegúrate de que la bruja no te vea o tendrás que recuperar la ball otra vez.
Witch's experiment (level 19, 30, 42 and 53)=Witch's experiment (nivel 19, 30, 42 y 53)
Start the quest=Empieza la misión
Accessing the garden=Acceder al jardín
Defeat the witch's experiment=Derrota al Witch's experiment
Cheese (multiple if you mess up)=Cheese (varios si te equivocas)
Combat gear and food for monsters up to level 53=Equipo de combate y comida para monstruos de hasta nivel 53
