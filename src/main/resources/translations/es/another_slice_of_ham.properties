# Spanish translations for Another Slice of H.A.M.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Tegdak=Puedes conseguir otro de Tegdak
You can get this back from the Goblin Village Generals=Puedes recuperarlo de los Generals de Goblin Village
Enter the Lumbridge Castle basement.=Entra en el sótano de Lumbridge Castle.
Travel with Kazgar to shortcut to Mistag.=Viaja con Kazgar para atajar hasta Mistag.
Travel with Mistag back to Lumbridge.=Viaja con Mistag de vuelta a Lumbridge.
Enter Dorgesh-Kaan.=Entra en Dorgesh-Kaan.
Climb up to the next floor.=Sube al siguiente piso.
Talk to Ur-tag in the north east building.=Habla con Ur-tag en el edificio del noreste.
Enter the railway entrance in the south west of Dorgesh-Kaan.=Entra en la entrada del ferrocarril en el suroeste de Dorgesh-Kaan.
Clean the artefacts on the specimen table.=Limpia los artefactos en la mesa de especímenes.
Show Tegdak the artefacts.=Enséñale los artefactos a Tegdak.
Talk to Zanik.=Habla con Zanik.
Leave the railway.=Sal del ferrocarril.
Go downstairs.=Baja por las escaleras.
Talk to General Wartface and General Bentnoze in Goblin Village.=Habla con General Wartface y General Bentnoze en Goblin Village.
Go to Goblin Village, ready to fight.=Ve a Goblin Village, listo para luchar.
Make your way to the tower to the south, using the buildings as cover, and climb up the ladder.=Avanza hasta la torre del sur usando los edificios como cobertura y sube por la escalera.
Kill the H.A.M. Mage and H.A.M. Archer with a ranged/magic weapon.=Mata al H.A.M. Mage y al H.A.M. Archer con un arma de rango/magia.
Talk to General Wartface and General Bentnoze in Goblin Village again.=Habla de nuevo con General Wartface y General Bentnoze en Goblin Village.
Talk to the Sergeants in Lumbridge Swamp.=Habla con los Sergeants en Lumbridge Swamp.
Enter the Lumbridge Swamp Caves.=Entra en las Lumbridge Swamp Caves.
Climb down the ladder to the secret H.A.M. base.=Baja por la escalera hasta la base secreta de H.A.M.
Hide behind the marked crate, and wait for the guards to walk past and around the corner.=Escóndete detrás de la caja marcada y espera a que los guardias pasen y doblen la esquina.
Work out how to avoid all the H.A.M guards.=Averigua cómo evitar a todos los guardias de H.A.M.
Wait for the guards to go around the corner.=Espera a que los guardias doblen la esquina.
Run out in front of the final guard, and wait for one of the sergeants to attack them.=Sal corriendo delante del último guardia y espera a que uno de los sargentos lo ataque.
Climb down the ladder.=Baja por la escalera.
When Sigmund starts using protection prayers, use the ancient mace's special attack on Sigmund to remove them and then defeat him.=Cuando Sigmund empiece a usar protection prayers, usa el ataque especial del ancient mace sobre Sigmund para quitárselas y luego derrótalo.
Defeat Sigmund.=Derrota a Sigmund.
Untie Zanik.=Desata a Zanik.
Travel to Dorgesh-Kaan under Lumbridge, and talk to Ur-tag there.=Viaja a Dorgesh-Kaan bajo Lumbridge y habla allí con Ur-tag.
Talk to Tegdak through the doorway in south-west Dorgesh-Kaan.=Habla con Tegdak a través de la puerta del suroeste de Dorgesh-Kaan.
Dig up the 6 artefacts in the railway tunnel, clean them, and show them to Tegdak.=Desentierra los 6 artefactos del túnel del ferrocarril, límpialos y enséñaselos a Tegdak.
Talk to Zanik in the railway, and then go talk to the Goblin Scribe in the north of Dorgesh-Kaan with her.=Habla con Zanik en el ferrocarril y luego ve con ella a hablar con el Goblin Scribe del norte de Dorgesh-Kaan.
Talk to Oldak in the north west of Dorgesh-Kaan with Zanik.=Habla con Oldak en el noroeste de Dorgesh-Kaan con Zanik.
H.A.M. Archer (level 30)=H.A.M. Archer (nivel 30)
H.A.M. Mage (level 30)=H.A.M. Mage (nivel 30)
Sigmund (level 64)=Sigmund (nivel 64)
