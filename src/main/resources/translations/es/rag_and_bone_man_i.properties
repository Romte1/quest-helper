# Spanish translations for Rag and Bone Man I.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Unknown state.=Estado desconocido.
Talk to the Odd Old Man east of Varrock.=Habla con el Odd Old Man al este de Varrock.
Kill a giant rat south east of Varrock.=Mata a una giant rat al sureste de Varrock.
Kill the unicorn south east of Varrock.=Mata al unicorn al sureste de Varrock.
Kill the bear south east of Varrock.=Mata al bear al sureste de Varrock.
Kill a ram south of Varrock.=Mata a un ram al sur de Varrock.
Kill a goblin east of Lumbridge.=Mata a un goblin al este de Lumbridge.
Kill a big frog in the Lumbridge Swamp.=Mata a una big frog en el Lumbridge Swamp.
Kill a monkey on Karamja.=Mata a un monkey en Karamja.
Kill a giant bat in the Karamja Volcano Dungeon.=Mata a un giant bat en el Karamja Volcano Dungeon.
Pickup the bone.=Coge el hueso.
Talk to Fortunato in Draynor Village, and then buy 8 jugs of vinegar from him.=Habla con Fortunato en Draynor Village y luego cómprale 8 jugs of vinegar.
Use the vinegar on pots for 8 pots of vinegar.=Usa el vinegar en pots para hacer 8 pots of vinegar.
Use the bones on the pots of vinegar.=Usa los huesos en los pots of vinegar.
Place logs under the pot-boiler near the Odd Old Man. If you've already polished all the bones, hand them in to the Odd Old Man.=Coloca logs bajo el pot-boiler cerca del Odd Old Man. Si ya has pulido todos los huesos, entrégaselos al Odd Old Man.
Add a bone to the pot boiler.=Añade un hueso al pot boiler.
Light the logs under the pot-boiler.=Enciende los logs bajo el pot-boiler.
Wait for the bones to be cleaned. You can hop worlds to make this happen instantly.=Espera a que se limpien los huesos. Puedes cambiar de mundo para que ocurra al instante.
Take the pot from the pot-boiler.=Coge el pot del pot-boiler.
Give the Odd Old Man the bones.=Dale los huesos al Odd Old Man.
Talk to the Odd Old Man to finish.=Habla con el Odd Old Man para terminar.
Repeat the steps until all the bones are cleaned.=Repite los pasos hasta que todos los huesos estén limpios.
8 low leveled monsters for their bones=8 monstruos de nivel bajo por sus huesos
If you've handed in any bones to the Odd Old Man, open the quest journal to sync up the helper's state=Si has entregado algún hueso al Odd Old Man, abre el diario de misiones para sincronizar el estado del helper
Starting out=Empezando
Collecting bones=Recogiendo huesos
Preparing the bones=Preparando los huesos
Cleaning the bones=Limpiando los huesos
Handing the bones in=Entregando los huesos
Dramen staff for fairy rings=Dramen staff para los fairy rings
