# Spanish translations for Troubled Tortugans.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
A bronze axe can be found to the west of The Summer Shore. You need to cut down multiple things, so bring the best woodcutting axe you can use.=Puedes encontrar un hacha de bronce al oeste de The Summer Shore. Tendrás que talar varias cosas, así que lleva el mejor hacha de leñador que puedas usar.
Can be found inside the smith's house to the north-east.=Se puede encontrar dentro de la casa del herrero, al noreste.
Can be found inside Elder Raley's house to the south-east.=Se puede encontrar dentro de la casa de Elder Raley, al sureste.
Talk to the Injured Tortugan on the small island north-west of The Great Conch to start the quest.=Habla con la Injured Tortugan en la pequeña isla al noroeste de The Great Conch para empezar la misión.
Shake a nearby palm for a palm leaf.=Sacude una palmera cercana para obtener una palm leaf.
Pick up the palm leaf from the ground=Recoge la palm leaf del suelo
Pick up seaweed from the shore.=Recoge seaweed de la orilla.
Use the seaweed on the palm leaf to create makeshift bandages.=Usa el seaweed en la palm leaf para crear makeshift bandages.
Talk to the Injured Tortugan and give her the makeshift bandages.=Habla con la Injured Tortugan y entrégale los makeshift bandages.
Help the Injured Tortugan with her wounds.=Ayuda a la Injured Tortugan con sus heridas.
Talk to the Injured Tortugan again.=Habla con la Injured Tortugan de nuevo.
Board your boat with Floopa.=Sube a tu barco con Floopa.
Sail to the docks at the southern edge of The Great Conch with Floopa.=Navega hasta los muelles en el borde sur de The Great Conch con Floopa.
Talk to Elder Korel at the docks of The Great Conch.=Habla con Elder Korel en los muelles de The Great Conch.
Head into The Summer Shore to the north and talk to Elder Raley in the south-east building.=Dirígete a The Summer Shore, al norte, y habla con Elder Raley en el edificio del sureste.
Talk to Elder Raley after completing the town repairs.=Habla con Elder Raley tras completar las reparaciones del pueblo.
Inspect the monument in the middle of town to pick up the Gryphon's trail.=Inspecciona el monumento en el centro del pueblo para encontrar el rastro del Gryphon.
Follow the Gryphon tracks west of town and inspect the red plant.=Sigue las huellas del Gryphon al oeste del pueblo e inspecciona la planta roja.
Follow the Gryphon tracks north and inspect the rockslide.=Sigue las huellas del Gryphon hacia el norte e inspecciona el desprendimiento de rocas.
Follow the Gryphon tracks north up the hill and inspect the plant on the east side.=Sigue las huellas del Gryphon hacia el norte, subiendo la colina, e inspecciona la planta del lado este.
Follow the Gryphon tracks east and inspect the plant to reveal the final set of tracks.=Sigue las huellas del Gryphon hacia el este e inspecciona la planta para revelar el último conjunto de huellas.
Follow the Gryphon tracks east and unblock the cave entrance.=Sigue las huellas del Gryphon hacia el este y desbloquea la entrada de la cueva.
Enter the Gryphon's cave, prepared for a fight.=Entra en la cueva del Gryphon, preparado para luchar.
Defeat the Gryphon. It hits with melee, and does a special attack if your worn weight is less than 40kg.=Derrota al Gryphon. Ataca cuerpo a cuerpo y hace un ataque especial si tu peso equipado es inferior a 40 kg.
Return to Elder Raley with news about the Gryphon's defeat.=Vuelve con Elder Raley con noticias de la derrota del Gryphon.
Get a Tortugan shield from Elder Blunn.=Consigue un Tortugan shield de Elder Blunn.
Sail to Little Pearl island, south-east of The Great Conch, to confront the Shellbane gryphon.=Navega a la isla Little Pearl, al sureste de The Great Conch, para enfrentarte al Shellbane gryphon.
Defeat the Shellbane gryphon. Have your worn weight be at least 40kg to avoid some damage. Protect from ranged if you're ranging it, and protect from melee when in melee range. Avoid tornadoes. Move when it spits a slow blob at you.=Derrota al Shellbane gryphon. Ten un peso equipado de al menos 40 kg para evitar parte del daño. Usa Protect from ranged si le atacas a distancia y Protect from melee cuando estés en cuerpo a cuerpo. Evita los tornados. Muévete cuando te lance una bola lenta.
Talk to Elder Korel after defeating the Shellbane gryphon.=Habla con Elder Korel tras derrotar al Shellbane gryphon.
Return to Elder Raley at The Great Conch to complete the quest.=Vuelve con Elder Raley en The Great Conch para completar la misión.
Gryphon (lvl 95)=Gryphon (nivel 95)
Shellbane gryphon (lvl 235)=Shellbane gryphon (nivel 235)
