# Spanish translations for Haunted Mine.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to the Zealot outside the Abandoned Mine in south west Morytania.=Habla con el Zealot a las afueras de la Abandoned Mine, en el suroeste de Morytania.
Pickpocket the Zealot outside the Abandoned Mine in south west Morytania.=Roba con carterismo al Zealot a las afueras de la Abandoned Mine, en el suroeste de Morytania.
Enter the south cart tunnel around the back of the mine.=Entra en el túnel de vagonetas del sur, por la parte trasera de la mina.
Climb down the ladder to the east.=Baja por la escalera del este.
Climb down another ladder to the east.=Baja por otra escalera del este.
Climb down the ladder to the north east.=Baja por la escalera del noreste.
Climb down the ladder in the room in the north east.=Baja por la escalera de la sala del noreste.
Go down the ladder to the south, making sure to avoid the moving mine cart.=Baja por la escalera hacia el sur, con cuidado de evitar la vagoneta en movimiento.
Check the Points Settings panel in the centre of the room. Click the 'Start' button in the interface.=Revisa el panel Points Settings del centro de la sala. Haz clic en el botón 'Start' de la interfaz.
Pull the marked lever.=Tira de la palanca marcada.
Pull levers until the tracks are lined up to take the cart to the north west corner (the panel's map UI shows north as pointing to the right).=Tira de las palancas hasta que las vías queden alineadas para llevar la vagoneta a la esquina noroeste (el mapa de la interfaz del panel muestra el norte apuntando a la derecha).
Use the Zealot's key on the water valve. Make sure you have some energy as you'll need to race to the lift afterwards.=Usa la Zealot's key en la válvula del agua. Asegúrate de tener energía, ya que después tendrás que correr hasta el lift.
Turn the valve. Make sure you have some energy as you'll need to race to the lift afterwards.=Gira la válvula. Asegúrate de tener energía, ya que después tendrás que correr hasta el lift.
Race to the lift before the ghost turns off the valve.=Corre hasta el lift antes de que el ghost cierre la válvula.
Go down the north west ladder to collect the glowing fungus.=Baja por la escalera del noroeste para recoger el glowing fungus.
Search the mine cart for the glowing fungus.=Busca en la vagoneta el glowing fungus.
Take the fungus back upstairs.=Lleva el fungus de vuelta arriba.
Pick up the chisel nearby.=Coge el chisel que hay cerca.
Pick a glowing fungus.=Coge un glowing fungus.
Go back up the ladder.=Vuelve a subir por la escalera.
Put the glowing fungus into the mine cart north west of the ladder.=Pon el glowing fungus en la vagoneta al noroeste de la escalera.
Climb back up to the surface.=Vuelve a subir a la superficie.
Leave through the cart tunnel.=Sal por el túnel de vagonetas.
Make sure you're prepared to fight Treus Dayth (level 95), then enter the north area of the Haunted Mine.=Asegúrate de estar preparado para luchar contra Treus Dayth (nivel 95) y luego entra en la zona norte de la Haunted Mine.
Climb down the west ladder.=Baja por la escalera del oeste.
Climb down the north east ladder.=Baja por la escalera del noreste.
Go down the east stairs.=Baja por las escaleras del este.
Go down the west stairs.=Baja por las escaleras del oeste.
Attempt to pick up the innocent-looking key. Treus Dayth (level 95) will spawn. Kill him.=Intenta coger la llave de aspecto inocente. Aparecerá Treus Dayth (nivel 95). Mátalo.
Kill Treus Dayth.=Mata a Treus Dayth.
Pick up the innocent-looking key.=Coge la llave de aspecto inocente.
Go back up to the flooded area.=Vuelve a subir a la zona inundada.
Cut from a crystal outcrop with a chisel in the south room to finish the quest.=Corta un crystal outcrop con un chisel en la sala del sur para terminar la misión.
Go back up the lift to get a chisel.=Vuelve a subir en el lift para conseguir un chisel.
You need a glowing fungus. Go back up to the flooded area.=Necesitas un glowing fungus. Vuelve a subir a la zona inundada.
Treus Dayth (level 95)=Treus Dayth (nivel 95)
Ability to create the Salve Amulet=Habilidad de crear el Salve Amulet
Ability to access Tarn's Lair=Habilidad de acceder a Tarn's Lair
Starting off=Empezando
Getting a light source=Consiguiendo una fuente de luz
