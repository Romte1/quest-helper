# Spanish translations for The Heart of Darkness.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Read the book.=Lee el libro.
Search the south-west chest.=Busca en el cofre suroeste.
Optional for the Salvager Overlook landing site=Opcional para el punto de aterrizaje de Salvager Overlook
Any pickaxe=Cualquier pickaxe
Talk to Prince Itzla Arkan at the Teomat. You can travel here using Renu the quetzal.=Habla con Prince Itzla Arkan en el Teomat. Puedes viajar allí usando a Renu el quetzal.
Travel on Renu to the Quetzacalli Gorge.=Viaja en Renu al Quetzacalli Gorge.
Talk to the Bartender in the pub in the Gorge.=Habla con el Bartender del pub del Gorge.
Rest in the bed in the south-eastern room of the pub.=Descansa en la cama de la sala sureste del pub.
Talk to Prince Itzla Arkan in the bedroom.=Habla con Prince Itzla Arkan en el dormitorio.
Talk to the shopkeeper east of the pub.=Habla con el shopkeeper al este del pub.
Return to Prince Itzla Arkan in the bedroom.=Vuelve con Prince Itzla Arkan al dormitorio.
Travel past the proudspire to the east to the Tower of Ascension. Talk to the prince there.=Viaja más allá del proudspire hacia el este hasta el Tower of Ascension. Habla con el príncipe allí.
Before going to the tower, build the landing site in the north of the salvager overlook.=Antes de ir a la torre, construye el punto de aterrizaje en el norte del salvager overlook.
Talk to the prince at the Tower of Ascension to the south-east of the salvager overlook.=Habla con el príncipe en el Tower of Ascension, al sureste del salvager overlook.
Talk to Nova outside the tower.=Habla con Nova a las afueras de la torre.
Talk to Sergius outside the tower.=Habla con Sergius a las afueras de la torre.
Talk to Felius outside the tower.=Habla con Felius a las afueras de la torre.
Talk to Caritta outside the tower.=Habla con Caritta a las afueras de la torre.
Talk to the prince at the Tower of Ascension to the south-east of the salvager overlook again.=Habla con el príncipe en el Tower of Ascension, al sureste del salvager overlook, de nuevo.
Talk to Forebearer Janus inside the tower.=Habla con Forebearer Janus dentro de la torre.
Climb up the staircase in the tower to the first challenge.=Sube por la escalera de la torre hasta el primer desafío.
Pickpocket one of the emissary ascended.=Roba con carterismo a uno de los emissary ascended.
Use the key to open the gate in the south-east corner of the room.=Usa la key para abrir la verja de la esquina sureste de la sala.
Search the south-east chest for a book and some paper.=Busca en el cofre sureste un libro y algo de papel.
Read the poem.=Lee el poema.
Talk to the prince in the room.=Habla con el príncipe en la sala.
Open the north-west chest.=Abre el cofre noroeste.
Inspect one of the scraps to combine them.=Inspecciona uno de los scraps para combinarlos.
Read the completed note.=Lee la nota completada.
Talk to Janus and tell him the passcode.=Habla con Janus y dile el passcode.
Talk to Forebearer Janus, ready to fight.=Habla con Forebearer Janus, listo para luchar.
Defeat the waves of enemies. Use Protect from Melee. You can heal yourself and the prince using bandages from the chests in the area.=Derrota a las oleadas de enemigos. Usa Protect from Melee. Puedes curarte a ti mismo y al príncipe usando las bandages de los cofres del área.
Talk to Forebearer Janus again to progress to the third trial.=Habla con Forebearer Janus de nuevo para avanzar al tercer desafío.
Talk to Tenoch.=Habla con Tenoch.
Work out who the guilty emissary is.=Averigua quién es el emissary culpable.
Talk to Silia.=Habla con Silia.
Talk to Adrius.=Habla con Adrius.
Talk to Eleuia.=Habla con Eleuia.
Accuse Tenoch.=Acusa a Tenoch.
Accuse Silia.=Acusa a Silia.
Accuse Eleuia.=Acusa a Eleuia.
Accuse the guilty individual.=Acusa al culpable.
Talk to Janus to go to the final trial, ready for a fight.=Habla con Janus para ir al desafío final, listo para luchar.
Defeat the prince. Use protect from melee. See sidebar for more details.=Derrota al príncipe. Usa protect from melee. Consulta la barra lateral para más detalles.
Defeat the prince. Use Protect from Melee.=Derrota al príncipe. Usa Protect from Melee.
He will protect from any special attacks you do.=Se protegerá de cualquier ataque especial que hagas.
He can do a sword swipe to turn off your prayers. Simply re-activate them straight away.=Puede hacer un sword swipe para desactivar tus prayers. Vuelve a activarlas de inmediato.
If he says he's doing a slam attack, step on the tile behind him to dodge it.=Si dice que va a hacer un ataque de slam, pisa la loseta detrás de él para esquivarlo.
Talk to Janus to wrap up the final trial.=Habla con Janus para concluir el desafío final.
Talk to Janus at the bottom of the tower.=Habla con Janus al pie de la torre.
Search the chest in the south of the tower for some emissary robes.=Busca en el cofre del sur de la torre unas emissary robes.
Talk to the prince to have him follow you.=Habla con el príncipe para que te siga.
Enter the temple to the east of the tower for a cutscene.=Entra en el templo al este de la torre para ver una cinemática.
Talk to the prince in the temple.=Habla con el príncipe en el templo.
Talk to Forebearer Fides in the temple.=Habla con Forebearer Fides en el templo.
Go down the stairs south-east of the temple. Be equipped for a fight.=Baja las escaleras al sureste del templo. Ve equipado para luchar.
Take a pickaxe from the nearby barrel.=Coge un pickaxe del barril cercano.
Mine the nearby rocks.=Mina las rocas cercanas.
Pull the lever in the south-east of the area. Make sure to avoid the wall spikes.=Tira de la palanca del sureste del área. Asegúrate de evitar los pinchos de la pared.
Climb down the ledge east of the lever.=Baja por la cornisa al este de la palanca.
Climb back up the ice to the south-west to pull the first lever.=Vuelve a subir por el hielo hacia el suroeste para tirar de la primera palanca.
Climb across the ice ledge to the north. Avoid the floor spike traps on the way.=Cruza la cornisa de hielo hacia el norte. Evita las trampas de pinchos del suelo por el camino.
Climb back across the icy ledge.=Vuelve a cruzar la cornisa helada.
Climb back up to pull a lever you missed.=Vuelve a subir para tirar de una palanca que te hayas saltado.
Pull the lever in the north-east room. Avoid the floor traps.=Tira de la palanca de la sala noreste. Evita las trampas del suelo.
Jump over the frozen platforms to the north-west, and climb down the ledge there.=Salta las plataformas congeladas hacia el noroeste y baja por la cornisa de allí.
Pull the third lever in the north-west room.=Tira de la tercera palanca en la sala noroeste.
Pull the final lever in the south-west, near the gate.=Tira de la palanca final en el suroeste, cerca de la verja.
Pull the chain to unlock a shortcut.=Tira de la cadena para desbloquear un atajo.
Climb down the shortcut chain to the west of the entrance.=Baja por la cadena del atajo al oeste de la entrada.
Search the urn with an air symbol on it near to the earth markings in the south-east of the area.=Busca en la urna con un símbolo de air cerca de las earth markings del sureste del área.
Work out how to open the door to the far west.=Averigua cómo abrir la puerta del extremo oeste.
Search the urn with an earth symbol on it near to the earth markings in the south-east of the area.=Busca en la urna con un símbolo de earth cerca de las earth markings del sureste del área.
Search the urn with an water symbol on it near to the water markings in the south-west of the area.=Busca en la urna con un símbolo de water cerca de las water markings del suroeste del área.
Search the urn with an fire symbol on it near to the water markings in the south-west of the area.=Busca en la urna con un símbolo de fire cerca de las water markings del suroeste del área.
Fix the broken air statue in the west of the area.=Repara la estatua de air rota en el oeste del área.
Fix the broken water statue in the west of the area.=Repara la estatua de water rota en el oeste del área.
Fix the broken earth statue in the west of the area.=Repara la estatua de earth rota en el oeste del área.
Fix the broken fire statue in the west of the area.=Repara la estatua de fire rota en el oeste del área.
Inspect the air markings in the north-east of the area.=Inspecciona las air markings del noreste del área.
Inspect the water markings in the south-west of the area.=Inspecciona las water markings del suroeste del área.
Inspect the earth markings in the south-east of the area.=Inspecciona las earth markings del sureste del área.
Inspect the fire markings in the north-west of the area.=Inspecciona las fire markings del noroeste del área.
Activate the first statue in the order.=Activa la primera estatua en el orden.
Activate the second statue in the order.=Activa la segunda estatua en el orden.
Activate the third statue in the order.=Activa la tercera estatua en el orden.
Activate the fourth statue in the order.=Activa la cuarta estatua en el orden.
Enter the door to the west, ready for the boss.=Entra por la puerta del oeste, listo para el boss.
Defeat Amoxliatl. See the sidebar for more details.=Derrota a Amoxliatl. Consulta la barra lateral para más detalles.
Defeat Amoxliatl. Use Protect from Magic.=Derrota a Amoxliatl. Usa Protect from Magic.
Ice spikes will appear on the floor, move off the tile to avoid them.=Aparecerán pinchos de hielo en el suelo; muévete de la loseta para evitarlos.
She may disable your prayers and shoot an icicle at you. Simply turn back on Protect from Magic.=Puede desactivar tus prayers y lanzarte un carámbano. Vuelve a activar Protect from Magic.
Ice blocks may appear. Use melee to destroy them all before they explode and heal the boss.=Pueden aparecer bloques de hielo. Usa melee para destruirlos todos antes de que exploten y curen al boss.
Talk to Servius, Teokan of Ralos in the palace in Civitas illa Fortis to complete the quest.=Habla con Servius, Teokan of Ralos, en el palacio de Civitas illa Fortis para completar la misión.
