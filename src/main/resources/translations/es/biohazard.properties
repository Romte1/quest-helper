Give Chancy the Liquid honey.=Entrega la Liquid honey a Chancy.
Work out what ingredient to give to Chancy by talking to them.=Averigua qué ingrediente darle a Chancy hablando con él.
Give Da Vinci the Ethenea.=Entrega la Ethenea a Da Vinci.
