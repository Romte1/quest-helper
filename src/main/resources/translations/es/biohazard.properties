# Spanish translations for Biohazard.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from the cupboard in Edmond's house west of Elena's house.=Puedes conseguir otra del armario en la casa de Edmond, al oeste de la casa de Elena.
For travelling from Ardougne to Rimmington.=Para viajar de Ardougne a Rimmington.
For buying the Priest Gown set=Para comprar el conjunto de Priest Gown
You can get another from Elena in East Ardougne.=Puedes conseguir otro de Elena en East Ardougne.
You can get more from the Chemist in Rimmington.=Puedes conseguir más del Chemist en Rimmington.
Talk to Elena in her house west of the northern Ardougne bank.=Habla con Elena en su casa al oeste del banco del norte de Ardougne.
Talk to Jerico in his house south of the northern Ardougne bank=Habla con Jerico en su casa al sur del banco del norte de Ardougne
Get bird feed from the cupboard in Jerico's house.=Consigue bird feed del armario en la casa de Jerico.
Get a pigeon cage from behind Jerico's house.=Consigue una pigeon cage detrás de la casa de Jerico.
Investigate the watchtower near the entrance to West Ardougne.=Investiga la watchtower cerca de la entrada a West Ardougne.
Open the Pigeon cage next to the watchtower.=Abre la Pigeon cage junto a la watchtower.
Talk to Omart, south of the watchtower, to enter West Ardougne.=Habla con Omart, al sur de la watchtower, para entrar en West Ardougne.
Squeeze through the fence to enter the Mourner's Headquarters yard in the north east of West Ardougne.=Pasa por la valla para entrar en el patio de la Mourner's Headquarters, al noreste de West Ardougne.
Pick up the rotten apple in the yard.=Coge la rotten apple del patio.
Use the rotten apple on the cauldron.=Usa la rotten apple en el cauldron.
Search the cupboard in Sarah's house south-west of the West Ardougne church for a disguise.=Busca en el armario de la casa de Sarah, al suroeste de la iglesia de West Ardougne, para conseguir un disfraz.
Enter the Mourners' Headquarters whilst wearing the medical gown.=Entra en la Mourners' Headquarters llevando puesto el medical gown.
Go upstairs and kill the mourner.=Sube las escaleras y mata al mourner.
Kill the mourner here for a key to the caged area.=Mata al mourner de aquí para conseguir una key de la zona con jaulas.
Search the crate in the caged area for Elena's Distillator.=Busca en el cajón de la zona con jaulas el Distillator de Elena.
Return to Elena. Go back downstairs or teleport out.=Vuelve con Elena. Baja las escaleras o teletranspórtate fuera.
Return to Elena. Talk to Kilron south-east of the West Ardougne church to return back to East Ardougne.=Vuelve con Elena. Habla con Kilron, al sureste de la iglesia de West Ardougne, para volver a East Ardougne.
Return to Elena.=Vuelve con Elena.
Take the Plague Sample to the Chemist in Rimmington. You can take a boat from Ardougne Dock to Rimmington for 30gp.=Lleva la Plague Sample al Chemist en Rimmington. Puedes tomar un barco desde Ardougne Dock a Rimmington por 30gp.
Go speak to Hops, Da Vinci and Chancy in the pub in the south east of Varrock. If you lost any of the chemicals, return to Elena to get more.=Ve a hablar con Hops, Da Vinci y Chancy en el pub al sureste de Varrock. Si has perdido alguno de los chemicals, vuelve con Elena para conseguir más.
Talk to Da Vinci for the Ethenea.=Habla con Da Vinci para conseguir la Ethenea.
Talk to Hops for the Sulphuric Broline.=Habla con Hops para conseguir la Sulphuric Broline.
Talk to Chancy for the Liquid honey.=Habla con Chancy para conseguir la Liquid honey.
Talk to Asyff to get a free priest gown. You can only get the free set once.=Habla con Asyff para conseguir un priest gown gratis. Solo puedes conseguir el conjunto gratis una vez.
Talk to Asyff and buy a priest gown set.=Habla con Asyff y compra un conjunto de priest gown.
Talk to Guidor in his house to the south.=Habla con Guidor en su casa al sur.
Return to Elena and inform her that the plague is a hoax.=Vuelve con Elena e infórmale de que la plaga es un engaño.
Tell King Lathas that the Plague is a hoax.=Dile a King Lathas que la plaga es un engaño.
