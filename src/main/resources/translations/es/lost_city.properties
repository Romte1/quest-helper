# Spanish translations for Lost City.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to the Warrior south east of Draynor Village.=Habla con el Warrior al sureste de Draynor Village.
Try cutting the tree just to the west.=Intenta cortar el árbol justo al oeste.
Talk to Shamus.=Habla con Shamus.
Bank all weapons and armour you have (including the axe), and go to Port Sarim to get a boat to Entrana.=Guarda en el banco todas las armas y armaduras que tengas (incluido el axe) y ve a Port Sarim para coger un barco a Entrana.
Climb down the ladder on the north side of the island. Once you go down, you can only escape via teleport.=Baja por la escalera en el lado norte de la isla. Una vez abajo, solo podrás escapar mediante teletransporte.
Kill zombies until one drops an axe.=Mata a zombies hasta que uno suelte un axe.
Pick up the axe=Coge el axe
Attempt to cut a branch from the Dramen tree. Be prepared for a Tree Spirit (level 101) to appear, which you can safespot behind nearby fungus.=Intenta cortar una rama del Dramen tree. Prepárate para que aparezca un Tree Spirit (nivel 101), al que puedes safespotear detrás de los hongos cercanos.
Kill the Tree Spirit. They can be safespotted behind nearby fungi to the east.=Mata al Tree Spirit. Se le puede safespotear detrás de los hongos cercanos al este.
Cut at least one branch from the Dramen tree. It's recommended you cut at least 4 branches so you don't have to return in future quests.=Corta al menos una rama del Dramen tree. Se recomienda cortar al menos 4 ramas para no tener que volver en futuras misiones.
Teleport away with the branches, preferably to Lumbridge.=Teletranspórtate con las ramas, preferiblemente a Lumbridge.
If you've lost your Dramen branch/staff, you will need to return to Entrana and cut another. You will not need to defeat the Tree Spirit again.=Si has perdido tu Dramen branch/staff, tendrás que volver a Entrana y cortar otra. No necesitarás derrotar al Tree Spirit de nuevo.
Use a knife on the dramen branch to craft a dramen staff.=Usa un knife en la dramen branch para fabricar un dramen staff.
Enter the shed south of Lumbridge with your Dramen Staff equipped.=Entra en el cobertizo al sur de Lumbridge con el Dramen Staff equipado.
Multiple zombies (level 25) (can be safespotted)=Varios zombies (nivel 25) (se pueden safespotear)
Dramen Tree Spirit (level 101) (can be safespotted)=Dramen Tree Spirit (nivel 101) (se puede safespotear)
Access to Zanaris.=Acceso a Zanaris.
Ability to craft Cosmic Runes=Habilidad de fabricar Cosmic Runes
Ability to buy and wield Dragon Daggers & Longswords=Habilidad de comprar y usar Dragon Daggers y Longswords
Starting off=Empezando
Finding Shamus=Encontrar a Shamus
Getting a Dramen branch=Conseguir una Dramen branch
Entering Zanaris=Entrar en Zanaris
Runes, or a way of dealing damage which you can smuggle onto Entrana. Runes for Crumble Undead (level 39 Magic) are best=Runes, o una forma de hacer daño que puedas llevar a Entrana. Las runes para Crumble Undead (nivel 39 de Magic) son lo mejor
Teleport, preferably to Lumbridge. Home teleport will work if off cooldown=Teleport, preferiblemente a Lumbridge. El home teleport sirve si no está en cooldown
