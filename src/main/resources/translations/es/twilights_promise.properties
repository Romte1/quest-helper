# Spanish translations for Twilight's Promise.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Ennius in the palace.=Puedes conseguir otro de Ennius en el palacio.
You can get more from Regulus Cento=Puedes conseguir más de Regulus Cento
Talk to Regulus Cento outside Varrock's East Gate to travel to Varlamore.=Habla con Regulus Cento a las afueras de la puerta este de Varrock para viajar a Varlamore.
Talk to Ennius Tullus just west of where you arrived, next to the fountain.=Habla con Ennius Tullus justo al oeste de donde llegaste, junto a la fuente.
Talk to Metzli in the temple in the south of the city.=Habla con Metzli en el templo del sur de la ciudad.
Enter the temple's crypt.=Entra en la cripta del templo.
Talk to Prince Itzla Arkan in the north room.=Habla con Prince Itzla Arkan en la sala del norte.
Leave the crypt.=Sal de la cripta.
Return to Ennius Tullus, who is now in the palace.=Vuelve con Ennius Tullus, que ahora está en el palacio.
Talk to the Knight of Varlamore on the south western part of the Fortis Cothon (docks) in the east of the city.=Habla con el Knight of Varlamore en la parte suroeste del Fortis Cothon (los muelles), al este de la ciudad.
Search the crate in the north-east of the Cothon, next to two barrels of fish.=Registra la caja del noreste del Cothon, junto a dos barriles de pescado.
Return to the Knight of Varlamore on the south part of the Fortis Cothon.=Vuelve con el Knight of Varlamore en la parte sur del Fortis Cothon.
Enter the Colosseum in the east of the city.=Entra en el Colosseum, al este de la ciudad.
Talk to the Knight of Varlamore in the north training room, ready to fight.=Habla con el Knight of Varlamore en la sala de entrenamiento del norte, listo para luchar.
Defeat the knight, swapping combat styles to bypass his prayers.=Derrota al knight cambiando de estilo de combate para saltarte sus prayers.
Talk to the Knight of Varlamore in the northern training room once more.=Habla con el Knight of Varlamore en la sala de entrenamiento del norte una vez más.
Talk to the Knights of Varlamore in the pub OUTSIDE the walls of the city to the south.=Habla con los Knights of Varlamore en el pub de FUERA de las murallas de la ciudad, al sur.
Lead the knight to the fountain to the east. Whenever they stop following you, talk to them again.=Guía al knight hasta la fuente del este. Si dejan de seguirte, vuelve a hablar con ellos.
Talk to the sobered knight at the fountain.=Habla con el knight ya sobrio que está en la fuente.
Talk to the Knight of Varlamore in the bazaar south of the palace.=Habla con el Knight of Varlamore en el bazar al sur del palacio.
Pickpocket the citizen in turquoise robes in the bazaar.=Roba con carterismo al citizen de túnica turquesa del bazar.
Return the amulet to the knight in the bazaar.=Devuelve el amulet al knight del bazar.
Return to Ennius Tullus in the palace.=Vuelve con Ennius Tullus en el palacio.
Go to the top floor of the Kualti Headquarters, just west of the palace.=Ve a la planta superior de la Kualti Headquarters, justo al oeste del palacio.
Search the chest in the south-east room on the south wall.=Registra el cofre de la sala sureste, en la pared sur.
Read the incriminating letter.=Lee la carta incriminatoria.
Return to Ennius and Furia in the palace.=Vuelve con Ennius y Furia en el palacio.
TALK to Regulus Cento south-east of the palace.=HABLA con Regulus Cento al sureste del palacio.
Feed Renu the feed.=Dale de comer a Renu.
Travel with Renu to Teomat.=Viaja con Renu al Teomat.
Talk to Prince Itzla Arkan in the temple, near the altar.=Habla con Prince Itzla Arkan en el templo, cerca del altar.
Talk to Metzli in the northern building of the Teomat.=Habla con Metzli en el edificio norte del Teomat.
Defeat the cultists.=Derrota a los cultists.
Talk to Prince Itzla Arkan in Teomat, near the altar, to finish the quest.=Habla con Prince Itzla Arkan en el Teomat, cerca del altar, para terminar la misión.
