# Spanish translations for Desert Easy Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Steps
Enter the desert.=Entra en el desierto.
Catch a Golden Warbler in the Uzer hunter area.=Pesca un Golden Warbler en la zona de caza de Uzer.
Talk to the rug merchant and travel to Pollnivneach.=Habla con el rug merchant y viaja a Pollnivneach.
Cut Kharidian cacti and fill up your waterskin. You may need to cut multiple cacti before you successfully get water.=Corta Kharidian cacti y llena tu waterskin. Puede que tengas que cortar varios cacti antes de conseguir agua.
Mine five clay in the north east of the desert.=Mina cinco clay en el noreste del desierto.
Have Zahur in Nardah clean a grimy herb for you.=Pide a Zahur en Nardah que te limpie un grimy herb.
Kill a vulture.=Mata a un vulture.
Enter the Pyramid plunder minigame. If you don't see a Guardian mummy exit and try a different entrance.=Entra en el minijuego Pyramid plunder. Si no ves a un Guardian mummy, sal e inténtalo por otra entrada.
Talk to the guardian mummy to start the minigame. If you don't see a Guardian mummy exit and try a different entrance.=Habla con el guardian mummy para empezar el minijuego. Si no ves a un Guardian mummy, sal e inténtalo por otra entrada.
Open the sarcophagus in the first room.=Abre el sarcophagus de la primera sala.
Talk to Simon Templeton and sell your artefact.=Habla con Simon Templeton y vende tu artefacto.
Use the rope on the entrance and enter the Kalphite Hive.=Usa la rope en la entrada y entra en la Kalphite Hive.
Pickup and drop cacti until task is completed=Recoge y suelta cacti hasta completar la tarea.
Talk to Jarr at the Shantay pass to claim your reward!=¡Habla con Jarr en el Shantay pass para reclamar tu recompensa!

# Requirements
Any Pickaxe=Cualquier Pickaxe
Any Artefact from Pyramid Plunder=Cualquier artefacto de Pyramid Plunder
Combat gear and ranged weapon or runes for multiple spell casts=Equipo de combate y arma a distancia o runas para lanzar varios hechizos
Food=Comida

# Combat requirements
Kill a Vulture (lvl 31), tank hits from Kalphite Soldier (lvl 85)=Mata a un Vulture (nivel 31) y aguanta los golpes del Kalphite Soldier (nivel 85)

# Rewards
Pharaoh's sceptre can hold up to 10 charges=El Pharaoh's sceptre puede almacenar hasta 10 cargas
Goats will always drop noted desert goat horn=Las cabras siempre soltarán desert goat horn anotado
Simon Templeton will now buy your noted artefacts too=Simon Templeton ahora también comprará tus artefactos anotados

