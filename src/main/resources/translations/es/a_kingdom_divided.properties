Fight the Judge of Yama. This boss uses magic + range prayer so melee is required. Run in the gaps of the fire waves to approach the boss.=Lucha contra el Judge of Yama. Este jefe usa protección de magia y a distancia, así que necesitas cuerpo a cuerpo. Pasa por los huecos de las oleadas de fuego para acercarte al jefe.
Prepare to fight the Judge of Yama. This boss uses magic + range prayer so melee is required. Run in the gaps of the fire waves to approach the boss.\n\nEnter the Portal near Veos's ship to fight the Judge of Yama.=Prepárate para luchar contra el Judge of Yama. Este jefe usa protección de magia y a distancia, así que necesitas cuerpo a cuerpo. Pasa por los huecos de las oleadas de fuego para acercarte al jefe.\n\nEntra en el Portal cerca del barco de Veos para luchar contra el Judge of Yama.
