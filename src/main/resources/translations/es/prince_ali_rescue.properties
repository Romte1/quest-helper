# Spanish translations for Prince Ali Rescue.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Leela for 15 coins=Puedes conseguir otra de Leela por 15 coins
Talk to Hassan in the Al Kharid Palace.=Habla con Hassan en el Al Kharid Palace.
Talk to Osman north of the Al Kharid Palace.=Habla con Osman al norte del Al Kharid Palace.
Have Ned in Draynor Village make you a wig from 3 balls of wool. He can also sell you a rope for 15 coins via dialogue (or bought from his shop for 18 coins) or 4 balls of wool.=Haz que Ned en Draynor Village te haga un wig con 3 balls of wool. También puede venderte una rope por 15 coins mediante el diálogo (o comprada en su shop por 18 coins) o 4 balls of wool.
Dye the wig with yellow dye. Buy a yellow dye with two onions and 5 coins if you still need it from Aggie in Draynor Village.=Teñe el wig con yellow dye. Si aún lo necesitas, compra un yellow dye con dos onions y 5 coins a Aggie en Draynor Village.
Talk to Aggie in Draynor Village to get some paste.=Habla con Aggie en Draynor Village para conseguir algo de paste.
Talk to Keli in the jail east of Draynor Village. If you've already made the key print, open the quest journal to re-sync.=Habla con Keli en la cárcel al este de Draynor Village. Si ya has hecho el key print, abre el quest journal para resincronizarlo.
Use the key print on any furnace with a bronze bar in your inventory to make a key.=Usa el key print en cualquier furnace con un bronze bar en tu inventario para hacer la key.
Talk to Leela east of Draynor Village.=Habla con Leela al este de Draynor Village.
Talk to Leela east of Draynor Village for another key. It'll cost 15gp.=Habla con Leela al este de Draynor Village por otra key. Costará 15gp.
Bring everything to the jail and give Joe there three beers.=Lleva todo a la cárcel y entrega tres beers a Joe.
Use rope on Keli.=Usa la rope en Keli.
Use the key on the prison door. If Lady Keli respawned you'll need to tie her up again.=Usa la key en la puerta de la prisión. Si Lady Keli reaparece, tendrás que atarla de nuevo.
Talk to Prince Ali and free him.=Habla con Prince Ali y libéralo.
Return to Hassan in the Al Kharid Palace to complete the quest.=Regresa a Hassan en el Al Kharid Palace para terminar la misión.
Able to survive jail guards (level 26) attacking you=Capaz de sobrevivir a los ataques de los jail guards (nivel 26)
Free use of the Al Kharid toll gates.=Uso gratuito de los Al Kharid toll gates.
Access to Sorceress's Garden Minigame (Members)=Acceso al Sorceress's Garden Minigame (Members)
Starting off=Empezando
Make a blonde wig=Haz un blonde wig
Make paste=Haz paste
Make a key print=Haz un key print
Make the key=Haz la key
Return with the items=Regresa con los items
Free Ali=Libera a Ali
Return to Al Kharid=Regresa a Al Kharid
Rope, or 15 coins / 4 balls of wool to obtain during the quest=Rope, o 15 coins / 4 balls of wool para conseguirlo durante la misión
Coins minimum=Coins como mínimo
Yellow dye, or 2 onions + 5 coins to obtain during quest=Yellow dye, o 2 onions + 5 coins para conseguirlo durante la misión
