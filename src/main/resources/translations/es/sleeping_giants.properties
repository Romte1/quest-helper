# Spanish translations for Sleeping Giants.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Imcando hammer also works=El Imcando hammer también sirve
Allows you to skip filling and using a bucket of water.=Te permite saltarte llenar y usar un bucket of water.
Ring of Dueling or Amulet of Glory; Can be used to quickly reach the Giants' Foundry.=Ring of Dueling o Amulet of Glory; se puede usar para llegar rápido al Giants' Foundry.
Go to the Desert Plateau east of Al Kharid to start the quest. Minigame teleport to Giant's Foundry.=Ve al Desert Plateau al este de Al Kharid para empezar la misión. Usa el teletransporte de minijuego al Giant's Foundry.
Take a hammer from the crate north of the Giants' Foundry.=Coge un hammer de la caja al norte del Giants' Foundry.
Attempt to Strike the Hill Giant at the entrance of the cave to start the quest.=Intenta golpear al Hill Giant en la entrada de la cueva para empezar la misión.
Speak to Kovac.=Habla con Kovac.
Enter the Giants' Foundry.=Entra en el Giants' Foundry.
Enter the Giants' Foundry again.=Entra en el Giants' Foundry de nuevo.
Fix the Broken polishing wheel.=Arregla la Broken polishing wheel.
Fix the Broken grindstone.=Arregla la Broken grindstone.
Fix the Broken trip hammer.=Arregla el Broken trip hammer.
Speak to Kovac to continue.=Habla con Kovac para continuar.
Speak to Kovac for a commission.=Habla con Kovac para conseguir un encargo.
Take some bars & weapons from the Crate.=Coge algunas bars y weapons de la Crate.
Fill the Crucible with items & bars until it is full.=Llena el Crucible con objetos y bars hasta que esté lleno.
Speak to Kovac about the mould.=Habla con Kovac sobre el mould.
Select the mould for the forte, blade and tip.=Selecciona el mould para el forte, la blade y el tip.
Select the Forte tab.=Selecciona la pestaña Forte.
Select the Forte that matches your commission best.=Selecciona el Forte que mejor encaje con tu encargo.
Select the Blades tab.=Selecciona la pestaña Blades.
Select the Blade that matches your commission best.=Selecciona la Blade que mejor encaje con tu encargo.
Select the Tips tab.=Selecciona la pestaña Tips.
Select the Tip that matches your commission best.=Selecciona el Tip que mejor encaje con tu encargo.
Set the Mould.=Establece el Mould.
Speak to Kovac about pouring the metal.=Habla con Kovac sobre verter el metal.
Pour the full Crucible into the mould.=Vierte el Crucible lleno en el mould.
Pick up the sword from the mould with a bucket of water or ice gloves equipped.=Coge la espada del mould con un bucket of water o ice gloves equipados.
Fill the bucket with water by using it on the Waterfall.=Llena el bucket con agua usándolo en el Waterfall.
Take a Bucket from the Pile of Buckets=Coge un Bucket de la Pile of Buckets
Dunk the preform in the lava pool until it's at max heat.=Mete el preform en la lava pool hasta que esté al máximo de calor.
Use the trip hammer while the heat bar is in the red, and re-heat it in the lava whenever it's close to yellow.=Usa el trip hammer mientras la barra de calor esté en rojo y vuelve a calentarlo en la lava cuando esté cerca del amarillo.
Cool the preform to the lower range of the yellow heat section on the waterfall.=Enfría el preform hasta la parte baja de la sección amarilla de calor en el waterfall.
Dunk the preform in the lava pool until it's at the bottom of the yellow heat section.=Mete el preform en la lava pool hasta que esté en la parte inferior de la sección amarilla de calor.
Grindstone the preform whilst in the yellow heat section.=Pasa el preform por la grindstone mientras esté en la sección amarilla de calor.
Cool the preform to the top of the range of the green heat section on the waterfall.=Enfría el preform hasta la parte superior de la sección verde de calor en el waterfall.
Dunk the preform in the lava pool until it's at the top of the green heat section.=Mete el preform en la lava pool hasta que esté en la parte superior de la sección verde de calor.
Use the polishing wheel whilst in the green heat range, heating it in the lava when needed.=Usa la polishing wheel mientras esté en el rango verde de calor, calentándolo en la lava cuando sea necesario.
Get your preform from the preform storage in the north of the room.=Coge tu preform del preform storage en el norte de la sala.
Give the finished sword to Kovac to complete the quest.=Entrega la espada terminada a Kovac para completar la misión.
Access to the Giants' Foundry=Acceso al Giants' Foundry
Starting out=Empezando
Creating the sword=Creando la espada
