# Spanish translations for Ghosts Ahoy.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from the Old man on the abandoned ship=Puedes conseguir otra del Old man en el abandoned ship
You can make this by picking nettles whilst wearing gloves (Edgeville yews for example), then using them on a bowl of water. Cook this to have nettle tea=Puedes prepararlo cogiendo nettles con guantes puestos (por ejemplo, en los yews de Edgeville) y usándolos en un bowl of water. Cocínalo para obtener nettle tea
