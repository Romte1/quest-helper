# Spanish translations for The Garden of Death.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Obtained in quest in a stone table in the first hole=Se obtiene durante la misión en una mesa de piedra del primer agujero
Search the tent in the south east of the Kebos Lowlands.=Busca en la tienda de campaña al sureste de Kebos Lowlands.
Read the journal=Lee el diario
Search the camping equipment for some secateurs.=Busca en el equipo de acampada para conseguir unas secateurs.
Enter the nearby hole.=Entra en el agujero cercano.
Search the north-west table.=Busca en la mesa del noroeste.
Read the stone tablet.=Lee la stone tablet.
Read the word translations.=Lee las word translations.
Click the 'Attempt Translation' button.=Haz clic en el botón 'Attempt Translation'.
Type 'Island', 'Water', 'Time', 'Vessel', and 'North'.=Escribe 'Island', 'Water', 'Time', 'Vessel' y 'North'.
Work out various translation words and input them to the word translations.=Averigua varias palabras de la traducción e introdúcelas en las word translations.
Leave the hole.=Sal del agujero.
Travel to Molch island via Boaty, located on the west/north/east sides of Lake Molch.=Viaja a la isla de Molch con Boaty, que se encuentra en los lados oeste, norte y este de Lake Molch.
Enter the hole on Molch Island.=Entra en el agujero de Molch Island.
Inspect the vines to the south.=Inspecciona las vides del sur.
Cut the vines with secateurs.=Corta las vides con las secateurs.
Search the south west stone table.=Busca en la mesa de piedra del suroeste.
Read the stone tablet, and take the note after closing the tablet's interface.=Lee la stone tablet y coge la nota después de cerrar la interfaz de la tablet.
Type 'West', 'Poison', 'Body', 'Food', and 'Earth'.=Escribe 'West', 'Poison', 'Body', 'Food' y 'Earth'.
Travel via Boaty to Molch, and enter the hole near Xeric's Shrine.=Viaja con Boaty a Molch y entra en el agujero junto a Xeric's Shrine.
Enter the hole next to Xeric's Shrine.=Entra en el agujero junto a Xeric's Shrine.
Search the south east stone table.=Busca en la mesa de piedra del sureste.
Type 'Make', 'Yes', 'No', 'Move', 'Arrive', 'East', and 'South'.=Escribe 'Make', 'Yes', 'No', 'Move', 'Arrive', 'East' y 'South'.
Enter the hole in the Ruins of Morra, south west of Shayzien.=Entra en el agujero de las Ruins of Morra, al suroeste de Shayzien.
Search the south stone table.=Busca en la mesa de piedra del sur.
Type 'Few', 'Big', 'Sun', 'Moon', 'Life', 'Death', 'Mind', 'Home', 'Air', and 'Fire'.=Escribe 'Few', 'Big', 'Sun', 'Moon', 'Life', 'Death', 'Mind', 'Home', 'Air' y 'Fire'.
