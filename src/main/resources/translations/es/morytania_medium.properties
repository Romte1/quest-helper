# Spanish translations for Morytania Medium Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Created by grinding a silver bar in the ectofuntus bone grinder.=Se crea moliendo una silver bar en el bone grinder del ectofuntus.
Access to the fairy ring system=Acceso al sistema de fairy rings
Combat gear=Equipo de combate
Food=Comida
Enter the Haunted Mine or use slayer ring to teleport directly to Tarn's Lair.=Entra en la Haunted Mine o usa un slayer ring para teletransportarte directamente a Tarn's Lair.
Enter the Haunted Mine. If you have a Slayer Ring, instead teleport to Tarn's Lair to skip most of this.=Entra en la Haunted Mine. Si tienes un Slayer Ring, teletranspórtate a Tarn's Lair para saltarte la mayor parte de esto.
Kill a terror dog. You can enter the room with the diary if you need a safe zone.=Mata un terror dog. Puedes entrar en la sala del diario si necesitas una zona segura.
Complete a lap of the Canifis Rooftop Course.=Completa una vuelta al Canifis Rooftop Course.
Catch a swamp lizard.=Pesca un swamp lizard.
Board the Swamp boaty at the Hollows.=Sube al Swamp boaty en The Hollows.
Use your Ectophial to teleport to Port Phasmatys.=Usa tu Ectophial para teletransportarte a Port Phasmatys.
Mix a Guthix balance potion while in Morytania.=Mezcla una Guthix balance potion en Morytania.
Chop some bark off the hollow tree south of Port phasmatys.=Tala algo de corteza del hollow tree al sur de Port Phasmatys.
Make a batch of cannonballs at Port Phasmatys.=Fabrica un lote de cannonballs en Port Phasmatys.
Talk to the Ghost captain at Port Phasmatys to travel to Dragontooth Island.=Habla con el Ghost captain en Port Phasmatys para viajar a Dragontooth Island.
Talk to Pirate Pete to travel to Braindeath Island.=Habla con Pirate Pete para viajar a Braindeath Island.
Climb down the ladder.=Baja por la escalera de mano.
Kill a Fever spider.=Mata una Fever spider.
Cross the gangplank to Bill Teach's ship. Alternatively use the Group finder to teleport directly there.=Cruza la pasarela hasta el barco de Bill Teach. Alternativamente, usa el Group finder para teletransportarte directamente allí.
Talk to Bill Teach to travel to Mos Le'Harmless.=Habla con Bill Teach para viajar a Mos Le'Harmless.
Start playing Trouble brewing. You don't need to win. You will need to empty your inventory and unequip any helmets.=Empieza a jugar a Trouble brewing. No necesitas ganar. Tendrás que vaciar tu inventario y quitarte cualquier casco.
Talk to Le-Sabre near Canifis to claim your reward!=Habla con Le-Sabre cerca de Canifis para reclamar tu recompensa.
a Terror dog (lvl 100) and a Fever spider (lvl 49)=un Terror dog (nivel 100) y un Fever spider (nivel 49)
5 daily teleports to the Slime Pit beneath the Ectofuntus from Morytania legs=5 teletransportes diarios al Slime Pit bajo el Ectofuntus desde las Morytania legs
Morytania legs act as a ghostspeak amulet when worn=Las Morytania legs actúan como un ghostspeak amulet cuando se llevan puestas
Robin offers 13 buckets of slime and 13 pots of bonemeal in exchange for bones each day=Robin ofrece 13 buckets of slime y 13 pots of bonemeal a cambio de bones cada día
5% more Slayer experience in the Slayer Tower while on a Slayer task=5% más de experiencia de Slayer en el Slayer Tower mientras tienes una tarea de Slayer
Finishing off=Para terminar
Enter the entrance to the north.=Entra por la entrada del norte.
Follow the path east then north, and go through the door you reach.=Sigue el camino hacia el este y luego hacia el norte, y atraviesa la puerta a la que llegues.
Follow the path west then north, and go through the door you reach.=Sigue el camino hacia el oeste y luego hacia el norte, y atraviesa la puerta a la que llegues.
Continue to the west of the room.=Continúa hacia el oeste de la sala.
Go through the north door.=Atraviesa la puerta del norte.
Go through the west door.=Atraviesa la puerta del oeste.
Go into the south door.=Entra por la puerta del sur.
Go into the east passageway.=Entra en el pasillo del este.
Jump across the pillars to the west ledge.=Salta entre los pilares hasta la repisa del oeste.
Jump across the pillars.=Salta entre los pilares.
Jump to the ledge.=Salta a la repisa.
Search the floor.=Busca en el suelo.
Jump across the pillars to the north side.=Salta entre los pilares hasta el lado norte.
Follow the path to the east.=Sigue el camino hacia el este.
Follow the path to the east. Avoid the walls which will occasionally stick out and knock you down, marked with a skull.=Sigue el camino hacia el este. Evita las paredes que de vez en cuando sobresalen y te derriban, marcadas con una calavera.
Activate Protect from Magic and jump across the pillars. Go down the stairs.=Activa Protect from Magic y salta entre los pilares. Baja las escaleras.
Enter the north passageway, and be prepared to fight.=Entra en el pasillo del norte y prepárate para luchar.
