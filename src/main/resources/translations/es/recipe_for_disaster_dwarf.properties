# Spanish translations for Recipe for Disaster: Mountain Dwarf.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Add coins to asgarnian ale to make 4 asgoldian ale. You can buy ale from Kaylee for 3gp each.=Añade monedas al asgarnian ale para hacer 4 asgoldian ale. Puedes comprar ale a Kaylee por 3gp cada una.
Enter the tunnel under White Wolf Mountain.=Entra en el túnel bajo White Wolf Mountain.
Go inspect the dwarf.=Ve a inspeccionar al enano.
Go use the dwarven rock cake on the dwarf.=Ve a usar la dwarven rock cake en el enano.
Icefiend if you don't have Ice Gloves=Icefiend si no tienes Ice Gloves
If you didn't pick up the rock cake with ice gloves, kill an icefiend to cool the rock cake.=Si no cogiste la rock cake con ice gloves, mata a un icefiend para enfriar la rock cake.
Increased access to the Culinaromancer's Chest=Mayor acceso al Culinaromancer's Chest
Inspect the dwarf.=Inspecciona al enano.
Keep giving the dwarf drinks until he's drunk.=Sigue dando bebidas al enano hasta que esté borracho.
Keep talking to the dwarf until he's drunk and agrees to make the rock cake.=Sigue hablando con el enano hasta que esté borracho y acepte hacer la rock cake.
Kill an icefiend to cool the rock cake.=Mata a un icefiend para enfriar la rock cake.
Pick up the dwarven rock cake. If you have ice gloves, wear them to pick it up. Otherwise, wear other gloves or telegrab it. If it despawns you'll need to bring Rohak more ingredients.=Coge la dwarven rock cake. Si tienes ice gloves, llévalos puestos para cogerla. Si no, usa otros guantes o telegrab. Si desaparece, tendrás que llevar más ingredientes a Rohak.
Saving the Dwarf=Salvando al Dwarf
Talk to Kaylee in the pub in Falador.=Habla con Kaylee en el pub de Falador.
Talk to Rohak more.=Habla con Rohak de nuevo.
Use the dwarven rock cake on the dwarf.=Usa la dwarven rock cake en el enano.
You can buy them for 3 coins each from Kaylee during the quest=Puedes comprarlas por 3 monedas cada una a Kaylee durante la misión
You can buy this from the  Culinaromancer's Chest=Puedes comprarlo en el Culinaromancer's Chest
You can find a bowl in Lumbridge Castle's Basement and fill it in the nearby sink=Puedes encontrar un bowl en Lumbridge Castle's Basement y llenarlo en el fregadero cercano
You can use normal gloves/telekenetic grab instead, but you'll then need to kill an Ice Fiend=Puedes usar guantes normales o telekinetic grab en su lugar, pero entonces tendrás que matar a un Ice Fiend
You only need 120 if you wear a Ring of Charos(a)=Solo necesitas 120 si llevas un Ring of Charos(a)
Teleport to Taverley=Teletranspórtate a Taverley
Teleport to Falador=Teletranspórtate a Falador
Teleport to Lumbridge=Teletranspórtate a Lumbridge
