# Spanish translations for Fallen From Grace.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Any pickaxe=Cualquier pickaxe
Combat gear=Equipo de combate
Talk to Ffion to be allowed onto the island.=Habla con Ffion para que te permita entrar en la isla.
Talk to Cormac in Auchrie village on Wyrmscraig island.=Habla con Cormac en la aldea de Auchrie, en la isla de Wyrmscraig.
Talk to Muriel in the house north east of Cormac.=Habla con Muriel en la casa al noreste de Cormac.
Search the tent to the south east on the coast for a pickaxe.=Busca en la tienda al sureste de la costa un pico.
Search the tent to the south east on the coast for a hammer.=Busca en la tienda al sureste de la costa un martillo.
Search the tent to the south east on the coast for a chisel.=Busca en la tienda al sureste de la costa un cincel.
Search the tent to the south east on the coast for a pickaxe, hammer, and chisel.=Busca en la tienda al sureste de la costa un pico, un martillo y un cincel.
Inspect the sunstone monolith on the coast south east of Muriel.=Inspecciona el monolito de sunstone en la costa al sureste de Muriel.
Mine a sunstone fragment off the sunstone monolith.=Mina un fragmento de sunstone del monolito de sunstone.
Use a chisel on the sunstone fragment.=Usa un cincel en el fragmento de sunstone.
Investigate the large hat on a basalt column on the south west corner of the island.=Investiga el sombrero grande sobre una columna de basalto en la esquina suroeste de la isla.
Return to Cormac in Auchrie village on Wyrmscraig island.=Vuelve a hablar con Cormac en la aldea de Auchrie, en la isla de Wyrmscraig.
Sail into the cave on the south west of the island with either a skiff or a raft.=Navega hacia la cueva al suroeste de la isla con un esquife o una balsa.
Disembark onto the gangplank and talk to Mortimer.=Desembarca en la pasarela y habla con Mortimer.
Kill the 3 trolls near to Mortimer.=Mata a los 3 trolls cerca de Mortimer.
Talk to Mortimer again.=Habla con Mortimer de nuevo.
Investigate the broken golem in the far north of the cavern.=Investiga el gólem roto en el extremo norte de la caverna.
Use your sunstone core on the broken golem.=Usa tu sunstone core en el gólem roto.
Work out how to unlock the chest in the north west of the northern room.=Averigua cómo desbloquear el cofre en el noroeste de la sala norte.
Unlock the chest in the north west of the northern room. The code is 'RIGHT, LEFT, DOWN, DOWN'.=Desbloquea el cofre en el noroeste de la sala norte. El código es 'RIGHT, LEFT, DOWN, DOWN'.
Right-click destroy the ancient sunstone core.=Haz clic derecho para destruir el ancient sunstone core.
Climb the staircase, ready for the boss fight.=Sube las escaleras, preparado para la pelea contra el jefe.
Defeat the Mad Angel. Read the sidebar for more details.=Derrota al Mad Angel. Lee la barra lateral para más detalles.
Defeat the Mad Angel. Use Protect from Melee.=Derrota al Mad Angel. Usa Protect from Melee.
If she pulls her sword back slowly, run behind her.=Si echa la espada hacia atrás lentamente, corre detrás de ella.
If she charges a blue attack, protect from magic. If you activate it the tick it hits you, you get a guaranteed max hit on her next hit.=Si carga un ataque azul, protégete de magia. Si lo activas en el tick en que te alcanza, consigues un golpe máximo garantizado en su siguiente ataque.
If she launches a projectile at a tile, stand on the tile to bounce it back to her.=Si lanza un proyectil hacia una casilla, ponte en esa casilla para devolvérselo.
Search the body in the church.=Busca en el cuerpo dentro de la iglesia.
Read the final letter.=Lee la carta final.
Return to Cormac to finish the quest.=Vuelve con Cormac para terminar la misión.
Mad Angel (lvl 270)=Mad Angel (nivel 270)
3 Mountain Trolls (level 69)=3 Mountain Trolls (nivel 69)
Access to Mad Angel boss=Acceso al jefe Mad Angel
Access to Sunstone Golem Crafting & Mining=Acceso a la fabricación y minería de Sunstone Golem
Teleports to Wyrmscraig on the Slayer Ring and Necklace of Passage=Teletransportes a Wyrmscraig con el Slayer Ring y el Necklace of Passage
Investigating=Investigando
Below the church=Bajo la iglesia
