# Spanish translations for Clock Tower.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

Bucket of Water or a pair of ice gloves or smiths gloves(i)=Un cubo de agua o un par de ice gloves o smiths gloves(i)
There is a bucket spawn next to the well east of the Clock Tower. You can fill it on the well=Hay un bucket junto al pozo al este de la Clock Tower. Puedes llenarlo en el pozo
There's a bucket and a well and just next to brother cedric for the black cog=Hay un bucket y un pozo justo al lado de brother cedric para el black cog
Ardougne Cloak to teleport to monastery=Ardougne Cloak para teletransportarte al monasterio
Talk to Brother Kojo in the Clock Tower to start the quest.=Habla con Brother Kojo en la Clock Tower para empezar la misión.
Open your Quest Journal to sync your current state.=Abre tu Quest Journal para sincronizar tu estado actual.
Go through the south east door and pick up the red cog.=Cruza la puerta del sureste y coge el red cog.
Use the red cog on the red spindle.=Usa el red cog en el red spindle.
Get the bucket next to Brother Cedric, north of the monastery, and fill it up on the well next to it for the Black cog step. If you have other plans for the black cog, you can ignore this step by going down the nearby ladder.=Coge el bucket junto a Brother Cedric, al norte del monasterio, y llénalo en el pozo de al lado para el paso del Black cog. Si tienes otros planes para el black cog, puedes ignorar este paso bajando por la escalera cercana.
Follow the tunnel and push the wall at the end.=Sigue el túnel y empuja la pared al final.
Pick up the blue cog.=Coge el blue cog.
Use the blue cog on the blue spindle.=Usa el blue cog en el blue spindle.
Enter the north east door, and pick up the black cog with a bucket of water, alternatively you can equip ice gloves or smith gloves(i).=Entra por la puerta del noreste y coge el black cog con un bucket of water; alternativamente, puedes equiparte ice gloves o smith gloves(i).
Go through the north-western door.=Cruza la puerta del noroeste.
Pick up the rat poison in the north west of the dungeon.=Coge el rat poison en el noroeste de la mazmorra.
Pull the marked lever up.=Sube la palanca marcada.
Use the rat poison on the food trough. Wait till the rats have died.=Usa el rat poison en el food trough. Espera hasta que las ratas hayan muerto.
Go through the gate.=Cruza la puerta.
Pick up the white cog.=Coge el white cog.
Head up the ladder.=Sube por la escalera.
Enter the Clock Tower basement for the red cog.=Entra en el sótano de la Clock Tower para conseguir el red cog.
Climb down the ladder to the east of the Clock Tower, next to Brother Cedric.=Baja por la escalera al este de la Clock Tower, junto a Brother Cedric.
Enter the Clock Tower basement for the white cog.=Entra en el sótano de la Clock Tower para conseguir el white cog.
Enter the Clock Tower basement for the black cog.=Entra en el sótano de la Clock Tower para conseguir el black cog.
Place the blue cog on the peg on the first floor.=Coloca el blue cog en la clavija del primer piso.
Place the red cog on the peg on the ground floor.=Coloca el red cog en la clavija de la planta baja.
Place the black cog on the peg in the basement.=Coloca el black cog en la clavija del sótano.
Place the white cog on the peg on the second floor.=Coloca el white cog en la clavija del segundo piso.
Talk to Brother Kojo in the Clock Tower for your reward.=Habla con Brother Kojo en la Clock Tower para recibir tu recompensa.
Able to survive a hit or 2 from an Ogre (level 53)=Capaz de sobrevivir 1 o 2 golpes de un Ogre (nivel 53)
Getting Started=Empezando
Obtaining the red cog=Consiguiendo el red cog
Obtaining the blue cog=Consiguiendo el blue cog
Obtaining the black cog=Consiguiendo el black cog
Obtaining the white cog=Consiguiendo el white cog
Finishing off=Terminando
