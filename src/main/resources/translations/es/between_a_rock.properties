# Spanish translations for Between a Rock.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Rolad south of Ice Mountain=Puedes conseguir otro de Rolad al sur de Ice Mountain
You can buy one from Nulodion above the Dwarven Mine for 5 coins=Puedes comprar uno a Nulodion sobre la Dwarven Mine por 5 monedas
Travel to the Keldagrim south mines and talk to Dondakan there.=Viaja a las minas del sur de Keldagrim y habla con Dondakan allí.
Pay the Dwarven Ferryman 5 coins to travel across the water.=Paga 5 monedas al Dwarven Ferryman para cruzar el agua.
Talk to Dondakan in the north of the mine.=Habla con Dondakan en el norte de la mina.
Talk to the Dwarven Engineer in west Keldagrim.=Habla con el Dwarven Engineer en el oeste de Keldagrim.
Talk to Rolad at the Ice Mountain entrance to the Dwarven Mine. If you don't have an ammo mould, buy one from Nulodion whilst you're here.=Habla con Rolad en la entrada de Ice Mountain a la Dwarven Mine. Si no tienes un ammo mould, compra uno a Nulodion mientras estás aquí.
Enter the Dwarven Mine.=Entra en la Dwarven Mine.
Search the mine carts for a page.=Busca una página en las vagonetas de la mina.
Kill scorpions for a page.=Mata escorpiones para conseguir una página.
Mine low level rocks for a page.=Mina rocas de bajo nivel para conseguir una página.
Mine low level rocks for a page.\n\nYou can continue mining the same rocks.=Mina rocas de bajo nivel para conseguir una página.\n\nPuedes seguir minando las mismas rocas.
Go back up to Rolad.=Vuelve arriba con Rolad.
Talk to Rolad again.=Habla con Rolad de nuevo.
Read the entire dwarven lore book.=Lee el libro dwarven lore entero.
Return to Dondakan with the book and a gold bar.=Vuelve con Dondakan con el libro y un gold bar.
Use a gold bar on Dondakan.=Usa un gold bar en Dondakan.
Use a gold bar on a furnace to make a gold cannonball.=Usa un gold bar en un horno para hacer un gold cannonball.
Return to Dondakan with the book and the gold cannonball.=Vuelve con Dondakan con el libro y el gold cannonball.
Use a gold cannon ball on Dondakan.=Usa un gold cannon ball en Dondakan.
Talk to Dondakan.=Habla con Dondakan.
Read the last page of the dwarven lore book again for a base schematic.=Lee de nuevo la última página del libro dwarven lore para conseguir un base schematic.
Use 3 gold bars on an anvil to make a gold helmet.=Usa 3 gold bars en un yunque para hacer un gold helmet.
Talk to Khorvak under White Wolf Mountain.=Habla con Khorvak bajo White Wolf Mountain.
Assemble the schematics.=Ensambla los schematics.
Prepare for a fight, then return to Dondakan.=Prepárate para una pelea y luego vuelve con Dondakan.
Mine 6 gold ores. If you want the Avatar to be level 75 vs 125, get 15. Keep these in your inventory for the boss fight. Do not remove your gold helmet.=Mina 6 gold ores. Si quieres que el Avatar sea de nivel 75 en vez de 125, consigue 15. Mantenlas en tu inventario para la pelea contra el jefe. No te quites el gold helmet.
TALK to the central wall of flame.=HABLA con el muro de llamas central.
Kill the avatar. Make sure to keep the gold ores in your inventory.=Mata al avatar. Asegúrate de mantener las gold ores en tu inventario.
Talk to Dondakan to finish the quest.=Habla con Dondakan para terminar la misión.
Scorpion (level 14)=Scorpion (nivel 14)
Arzinian Being of Bordanzan (level 75 - 125)=Arzinian Being of Bordanzan (nivel 75 - 125)
Ability to Teleport to Dondakan's Rock using a Ring of Wealth.=Habilidad de teletransportarte a Dondakan's Rock usando un Ring of Wealth.
Access to Arzinian Mine.=Acceso a la Arzinian Mine.
Starting off=Empezando
Research=Investigación
Experiment=Experimento
Solving the schematic=Resolviendo el schematic
Into the hard place=En el lugar difícil
Click the highlighted boxes to move the pieces to the correct spots.=Haz clic en las casillas resaltadas para mover las piezas a sus posiciones correctas.
