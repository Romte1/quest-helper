# Spanish translations for Shilo Village.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You will NOT get this item back=NO recuperarás este objeto
Talk to Mosol Rei east of Shilo Village in south Karamja to receive a wampum belt.=Habla con Mosol Rei al este de Shilo Village, en el sur de Karamja, para recibir un wampum belt.
Show the wampum belt to Trufitus in Tai Bwo Wannai village.=Muestra el wampum belt a Trufitus en la aldea de Tai Bwo Wannai.
Use a spade on the ground in south east Karamja.=Usa una spade en el suelo en el sureste de Karamja.
Look at the mound of earth in south east Karamja.=Mira el montón de tierra en el sureste de Karamja.
Use a lit torch or candle on the fissure.=Usa un lit torch o candle en la grieta.
Use a rope on the fissure.=Usa una rope en la grieta.
Right-click search the fissure.=Haz clic derecho y busca en la grieta.
Search the nearby cave-in to go deeper in the caverns.=Busca en el derrumbe cercano para adentrarte más en las cavernas.
Search the loose rocks to the north for a tattered scroll.=Busca en las rocas sueltas al norte para conseguir un tattered scroll.
Search the old sacks to the east for a crumpled scroll.=Busca en los sacos viejos al este para conseguir un crumpled scroll.
Right-click search the gallows in the north east corner for a corpse.=Haz clic derecho y busca en la horca de la esquina noreste para conseguir un corpse.
Use Zadimus's corpse on Trufitus.=Usa el corpse de Zadimus en Trufitus.
Read the tattered scroll.=Lee el tattered scroll.
Read the crumpled scroll.=Lee el crumpled scroll.
Bury Zadimus's corpse in the middle of Tai Bwo Wannai.=Entierra el corpse de Zadimus en el centro de Tai Bwo Wannai.
Right-click search the rocks on Cairn Isle.=Haz clic derecho y busca en las rocas de Cairn Isle.
Right-click search the tomb dolmen to the south.=Haz clic derecho y busca en el tomb dolmen al sur.
Use a chisel on the pommel.=Usa un chisel en el pommel.
Use bronze wire on the beads.=Usa bronze wire en las beads.
Search the palm trees in the north east of Karamja. Come equipped for a boss fight.=Busca en las palmeras al noreste de Karamja. Ven equipado para una pelea contra un jefe.
Right-click search the carved doors behind the palm trees.=Haz clic derecho y busca en las puertas talladas tras las palmeras.
Use a chisel on the bone shard.=Usa un chisel en el bone shard.
Use the bone key on the doors behind the palm trees.=Usa la bone key en las puertas tras las palmeras.
Enter the doors behind the palm trees.=Entra en las puertas tras las palmeras.
Equip the beads of the dead, then make your way through the gate, down the rocks, then to the south west corner. Use bones on the door there.=Equipa las beads of the dead, luego avanza por la puerta, baja por las rocas y ve a la esquina suroeste. Usa bones en la puerta de allí.
Search the tomb dolmen, ready to fight.=Busca en el tomb dolmen, preparado para pelear.
Defeat Nazastarool's 3 forms. You can safe spot them over the tomb dolmen. The Crumble Undead spell is very strong against them.=Derrota a las 3 formas de Nazastarool. Puedes hacer safe spot sobre el tomb dolmen. El hechizo Crumble Undead es muy potente contra ellos.
Pickup Rashiliyia's corpse.=Recoge el corpse de Rashiliyia.
Right-click search the rocks on Cairn Isle to enter the caverns again.=Haz clic derecho y busca en las rocas de Cairn Isle para entrar de nuevo en las cavernas.
Use Rashiliyia's corpse on the dolmen to the south.=Usa el corpse de Rashiliyia en el dolmen al sur.
Nazastarool 3 times (levels 68, 91, 93) (safespottable)=Nazastarool 3 veces (niveles 68, 91, 93) (se puede hacer safe spot)
Access to Shilo Village=Acceso a Shilo Village
Ability to mine gem rocks in Shilo Village=Habilidad de minar gem rocks en Shilo Village
Exploring=Explorando
Free Rashiliyia=Liberar a Rashiliyia
A quick teleport for escaping=Un teleport rápido para escapar
Crumble undead spell for final boss=Hechizo Crumble undead para el jefe final
