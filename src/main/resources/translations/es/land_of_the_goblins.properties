# Spanish translations for Land of the Goblins.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Watch the cutscene.=Mira la escena.
Enter the Lumbridge Castle basement.=Entra en el sótano del Lumbridge Castle.
Travel with Kazgar to shortcut to Mistag.=Viaja con Kazgar para llegar antes a Mistag.
Enter the city of Dorgesh-Kaan.=Entra en la ciudad de Dorgesh-Kaan.
Talk to Zanik in Oldak's lab.=Habla con Zanik en el laboratorio de Oldak.
Enter the Goblin Cave next to the Fishing Guild.=Entra en la Goblin Cave junto al Fishing Guild.
Talk to Zanik and get her to follow you.=Habla con Zanik y haz que te siga.
Talk to the goblin guard in the northwest of the cave.=Habla con el guardia goblin del noroeste de la cueva.
Talk to the Makeover Mage southwest of Falador.=Habla con la Makeover Mage al suroeste de Falador.
Pick some Pharmakos berries from the bushes outside.=Coge algunas Pharmakos berries de los arbustos de fuera.
Use the pharmakos berries on the unfinished toadflax potion.=Usa las pharmakos berries en la toadflax potion (unf).
Go back to the Goblin Cave outside the Fishing Guild.=Vuelve a la Goblin Cave junto al Fishing Guild.
Pick some black mushrooms and use it on a vial to make black dye.=Coge algunas black mushrooms y úsalas en un vial para hacer black dye.
Make black dye by using the blackmushrooms on a vial.=Haz black dye usando las black mushrooms en un vial.
Go to the area outside the temple near the guards.=Ve a la zona de fuera del templo, cerca de los guardias.
Drink the goblin potion.=Bebe la goblin potion.
Confirm to become a goblin. Your selection doesn't matter.=Confirma para convertirte en goblin. Tu elección no importa.
Talk to the goblin guard to enter the temple. If you want, you can tell them to guess your name until you get one you like.=Habla con el guardia goblin para entrar en el templo. Si quieres, puedes pedirle que adivine tu nombre hasta que salga uno que te guste.
Search the crate by the entrance for some goblin mail.=Busca en la caja de la entrada para conseguir goblin mail.
Use the black dye on the goblin mail.=Usa el black dye en la goblin mail.
Pass by the guard to the northeastern room. WARNING: If you teleport away with a full inventory and while wearing the goblin mail, it will be DESTROYED.=Pasa junto al guardia a la sala noreste. ADVERTENCIA: si te teletransportas con el inventario lleno y llevando la goblin mail puesta, se DESTRUIRÁ.
Pass by the guard to the northeastern room again.=Pasa junto al guardia a la sala noreste de nuevo.
Search the crate for a Dorgesh-Kaan sphere.=Busca en la caja una Dorgesh-Kaan sphere.
Talk to Zanik in the cell.=Habla con Zanik en la celda.
Pass by the guard to leave the northeastern room.=Pasa junto al guardia para salir de la sala noreste.
Talk to High Priest Bighead. When prompted, answer in this order: True, False, False.=Habla con High Priest Bighead. Cuando te pregunte, responde en este orden: True, False, False.
Go back to the Goblin Cave outside the Fishing Guild, ready for fighting.=Vuelve a la Goblin Cave junto al Fishing Guild, preparado para luchar.
Pickpocket a key from the priest.=Roba una llave al sacerdote.
Talk to Aggie in Draynor Village.=Habla con Aggie en Draynor Village.
Go to Hemenster to catch a whitefish.=Ve a Hemenster para pescar un whitefish.
Catch a Hemenster whitefish.=Pesca un Hemenster whitefish.
Bring the whitefish and black goblin mail to Aggie.=Lleva el whitefish y la black goblin mail a Aggie.
Enter the temple.=Entra en el templo.
Use the yellow dye on your goblin mail. It is safe to unequip the goblin mail inside the enclave, you will be thrown out to the center area.=Usa el yellow dye en tu goblin mail. Es seguro quitarte la goblin mail dentro del enclave; te expulsarán a la zona central.
Use the blue dye on your goblin mail. It is safe to unequip the goblin mail inside the enclave, you will be thrown out to the center area.=Usa el blue dye en tu goblin mail. Es seguro quitarte la goblin mail dentro del enclave; te expulsarán a la zona central.
Use the orange dye on your goblin mail. It is safe to unequip the goblin mail inside the enclave, you will be thrown out to the center area.=Usa el orange dye en tu goblin mail. Es seguro quitarte la goblin mail dentro del enclave; te expulsarán a la zona central.
Use the purple dye on your goblin mail. It is safe to unequip the goblin mail inside the enclave, you will be thrown out to the center area.=Usa el purple dye en tu goblin mail. Es seguro quitarte la goblin mail dentro del enclave; te expulsarán a la zona central.
Pass by the guard to enter the western area.=Pasa junto al guardia para entrar en la zona oeste.
Pass by the guard to enter the north-western area.=Pasa junto al guardia para entrar en la zona noroeste.
Pass by the guard to enter the eastern area.=Pasa junto al guardia para entrar en la zona este.
Pass by the guard to enter the south-eastern area.=Pasa junto al guardia para entrar en la zona sureste.
Pass by the guard to enter the south-western area.=Pasa junto al guardia para entrar en la zona suroeste.
Pickpocket the priest in the western room for the Saragorak key.=Roba al sacerdote de la sala oeste para conseguir la Saragorak key.
Pickpocket the priest in the north-western room for the Yurkolgokh key.=Roba al sacerdote de la sala noroeste para conseguir la Yurkolgokh key.
Pickpocket the priest in the eastern room for the Ekeleshuun key.=Roba al sacerdote de la sala este para conseguir la Ekeleshuun key.
Pickpocket the priest in the south-eastern room for the Narogoshuun key.=Roba al sacerdote de la sala sureste para conseguir la Narogoshuun key.
Pickpocket the priest in the south-western room for the Horogothgar key.=Roba al sacerdote de la sala suroeste para conseguir la Horogothgar key.
Unlock the door using the 6 keys. You may leave to gear up after unlocking it.=Abre la puerta usando las 6 llaves. Puedes irte a equiparte después de abrirla.
Enter the crypt.=Entra en la cripta.
Say Snothead's name at the south-west grave.=Di el nombre de Snothead en la tumba suroeste.
Say Snailfeet's name at the south-east grave.=Di el nombre de Snailfeet en la tumba sureste.
Say Mosschin's name at the north-west grave.=Di el nombre de Mosschin en la tumba noroeste.
Say Redeyes's name at the north-east grave.=Di el nombre de Redeyes en la tumba noreste.
Say Strongbones's name at the north grave.=Di el nombre de Strongbones en la tumba norte.
Defeat Snothead. He attacks using melee.=Derrota a Snothead. Ataca con melee.
Defeat Snailfeet. He attacks using melee and range.=Derrota a Snailfeet. Ataca con melee y range.
Defeat Mosschin. He attacks using melee and magic.=Derrota a Mosschin. Ataca con melee y magia.
Defeat Redeyes. He attacks using melee and magic, and lowers your attack, strength, and defence.=Derrota a Redeyes. Ataca con melee y magia, y reduce tu attack, strength y defence.
Defeat Strongbones. He attacks using all 3 combat styles, lowers your attack, strength and defence. Ignore the level 29 Skoblins he spawns.=Derrota a Strongbones. Ataca con los 3 estilos de combate y reduce tu attack, strength y defence. Ignora a los Skoblins de nivel 29 que invoca.
Talk to Snothead to learn the name of the next priest.=Habla con Snothead para saber el nombre del siguiente sacerdote.
Talk to Snailfeet to learn the name of the next priest.=Habla con Snailfeet para saber el nombre del siguiente sacerdote.
Talk to Mosschin to learn the name of the next priest.=Habla con Mosschin para saber el nombre del siguiente sacerdote.
Talk to Redeyes to learn the name of the next priest.=Habla con Redeyes para saber el nombre del siguiente sacerdote.
Talk to Strongbones to learn where Yu'biusk is.=Habla con Strongbones para saber dónde está Yu'biusk.
Talk to Oldak in his workshop.=Habla con Oldak en su taller.
If you have access to fairy rings, travel to AJQ. Otherwise, climb the stairs in south Dorgesh-Kaan.=Si tienes acceso a los fairy rings, viaja a AJQ. Si no, sube las escaleras del sur de Dorgesh-Kaan.
Climb up the stairs to the south to enter the Dorgesh-Kaan cave.=Sube las escaleras del sur para entrar en la cueva de Dorgesh-Kaan.
Climb down the ladder to the west.=Baja la escalera de mano del oeste.
Talk to Oldak near the machine at the fairy ring in the the caves south of Dorgesh-Kaan.=Habla con Oldak junto a la máquina del fairy ring en las cuevas al sur de Dorgesh-Kaan.
Fix the machine.=Arregla la máquina.
Set the first value to 9.=Pon el primer valor en 9.
Set the second value to 4.=Pon el segundo valor en 4.
Set the first value to 4.=Pon el primer valor en 4.
Set the first value to 1.=Pon el primer valor en 1.
Talk to Oldak to return to Yu'Biusk.=Habla con Oldak para volver a Yu'Biusk.
Walk up to the strange box and watch the cutscene. Quest complete!=Acércate a la caja extraña y mira la escena. ¡Misión completada!
Return to the goblin temple with all the dyes and some combat gear.=Vuelve al templo goblin con todos los tintes y algo de equipo de combate.
Return to the goblin temple with some combat gear.=Vuelve al templo goblin con algo de equipo de combate.
Talk to Grubfoot in the Dorgeshuun Mines.=Habla con Grubfoot en las Dorgeshuun Mines.
Return to Dorgesh-Kaan and speak to Oldak.=Vuelve a Dorgesh-Kaan y habla con Oldak.
If you have access to fairy rings, travel to AJQ. Otherwise, return to Dorgesh-Kaan.=Si tienes acceso a los fairy rings, viaja a AJQ. Si no, vuelve a Dorgesh-Kaan.
Black mushrooms obtainable during quest - bring empty vial and pestle and mortar=Las black mushrooms se pueden conseguir durante la misión: lleva un vial vacío y pestle and mortar.
If using an extinguishable light source=Si usas una fuente de luz que se puede apagar.
For transportation via fairy rings=Para transportarte con fairy rings.
Inventory space to unequip all your items=Espacio en el inventario para desequiparte todos los objetos.
No equipped items=Sin objetos equipados.
No pet following you=Sin mascota siguiéndote.
