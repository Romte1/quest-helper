# Spanish translations for Spirits of the Elid.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Costume needle cannot be used as a substitute.=No puedes usar una costume needle como sustituto.
Short bow obtainable during quest east of the cave entrance=Puedes conseguir un short bow durante la misión al este de la entrada de la cueva
Bronze arrows obtainable during quest south of cave entrance=Puedes conseguir bronze arrows durante la misión al sur de la entrada de la cueva
Speak to Awusah the Mayor in Nardah.=Habla con Awusah the Mayor en Nardah.
Speak to Ghaslor the Elder, just north of Awusah.=Habla con Ghaslor the Elder, justo al norte de Awusah.
Open and search the cupboard in the north-west corner of the house that is north of the fountain.=Abre y busca en el armario de la esquina noroeste de la casa que está al norte de la fuente.
Use the needle and thread on the torn robes (both top and bottom).=Usa la needle y el thread en las torn robes (tanto la parte de arriba como la de abajo).
Cast the Telekinetic Grab spell on the ancestral key on the table.=Lanza el hechizo Telekinetic Grab sobre la ancestral key de la mesa.
Use the rope on the root to enter the cave north-west of Nardah where the river turns into a waterfall.=Usa la rope en la raíz para entrar en la cueva al noroeste de Nardah, donde el río se convierte en una cascada.
Equip the Robes of Elidinis and use the ancestral key on the door.=Equípate las Robes of Elidinis y usa la ancestral key en la puerta.
Open the door to the south and fight the White Golem (level-75).  You can only damage the Golem with the stab attack style.=Abre la puerta del sur y lucha contra el White Golem (nivel 75).  Solo puedes dañar al Golem con el estilo de ataque stab.
Open the southern door again.=Abre la puerta del sur de nuevo.
Clear the Water Channel then leave the room.=Despeja el Water Channel y luego sal de la sala.
Open the door to the east and fight the Grey Golem (level-75).  You can only damage the Golem with the slash attack style.=Abre la puerta del este y lucha contra el Grey Golem (nivel 75).  Solo puedes dañar al Golem con el estilo de ataque slash.
Open the eastern door again.=Abre la puerta del este de nuevo.
Open the door to the north-east and fight the Black Golem (level-75).  You can only damage the Golem with the crush attack style.=Abre la puerta del noreste y lucha contra el Black Golem (nivel 75).  Solo puedes dañar al Golem con el estilo de ataque crush.
Open the north-eastern door again.=Abre la puerta del noreste de nuevo.
Clear the Water Channel by shooting the target then leave the room.=Despeja el Water Channel disparando al objetivo y luego sal de la sala.
Open the door to the north near the lake.=Abre la puerta del norte, junto al lago.
Talk to the Water Spirits on the north side of the lake.=Habla con los Water Spirits en el lado norte del lago.
Return to Nardah and speak to Awusah the Mayor.=Vuelve a Nardah y habla con Awusah the Mayor.
Take the shoes near the doorway then leave Awusah's house.=Coge los shoes que están junto a la puerta y luego sal de la casa de Awusah.
Leave Awusah's home.=Sal de la casa de Awusah.
Use a knife on the shoes to cut out the sole.=Usa un knife en los shoes para cortar la sole.
Enter the crevice to the west of Nardah.=Entra en la grieta al oeste de Nardah.
Talk to the Genie in the Crevice.=Habla con el Genie en la Crevice.
Talk to the Genie again with the sole.=Habla con el Genie de nuevo con la sole.
Return to Nardah and use the statuette on the statuette plinth in the northern house.=Vuelve a Nardah y usa la statuette en el pedestal de la casa del norte.
Black Golem, Grey Golem, White Golem (Level 75)=Black Golem, Grey Golem, White Golem (nivel 75)
Access to Nardah's Fountain and Shrine=Acceso a la Fountain y el Shrine de Nardah
Starting Off=Empezando
The Golems=Los golems
The Genie=El genie
Crush Weapon Style=Estilo de arma contundente
Stab Weapon Style=Estilo de arma de estocada
Slash Weapon Style=Estilo de arma cortante
Arrows for bow=Arrows para el bow
Coins for magic carpet=Coins para la alfombra mágica
Spear or Hasta for the 3 weapon styles=Spear o Hasta para los 3 estilos de arma

Light source=Una fuente de luz
Any Pickaxe=Cualquier pickaxe
Any bow=Cualquier bow
Combat Gear=Equipo de combate
Food=Comida
