# Spanish translations for The Mage Arena.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Runes for fighting Kolodion=Runas para luchar contra Kolodion
Knife or sharp weapon to cut through a web=Cuchillo o arma afilada para cortar una web
Pull the lever in the building north of the Mage Arena. This is IN THE WILDERNESS, so don't bring anything you don't want to lose.=Tira de la palanca en el edificio al norte de la Mage Arena. Esto está EN EL WILDERNESS, así que no lleves nada que no quieras perder.
Talk to Kolodion, ready for fighting him in the Mage Arena.=Habla con Kolodion, listo para luchar contra él en la Mage Arena.
Defeat Kolodion's various forms.=Derrota las distintas formas de Kolodion.
Enter the sparkling pool.=Entra en el estanque brillante.
Pray at the statue of the god whose cape you want. Pick up the cape which appears.=Reza en la estatua del dios cuya capa quieras. Recoge la capa que aparezca.
Talk to the Chamber Guardian for your staff.=Habla con el Chamber Guardian para conseguir tu staff.
Kolodion in 5 forms, up to level 112=Kolodion en 5 formas, hasta nivel 112
This miniquest is in deep Wilderness. Don't bring anything you're not willing to risk! It's recommended to turn off player attack options to avoid potentially getting skulled.=Esta miniquest se desarrolla en lo más profundo del Wilderness. ¡No lleves nada que no estés dispuesto a arriesgar! Se recomienda desactivar las opciones de ataque a jugadores para evitar que te pongan la calavera.
Ability to unlock 3 new God Spells.=Habilidad de desbloquear 3 nuevos God Spells.
Getting to the Mage Arena=Llegar a la Mage Arena
Defeating Kolodion=Derrotar a Kolodion
Getting your rewards=Conseguir tus recompensas
