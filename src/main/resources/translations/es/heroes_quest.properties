# Spanish translations for Heroes' Quest.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Achietties outside the Heroes' Guild, south of Burthorpe.=Habla con Achietties fuera del Heroes' Guild, al sur de Burthorpe.
You need to get an oily rod. Talk to Gerrant in Port Sarim to get some slime.=Necesitas conseguir una oily rod. Habla con Gerrant en Port Sarim para conseguir slime.
Combine the harralander potion (unf) with the blamish snail slime.=Combina la harralander potion (unf) con la blamish snail slime.
Use the Blamish oil on your fishing rod.=Usa el Blamish oil en tu fishing rod.
Go to Taverley Dungeon. As you're 70 Agility, you don't need a dusty key.=Ve a la Taverley Dungeon. Como tienes 70 de Agility, no necesitas una dusty key.
Go to Taverley Dungeon. Bring a dusty key if you have one, otherwise you can get one in the dungeon.=Ve a la Taverley Dungeon. Lleva una dusty key si tienes una; si no, puedes conseguirla en la mazmorra.
Squeeze through the obstacle pipe.=Pasa por el obstacle pipe.
Travel through Taverley Dungeon until you reach the Black Knights' Base. Kill the Jailer in the east side of the base for a jail key.=Recorre la Taverley Dungeon hasta llegar a la Black Knights' Base. Mata al Jailer en el lado este de la base para conseguir una jail key.
Use the jail key on the south door and talk to Velrak for a dusty key.=Usa la jail key en la puerta sur y habla con Velrak para conseguir una dusty key.
Enter the gate to the deeper Taverley dungeon.=Entra por la puerta a la parte profunda de la Taverley dungeon.
Fish a lava eel from the lava south of the blue dragons.=Pesca un lava eel en la lava al sur de los blue dragons.
Cook the Lava Eel at a range. You cannot fail this.=Cocina el Lava Eel en un range. No puedes fallar.
Talk to Katrine at the Black Arm Gang base in South west Varrock.=Habla con Katrine en la base de la Black Arm Gang, al suroeste de Varrock.
Try to enter the house in east Brimhaven.=Intenta entrar en la casa al este de Brimhaven.
Talk to Trobert inside.=Habla con Trobert dentro.
Equip your black armour and enter the mansion in the north west of Brimhaven.=Equipa tu armadura negra y entra en la mansión al noroeste de Brimhaven.
Talk to Grip.=Habla con Grip.
Get a miscellaneous key from Grip then give it to your partner. Once you've done that, wait for your partner to enter the north east room of the mansion.After that, search the cupboard in the north room to lure Grip there. Your partner should kill them.=Consigue una miscellaneous key de Grip y dásela a tu compañero. Cuando lo hayas hecho, espera a que tu compañero entre en la sala noreste de la mansión.Después, registra el armario de la sala norte para atraer a Grip. Tu compañero debería matarlo.
Pick up Grip's keyring=Coge el keyring de Grip
Use Grip's keyring on the treasure room door.=Usa el keyring de Grip en la puerta de la treasure room.
Search the chest in the treasure room for two candlesticks.=Busca en el cofre de la treasure room dos candlesticks.
Give one of Pete's candlesticks to your partner. Afterwards, return to Katrine with Pete's candlestick=Dale uno de los candlesticks de Pete a tu compañero. Después, vuelve con Katrine con el candlestick de Pete
Head into the Phoenix Gang's base in south Varrock.=Entra en la base de la Phoenix Gang, al sur de Varrock.
Talk to Straven.=Habla con Straven.
Talk to Alfonse the Waiter in the restaurant in Brimhaven.=Habla con Alfonse the Waiter en el restaurante de Brimhaven.
You'll need your partner to give you a miscellaneous key.=Necesitarás que tu compañero te dé una miscellaneous key.
Talk to Charlie the Cook in the back of the restaurant.=Habla con Charlie the Cook en la parte trasera del restaurante.
Push the wall to enter Pete's garden.=Empuja la pared para entrar en el jardín de Pete.
Use the misc key on the door to the north west.=Usa la misc key en la puerta al noroeste.
Wait for your partner to lure Grip into the room next to yours, and kill him with magic/ranged. Afterwards, trade your partner for a candlestick.=Espera a que tu compañero atraiga a Grip a la sala contigua y mátalo con magia/ranged. Después, comercia con tu compañero para conseguir un candlestick.
Get your candlestick from your partner.=Consigue tu candlestick de tu compañero.
Bring the candlestick back to Straven.=Lleva el candlestick de vuelta a Straven.
Head to White Wolf Mountain, and mine a rockslide in the northern part.=Ve a White Wolf Mountain y pica un rockslide en la parte norte.
Take the south east ladder down.=Baja por la escalera del sureste.
Follow the tunnel south, then go up the ladder there.=Sigue el túnel hacia el sur y luego sube por la escalera.
Take the east ladder down.=Baja por la escalera del este.
Follow the path around until you reach a ladder, then climb it.=Sigue el camino hasta llegar a una escalera y súbela.
Take the north ladder down.=Baja por la escalera del norte.
Kill the Ice Queen for ice gloves.=Mata a la Ice Queen para conseguir los ice gloves.
Pick up the ice gloves.=Coge los ice gloves.
Travel to Entrana with the monks in Port Sarim.=Viaja a Entrana con los monjes de Port Sarim.
Kill the entrana firebird on the north of Entrana.=Mata al entrana firebird en el norte de Entrana.
Pick up the fire feather.=Coge la fire feather.
Bring Achietties all the items to finish.=Lleva todos los objetos a Achietties para terminar.
You can get another from Katrine in the Black Arm Gang base.=Puedes conseguir otra de Katrine en la base de la Black Arm Gang.
You can get another from Straven in the Phoenix Gang base.=Puedes conseguir otra de Straven en la base de la Phoenix Gang.
You can get another from Trobert in the building in east Brimhaven.=Puedes conseguir otros de Trobert en el edificio al este de Brimhaven.
Ice Queen (level 111) for ice gloves=Ice Queen (nivel 111) para los ice gloves
Entrana firebird (level 2)=Entrana firebird (nivel 2)
Grip (level 26)=Grip (nivel 26)
Access to the Hero's Guild.=Acceso al Hero's Guild.
Ability to use the Fountain of Rune.=Habilidad de usar la Fountain of Rune.
Ability to use Charge Dragonstone Jewellery scrolls.=Habilidad de usar los pergaminos Charge Dragonstone Jewellery.
Ability to purchase and equip Dragon Battleaxes and Maces.=Habilidad de comprar y equipar Dragon Battleaxes y Maces.
You will need to find another player who joined the Phoenix Gang during the Shield of Arrav quest to assist you. If one of you is an Ironman, you can use the necessary items on one another to trade them.=Necesitarás encontrar a otro jugador que se uniera a la Phoenix Gang durante la misión Shield of Arrav para que te ayude. Si uno de vosotros es Ironman, puede usar los objetos necesarios sobre el otro para intercambiarlos.
You will need to find another player who joined the Black Arm Gang during the Shield of Arrav quest to assist you. If one of you is an Ironman, you can use the necessary items on one another to trade them.=Necesitarás encontrar a otro jugador que se uniera a la Black Arm Gang durante la misión Shield of Arrav para que te ayude. Si uno de vosotros es Ironman, puede usar los objetos necesarios sobre el otro para intercambiarlos.
Start the quest=Empieza la misión
Get the Lava Eel=Consigue el Lava Eel
Get thieves' armband=Consigue el thieves' armband
Get ice gloves=Consigue los ice gloves
Get fire feather=Consigue la fire feather
Finish off=Termina
Weapons, armour and food for the Ice Queen=Weapons, armour y food para la Ice Queen
Brimhaven teleport, or travel by boat from Ardougne/Port Sarim for 30gp=Brimhaven teleport, o viaja en barco desde Ardougne/Port Sarim por 30gp
