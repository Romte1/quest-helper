# Spanish translations for Recipe for Disaster: Monkey Ambassador.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Kill a gorilla in the monkey temple for their bones, and make a greegree from them=Mata a un gorilla en el monkey temple para conseguir sus huesos y fabrica un greegree con ellos
Kill a monkey archer in the monkey market for its bones and make a greegree from them=Mata a un monkey archer en el monkey market para conseguir sus huesos y fabrica un greegree con ellos
Kill a zombie monkey under the monkey temple and make a greegree from them=Mata a un zombie monkey bajo el monkey temple y fabrica un greegree con ellos
You can buy some from Solihib in the monkey market=Puedes comprar algunas a Solihib en el monkey market
Combat gear=Equipo de combate
Go inspect Awowogei in Lumbridge Castle.=Ve a inspeccionar a Awowogei en Lumbridge Castle.
Inspect Awowogei.=Inspecciona a Awowogei.
Talk to Awowogei on Ape Atoll.=Habla con Awowogei en Ape Atoll.
Talk to the three monkeys sat in the temple.=Habla con los tres monos sentados en el templo.
Use a banana on the one of the three monkeys.=Usa un banana en uno de los tres monos.
Use some monkey nuts on the one of the three monkeys.=Usa algunas monkey nuts en uno de los tres monos.
Travel to Crash Island with Lumdo.=Viaja a Crash Island con Lumdo.
Enter the hole on Crash Island. Protect melee when entering as you'll be attacked straight away by snakes.=Entra en el agujero de Crash Island. Activa Protect from Melee al entrar, ya que las serpientes te atacarán de inmediato.
Kill a Big Snake for its corpse. Kill a few in case you burn it.=Mata a una Big Snake para conseguir su cadáver. Mata varias por si lo quemas.
Leave the hole.=Sal del agujero.
Travel back to Ape Atoll with Lumdo.=Vuelve a Ape Atoll con Lumdo.
Use a rope on the red banana tree on the north west of Ape Atoll as a gorilla.=Usa una rope en el red banana tree del noroeste de Ape Atoll siendo un gorila.
Go around the monkey agility course until you reach a hole, and go down it.=Recorre el monkey agility course hasta llegar a un agujero y baja por él.
Take a nut from the bush.=Coge una nut del arbusto.
Use a pestle and mortar on the tchiki nuts. Get more tchiki nut paste as desired in case you burn the final meal.=Usa un pestle and mortar en las tchiki nuts. Consigue más tchiki nut paste si quieres, por si quemas el plato final.
Use a knife/slash weapon on the red banana. Get more sliced red bananas as desired in case you burn the final meal.=Usa un knife o un arma de corte en la red banana. Consigue más sliced red bananas si quieres, por si quemas el plato final.
Use the paste on the snake to stuff it.=Usa la paste en la snake para rellenarla.
Enter the trapdoor in the monkey temple.=Entra en la trapdoor del monkey temple.
Enter the hole just under where you entered.=Entra en el agujero justo debajo de donde entraste.
Go across the hot rocks with the zombie greegree equipped. Cook the stuffed snake on the rock at the end of the room.=Cruza las rocas calientes con el zombie greegree equipado. Cocina la stuffed snake en la roca del final de la sala.
Go give the snake to Awowogei to finish the quest.=Ve a entregar la snake a Awowogei para terminar la misión.
Give the snake to Awowogei to finish the quest.=Entrega la snake a Awowogei para terminar la misión.
Big Snake (level 84)=Big Snake (nivel 84)
If you need the greegrees still, a zombie, ninja, and guard monkey=Si aún necesitas los greegrees, un zombie, ninja y guard monkey
If you don't have the ninja/gorilla/zombie greegrees ready, it's recommended you get them all in a single run to Zooknock to save time.=Si no tienes los ninja/gorilla/zombie greegrees preparados, se recomienda conseguirlos todos en una sola visita a Zooknock para ahorrar tiempo.
Ability to teleport to Ape Atoll=Habilidad de teletransportarse a Ape Atoll
Increased access to the Culinaromancer's Chest=Mayor acceso al Culinaromancer's Chest
Starting off=Empezando
Saving Awowogei=Salvando a Awowogei
