Access to the Werewolf Agility Course=Acceso a la Werewolf Agility Course
Starting off=Empezando
Graverobbing=Saqueo de tumbas
Getting tools=Consiguiendo herramientas
Attracting lightning=Atrayendo el rayo
Facing the monster=Enfrentando al monstruo
Finishing off=Finalizando
