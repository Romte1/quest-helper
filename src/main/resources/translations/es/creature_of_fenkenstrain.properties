Teleport to any furnace such as glory for Edgeville teleport, Ectophial to Port Phasmatys or a Falador teleport=Teleport a cualquier furnace, como glory para el teleport a Edgeville, Ectophial a Port Phasmatys o un Falador teleport
33 Magic and runes to cast telegrab, or 50 coins=33 de Magic y runas para lanzar telegrab, o 50 coins
