# Spanish translations for Creature of Fenkenstrain.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Costume needle cannot be used as a substitute=El Costume needle no se puede usar como sustituto
Head to the Canifis bar and either buy the pickled brain for 50 coins, or telegrab it.=Ve al bar de Canifis y compra el pickled brain por 50 coins, o usa telegrab para cogerlo.
Talk to Dr. Fenkenstrain to start the quest.=Habla con Dr. Fenkenstrain para empezar la misión.
Go up the staircase to grab the items you will need.=Sube por la escalera para coger los objetos que necesitarás.
Search the nearby bookcase for Handy Maggot Avoidance Techniques.=Busca en la estantería cercana Handy Maggot Avoidance Techniques.
Search the west bookcase for The Joy of Grave Digging.=Busca en la estantería del oeste The Joy of Grave Digging.
Combine the two amulet by using one on the other.=Combina los dos amuletos usando uno sobre el otro.
Go back to the ground floor.=Vuelve a la planta baja.
Talk to the Gardener Ghost while wearing your Ghostspeak amulet.=Habla con el Gardener Ghost mientras llevas puesto tu Ghostspeak amulet.
Go to the grave of the gardener and dig for his head.=Ve a la tumba del gardener y cava para encontrar su cabeza.
Use the decapitated head on the pickled brain to create a decapitated head.=Usa la decapitated head en el pickled brain para crear una decapitated head.
Use the Star Amulet on the memorial and push it to go in the caves.=Usa el Star Amulet en el memorial y empújalo para entrar en las cuevas.
Push the memorial south east of the castle.=Empuja el memorial al sureste del castillo.
Kill the level 51 Experiment north-west of the ladder to get a key.=Mata al Experiment de nivel 51 al noroeste de la escalera para conseguir una key.
Pick up the key.=Recoge la key.
Leave the caves by going north-west, be sure to pick up the key from the level 51 experiment.=Sal de las cuevas yendo al noroeste; asegúrate de recoger la key del Experiment de nivel 51.
Use your spade on this tile to get the torso.=Usa tu spade en esta casilla para conseguir el torso.
Use your spade on this tile to get arms.=Usa tu spade en esta casilla para conseguir los arms.
Use your spade on this tile to get legs.=Usa tu spade en esta casilla para conseguir las legs.
Deliver the body parts to Dr. Fenkenstrain, use a teleport to Fenkenstrain's castle or run back through the caves.=Entrega las body parts al Dr. Fenkenstrain; usa un teleport a Fenkenstrain's castle o vuelve corriendo por las cuevas.
Get a needle and 5 threads and deliver them to Dr. Fenkenstrain.=Consigue una needle y 5 threads y entrégalos al Dr. Fenkenstrain.
Talk to the Gardener Ghost and ask for the shed key.=Habla con el Gardener Ghost y pídele la shed key.
Open the cupboard and search it for a brush.=Abre el armario y búscalo para encontrar un brush.
Grab 3 canes from the pile.=Coge 3 canes del montón.
Use 3 canes on the brush one at a time.=Usa 3 canes en el brush, una a una.
Go up to the second floor of the castle.=Sube al segundo piso del castillo.
Use the extended brush on the fireplace to get the conductor mould.=Usa el extended brush en la chimenea para conseguir el conductor mould.
Go to any furnace make a lightning rod.=Ve a cualquier furnace y fabrica un lightning rod.
Return to the castle and go upstairs.=Vuelve al castillo y sube.
Go up to the third floor using the ladder in the middle of the castle.=Sube al tercer piso usando la escalera de mano en el centro del castillo.
Repair the lightning Conductor.=Repara el lightning Conductor.
Go back to the first floor of the castle and talk to Dr. Fenkenstrain.=Vuelve al primer piso del castillo y habla con el Dr. Fenkenstrain.
Go up to the second floor to confront Fenkenstrain's monster.=Sube al segundo piso para enfrentarte al monstruo de Fenkenstrain.
Use the Tower Key on the door.=Usa la Tower Key en la puerta.
Go up the ladder.=Sube por la escalera de mano.
Talk to Fenkenstrain's monster.=Habla con el monstruo de Fenkenstrain.
Go back to Dr. Fenkenstrain, instead of talking to him right click and pickpocket him.=Vuelve con el Dr. Fenkenstrain; en lugar de hablar con él, haz clic derecho y roba en sus bolsillos.
