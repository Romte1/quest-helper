# Spanish translations for Priest in Peril.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Speak to King Roald in Varrock Castle.=Habla con King Roald en el Varrock Castle.
Go to the temple east of Varrock by the river and click on the large door.=Ve al templo al este de Varrock, junto al río, y haz clic en la puerta grande.
Go down the ladder north of the temple.=Baja por la escalera de mano al norte del templo.
Kill the Temple Guardian (level 30). It is immune to magic so you will need to use either ranged or melee.=Mata al Temple Guardian (nivel 30). Es inmune a la magia, así que tendrás que usar ranged o melé.
Climb back up the ladder and return to King Roald.=Sube de nuevo por la escalera de mano y vuelve con King Roald.
Return to King Roald.=Vuelve con King Roald.
Return to the temple.=Vuelve al templo.
Kill a Monk of Zamorak (level 30) for a golden key. You can safespot using the pews.=Mata a un Monk of Zamorak (nivel 30) para conseguir una golden key. Puedes safespotear usando las bancas.
Go upstairs.=Sube las escaleras.
Climb up the ladder.=Sube por la escalera de mano.
Talk to Drezel on the top floor of the temple.=Habla con Drezel en el último piso del templo.
Use the bucket on the well in the central room.=Usa el bucket en el pozo de la sala central.
Go to the central room, and study the monuments to find which has a key on it. Use the Golden Key on it.=Ve a la sala central y examina los monumentos para ver cuál tiene una llave. Usa la Golden Key en él.
Go down to the underground of the temple.=Baja al sótano del templo.
Go back up to the top floor of the temple.=Vuelve a subir al último piso del templo.
Open the cell door.=Abre la puerta de la celda.
Talk to Drezel to bless the water.=Habla con Drezel para bendecir el agua.
Use the blessed water on the coffin.=Usa el blessed water en el ataúd.
Talk to Drezel again.=Habla con Drezel de nuevo.
Talk to Drezel in the east of the underground temple area.=Habla con Drezel en el este de la zona subterránea del templo.
Temple Guardian (level 30). You cannot use Magic. Rings of recoil will not award the kill.=Temple Guardian (nivel 30). No puedes usar Magic. Los Rings of recoil no otorgarán la muerte.
Monk of Zamorak (level 30)=Monk of Zamorak (nivel 30)
Access to Canifis and Morytania=Acceso a Canifis y Morytania
Start the quest=Empieza la misión
Go to the temple=Ve al templo
Return to the temple=Vuelve al templo
Freeing Drezel=Liberando a Drezel
Curing the Salve=Curando la Salve
Bring Drezel 50 UNNOTED rune/pure essence in the underground of the Salve Temple to finish the quest!=Lleva a Drezel 50 rune/pure essence sin nota en el sótano del Salve Temple, ¡para terminar la misión!
Bring Drezel=Lleva a Drezel
UNNOTED rune/pure essence in the underground of the Salve Temple.=rune/pure essence sin nota en el sótano del Salve Temple.
