# Spanish translations for Family Crest.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Teleport to the Dwarven Mine (Combat Bracelet [3], Skills Necklace [2])=Teletranspórtate a la Dwarven Mine (Combat Bracelet [3], Skills Necklace [2])
Any pickaxe=Cualquier pickaxe
At least one dose of antipoison or superantipoison=Al menos una dosis de antipoison o superantipoison
Runes for casting each of the 4 blast spells=Runas para lanzar cada uno de los 4 blast spells
You can get another from Caleb in Catherby=Puedes conseguir otra de Caleb en Catherby
You can get another from Avan north of Al Kharid=Puedes conseguir otra de Avan al norte de Al Kharid
Talk to Dimintheis in south east Varrock.=Habla con Dimintheis al sureste de Varrock.
Talk to Caleb in Catherby.=Habla con Caleb en Catherby.
Talk to Caleb again with the required fish.=Habla con Caleb de nuevo con los peces requeridos.
Talk to Caleb in Catherby once more.=Habla con Caleb en Catherby una vez más.
Talk to the Gem Trader in Al Kharid.=Habla con el Gem Trader en Al Kharid.
Talk to the man south of the Al Kharid mine.=Habla con el hombre al sur de la mina de Al Kharid.
Talk to Boot in the south western Dwarven Mines.=Habla con Boot en el suroeste de las Dwarven Mines.
Enter the old ruin entrance west of Witchaven.=Entra en la entrada de las viejas ruinas al oeste de Witchaven.
Follow the path around, and pull the lever on the wall in the north east corner.=Sigue el camino y tira de la palanca en la pared de la esquina noreste.
Pull the lever in the south room up.=Sube la palanca de la sala sur.
Pull the north wall lever again.=Tira de nuevo de la palanca de la pared norte.
Pull the lever in the north room up.=Sube la palanca de la sala norte.
Pull the lever in the south room down.=Baja la palanca de la sala sur.
Follow the dungeon around to the east.=Recorre la mazmorra hacia el este.
Mine 2 perfect gold in the east room.=Mina 2 perfect gold en la sala este.
Smelt the perfect gold ore into bars.=Funde el perfect gold ore para convertirlo en barras.
Make a perfect ruby necklace at a furnace. Make sure to only craft one.=Haz un perfect ruby necklace en un horno. Asegúrate de fabricar solo uno.
Make a perfect ruby ring at a furnace. Make sure to only craft one.=Haz un perfect ruby ring en un horno. Asegúrate de fabricar solo uno.
Return to the man south of the Al Kharid mine.=Vuelve con el hombre al sur de la mina de Al Kharid.
Go upstairs in the Jolly Boar Inn north east of Varrock and talk to Johnathon.=Sube las escaleras en el Jolly Boar Inn, al noreste de Varrock, y habla con Johnathon.
Talk to Johnathon.=Habla con Johnathon.
Give Johnathon some antipoison.=Entrega un poco de antipoison a Johnathon.
Enter the Edgeville Wilderness Dungeon, ready to kill Chronozon. Other players will be able to attack you.=Entra en la Edgeville Wilderness Dungeon, listo para matar a Chronozon. Otros jugadores podrán atacarte.
Kill Chronozon in the south west corner of the Edgeville Wilderness Dungeon. You need to hit him at least once with all 4 elemental blast spell.=Mata a Chronozon en la esquina suroeste de la Edgeville Wilderness Dungeon. Debes golpearle al menos una vez con los 4 elemental blast spell.
Pick up the crest part.=Recoge la parte del crest.
Combine the 3 crest parts together.=Combina las 3 partes del crest.
Return the family crest to Dimintheis in south east Varrock.=Devuelve el family crest a Dimintheis al sureste de Varrock.
The final boss of this quest is in the Edgeville WILDERNESS dungeon, where other players can kill you. Make sure when you go there you aren't risking anything you'd not be willing to lose.=El jefe final de esta misión está en la mazmorra WILDERNESS de Edgeville, donde otros jugadores pueden matarte. Asegúrate de no arriesgar nada que no estés dispuesto a perder cuando vayas.
