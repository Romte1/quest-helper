# Spanish translations for Death Plateau.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can buy one from bar on the east side of the Grand Tree on the 1st floor=Puedes comprar una en el bar del lado este del Grand Tree, en la 1ª planta
You can get another by talking to Tenzing=Puedes conseguir otro hablando con Tenzing
You can get another by talking to Harold upstairs in Burthorpe's Pub=Puedes conseguir otra hablando con Harold en la planta de arriba de Burthorpe's Pub
Talk to Denulth in Burthorpe. You can get there with the Burthorpe minigame teleport or a games necklace.=Habla con Denulth en Burthorpe. Puedes llegar con el teletransporte de minijuego de Burthorpe o con un games necklace.
Ask Eohric, upstairs in Burthorpe castle, about the guard that was on duty last night.=Pregunta a Eohric, en la planta de arriba del castillo de Burthorpe, por el guardia que estaba de servicio anoche.
Talk to Harold, upstairs in the bar in Burthorpe.=Habla con Harold, en la planta de arriba del bar de Burthorpe.
Talk to Eohric.=Habla con Eohric.
Take an Asgarnian ale from the bar.=Coge una Asgarnian ale de la barra.
Talk to Harold.=Habla con Harold.
Talk to Harold to give him a Blurberry Special.=Habla con Harold para darle una Blurberry Special.
Gamble with Harold (101 coins to immediately bankrupt him).=Apuesta con Harold (101 coins para arruinarlo de inmediato).
Read the IOU, and then keep the Combination for the end of the quest.=Lee el IOU y guarda la Combination para el final de la misión.
Use the red stone on the mechanism.=Usa la red stone en el mecanismo.
Use the blue stone on the mechanism.=Usa la blue stone en el mecanismo.
Use the yellow stone on the mechanism.=Usa la yellow stone en el mecanismo.
Use the pink stone on the mechanism.=Usa la pink stone en el mecanismo.
Use the green stone on the mechanism.=Usa la green stone en el mecanismo.
Work out where to place the red stone on the mechanism.=Averigua dónde colocar la red stone en el mecanismo.
Go back to Burthorpe castle, and place the coloured stone balls in the correct spots on the mechanism.=Vuelve al castillo de Burthorpe y coloca las stone balls de colores en los lugares correctos del mecanismo.
Open the quest's journal to sync your current quest state.=Abre el diario de la misión para sincronizar el estado actual de la misión.
Enter the cave north west of Burthorpe.=Entra en la cueva al noroeste de Burthorpe.
Talk to Saba.=Habla con Saba.
Leave Saba's cave.=Sal de la cueva de Saba.
Go northwest of Burthorpe, then south at the fork, and talk to Tenzing.=Ve al noroeste de Burthorpe, luego al sur en la bifurcación, y habla con Tenzing.
Ask Denulth about Dunstan's son.=Pregunta a Denulth por el hijo de Dunstan.
Talk to Dunstan at the anvil in Burthorpe, then talk to Denulth, where you started the quest.=Habla con Dunstan en el yunque de Burthorpe, luego habla con Denulth, donde empezaste la misión.
Talk to Dunstan to exchange the climbing boots for spiked boots.=Habla con Dunstan para cambiar las climbing boots por spiked boots.
Bring the spiked boots, along with (unnoted) 10 bread and 10 trout to Tenzing.=Lleva las spiked boots, junto con 10 bread y 10 trout (sin notar) a Tenzing.
Exit Tenzing's house into the backyard THROUGH THE NORTH DOOR and OVER THE STILE. Continue north past the Death Plateau warning, and around to the east until you stop and say you've gone far enough.=Sal de la casa de Tenzing al patio TRASERO POR LA PUERTA NORTE y SAL POR EL STILE. Continúa al norte pasando el cartel de advertencia de Death Plateau, y rodea hacia el este hasta que te detengas y digas que has ido lo bastante lejos.
Go back and talk to Denulth, giving him the secret map and Combination.=Vuelve y habla con Denulth, dándole el secret map y la Combination.
The ability to craft claws.=La habilidad de fabricar claws.
The ability to purchase and equip Climbing Boots.=La habilidad de comprar y equipar Climbing Boots.
The equipment room=La sala de equipamiento
Get spiked boots=Consigue spiked boots
The secret path=El camino secreto
