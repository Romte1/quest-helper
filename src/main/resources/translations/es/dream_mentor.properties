Combat gear=Equipo de combate
Enter the mine in the north east of Lunar Isle.=Entra en la mina al noreste de Lunar Isle.
Enter the cave entrance on the north wall.=Entra en la entrada de la cueva en la pared norte.
Attempt to talk to the fallen man.=Intenta hablar con el hombre caído.
Feed the fallen man 4 food. You'll need to alternate between at least 3 different types of food.=Alimenta al hombre caído con 4 comidas. Tendrás que alternar entre al menos 3 tipos de comida diferentes.
Talk to the fallen man.=Habla con el hombre caído.
Feed Cyrisus 6 food. You'll need to alternate between at least 3 different types of food.=Alimenta a Cyrisus con 6 comidas. Tendrás que alternar entre al menos 3 tipos de comida diferentes.
Talk to Cyrisus.=Habla con Cyrisus.
Talk to 'Bird's-Eye' Jack in the Lunar Isle bank.=Habla con 'Bird's-Eye' Jack en el banco de Lunar Isle.
Talk to 'Bird's-Eye' Jack in the Lunar Isle bank for Cyrisus's equipment.=Habla con 'Bird's-Eye' Jack en el banco de Lunar Isle para conseguir el equipo de Cyrisus.
Give Cyrisus his equipment.=Entrega a Cyrisus su equipo.
Feed Cyrisus alternating types of food.=Alimenta a Cyrisus alternando tipos de comida.
Talk to Cyrisus until he's fully recovered.=Habla con Cyrisus hasta que se recupere por completo.
Talk to the Oneiromancer in the south east of Lunar Isle.=Habla con la Oneiromancer al sureste de Lunar Isle.
Fill the vial with water.=Llena la vial con agua.
Add a goutweed to the dream vial.=Añade un goutweed a la dream vial.
Use a hammer on an astral rune.=Usa un hammer en una astral rune.
Use a pestle and mortar on the astral rune shards.=Usa un pestle and mortar en las astral rune shards.
Add the ground astral rune to the dream vial.=Añade la ground astral rune a la dream vial.
Equip your combat equipment, food, and light the Brazier in the west of Lunar Isle's town. The upcoming fight is hard, and you can only leave via the lecturn in the arena and cannot pray. Magic attacks are extremely effective for the fight.=Equípate el equipo de combate y la comida, y enciende el Brazier al oeste del pueblo de Lunar Isle. La pelea que viene es difícil, solo puedes salir por el lectern de la arena y no puedes rezar. Los ataques mágicos son extremadamente eficaces para la pelea.
Talk to Cyrisus to enter the dream.=Habla con Cyrisus para entrar en el sueño.
Kill The Inadequacy.=Mata a The Inadequacy.
Kill The Everlasting. You can safe spot it by the entry book.=Mata a The Everlasting. Puedes safespotearlo junto al libro de entrada.
Kill The Untouchable. You can safe spot it by the entry book.=Mata a The Untouchable. Puedes safespotearlo junto al libro de entrada.
Kill The Illusive.=Mata a The Illusive.
Talk to the Oneiromancer to finish the quest!=Habla con la Oneiromancer para terminar la misión.
The Inadequacy (level 343)=The Inadequacy (nivel 343)
The Everlasting (level 223, safespottable)=The Everlasting (nivel 223, se puede safespotear)
The Untouchable (level 274, safespottable)=The Untouchable (nivel 274, se puede safespotear)
The Illusive (level 108, won't attack you)=The Illusive (nivel 108, no te atacará)
To handle the food you could use Sack of Potatoes(10), Sack of Cabbages(10) and Sack of Onions(10). This would allow you to carry all the food in just three inventory spaces. You will need to fight all 4 bosses in a row without prayers. It's recommended that you use magic as they all have very low magic defence.=Para manejar la comida puedes usar Sack of Potatoes(10), Sack of Cabbages(10) y Sack of Onions(10). Así podrías llevar toda la comida en solo tres espacios de inventario. Tendrás que luchar contra los 4 jefes seguidos sin prayers. Se recomienda usar magia, ya que todos tienen una defensa mágica muy baja.
7 New Lunar Spells=7 nuevos hechizos lunares
Ability to bank without the Seal of Passage by talking to 'Birds-Eye-Jack'=Habilidad de usar el banco sin el Seal of Passage hablando con 'Birds-Eye-Jack'
Helping Cyrisus=Ayudando a Cyrisus
Defeating his fear=Venciendo su miedo
