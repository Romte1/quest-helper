# Spanish translations for The Curse of Arrav.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Solve the Metal door puzzle by following the instructions in the overlay.=Resuelve el puzzle de la Metal door siguiendo las instrucciones del overlay.
Read the Code key in your inventory.=Lee la Code key de tu inventario.
Open the metal doors and solve the puzzle.=Abre las metal doors y resuelve el puzzle.
solve the puzzle somehow=resuelve el puzzle de alguna manera
Click the Up button.=Haz clic en el botón Up.
Click the Down button.=Haz clic en el botón Down.
Click the Enter button.=Haz clic en el botón Enter.
Click the Back button.=Haz clic en el botón Back.
Any pickaxe=Cualquier pickaxe
Any crossbow=Cualquier crossbow
Crush or ranged combat gear to fight the Golem guard=Equipo de combate de crush o a distancia para luchar contra el Golem guard
Ranged or melee combat gear for killing Arrav=Equipo de combate a distancia o cuerpo a cuerpo para matar a Arrav
If you bring Melee gear, it's advisable to bring some ranged weapon swap like darts for killing the Zombies as they spawn=Si llevas Melee gear, es recomendable llevar algún arma a distancia de cambio, como darts, para matar a los Zombies según aparezcan
Food=Comida
You can get a new one from Elias at the entrance of Zemouregal's base if you've lost it.=Puedes conseguir uno nuevo de Elias en la entrada de la base de Zemouregal si lo has perdido.
This state should not be reachable, please make a report with a screenshot in the Quest Helper discord.=Este estado no debería ser alcanzable; haz un informe con una captura de pantalla en el discord de Quest Helper.
Talk to Elias south of Ruins of Uzer to start the quest.=Habla con Elias al sur de Ruins of Uzer para empezar la misión.
Enter the tomb south-west of Elias.=Entra en la tumba al suroeste de Elias.
Get the first Mastaba key from the skeleton in the cave south of the entrance.=Consigue la primera Mastaba key del esqueleto de la cueva al sur de la entrada.
Get the second Mastaba key from the skeleton east of the entrance.=Consigue la segunda Mastaba key del esqueleto al este de la entrada.
Search the Odd markings to the south to get to the south lever. Search the markings again if you fail.=Busca en las Odd markings del sur para llegar a la palanca sur. Busca en las markings de nuevo si fallas.
Pull the lever to the south-east.=Tira de la palanca hacia el sureste.
Search the Odd markings next to you to get out.=Busca en las Odd markings que tienes al lado para salir.
Search the Odd markings to the north to get to the north lever. Search the markings again if you fail.=Busca en las Odd markings del norte para llegar a la palanca norte. Busca en las markings de nuevo si fallas.
Pull the lever to the north-east.=Tira de la palanca hacia el noreste.
Open the imposing doors, ready to fight the Golem guard.=Abre las imposing doors, listo para luchar contra el Golem guard.
Fight the Golem guard. It is weak to crush style weapons. Use Protect from Melee to avoid damage from his attacks. When the screen shakes, step away from him to avoid taking damage.=Lucha contra el Golem guard. Es débil a las armas de estilo crush. Usa Protect from Melee para evitar daño de sus ataques. Cuando la pantalla tiemble, apártate de él para evitar recibir daño.
Open the imposing doors to the north-east of the tomb.=Abre las imposing doors al noreste de la tumba.
Climb the stairs down the tomb basement.=Baja las escaleras al sótano de la tumba.
Move across the floor tile puzzle.=Cruza el puzzle de losetas del suelo.
Search the shelves to the west for an oil-filled canopic jar.=Busca en las estanterías del oeste un oil-filled canopic jar.
Inspect the murals in the room to the south.=Inspecciona los murales de la sala sur.
Put the Dwellberries in the Canopic jar.=Pon las Dwellberries en el Canopic jar.
Put the Ring of life in the Canopic jar.=Pon el Ring of life en el Canopic jar.
Return to Elias south of Ruins of Uzer, either by walking out of the tomb or using the fairy ring.=Vuelve con Elias al sur de Ruins of Uzer, ya sea saliendo de la tumba o usando el fairy ring.
Enter the cave next to Trollheim. You can use a Trollheim teleport tablet or the GWD Ghommal's Hilt teleport to get close.=Entra en la cueva junto a Trollheim. Puedes usar un Trollheim teleport tablet o el teletransporte del GWD Ghommal's Hilt para acercarte.
Continue through the Trollheim cave, exiting at the Crevasse to the north-west. Use Protect from Melee to avoid taking damage from the Ice Trolls.=Continúa por la cueva de Trollheim, saliendo en el Crevasse al noroeste. Usa Protect from Melee para evitar daño de los Ice Trolls.
Enter the Trollweiss cave to the east.=Entra en la cueva Trollweiss hacia el este.
Mine the rubble and make your way through the cave.=Mina los escombros y abre camino por la cueva.
Climb up the stairs in the room with the red tile floor and talk to Arrav.=Sube las escaleras de la sala con el suelo de losetas rojas y habla con Arrav.
Talk to Arrav.=Habla con Arrav.
Enter the room to your east and search the tapestry for something to help you with your heist.=Entra en la sala al este y busca en el tapiz algo que te ayude con el atraco.
Search the tapestry in the south of the room.=Busca en el tapiz del sur de la sala.
Return to Elias south of Ruins of Uzer and ask him for help interpreting the plans.=Vuelve con Elias al sur de Ruins of Uzer y pídele ayuda para interpretar los planos.
Head to Zemouregal's base east of Varrock's sawmill and talk to Elias.=Dirígete a la base de Zemouregal al este del sawmill de Varrock y habla con Elias.
Enter Zemouregal's base east of Varrock's sawmill.=Entra en la base de Zemouregal al este del sawmill de Varrock.
Make your way to the back of Zemouregal's base. Protect from Melee against the zombies to avoid most damage.=Abre camino hasta la parte trasera de la base de Zemouregal. Usa Protect from Melee contra los zombies para evitar la mayor parte del daño.
Open the gate and make your way to the back of Zemouregal's base. Protect from Melee against the zombies to avoid most damage.=Abre la verja y abre camino hasta la parte trasera de la base de Zemouregal. Usa Protect from Melee contra los zombies para evitar la mayor parte del daño.
Open the door and make your way to the back of Zemouregal's base. Protect from Melee against the zombies to avoid most damage.=Abre la puerta y abre camino hasta la parte trasera de la base de Zemouregal. Usa Protect from Melee contra los zombies para evitar la mayor parte del daño.
Open the gate and make your way to the back of Zemouregal's base.=Abre la verja y abre camino hasta la parte trasera de la base de Zemouregal.
Enter the sewers and make your way to the back of Zemouregal's base.=Entra en las cloacas y abre camino hasta la parte trasera de la base de Zemouregal.
Head south to exit the sewers and make your way to the back of Zemouregal's base.=Ve al sur para salir de las cloacas y abre camino hasta la parte trasera de la base de Zemouregal.
Search the table for some decoder strips.=Busca en la mesa unas decoder strips.
Enter the storage room to the south-east.=Entra en el almacén al sureste.
Exit the storage room.=Sal del almacén.
Open the chest for the code key.=Abre el cofre para conseguir la code key.
Step through through the metal doors.=Atraviesa las metal doors.
Grapple across the pipe=Cruza el tubo con el grapnel
Attempt to take Arrav's heart from the pedestal, ready for a fight with Arrav. Kill zombies as they appear (ranged weapons are handy here). Avoid the venom pools they spawn. Use Protect from Melee to avoid some of the incoming damage. When Arrav throws an axe towards you, step to the side or behind him.=Intenta coger el corazón de Arrav del pedestal, listo para luchar contra Arrav. Mata a los zombies según aparezcan (las armas a distancia son útiles aquí). Evita los charcos de veneno que generan. Usa Protect from Melee para evitar parte del daño recibido. Cuando Arrav te lance un hacha, apártate a un lado o ponte detrás de él.
Fight Arrav. Kill zombies as they appear (ranged weapons are handy here). Avoid the venom pools they spawn. Use Protect from Melee to avoid some of the incoming damage. When Arrav throws an axe towards you, step to the side or behind him.=Lucha contra Arrav. Mata a los zombies según aparezcan (las armas a distancia son útiles aquí). Evita los charcos de veneno que generan. Usa Protect from Melee para evitar parte del daño recibido. Cuando Arrav te lance un hacha, apártate a un lado o ponte detrás de él.
Watch the dialog.=Mira el diálogo.
Talk to Elias to finish the quest.=Habla con Elias para terminar la misión.
