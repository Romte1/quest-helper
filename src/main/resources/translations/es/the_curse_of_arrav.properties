Unable to figure out a path, click your way across lol=No se ha podido encontrar un camino; ve haciendo clic para cruzar, lol
Finish the puzzle by clicking the lever.=Termina el puzzle haciendo clic en la palanca.
Make your way through the Trollweiss cave, mining rubble with your pickaxe from the direction indicated. Rubble can only be mined from the same direction once.=Abre camino por la cueva Trollweiss, minando los escombros con tu pickaxe desde la dirección indicada. Los escombros solo se pueden minar una vez desde la misma dirección.
Mine the rubble from the %s side=Mina los escombros desde el lado %s
Rubble mined from the %s side=Escombros minados desde el lado %s
