# Rewards
Unlimited teleports to Ardougne farm patch with the Ardougne cloak 4=Teletransportes ilimitados al huerto de Ardougne con el Ardougne cloak 4
250 free noted pure essence every day from Wizard Cromperty=250 pure essence anotadas gratis cada día de Wizard Cromperty
50% more fish from Fishing Trawler=50% más de pescado en el Fishing Trawler
25% more marks of grace from the Ardougne Rooftop Course=25% más de marks of grace en el Ardougne Rooftop Course
Bert will automatically deliver 84 buckets of sand to your bank each day you log in (unless you are an Ultimate Ironman), even if you cancel membership=Bert entregará automáticamente 84 buckets of sand en tu banco cada día que inicies sesión (a menos que seas Ultimate Ironman), incluso si cancelas la suscripción

