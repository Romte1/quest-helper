# Spanish translations for Ardougne Elite Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Steps
Cast Ice Barrage on a Player within Castle Wars.=Lanza Ice Barrage a un jugador en Castle Wars.
Climb down the stairs to enter the Yanille Agility Dungeon.=Baja las escaleras para entrar en la Yanille Agility Dungeon.
Lockpick the door to the Yanille Agility Dungeon.=Abre con una ganzúa la puerta de la Yanille Agility Dungeon.
Farm more Nightmare Zone points. Speak with Dominic Onion and buy a dream.=Consigue más Nightmare Zone points. Habla con Dominic Onion y compra un sueño.
Imbue a salve amulet at Nightmare Zone.=Imbuye una salve amulet en Nightmare Zone.
Equip your salve amulet.=Equipa tu salve amulet.
Catch a manta ray in the Fishing Trawler and cook it in Port Khazard.=Pesca una manta ray en el Fishing Trawler y cocínala en Port Khazard.
Complete a lap of Ardougne's rooftop agility course.=Completa una vuelta al circuito de agilidad de los tejados de Ardougne.
Pickpocket a Hero in East Ardougne.=Roba a un Hero en East Ardougne.
Spin a crossbow string in Witchaven. Do not complete any other diary tasks while completing this.=Hila una crossbow string en Witchaven. No completes ninguna otra tarea del diario mientras haces esto.
Enter Yanille to continue the task.=Entra en Yanille para continuar la tarea.
Smith some rune limbs in Yanille.=Forja unas rune limbs en Yanille.
Use your knife on the  yew logs to make a yew stock.=Usa tu knife con los yew logs para hacer un yew stock.
Combine the rune limbs with the yew stock.=Combina las rune limbs con el yew stock.
String the rune crossbow (u).=Encuerda la rune crossbow (u).
Plant and harvest the Torstol from the north Ardougne herb patch. If you're waiting for it to grow and want to complete further tasks, use the tick box on panel.=Planta y cosecha el Torstol del bancal de hierbas del norte de Ardougne. Si estás esperando a que crezca y quieres completar otras tareas, usa la casilla del panel.
Talk to Two-pints in the Flying Horse Inn at East Ardougne to claim your reward!=¡Habla con Two-pints en el Flying Horse Inn de East Ardougne para reclamar tu recompensa!

