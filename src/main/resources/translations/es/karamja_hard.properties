# Spanish translations for Karamja Hard Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Win in the Fight Pits in the north west of Mor Ul Rek. You can ask a friend to come lose to you.=Gana en los Fight Pits al noroeste de Mor Ul Rek. Puedes pedirle a un amigo que venga a perder contra ti.
Search and then enter the Mossy Rocks in the north west of the Kharazi, and follow the cavern to kill a deathwing.=Busca y entra en las Mossy Rocks al noroeste de la Kharazi y sigue la caverna para matar a un deathwing.
Smash through the boulders and enter the gate at the end of the corridor.=Rompe las rocas y entra por la puerta al final del pasillo.
Shake leafy palm trees in the Kharazi Jungle and pick up 5 palm leaves. You can pick up and drop the same leaf for this task.=Sacude las palmeras frondosas de la Kharazi Jungle y recoge 5 palm leaves. Puedes recoger y soltar la misma hoja para esta tarea.
You can make one by using a palm leaf on a raw oomlie and cooking it. Both are obtained from the Kharazi Jungle=Puedes hacer uno usando una palm leaf en un raw oomlie y cocinándolo. Ambos se obtienen en la Kharazi Jungle
Combat gear to reach wave 31 in the Fight Caves and defeat a Ket-Zek=Equipo de combate para llegar a la oleada 31 en las Fight Caves y derrotar a un Ket-Zek
Enter Mor Ul Rek under the Karamja Volcano.=Entra en Mor Ul Rek bajo el Karamja Volcano.
Enter the fight caves in Mor Ul Rek, ready to reach at least wave 31 to defeat a Ket-Zek.=Entra en las fight caves de Mor Ul Rek, preparado para llegar al menos a la oleada 31 y derrotar a un Ket-Zek.
Enter the cave that leads to Mor Ul Rek under the Karamja Volcano.=Entra en la cueva que lleva a Mor Ul Rek bajo el Karamja Volcano.
Reach at least wave 31 to defeat Ket-Zek.=Llega al menos a la oleada 31 para derrotar a Ket-Zek.
Eat an oomlie wrap.=Cómete un oomlie wrap.
Enter the nature altar, either from the ruin or through the Abyss.=Entra en el nature altar, ya sea desde la ruina o a través del Abyss.
Craft a nature rune.=Fabrica una nature rune.
Cook a raw karambwan.=Cocina un raw karambwan.
Right-click search the bookcase and slide past it.=Haz clic derecho para buscar en la bookcase y deslízate por ella.
Kill a death wing.=Mata a un death wing.
Grapple across the shortcut south of Musa Point.=Cruza el atajo con grapple al sur de Musa Point.
Climb the ladder to Duradel.=Sube por la escalera hasta Duradel.
Get a task from Duradel.=Consigue una tarea de Duradel.
Enter Brimhaven Dungeon.=Entra en la Brimhaven Dungeon.
Kill any metal dragon in the south of the dungeon.=Mata a cualquier metal dragon en el sur de la mazmorra.
Talk to Pirate Jackie the Fruit in Brimhaven to claim your reward!=Habla con Pirate Jackie the Fruit en Brimhaven para reclamar tu recompensa.
Nature Talisman/Tiara, Catalytic Talisman/Tiara, RC-skill cape or via Abyss=Nature Talisman/Tiara, Catalytic Talisman/Tiara, capa de RC o mediante el Abyss
