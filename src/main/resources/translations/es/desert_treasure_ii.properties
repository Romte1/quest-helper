Defeat The Forsaken Assassin. Protect from ranged, and lure him into the white smoke. He will sometimes throw 3 vials, avoid them, as they will poison you and deal large damage.=Derrota a The Forsaken Assassin. Usa Protect from ranged y atráelo al humo blanco. A veces lanzará 3 viales; evítalos, ya que te envenenarán y harán mucho daño.
Defeat Ketla the Unworthy. Protect from ranged. She will spawn shadow clones, which you should hide behind whenever she has a skull above her.=Derrota a Ketla the Unworthy. Usa Protect from ranged. Invocará clones de sombra detrás de los cuales deberías esconderte siempre que tenga una calavera sobre ella.
Defeat Kasonde the Craven. Protect from ranged if at a distance or melee if up close. The fight is similar to earlier in the quest.=Derrota a Kasonde the Craven. Usa Protect from ranged si estás a distancia o de melee si estás cerca. La pelea es similar a la de antes en la misión.
Defeat Persten the Deceitful. Protect from Magic. Avoid the lighting strikes by moving. Destroy any portals she spawns, or run from corner to corner avoiding the leeches that spawn from the portal.=Derrota a Persten the Deceitful. Usa Protect from Magic. Evita los rayos moviéndote. Destruye los portales que invoque o corre de esquina a esquina evitando las sanguijuelas que salen del portal.
Watch the cutscene, then defeat the wights.=Mira la cinemática y luego derrota a los wights.
