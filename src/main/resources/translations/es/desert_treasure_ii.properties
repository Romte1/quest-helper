Board the boat to the Leviathan area.=Sube al barco hacia la zona del Leviathan.
Consider re-gearing, then board the boat to fight the Leviathan. Read the sidebar for more details.=Plantéate cambiar de equipo y luego sube al barco para luchar contra el Leviathan. Lee la barra lateral para más detalles.
Consider re-gearing, then board the boat to fight the Leviathan.=Plantéate cambiar de equipo y luego sube al barco para luchar contra el Leviathan.
Use ranged combat. Its attacks register as 'hitting' you upon actual contact, so make sure to pray when projectiles are hitting you rather than being created.=Usa combate a distancia. Sus ataques cuentan como impacto al contacto real, así que asegúrate de rezar cuando los proyectiles te estén alcanzando, no cuando se crean.
Shadow spells will stun it.=Los shadow spells lo aturdirán.
Blue projectiles are magic attacks, green ranged, and orange melee. Avoid dropping rocks.=Los proyectiles azules son ataques mágicos, los verdes a distancia y los naranjas de melee. Evita que caigan rocas.
Run away from electricity attacks. When boulders start falling, walk them in a line to create a wall which you can hide behind from the Leviathan, as after 10 rocks you will need to use them to avoid a blast attack.=Huye de los ataques de electricidad. Cuando empiecen a caer rocas, camina en línea para crear un muro tras el que esconderte del Leviathan, ya que tras 10 rocas tendrás que usarlas para evitar un ataque de explosión.
At 20% health, the leviathan will become enraged, constantly dropping rocks. You need to locate an abyssal pathfinder and stay near it until you kill the Leviathan.=Al 20% de salud, el leviathan se enfurecerá y dejará caer rocas constantemente. Debes localizar un abyssal pathfinder y quedarte cerca de él hasta matar al Leviathan.
