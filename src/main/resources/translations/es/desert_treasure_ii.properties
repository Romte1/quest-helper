Fight the Mysterious Figure. When frozen, spam-click to move away to avoid taking damage. Use Protect from Magic for the entire fight.=Lucha contra el Mysterious Figure. Cuando te congelen, haz clic repetidamente para alejarte y evitar el daño. Usa Protect from Magic durante todo el combate.
Enter to the Vault door north-east of Nardah with the final medallion, ready to fight.=Entra por la puerta de la Vault al noreste de Nardah con el medallón final, preparado para luchar.
Return to fight the Mysterious Figure, through the portal south of the Quarry in the desert.=Vuelve a luchar contra el Mysterious Figure a través del portal al sur de la Quarry, en el desierto.
Retrieve the medallion from the portal south of the Quarry.=Recupera el medallón del portal al sur de la Quarry.
