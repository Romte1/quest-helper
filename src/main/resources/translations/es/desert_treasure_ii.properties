Run east into the room with a crevice. Clear it, and go through it.=Corre al este hasta la sala con una grieta. Límpiala y crúzala.
Work out how to open the nearby locked chest.=Averigua cómo abrir el cofre cerrado cercano.
Enter the room with beds in it, south of the crevice. Open the south-eastern chest, next to the crates. The code is 'UP RIGHT LEFT DOWN RIGHT UP'.=Entra en la sala con camas, al sur de la grieta. Abre el cofre del sureste, junto a los cajones. El código es 'UP RIGHT LEFT DOWN RIGHT UP'.
Enter the room with beds in it, south of the crevice. Work out how to open the south-eastern chest, next to the crates.=Entra en la sala con camas, al sur de la grieta. Averigua cómo abrir el cofre del sureste, junto a los cajones.
Enter the crevice to the south to shortcut back to the main room.=Entra en la grieta al sur para volver a la sala principal.
Open the chest in the cell to the west of the main room, through the Ruby Gate. The code for it is 'WRATH'.=Abre el cofre de la celda al oeste de la sala principal, a través del Ruby Gate. El código es 'WRATH'.
Work out how to open the chest in the cell to the west of the main room, through the Ruby Gate.=Averigua cómo abrir el cofre de la celda al oeste de la sala principal, a través del Ruby Gate.
Get your equipment back from the chest in the cell next to the Assassin. You'll need to go through some dialog with him to enter.=Recupera tu equipo del cofre de la celda junto al Assassin. Tendrás que hablar con él para entrar.
Talk to the assassin.=Habla con el asesino.
Get a full inventory of food, and return to the refugee camp in the south-eastern room. Light the firecrackers there. Once you do, you'll need to survive Jhallan attacking you for 2 minutes.=Consigue un inventario lleno de comida y vuelve al campamento de refugiados de la sala sureste. Enciende los petardos allí. Cuando lo hagas, tendrás que sobrevivir a los ataques de Jhallan durante 2 minutos.
Survive Jhallan's attacks for 2 minutes. Protect from Mage, keep your health high, and avoid the shadow attacks.=Sobrevive a los ataques de Jhallan durante 2 minutos. Usa Protect from Mage, mantén la salud alta y evita los ataques de sombra.
Talk to the assassin after the fight.=Habla con el asesino después del combate.
Go down the stairs in the far north-east of the prison. Be prepared for fighting the boss of the area.=Baja las escaleras en el extremo noreste de la prisión. Prepárate para luchar contra el jefe de la zona.
Enter the boss arena.=Entra en la arena del jefe.
Defeat the Duke. Check the sidebar for more details.=Derrota al Duke. Consulta la barra lateral para más detalles.
Defeat the Duke. You must first wake him with two 'Arder-musca poison'.=Derrota al Duke. Primero debes despertarlo con dos 'Arder-musca poison'.
Make sure to avoid any of the enviromental effects, such as gas, lightning, and the Extremitys' vision.=Asegúrate de evitar cualquiera de los efectos ambientales, como el gas, los rayos y la visión de los Extremitys.
To make the poison, get 3 Arder mushrooms from the north-eastern corner, and 3 Musca from the north-western corner.=Para hacer el veneno, consigue 3 Arder mushrooms de la esquina noreste y 3 Musca de la esquina noroeste.
Grab the pestle and mortar from the shelves west of the entrance, and a pickaxe from the east of it.=Coge el pestle and mortar de los estantes al oeste de la entrada y un pickaxe al este de esta.
Use the pestle and mortar on the mushrooms, and then mine 12 salt from the salt deposits in the middle of the room.=Usa el pestle and mortar en las setas y luego mina 12 salt de los depósitos de sal del centro de la sala.
With the ground mushrooms and salts, add them to the fermentation vats near the entrance. Empty them for 2 poisons.=Con las setas molidas y las sales, añádelas a los depósitos de fermentación cerca de la entrada. Vacíalos para obtener 2 venenos.
Use both poisons on the boss to start the fight. Stay close to him where possible, and Protect from Melee. He will use the following attacks:=Usa ambos venenos en el jefe para empezar el combate. Mantente cerca de él cuando sea posible y usa Protect from Melee. Utilizará los siguientes ataques:
Blue orb: Magic attack.=Orbe azul: ataque mágico.
Spikes: the Duke hits the floor, causing spikes to appear. Avoid them.=Pinchos: el Duke golpea el suelo y aparecen pinchos. Evítalos.
Gas vent: the Duke activates one of the gas vents. Keep away from it.=Rejilla de gas: el Duke activa una de las rejillas de gas. Mantente alejado.
Duke's gaze: the duke opens his eye to deal massive damage. Hide behind a pillar to avoid this.=Mirada del Duke: el duque abre su ojo para infligir un daño masivo. Escóndete tras un pilar para evitarlo.
Pick up the odd key.=Coge la odd key.
Enter the room south-west of the Duke.=Entra en la sala al suroeste del Duke.
Attempt to enter the Duke's room to retrieve the odd key.=Intenta entrar en la sala del Duke para recuperar la odd key.
Talk to the assassin in the room.=Habla con el asesino de la sala.
Open the chest in the south-east of the room for sucellus' medallion.=Abre el cofre del sureste de la sala para conseguir el medallón de Sucellus.
Use the medallion on the south-west statue.=Usa el medallón en la estatua del suroeste.
Bring high healing food to tank the infected.=Lleva comida de mucha curación para aguantar a los infectados.
You can get another from the south-west corner of The Stranglewood=Puedes conseguir otras de la esquina suroeste de The Stranglewood
You can get another from the north-west corner of The Stranglewood=Puedes conseguir otra de la esquina noroeste de The Stranglewood
You can get another from Kasonde's hideout=Puedes conseguir otro del escondite de Kasonde
Talk to Barus near the burning man in south-west Lovakengj.=Habla con Barus junto al hombre en llamas en el suroeste de Lovakengj.
Xeric's talisman ([3] Xeric's Inferno)=Xeric's talisman ([3] Xeric's Inferno)
Search the desk in the house south of the Hosidius Estate Agent.=Registra el escritorio de la casa al sur del Hosidius Estate Agent.
Xeric's talisman ([2] Xeric's Glade)=Xeric's talisman ([2] Xeric's Glade)
Read the potion note.=Lee la nota de la poción.
Drink the strange potion.=Bebe la strange potion.
Board the boat south of Quidamortem into The Stranglewood. You can use the Fairy Ring BLS to get nearby, or travel with the Mountain Guide.=Sube al barco al sur de Quidamortem hacia The Stranglewood. Puedes usar la Fairy Ring BLS para acercarte o viajar con el Mountain Guide.
Run deeper into Stranglewood. Be careful of the Strangled, as they'll bind you and deal damage.=Corre más adentro de Stranglewood. Ten cuidado con los Strangled, ya que te inmovilizarán y te harán daño.
Talk to Kasonde.=Habla con Kasonde.
Hide away in the Entry in the north-west of the room.=Escóndete en la Entry del noroeste de la sala.
Defend Kasonde! There are barricades in the stone chests you can set up to block routes. There are also satchels you can place on the floor, and detonate using the Detonator. This will kill all of the Strangled in a 7x7 area, as well as damaging you or Kasonde if either of you are in the blast radius.=¡Defiende a Kasonde! Hay barricadas en los cofres de piedra que puedes colocar para bloquear rutas. También hay sacos que puedes poner en el suelo y detonar con el Detonator. Esto matará a todos los Strangled en un área de 7x7, además de dañarte a ti o a Kasonde si alguno está en el radio de la explosión.
Closed chests require you to guess the correct code to open, with correct numbers in the correct place being marked in green, and correct numbers in the wrong places being marked with blue.=Los cofres cerrados requieren que adivines el código correcto para abrirlos; los números correctos en la posición correcta se marcan en verde y los números correctos en la posición incorrecta se marcan en azul.
It's recommended to also use freezes if you have ancient magicks with you to keep them off of Kasonde. If you have freezes, you can largely ignore the barricading and explosives.=También se recomienda usar freezes si llevas ancient magicks para mantenerlos alejados de Kasonde. Si tienes freezes, puedes ignorar en gran medida las barricadas y los explosivos.
Defend Kasonde! Read the sidebar for more details.=¡Defiende a Kasonde! Lee la barra lateral para más detalles.
Leave the dungeon up the ladder.=Sal de la mazmorra subiendo la escalera.
Talk to Kasonde on the surface.=Habla con Kasonde en la superficie.
Go get the herb from the north-west corner of the area. The stangled will attack you, so bring food and freezes to trap them. More info in the sidebar.=Ve a por la hierba a la esquina noroeste de la zona. Los strangled te atacarán, así que lleva comida y freezes para atraparlos. Más información en la barra lateral.
Go get the herb. The Strangled will attack you, so have food. If your infected bar reaches full, you'll be teleported to the starting room again. =Ve a por la hierba. Los Strangled te atacarán, así que lleva comida. Si tu barra de infección se llena, te teletransportarán de nuevo a la sala inicial. 
You can get some stink bombs from the chest in the south-east corner of Kasonde's room, which when used attract the Strangled to the location. This can be useful for avoiding them.=Puedes conseguir stink bombs del cofre de la esquina sureste de la sala de Kasonde; al usarlas, atraen a los Strangled a la ubicación. Esto puede ser útil para evitarlos.
Freezes and blood spells are useful for trapping them and healing up.=Los freezes y los blood spells son útiles para atraparlos y curarte.
Get the berry from the south-west part of the area. Beware the Strangled still.=Consigue la baya en la parte suroeste de la zona. Cuidado con los Strangled.
Go to Kasonde, who is inside the main pyramid of the area to the north. Be ready to fight a few Strangled.=Ve hacia Kasonde, que está dentro de la pirámide principal de la zona al norte. Prepárate para luchar contra unos cuantos Strangled.
Defeat the Strangled attacking Kasonde.=Derrota a los Strangled que atacan a Kasonde.
Add the herb to unfinished serum.=Añade la hierba al unfinished serum.
Add the berries to the serum.=Añade las bayas al serum.
Drink the strangler serum.=Bebe el strangler serum.
Go to the ritual site to the west, ready to fight the boss of the area.=Ve al lugar del ritual al oeste, preparado para luchar contra el jefe de la zona.
Defeat Vardorvis, who's weak to slash. Look at the sidebar for more details. Protect from Melee when he's not using a special attack.=Derrota a Vardorvis, que es débil a slash. Consulta la barra lateral para más detalles. Usa Protect from Melee cuando no esté usando un ataque especial.
Defeat Vardorvis. He's weak to slash weapons, and uses Melee. It's recommended to watch a video to get an understanding of his abilities.=Derrota a Vardorvis. Es débil a las armas de slash y usa melee. Se recomienda ver un vídeo para entender sus habilidades.
Swinging axes: He will spawn axes around the arena, which will go to the opposite corner to which they appear. Avoid them.=Hachas oscilantes: invocará hachas alrededor de la arena, que irán a la esquina opuesta a la que aparecen. Evítalas.
Homing spikes: Vardorvis hits the ground, causing a spike to appear under you. Move off the tile to avoid.=Pinchos teledirigidos: Vardorvis golpea el suelo y aparece un pincho bajo ti. Muévete de la casilla para evitarlo.
Head projectile: A tentacle will appear with a head on it, firing a green projectile. Protect from Missiles should be flicked to.=Proyectil de cabeza: aparecerá un tentáculo con una cabeza que dispara un proyectil verde. Deberías cambiar a Protect from Missiles.
Virus cells: Red splotches appear on the screen. Click them all within the time limit to avoid damage.=Células víricas: aparecen manchas rojas en la pantalla. Haz clic en todas dentro del tiempo límite para evitar el daño.
Pick up the Temple Key in the Vardorvis arena.=Coge la Temple Key en la arena de Vardorvis.
Go to the ritual site to the west, and search the rocks to get another Temple Key.=Ve al lugar del ritual al oeste y registra las rocas para conseguir otra Temple Key.
Go to the ritual site to the west via the shortcut hole north-east of main pyramid, ready to fight the boss of the area.=Ve al lugar del ritual al oeste por el agujero atajo al noreste de la pirámide principal, preparado para luchar contra el jefe de la zona.
Return to Kasonde with the temple key, who is inside the main pyramid of the area to the north. Be ready for another fight.=Vuelve con Kasonde con la temple key; está dentro de la pirámide principal de la zona al norte. Prepárate para otra pelea.
Defeat Kasonde in the pyramid. Avoid the potions he throws. If he throws his hands up, hide behind a pillar.=Derrota a Kasonde en la pirámide. Evita las pociones que lanza. Si levanta las manos, escóndete tras un pilar.
Talk to Kasonde again in the pyramid.=Habla con Kasonde de nuevo en la pirámide.
Search the north-east chest in Kasonde's initial hideout for a medallion.=Registra el cofre del noreste del escondite inicial de Kasonde para encontrar un medallón.
Return to the Vault door north-east of Nardah.=Vuelve a la puerta de la Vault al noreste de Nardah.
Use the medallion on the north-east statue.=Usa el medallón en la estatua del noreste.
You can claim another from the table next to Ketla, or by using 'recall' on the blackstone fragment if you've already done so=Puedes reclamar otro de la mesa junto a Ketla, o usando 'recall' en el blackstone fragment si ya lo has hecho
You can get another from Ketla=Puedes conseguir otro de Ketla
Enter Camdozaal, west of Ice Mountain.=Entra en Camdozaal, al oeste de Ice Mountain.
Talk to Ramarno to the north by the sacred forge.=Habla con Ramarno al norte, junto a la sacred forge.
Talk to Prescott to the east.=Habla con Prescott al este.
Tie the rope to a rock in the north west of the cavern, in the mine by the sinkhole.=Ata la cuerda a una roca en el noroeste de la caverna, en la mina junto al sinkhole.
Descend into the sinkhole.=Baja al sinkhole.
Activate the teleporter to the south-east of the rope. You can use teleporters you've activated to go to other activated teleporters.=Activa el teleporter al sureste de la cuerda. Puedes usar los teleporters que hayas activado para ir a otros teleporters activados.
Delve into the shadows.=Adéntrate en las sombras.
Activate the teleporter further south-east.=Activa el teleporter más al sureste.
Activate the teleporter to the south in the Science District.=Activa el teleporter al sur del Science District.
Activate the teleporter in the far south of the Science District.=Activa el teleporter del extremo sur del Science District.
Teleport back to the Plaza, then run east. Activate the teleporter in the north-west of the residential area.=Vuelve en teleporter a la Plaza y corre al este. Activa el teleporter del noroeste de la zona residencial.
Activate the teleporter in the south of the residential area.=Activa el teleporter del sur de la zona residencial.
Activate the teleporter in the far east of the residential area, through the building you unlocked for the idol.=Activa el teleporter del extremo este de la zona residencial, a través del edificio que desbloqueaste para el ídolo.
Use the teleporter to the Western Residential District.=Usa el teleporter al Western Residential District.
Enter the north-western building in the Science District, and take the Shadow Schematic which is on top of a barrel in there.=Entra en el edificio del noroeste del Science District y coge el Shadow Schematic que está encima de un barril.
Take the shadow key from the north-western room of the Science District.=Coge la shadow key de la sala noroeste del Science District.
Take the shadow key from the building to the south.=Coge la shadow key del edificio al sur.
Run south-east to try and enter the Sunken Cathedral.=Corre al sureste e intenta entrar en el Sunken Cathedral.
Talk to Ketla, next to the Western Residential District teleport.=Habla con Ketla, junto al teleporter del Western Residential District.
Give the blocker schematic to Ketla, next to the Western Residential District teleport.=Entrega el blocker schematic a Ketla, junto al teleporter del Western Residential District.
Get the Shadow Blocker from the workbench next to Ketla, or use 'Recall' on your Blackstone fragment to retrieve it.=Coge el Shadow Blocker del workbench junto a Ketla, o usa 'Recall' en tu Blackstone fragment para recuperarlo.
Return to the Science District, and enter the building with furnaces in it. Place the Shadow Blocker next to the locked doors inside.=Vuelve al Science District y entra en el edificio con hornos. Coloca el Shadow Blocker junto a las puertas cerradas de dentro.
Teleport to the Southern Science District.=Teletranspórtate al Southern Science District.
Pick up the shadow blocker.=Coge el shadow blocker.
Right-click and select 'Recall' on the blackstone fragment to recall everything.=Haz clic derecho y selecciona 'Recall' en el blackstone fragment para recuperarlo todo.
Enter the puddle outside of the building with furnaces in it. When you're in the Shadow Realm, you will slowly lose sanity. If you're low on Sanity, you can escape using the Blackstone fragment.=Entra en el charco fuera del edificio con hornos. Cuando estés en el Shadow Realm, perderás cordura lentamente. Si tienes poca Sanity, puedes escapar usando el Blackstone fragment.
Unlock the door inside the furnace building. As long as you're directly next to the Shadow Blocker you placed you will be safe from lost souls.=Desbloquea la puerta dentro del edificio de los hornos. Mientras estés directamente junto al Shadow Blocker que colocaste, estarás a salvo de las almas perdidas.
Take the basic shadow torch schematic.=Coge el basic shadow torch schematic.
Activate the blackstone fragment to leave.=Activa el blackstone fragment para salir.
Bring the basic shadow torch schematic to Ketla, next to the Western Residential District teleport.=Lleva el basic shadow torch schematic a Ketla, junto al teleporter del Western Residential District.
Get the Shadow Torch from the workbench next to Ketla, or recall it with the blackstone fragment.=Coge el Shadow Torch del workbench junto a Ketla, o recupéralo con el blackstone fragment.
Enter the puddle south-east of Ketla.=Entra en el charco al sureste de Ketla.
Destroy the tentacles outside the building to the east.=Destruye los tentáculos fuera del edificio al este.
Activate the blackstone fragment to leave the Shadow Realm.=Activa el blackstone fragment para salir del Shadow Realm.
Take the revitalising idol schematic from inside the house.=Coge el revitalising idol schematic del interior de la casa.
Bring the basic revitalising idol schematic to Ketla, next to the Western Residential District teleport.=Lleva el basic revitalising idol schematic a Ketla, junto al teleporter del Western Residential District.
Get the revitalising idol from the workbench next to Ketla, or recall it with the blackstone fragment.=Coge el revitalising idol del workbench junto a Ketla, o recupéralo con el blackstone fragment.
Place the idol by the teleporter.=Coloca el ídolo junto al teleporter.
Pick up the revitalising idol.=Coge el revitalising idol.
Run around through the building and up north, making sure to RESTORE SANITY AT THE IDOL. Destroy the tentacles blocking the door at the end of the path.=Corre por el edificio y sube al norte, asegurándote de RECUPERAR CORDURA EN EL ÍDOLO. Destruye los tentáculos que bloquean la puerta al final del camino.
Grab the shadow key in the room you've just unlocked.=Coge la shadow key de la sala que acabas de desbloquear.
Right-click and select 'Recall' on the blackstone fragment to recall all your devices.=Haz clic derecho y selecciona 'Recall' en el blackstone fragment para recuperar todos tus dispositivos.
Return to the west residential area, and place the shadow blocker at the pub's entrance.=Vuelve a la zona residencial oeste y coloca el shadow blocker en la entrada del pub.
Open the pub's doors.=Abre las puertas del pub.
Take the superior torch schematic.=Coge el superior torch schematic.
Enter the pub and claim the superior torch schematic.=Entra en el pub y reclama el superior torch schematic.
Bring the superior shadow torch schematic to Ketla, next to the Western Residential District teleport.=Lleva el superior shadow torch schematic a Ketla, junto al teleporter del Western Residential District.
Get the superior shadow torch from the workbench next to Ketla, or recall it with the blackstone fragment.=Coge el superior shadow torch del workbench junto a Ketla, o recupéralo con el blackstone fragment.
Enter the puddle outside of the building with furnaces in it in the Science District.=Entra en el charco fuera del edificio con hornos del Science District.
Go to the north-west of the science district, and burn the tentacles there to grab the Anima portal schematic.=Ve al noroeste del science district y quema los tentáculos para coger el Anima portal schematic.
Bring the anima portal schematic to Ketla, next to the Western Residential District teleport.=Lleva el anima portal schematic a Ketla, junto al teleporter del Western Residential District.
Get the anima portal from the workbench next to Ketla, or recall it with the blackstone fragment.=Coge el anima portal del workbench junto a Ketla, o recupéralo con el blackstone fragment.
Enter the puddle on the Plaza.=Entra en el charco de la Plaza.
Destroy the tentacles in front of the building to the south of the Plaza.=Destruye los tentáculos frente al edificio al sur de la Plaza.
Get the shadow key from the house.=Coge la shadow key de la casa.
Return to the palace in the north-west. Face the marked tile and place the shadow blocker to place it onto the marked tile.=Vuelve al palacio del noroeste. Mira la casilla marcada y coloca el shadow blocker para ponerlo en la casilla marcada.
Face the marked tile and place the anima portal to place it onto the marked tile.=Mira la casilla marcada y coloca el anima portal para ponerlo en la casilla marcada.
Face the marked tile and place the idol to place it into the marked tile.=Mira la casilla marcada y coloca el ídolo para ponerlo en la casilla marcada.
Run to the chest in the shadow realm, and use the revitalising idol to increase your Sanity. Light the 4 braziers near the chest.=Corre al cofre del shadow realm y usa el revitalising idol para aumentar tu Sanity. Enciende los 4 braseros junto al cofre.
Restore sanity with the revitalizing idol.=Recupera cordura con el revitalizing idol.
Open the chest in the palace.=Abre el cofre del palacio.
Bring the perfected shadow torch schematic to Ketla, next to the Western Residential District teleport.=Lleva el perfected shadow torch schematic a Ketla, junto al teleporter del Western Residential District.
Go upstairs in the pub.=Sube las escaleras del pub.
Touch the remnant in the north-east room.=Toca el remnant de la sala noreste.
Enter the puddle south-east of Ketla again once your Sanity has returned.=Entra en el charco al sureste de Ketla de nuevo cuando tu Sanity haya vuelto.
Burn the tentacles outside the house to the south-west.=Quema los tentáculos fuera de la casa al suroeste.
Burn the tentacles outside the house to the west.=Quema los tentáculos fuera de la casa al oeste.
Get the shadow key from the south-west house you can now enter.=Coge la shadow key de la casa suroeste a la que ahora puedes entrar.
Place the shadow blocker in the square building you made accessible, next to the chest.=Coloca el shadow blocker en el edificio cuadrado que has hecho accesible, junto al cofre.
Enter the puddle south-east of Ketla again.=Entra en el charco al sureste de Ketla de nuevo.
Open the chest in the square building.=Abre el cofre del edificio cuadrado.
Go to the Southern Science District and enter the puddle there.=Ve al Southern Science District y entra en el charco de allí.
Destroy the tentacles outside the small house to the south.=Destruye los tentáculos fuera de la casita al sur.
Open the chest in the small house to the south.=Abre el cofre de la casita al sur.
Combine the icon halves.=Combina las mitades del icono.
Enter the drain in the middle of the Residential District.=Entra en el desagüe en el centro del Residential District.
Go through the gate.=Cruza la puerta.
Go down the ladder to the east.=Baja por la escalera al este.
Inspect the Ancient Pillar.=Inspecciona el Ancient Pillar.
Talk to yourself.=Habla contigo mismo.
Get the perfect shadow torch from the workbench next to Ketla, or recall it with the blackstone fragment.=Coge el perfect shadow torch del workbench junto a Ketla, o recupéralo con el blackstone fragment.
Enter the puddle south-east of Ketla for the final time.=Entra en el charco al sureste de Ketla por última vez.
Destroy the tentacles at the Cathedral to the south.=Destruye los tentáculos de la Cathedral al sur.
Gear up for the boss fight, and then enter the Cathedral. Disturb the Odd Figure to start the fight. View the sidebar for more details.=Equípate para la pelea del jefe y luego entra en la Cathedral. Perturba al Odd Figure para empezar el combate. Consulta la barra lateral para más detalles.
Enter Camdozaal, west of Ice Mountain, ready to fight The Whisperer.=Entra en Camdozaal, al oeste de Ice Mountain, preparado para luchar contra The Whisperer.
Gear up, then disturb the Odd Figure in the Cathedral. The Whisperer will attack with magic and ranged attacks, and use a homing tentacle attack after each one. Protect appropriately, and move to avoid the tentacle splashes.=Equípate y luego perturba al Odd Figure en la Cathedral. The Whisperer atacará con ataques mágicos y a distancia, y usará un ataque de tentáculo teledirigido después de cada uno. Usa la protección adecuada y muévete para evitar las salpicaduras del tentáculo.
At 1/3rd health, she will cast a special attack:=Al 1/3 de salud, lanzará un ataque especial:
Soul Siphon: Activate the blackstone fragment in your inventory. 12 souls spawn. Kill them to avoid the Whisperer dealing a massive hit.=Soul Siphon: activa el blackstone fragment de tu inventario. Aparecen 12 almas. Mátalas para evitar que The Whisperer inflija un golpe masivo.
Corrupted seeds: Activate the blackstone fragment in your inventory. Avoid the dark green seeds, and step on the light green ones.=Corrupted seeds: activa el blackstone fragment de tu inventario. Evita las semillas verde oscuro y pisa las verde claro.
Screech: Pillars appear, which you must hide behind to avoid damage.=Screech: aparecen pilares tras los que debes esconderte para evitar el daño.
After each special attack, the Whisperer fire out a binding spell if you are within 10 tiles of her, dealing Melee damage.=Después de cada ataque especial, The Whisperer lanza un hechizo de inmovilización si estás a 10 casillas o menos de ella, infligiendo daño de melee.
When she hits 0 health, she will heal back to 100, and start attacking rapidly, starting with ranged, and alternating every two attacks until the fight ends. Finish her off.=Cuando llegue a 0 de salud, se curará hasta 100 y empezará a atacar rápidamente, comenzando con ataques a distancia y alternando cada dos ataques hasta que termine la pelea. Acaba con ella.
Search the entrails dropped by the Whisperer.=Registra las entrañas que suelta The Whisperer.
Use the medallion on the north-west statue.=Usa el medallón en la estatua del noroeste.
