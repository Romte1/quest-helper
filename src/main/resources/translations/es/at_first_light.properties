# Spanish translations for At First Light.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Requirements and tooltips
You can buy one from Imia in the north of the Hunter Guild's surface area for 41gp.=Puedes comprarle uno a Imia en el norte de la superficie del Hunter Guild por 41 gp.
Jerboa tail, or a box trap to get some=Jerboa tail, o un box trap para conseguir una
2 Jerboa tails, or a box trap to get some=2 Jerboa tails, o un box trap para conseguir algunas

# Steps
Talk to Guildmaster Apatura in the Hunter Guild, south-west of Civitas illa Fortis.=Habla con Guildmaster Apatura en el Hunter Guild, al suroeste de Civitas illa Fortis.
Go down the stairs in the tree in the guild.=Baja las escaleras del árbol del guild.
Talk to Guild Scribe Verity behind the bar.=Habla con Guild Scribe Verity detrás de la barra.
Talk to Guild Hunter Wolf (Master), next to the bar.=Habla con Guild Hunter Wolf (Master), junto a la barra.
Wind up a toy mouse.=Dale cuerda a un toy mouse.
Use the wound up toy mouse on Guild Hunter Kiko near the bar.=Usa el toy mouse dado cuerda en Guild Hunter Kiko, junto a la barra.
Check the cat's bed.=Revisa la cama del gato.
Return to Guild Hunter Wolf (Master), next to the bar.=Vuelve con Guild Hunter Wolf (Master), junto a la barra.
Go back up the stairs.=Vuelve a subir las escaleras.
Get a box trap. You can buy one from Imia in the north of the Hunter Guild's surface for 41gp.=Consigue un box trap. Puedes comprarle uno a Imia en el norte de la superficie del Hunter Guild por 41 gp.
Talk to Guild Hunter Fox near the crevice south-east of the Hunter Guild.=Habla con Guild Hunter Fox junto a la grieta al sureste del Hunter Guild.
Search the leafy bush south of the crevice for a smooth leaf.=Busca una smooth leaf en el arbusto frondoso al sur de la grieta.
Search the rough-looking bush on the west side of the Locus Oasis.=Busca en el arbusto de aspecto áspero del lado oeste del Locus Oasis.
Catch two Embertailed Jerboa for their tails.=Atrapa dos Embertailed Jerboa para conseguir sus colas.
Use the tails on the leaves.=Usa las colas en las hojas.
Bring the poultice back to Guild Hunter Fox near the crevice.=Lleva el poultice de vuelta a Guild Hunter Fox, junto a la grieta.
Talk to Guild Hunter Fox.=Habla con Guild Hunter Fox.
Talk to Atza in one of the buildings outside Civitas illa Fortis' south wall, west of the general store.=Habla con Atza en uno de los edificios a las afueras de la muralla sur de Civitas illa Fortis, al oeste de la tienda general.
Set-up the pile of equipment next to Atza.=Monta el montón de equipo junto a Atza.
Talk to Atza again for some trimmed fur.=Habla con Atza de nuevo para conseguir trimmed fur.
Return to Guild Hunter Fox near the crevice south-east of the Hunter Guild to get his report.=Vuelve con Guild Hunter Fox, junto a la grieta al sureste del Hunter Guild, para conseguir su informe.
Return back to Fox to get his report.=Vuelve con Fox para conseguir su informe.
Go down the stairs in the tree in the Hunters Guild.=Baja las escaleras del árbol del Hunters Guild.
Talk to Guild Scribe Verity behind the bar again.=Habla con Guild Scribe Verity detrás de la barra de nuevo.
Take the needle in the Hunter Guild's surface area, in its south-east corner.=Coge la needle de la superficie del Hunter Guild, en su esquina sureste.
Use a jerboa tail on the cat bed.=Usa una jerboa tail en la cama del gato.
Take a hammer from the house north of Atza.=Coge un hammer de la casa al norte de Atza.
Go back up the stairs and talk to Guildmaster Apatura to finish the quest.=Sube de nuevo las escaleras y habla con Guildmaster Apatura para terminar la misión.
Talk to Guildmaster Apatura to finish the quest.=Habla con Guildmaster Apatura para terminar la misión.

