# Spanish translations for Secrets of the North.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Requirements and tooltips
Combat Gear=Equipo de combate
Food=Comida
You can get another from the chest in the north of the central room of the puzzle area=Puedes conseguir otra del cofre del norte de la sala central de la zona del puzle

# Steps
Talk to the guard outside of the Carnillean Mansion in East Ardougne.=Habla con el guardia a las afueras de la Carnillean Mansion en East Ardougne.
Climb the stairs in Carnillean Mansion and talk to the guard there.=Sube las escaleras de la Carnillean Mansion y habla con el guardia de allí.
Talk to the guard.=Habla con el guardia.
Inspect Ceril Carnillean's body.=Inspecciona el cuerpo de Ceril Carnillean.
Knock-at the wall on the North side of the room.=Golpea la pared del lado norte de la habitación.
Inspect the broken Window on the East side of the room.=Inspecciona la ventana rota del lado este de la habitación.
Climb the Ladder.=Sube la escalera.
Inspect the chest.=Inspecciona el cofre.
Descend the ladder and talk to the guard about what you've found.=Baja la escalera y habla con el guardia sobre lo que has encontrado.
Tell the guard about what you found.=Cuéntale al guardia lo que has encontrado.
Climb down the staircase.=Baja la escalera.
Head to the Fight Arena Bar and talk to the Khazard Barman.=Ve al Fight Arena Bar y habla con el Khazard Barman.
Inspect the barrels outside the Fight Arena Bar entrance.=Inspecciona los barriles de la entrada del Fight Arena Bar.
Inspect the boulder to the north.=Inspecciona la roca del norte.
Continue north and inspect the bush there.=Continúa hacia el norte e inspecciona el arbusto de allí.
Inspect the stump to the east.=Inspecciona el tocón del este.
Inspect the boulder to the south east.=Inspecciona la roca del sureste.
Inspect the bush to the east.=Inspecciona el arbusto del este.
Approach Evelot to the east to start the fight.\n\nProtect from melee and reactivate prayer after she special attacks.=Acércate a Evelot por el este para empezar la lucha.\n\nUsa Protect from Melee y reactiva la protección después de sus ataques especiales.
Talk to Evelot again after the fight.=Habla con Evelot de nuevo tras la lucha.
Enter the cave that leads to the Ardougne sewers, near the Clock Tower.=Entra en la cueva que lleva a las alcantarillas de Ardougne, cerca del Clock Tower.
Board the raft.=Súbete a la balsa.
Talk to Alomone or Clivet inside the cult area.=Habla con Alomone o Clivet dentro de la zona del culto.
Talk to Hazeel.=Habla con Hazeel.
Return to the Carnillean Mansion.=Vuelve a la Carnillean Mansion.
Return to the Carnillean Mansion and speak to the Guard.=Vuelve a la Carnillean Mansion y habla con el guardia.
Climb down the ladder into the basement of the mansion.=Baja la escalera hasta el sótano de la mansión.
Talk to Claus the Chef.=Habla con Claus the Chef.
Search the cooking shelves for a button.=Busca un botón en los estantes de la cocina.
Inspect the wall next to the noticeboard.=Inspecciona la pared junto al tablón de anuncios.
Picklock the chest.=Abre el cofre con una ganzúa.
Green means it's the right number and position.=Verde significa que el número y la posición son correctos.
Blue means it's the right position but wrong number.=Azul significa que la posición es correcta pero el número no.
The puzzle's solution does not change attempt to attempt.=La solución del puzle no cambia entre intentos.
Inspect the dusty scroll.=Inspecciona el dusty scroll.
Return to Hazeel and tell him about the scroll.=Vuelve con Hazeel y cuéntale lo del pergamino.
Talk to Big Fish at the north entrance to Weiss.=Habla con Big Fish en la entrada norte de Weiss.
Talk to Big Fish (Hazeel) at the north entrance to Weiss again.=Habla con Big Fish (Hazeel) de nuevo en la entrada norte de Weiss.
Talk to Snowflake.=Habla con Snowflake.
Prepare for a fight and climb down the stairs in the middle of Weiss.=Prepárate para luchar y baja las escaleras del centro de Weiss.
Enter the cave to the south.=Entra en la cueva del sur.
Defeat the assassin.=Derrota al assassin.
Put the Assassin in the smoke bombs so you can hit him and dodge the poison vials he throws out.=Mete al Assassin en las bombas de humo para poder golpearlo y esquivar los viales de veneno que lanza.
Talk to General Khazard.=Habla con General Khazard.
Talk to Hazeel to the west and tell him about what happened.=Habla con Hazeel al oeste y cuéntale lo que ha pasado.
Search the barrel south of the room you fought the assassin.=Registra el barril al sur de la sala donde luchaste contra el assassin.
Enter the centre room. Use the code "BLOOD" to unlock the gate.=Entra en la sala central. Usa el código "BLOOD" para desbloquear la puerta.
Unlock the gate to the centre room by working out the correct code.=Desbloquea la puerta de la sala central averiguando el código correcto.
Work out and enter the code to the central room's gate.=Averigua e introduce el código de la puerta de la sala central.
Open the north chest using the code "7402".=Abre el cofre del norte usando el código "7402".
Open the north chest after working out the code for it.=Abre el cofre del norte tras averiguar su código.
Open the north chest after working out its code.=Abre el cofre del norte tras averiguar su código.
Get a tinderbox from the crate in the west of the central room.=Coge un tinderbox de la caja del oeste de la sala central.
Light the North West Brazier.=Enciende el brasero del noroeste.
Light the South East Brazier.=Enciende el brasero del sureste.
Light the North East Brazier.=Enciende el brasero del noreste.
Light the South West Brazier.=Enciende el brasero del suroeste.
Open the western chest.=Abre el cofre del oeste.
Open the north gate using the code LEFT - UP - LEFT - DOWN.=Abre la puerta del norte usando el código LEFT - UP - LEFT - DOWN.
Open the north gate using a code you can work out.=Abre la puerta del norte usando un código que puedes averiguar.
Use the handle on the lever mechanism=Usa el lever handle en el mecanismo de palanca
Pull the lever.=Tira de la palanca.
Inspect the south west pillar in the room where you fought the assassin.=Inspecciona el pilar del suroeste de la sala donde luchaste contra el assassin.
Use the jewel shards on one another.=Usa los jewel shards entre sí.
Use the ancient jewel on the icy chest.=Usa el ancient jewel en el icy chest.
Open the gate near the barrel you found the lever handle in.=Abre la puerta junto al barril donde encontraste el lever handle.
Resupply if you haven't already. Prepare yourself for a challenging fight then enter the crevice.=Repón suministros si aún no lo has hecho. Prepárate para una lucha difícil y entra en la grieta.
Defeat the Strange Creature.=Derrota a la Strange Creature.
Speak to Jhallan in the Muspah room.=Habla con Jhallan en la sala del Muspah.
Talk to Hazeel inside the ruins for a teleport to Ardougne.=Habla con Hazeel dentro de las ruinas para que te teletransporte a Ardougne.
Return to the guard outside of the Carnillean Mansion in East Ardougne to finish the quest. Talk to Hazeel for a teleport to Ardougne.=Vuelve con el guardia a las afueras de la Carnillean Mansion en East Ardougne para terminar la misión. Habla con Hazeel para que te teletransporte a Ardougne.
Click the highlighted arrows to move the slots to the solution 'BLOOD'.=Haz clic en las flechas resaltadas para llevar las ranuras a la solución 'BLOOD'.
Solve the arrow puzzle by clicking them in the right order.=Resuelve el puzle de flechas haciéndoles clic en el orden correcto.

