# Spanish translations for Shadows of Custodia.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Combat gear=Equipo de combate
Teleport to Auburnvale (Fairy ring AIS)=Teletranspórtate a Auburnvale (Fairy ring AIS)
Can be obtained during the quest, south-west of the area where you need it.=Se puede obtener durante la misión, al suroeste de la zona donde lo necesitas.
This state should not be reachable, please make a report with a screenshot in the Quest Helper discord.=No deberías poder llegar a este estado; informa del problema con una captura de pantalla en el Discord de Quest Helper.
Read the noticeboard in the Auburnvale bar to start the quest.=Lee el tablón de anuncios en el bar de Auburnvale para empezar la misión.
Talk to Marcus in the Auburnvale bar.=Habla con Marcus en el bar de Auburnvale.
Talk to the Bartender in the Auburnvale bar.=Habla con el Bartender en el bar de Auburnvale.
Talk to the Shopkeep in the Auburnvale General store.=Habla con el Shopkeep en la Auburnvale General store.
Talk to Ictus, north of the Auburnvale Quetzal.=Habla con Ictus, al norte del Auburnvale Quetzal.
Talk to citizens of Auburnvale about the missing people.=Habla con los ciudadanos de Auburnvale sobre los desaparecidos.
Talk to Aemilia and Francis, north of the Auburnvale General store, about their missing sons.=Habla con Aemilia y Francis, al norte de la Auburnvale General store, sobre sus hijos desaparecidos.
Inspect the wall outside Aemilia and Francis' house.=Inspecciona el muro frente a la casa de Aemilia y Francis.
Inspect the puddle outside Aemilia and Francis' house.=Inspecciona el charco frente a la casa de Aemilia y Francis.
Follow the puddle trail and inspect the plank in the river, west of Auburnvale.=Sigue el rastro de charcos e inspecciona la tabla en el río, al oeste de Auburnvale.
Return to Aemilia and Francis' house, north of the Auburnvale General store, and talk to them about the cloth you found.=Vuelve a la casa de Aemilia y Francis, al norte de la Auburnvale General store, y háblales sobre la tela que encontraste.
Follow the trail west of the city, then through the mountains, and enter the cave.=Sigue el rastro al oeste de la ciudad, luego por las montañas, y entra en la cueva.
Talk to the Injured boy inside the cave.=Habla con el Injured boy dentro de la cueva.
Return to Aemilia and Francis's house, north of the Auburnvale General store, and tell them you found their missing boys.=Vuelve a la casa de Aemilia y Francis, al norte de la Auburnvale General store, y diles que encontraste a sus hijos desaparecidos.
Reinforce the wall outside Aemilia and Francis' house.=Refuerza el muro frente a la casa de Aemilia y Francis.
Talk to Captain Ariadna, south-west of the Auburnvale General store, and inform her about the missing people.=Habla con Captain Ariadna, al suroeste de la Auburnvale General store, e infórmale sobre los desaparecidos.
Climb upstairs of Aemilia and Francis' house and talk to Etz.=Sube a la planta superior de la casa de Aemilia y Francis y habla con Etz.
Talk to Etz, upstairs of Aemilia and Francis' house, about what he remembers.=Habla con Etz, en la planta superior de la casa de Aemilia y Francis, sobre lo que recuerda.
Climb downstairs, then head back to the cave.=Baja las escaleras y vuelve a la cueva.
Kill the strange creatures. Protect from Melee works to avoid most damage.=Mata a las extrañas criaturas. Protect from Melee sirve para evitar la mayor parte del daño.
Talk to Antos in the eastern part of the cave, ready to fight three Strange creatures. Protect from Melee works to avoid all damage.=Habla con Antos en la parte este de la cueva, listo para luchar contra tres Strange creatures. Protect from Melee sirve para evitar todo el daño.
Talk to Captain Ariadna in Auburnvale to finish the quest!=Habla con Captain Ariadna en Auburnvale para terminar la misión.
3 Strange creatures (level 93)=3 Strange creatures (nivel 93)
Access to the Custodia Pass Slayer Dungeon=Acceso a la Custodia Pass Slayer Dungeon
Starting off=Empezando
Hunting the trail=Siguiendo el rastro
Inform the authorities=Informa a las autoridades
Save Antos=Salva a Antos
