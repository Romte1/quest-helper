# Spanish translations for Goblin Diplomacy.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can have Aggie in Draynor Village make you some for 2 woad leaves (bought from Wyson in Falador Park for 20 coins) and 5 coins.=Puedes hacer que Aggie en Draynor Village te prepare algunas por 2 woad leaves (compradas a Wyson en Falador Park por 20 coins) y 5 coins.
This is made from red dye and yellow dye. Bring Aggie in Draynor Village 3 redberries and 5 coins for red dye, then 2 onions and 5 coins for yellow dye.=Esto se hace con red dye y yellow dye. Lleva a Aggie en Draynor Village 3 redberries y 5 coins para red dye, y luego 2 onions y 5 coins para yellow dye.
You can get goblin mail by killing goblins around goblin village.=Puedes conseguir goblin mail matando goblins alrededor de goblin village.
You need three goblin mails, which you can find around the Goblin Village. The first is up the ladder in a crate in the south of the village.=Necesitas tres goblin mails, que puedes encontrar alrededor del Goblin Village. La primera está arriba de la escalera, en una caja al sur del pueblo.
Search the crate up the ladder.=Busca en la caja arriba de la escalera.
Go back down the ladder.=Vuelve a bajar la escalera.
Search the crate in the west of Goblin Village for Goblin Mail.=Busca en la caja al oeste del Goblin Village para conseguir Goblin Mail.
The second goblin mail can be found in the west hut in a crate.=La segunda goblin mail está en la cabaña del oeste, en una caja.
Search the crate north of the General's hut in Goblin Village.=Busca en la caja al norte de la cabaña del General en Goblin Village.
The last goblin mail is north of the generals' hut in a crate.=La última goblin mail está al norte de la cabaña de los generals, en una caja.
Use the blue dye on one of the goblin mail.=Usa el blue dye en una de las goblin mail.
Use the orange dye on one of the goblin mail.=Usa el orange dye en una de las goblin mail.
Talk to one of the Goblin Generals in Goblin Village.=Habla con uno de los Goblin Generals en Goblin Village.
Talk to one of the Goblin Generals in Goblin Village again.=Habla de nuevo con uno de los Goblin Generals en Goblin Village.
Talk to one of the Goblin Generals in Goblin Village once more.=Habla una vez más con uno de los Goblin Generals en Goblin Village.
Prepare goblin mail=Prepara goblin mail
Present the armours=Presenta las armours
