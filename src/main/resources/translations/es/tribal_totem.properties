# Spanish translations for Tribal Totem.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Kangai Mau in the Brimhaven food store.=Habla con Kangai Mau en la tienda de comida de Brimhaven.
Travel to the GPDT depot in Ardougne and investigate the most northeastern crate for a label.=Viaja al GPDT depot en Ardougne e investiga el cajón más al noreste para encontrar una label.
Use the label on the highlighted crate.=Usa la label en el cajón resaltado.
Talk to a nearby GPDT employee.=Habla con un GPDT employee cercano.
Talk to Wizard Cromperty in north east Ardougne.=Habla con Wizard Cromperty al noreste de Ardougne.
Work out and enter the password for the door to the west.=Averigua e introduce la contraseña de la puerta al oeste.
Try and open the door to the west. The password is 'KURT', (K\=10 right, U\=6 left, R\=9 left, T\=7 left)=Intenta abrir la puerta al oeste. La contraseña es 'KURT', (K\=10 derecha, U\=6 izquierda, R\=9 izquierda, T\=7 izquierda)
FIRST Right-click 'Investigate' the stairs to disable a trap, then climb the stairs.=PRIMERO haz clic derecho en 'Investigate' las escaleras para desactivar una trampa, y luego sube las escaleras.
Open the chest on the top floor and search it for the totem.=Abre el cofre del último piso y busca en él el totem.
Travel back to Brimhaven.=Vuelve a Brimhaven.
Return to Kangai Mau in Brimhaven.=Vuelve con Kangai Mau en Brimhaven.
Retrieving the totem=Recuperar el totem
Click the highlighted arrows to move the slots to the solution 'KURT'.=Haz clic en las flechas resaltadas para mover las ranuras hasta la solución 'KURT'.
