# Spanish translations for Desert Medium Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Steps
Enter the cave at the top of Eagles' Peak. You can use a fairy ring to (AKQ), then head south to get there easily.=Entra en la cueva de la cima de Eagles' Peak. Puedes usar un fairy ring (AKQ) y luego ir hacia el sur para llegar fácilmente.
Use a rope on the Desert Eagle to travel to the Desert area.=Usa una rope en el Desert Eagle para viajar a la zona del desierto.
Talk to the rug merchant and travel to Uzer.=Habla con el rug merchant y viaja a Uzer.
Pluck a feather from a Desert Phoenix.=Arranca una pluma de un Desert Phoenix.
Setup a net trap and catch an Orange Salamander in the Uzer hunting area.=Coloca una net trap y pesca un Orange Salamander en la zona de caza de Uzer.
Create a combat potion in the desert. Note: Do not be within a city.=Crea una combat potion en el desierto. Nota: no estés dentro de una ciudad.
Enter the desert and be out of any city limits (You must be losing health or water from the heat).=Entra en el desierto y sal de los límites de cualquier ciudad (debes estar perdiendo salud o agua por el calor).
Chop some teak logs near Uzer.=Tala unos teak logs cerca de Uzer.
Use an Ice cooler on a low hp Lizard in the desert.=Usa un Ice cooler en un Lizard con poca vida en el desierto.
Pray at the Elidinis Statuette in Nardah. If it doesn't complete expend some prayer points then try again.=Reza en la Elidinis Statuette de Nardah. Si no se completa, gasta algunos prayer points y vuelve a intentarlo.
Visit the genie.=Visita al genie.
Climb down the crevice west of Nardah.=Baja por la grieta al oeste de Nardah.
Talk to Simon Templeton.=Habla con Simon Templeton.
Go to the Agility Pyramid.=Ve a la Agility Pyramid.
Climb the Agility Pyramid and collect the pyramid top. Be sure to click continue in the dialog.=Sube a la Agility Pyramid y recoge la pyramid top. Asegúrate de hacer clic en continuar en el diálogo.
Teleport to Enakhra's Temple with the Camulet.=Teletranspórtate al Enakhra's Temple con el Camulet.
Move your house to Pollnivneach, then enter your house there.=Traslada tu casa a Pollnivneach y entra en ella allí.
Teleport to Pollnivneach with a redirected house tablet.=Teletranspórtate a Pollnivneach con una redirected house tablet.
Talk to Jarr at the Shantay pass to claim your reward!=¡Habla con Jarr en el Shantay pass para reclamar tu recompensa!

