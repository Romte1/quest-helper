# Spanish translations for Eadgar's Ruse.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Travel to Eadgar=Viaja hasta Eadgar
You can make these by using a knife on a pineapple=Puedes hacerlas usando un knife en una pineapple
You can buy some from the Gnome Stronghold drinks shop=Puedes comprar algo en la tienda de bebidas del Gnome Stronghold
You can cut a pineapple into chunks with a knife=Puedes cortar una pineapple en trozos con un knife
You can get another by using alco-chunks on the aviary hatch of the parrot cage in Ardougne Zoo=Puedes conseguir otro usando alco-chunks en la trampilla del aviario de la jaula de loros del zoo de Ardougne
You can get another by talking to Eadgar=Puedes conseguir otro hablando con Eadgar
If you lost the parrot Eadgar will have it=Si perdiste el loro, Eadgar lo tendrá
You can get another from Eadgar if you lose it=Puedes conseguir otro de Eadgar si lo pierdes
Talk to Sanfew upstairs in the Taverley herblore store.=Habla con Sanfew en la planta de arriba de la tienda de herbolario de Taverley.
Get some climbing boots or 12 coins.=Consigue unas climbing boots o 12 coins.
Follow the path west of Burthorpe, then go along the path going south.=Sigue el camino al oeste de Burthorpe y luego el camino que va hacia el sur.
Follow the path west of Burthorpe, then go along the path going south. Buy some climbing boots from Tenzing in his hut here.=Sigue el camino al oeste de Burthorpe y luego el camino que va hacia el sur. Compra unas climbing boots a Tenzing en su cabaña de aquí.
Climb over the stile north of Tenzing.=Cruza el stile al norte de Tenzing.
Follow the path until you reach some rocks. Climb over them.=Sigue el camino hasta llegar a unas rocas. Sube por encima de ellas.
Enter the Secret Door to the Troll Stronghold.=Entra en la Secret Door del Troll Stronghold.
Pickpocket or kill Berry for a cell key.=Carterea o mata a Berry para conseguir una cell key.
Kill Berry for a cell key.=Mata a Berry para conseguir una cell key.
Unlock Eadgar's cell.=Abre la celda de Eadgar.
Go up the stairs from the prison.=Sube las escaleras desde la prisión.
Go up to the next floor of the Stronghold.=Sube al siguiente piso del Stronghold.
Leave the Stronghold.=Sal del Stronghold.
Climb to the top of Trollheim and enter Eadgar's cave.=Sube a la cima de Trollheim y entra en la cueva de Eadgar.
Talk to Eadgar.=Habla con Eadgar.
Leave Eadgar's cave.=Sal de la cueva de Eadgar.
Enter the Troll Stronghold.=Entra en el Troll Stronghold.
Go down the south staircase.=Baja por la escalera sur.
Talk to Burntmeat.=Habla con Burntmeat.
Talk to Eadgar in his cave on top of Trollheim.=Habla con Eadgar en su cueva en lo alto de Trollheim.
Travel to Ardougne Zoo and talk to Parroty Pete. Ask him both question 2 and 3, then use the vodka on the pineapple chunks.=Ve al zoo de Ardougne y habla con Parroty Pete. Hazle las preguntas 2 y 3, y luego usa el vodka en las pineapple chunks.
Travel to Ardougne Zoo and talk to Parroty Pete. Ask him question 2 then use the vodka on the pineapple chunks.=Ve al zoo de Ardougne y habla con Parroty Pete. Hazle la pregunta 2 y luego usa el vodka en las pineapple chunks.
Travel to Ardougne Zoo and talk to Parroty Pete. Ask him question 3 then use the vodka on the pineapple chunks.=Ve al zoo de Ardougne y habla con Parroty Pete. Hazle la pregunta 3 y luego usa el vodka en las pineapple chunks.
Use vodka on your pineapple chunks=Usa vodka en tus pineapple chunks
Use the alco-chunks on the aviary hatch of the parrot cage.=Usa las alco-chunks en la trampilla del aviario de la jaula de los loros.
Return the parrot to Eadgar on top of Trollheim.=Devuelve el loro a Eadgar en lo alto de Trollheim.
Take the parrot to the Troll Stronghold prison.=Lleva el loro a la prisión del Troll Stronghold.
Take the parrot to the Troll Stronghold prison, and hide it in the rack there.=Lleva el loro a la prisión del Troll Stronghold y escóndelo en el rack de allí.
Use the parrot on a rack in the prison.=Usa el loro en un rack de la prisión.
Talk to Tegid in the south of Taverley for a dirty robe. Once you have it, return to Eadgar with all the items he needs.=Habla con Tegid en el sur de Taverley para conseguir una dirty robe. Cuando la tengas, vuelve con Eadgar con todos los objetos que necesita.
Bring Eadgar all the listed items. Check the quest log if you're not sure what items you've already handed in.=Lleva a Eadgar todos los objetos de la lista. Consulta el diario de misiones si no estás seguro de qué objetos ya has entregado.
Go pick a troll thistle from outside Eadgar's cave.=Ve a coger un troll thistle del exterior de la cueva de Eadgar.
Light a fire then use the troll thistle on it.=Enciende un fuego y luego usa el troll thistle en él.
Use the troll thistle on the fire.=Usa el troll thistle en el fuego.
Use the troll thistle on one of the fire outside the Troll Stronghold.=Usa el troll thistle en uno de los fuegos del exterior del Troll Stronghold.
Use the pestle and mortar on the dried thistle=Usa el pestle and mortar en el dried thistle
Use the ground thistle on a ranarr potion (unf)=Usa el ground thistle en una ranarr potion (unf)
Bring Eadgar the troll potion.=Lleva a Eadgar la troll potion.
Get the parrot from the Troll Stronghold prison.=Consigue el loro en la prisión del Troll Stronghold.
Get the parrot from the rack in the prison.=Coge el loro del rack de la prisión.
Return to Eadgar with the parrot.=Vuelve con Eadgar con el loro.
Take the fake man to Burntmeat.=Lleva el fake man a Burntmeat.
Talk to Burntmeat in the Troll Stronghold kitchen.=Habla con Burntmeat en la cocina del Troll Stronghold.
Search the kitchen drawers south east of Burntmeat.=Busca en los cajones de la cocina al sureste de Burntmeat.
Go down to the storeroom from the Troll Stronghold kitchen.=Baja al almacén desde la cocina del Troll Stronghold.
Enter the storeroom.=Entra en el almacén.
Search the goutweed crates for goutweed. You'll need to avoid the troll guards or you'll be kicked out and take damage.=Busca en las cajas de goutweed para conseguir goutweed. Tendrás que evitar a los guardias trol o te expulsarán y recibirás daño.
If you wish to do Dream Mentor or Dragon Slayer II, grab two more goutweed. Afterwards, return to Sanfew upstairs in the Taverley herblore store.=Si quieres hacer Dream Mentor o Dragon Slayer II, coge dos goutweed más. Después, vuelve con Sanfew en la planta de arriba de la tienda de herbolario de Taverley.
Ability to use the Trollheim teleport=Habilidad de usar el teletransporte a Trollheim
Ability to use Scrolls of Redirection to Trollheim.=Habilidad de usar Scrolls of Redirection a Trollheim.
Ability to trade Goutweed to Sanfew for herbs.=Habilidad de intercambiar Goutweed con Sanfew por hierbas.
Start the quest=Empieza la misión
Talk to Burntmeat=Habla con Burntmeat
Get a parrot=Consigue un loro
Making a fake man=Crea un hombre falso
Get the Goutweed=Consigue el goutweed
