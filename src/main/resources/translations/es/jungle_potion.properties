Search the palm trees north east of Tai Bwo Wannai for an Ardrigal herb.=Busca en las palmeras al noreste de Tai Bwo Wannai para conseguir un Ardrigal herb.
If you want to do Legends' Quest grab one extra as you will need it later.=Si quieres hacer Legends' Quest, coge una extra, ya que la necesitarás más adelante.
Clean and return the Ardrigal to Trufitus.=Limpia y entrega la Ardrigal a Trufitus.
Search the scorched earth in the south of Tai Bwo Wannai for a Sito Foil herb.=Busca en la tierra quemada al sur de Tai Bwo Wannai para conseguir un Sito Foil herb.
Clean and return the Sito Foil to Trufitus.=Limpia y entrega la Sito Foil a Trufitus.
