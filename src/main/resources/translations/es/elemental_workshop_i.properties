Search the marked bookcase in Seers' Village.=Busca en la estantería marcada en Seers' Village.
Read the battered book.=Lee el Battered book.
Use a knife on the battered book.=Usa un cuchillo en el Battered book.
Open the odd wall to the north of the bookcase.=Abre la odd wall al norte de la estantería.
Climb down the staircase.=Baja por la escalera.
Turn the marked water control in the north room.=Gira el control de agua marcado en la sala norte.
Turn the other marked water control in the north room.=Gira el otro control de agua marcado en la sala norte.
Pull the lever in the north room.=Tira de la palanca en la sala norte.
Search the marked crate for some leather.=Busca en la caja marcada para conseguir cuero.
Search the stacked crates in the west room for a needle.=Busca en las cajas apiladas de la sala oeste para conseguir una aguja.
Repair the bellows in the east room.=Repara los fuelles de la sala este.
Pull the lever next to the bellows.=Tira de la palanca junto a los fuelles.
Search the boxes in the north east of the central room.=Busca en las cajas del noreste de la sala central.
Use the stone bowl on the lava trough in the south room.=Usa el cuenco de piedra en el pilón de lava de la sala sur.
Use the lava-filled bowl on the furnace.=Usa el cuenco lleno de lava en el horno.
Mine one of the elemental rocks in the west room, ready to fight a level 35.=Mina una de las rocas elementales de la sala oeste, preparado para luchar contra un nivel 35.
Kill the rock elemental that appeared.=Mata al rock elemental que aparezca.
Pick up the elemental ore.=Coge el elemental ore.
