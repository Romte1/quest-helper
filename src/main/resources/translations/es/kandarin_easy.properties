# Spanish translations for Kandarin Easy Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another by searching the bookcase in the house south of the Elemental Workshop, then reading the book you get from it=Puedes conseguir otra buscando en la estantería de la casa al sur del Elemental Workshop y leyendo el libro que obtengas.
Fish on Catherby beach at the Big Net fishing spots for a mackerel.=Pesca en la playa de Catherby en los puntos de pesca Big Net para conseguir una mackerel.
Buy a candle from the candle maker in Catherby.=Compra una vela al candle maker de Catherby.
Fill an empty fish bowl at a sink.=Llena un fish bowl vacío en un fregadero.
Speak with Harry in the Catherby Fishing Shop to get a tiny net.=Habla con Harry en la Catherby Fishing Shop para conseguir una tiny net.
Put seaweed into the fishbowl.=Pon seaweed en el fishbowl.
Fish in the aquarium near Harry.=Pesca en el acuario cerca de Harry.
Pick 5 flax at the flax field west of Catherby.=Recoge 5 flax en el campo de flax al oeste de Catherby.
Speak with Sherlock west of Catherby.=Habla con Sherlock al oeste de Catherby.
Enter the Elemental Workshop in Seers' Village.=Entra en el Elemental Workshop de Seers' Village.
Kill one of the fire elementals.=Mata a uno de los fire elementals.
Kill one of the earth elementals. Only the roaming ones work for this.=Mata a uno de los earth elementals. Solo sirven los que van errantes.
Kill one of the water elementals.=Mata a uno de los water elementals.
Kill one of the air elementals.=Mata a uno de los air elementals.
Talk with the bartender in Seers' Village and buy a stew.=Habla con el bartender de Seers' Village y compra un stew.
Play the organ in Seers' Village Church.=Toca el órgano en la iglesia de Seers' Village.
Plant 3 jute seeds in the hops patch north west of Seers' Village.=Planta 3 jute seeds en el bancal de hops al noroeste de Seers' Village.
Talk with Galahad west of McGrubor's Wood until he gives you some tea.=Habla con Galahad al oeste de McGrubor's Wood hasta que te dé un poco de té.
Cross the log shortcut near to Galahad.=Cruza el atajo de troncos cerca de Galahad.
Talk to the 'Wedge' in front of Camelot Castle to claim your reward!=Habla con 'Wedge' frente al Camelot Castle para reclamar tu recompensa.
