# Spanish translations for A Soul's Bane.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Launa east of Varrock.=Habla con Launa al este de Varrock.
Use a rope on the rift.=Usa una rope en la rift.
Enter the rift.=Entra en la rift.
Take a weapon from the weapon rack. Kill the angry monsters with the appropriate weapon:=Coge un arma del weapon rack. Mata a los monstruos furiosos con el arma adecuada:
Sword - Unicorn=Sword - Unicorn
Spear - Bear=Spear - Bear
Mace - Rat=Mace - Rat
Battleaxe - Goblin=Battleaxe - Goblin
Kill animals with appropriate weapons until the Rage Metre fills.=Mata animales con las armas adecuadas hasta que se llene la Rage Metre.
Go to the next room.=Ve a la siguiente sala.
Look inside the Dark Holes to cause fear reapers to appear. Kill 5 of them. You cannot search the same hole over and over again.=Mira dentro de los Dark Holes para que aparezcan fear reapers. Mata a 5. No puedes buscar en el mismo agujero una y otra vez.
Kill the Fear Reaper.=Mata al Fear Reaper.
Continue to the next room.=Continúa a la siguiente sala.
Attack the confusion beasts until you find one which takes damage, and kill it. The others will take 8 hits to die.=Ataca a las confusion beasts hasta encontrar una que reciba daño y mátala. Las demás necesitarán 8 golpes para morir.
Leave the room through the confusing door.=Sal de la sala por la puerta confusa.
Kill each hopeless creature 3 times.=Mata a cada hopeless creature 3 veces.
Continue through the exit of the room.=Continúa por la salida de la sala.
Kill all three of Tolna's heads.=Mata a las tres cabezas de Tolna.
Talk to Tolna.=Habla con Tolna.
Talk to Tolna outside the rift.=Habla con Tolna fuera de la rift.
Multiple level 40-46 enemies=Varios enemigos de nivel 40-46
Access to the Dungeon of Tolna=Acceso al Dungeon of Tolna
Starting off=Empezando
