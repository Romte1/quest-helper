# Spanish translations for Underground Pass.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can grab a bucket from the southwest corner of the large dwarf encampment building.=Puedes coger un bucket de la esquina suroeste del gran edificio del campamento enano.
You can get another by searching the equipment by the fireplace beside Koftik.=Puedes conseguir otro registrando el equipo junto a la chimenea al lado de Koftik.
You can get this from the cage in the previous room=Puedes conseguirlo en la jaula de la sala anterior
You can get a pair from Klank in the Dwarf camp=Puedes conseguir un par de Klank en el campamento enano
Go to the second floor of Ardougne Castle.=Ve al segundo piso de Ardougne Castle.
Talk to King Lathas.=Habla con King Lathas.
Talk to Koftik in West Ardougne.=Habla con Koftik en West Ardougne.
Talk to Koftik outside the West Ardougne cave.=Habla con Koftik a las afueras de la cueva de West Ardougne.
Enter the dungeon.=Entra en la mazmorra.
Climb-over rockslide.=Trepa por el desprendimiento.
Talk to Koftik inside the cave.=Habla con Koftik dentro de la cueva.
Search the abandoned equipment for an oily cloth.=Busca en el equipo abandonado un oily cloth.
Use the oily cloth on an arrow.=Usa el oily cloth en una arrow.
Use the tinderbox on the fire arrow. If you don't have a tinderbox, use the arrow on the nearby fire instead.=Usa el tinderbox en la fire arrow. Si no tienes tinderbox, usa la arrow en el fuego cercano.
Walk to the room north of Koftik.=Camina hasta la sala al norte de Koftik.
Wield a lit arrow and shoot the guide-rope.=Equipa una lit arrow y dispara a la guide-rope.
Follow the path west to leave.=Sigue el camino hacia el oeste para salir.
Pick up the plank in the north room.=Coge el plank de la sala norte.
Swing across the pit with a rope.=Cruza el pozo columpiándote con una rope.
Climb-over rockslide=Trepa por el desprendimiento
Cross the grid by trial and error. Keep health above 15, and remember the path for Regicide.=Cruza la rejilla por prueba y error. Mantén la salud por encima de 15 y recuerda el camino para Regicide.
Pull the lever to raise the gate.=Tira de la palanca para subir la puerta.
Either disable or walk past the traps.=Desactiva las trampas o esquívalas.
Take the first orb of light.=Coge el primer orb of light.
Use a plank on the flat rock to cross it.=Usa un plank en la roca plana para cruzarla.
Take the second orb of light north west of the well.=Coge el segundo orb of light al noroeste del pozo.
Take the third orb of light west of the well. Remember to use a plank on the flat rocks to cross them.=Coge el tercer orb of light al oeste del pozo. Recuerda usar un plank en las rocas planas para cruzarlas.
Search the flat rock to remove the trap and take the fourth orb to the south west of the well.=Busca en la roca plana para quitar la trampa y coge el cuarto orb al suroeste del pozo.
Return to the furnace to the east, and use the orbs on it.=Vuelve al horno al este y usa los orbs en él.
Climb down the well.=Baja por el pozo.
Navigate the maze, or use the shortcut to the south with 50 Thieving.=Recorre el laberinto o usa el atajo del sur con 50 Thieving.
Pick the lock to enter the cell.=Forcejea la cerradura para entrar en la celda.
Dig the loose mud.=Cava en el barro suelto.
Cross the ledge.=Cruza la cornisa.
Enter the pipe to the next section.=Entra en el tubo a la siguiente sección.
Search the unicorn cage.=Busca en la jaula del unicornio.
Use the railing on the boulder.=Usa la railing en el peñasco.
Search the cage again.=Busca en la jaula de nuevo.
Enter the tunnel.=Entra en el túnel.
Travel through the tunnel to find some knights.=Recorre el túnel para encontrar a unos knights.
Kill Sir Jerro and take his badge. Optionally: talk to one of the knights first to receive food and potions.=Mata a Sir Jerro y coge su insignia. Opcional: habla antes con uno de los knights para recibir comida y pociones.
Kill Sir Carl and take his badge.=Mata a Sir Carl y coge su insignia.
Kill Sir Harry and take his badge.=Mata a Sir Harry y coge su insignia.
Use the badges and unicorn horn on the well.=Usa las insignias y el unicorn horn en el pozo.
Open the door at the end of the path.=Abre la puerta al final del camino.
Follow the edge of the cavern down to enter a cave on the south wall.=Sigue el borde de la caverna hacia abajo para entrar en una cueva en la pared sur.
Talk to Niloof.=Habla con Niloof.
Return up to Iban's Cavern.=Vuelve arriba a Iban's Cavern.
Start from the south east corner of the bridges, and go northwest along them and retrieve the witch's cat.=Empieza en la esquina sureste de los puentes y avanza hacia el noroeste por ellos para recoger el witch's cat.
Use the cat on the witch's door in the south east corner of the area to distract her.=Usa el gato en la puerta de la bruja en la esquina sureste de la zona para distraerla.
Search the chest in the witch's house. You'll need 4 empty inventory slots.=Busca en el cofre de la casa de la bruja. Necesitarás 4 espacios libres en el inventario.
From the south east corner of the area, head west then south along the pathways. Kill Holthion and pick up his amulet.=Desde la esquina sureste de la zona, ve al oeste y luego al sur por los caminos. Mata a Holthion y coge su amuleto.
Kill Doomion and pick up his amulet.=Mata a Doomion y coge su amuleto.
Kill Othainian and pick up his amulet.=Mata a Othainian y coge su amuleto.
Use the shadow on the doll.=Usa la shadow en el doll.
Search the chest north of Doomion.=Busca en el cofre al norte de Doomion.
Use the ashes on the doll.=Usa las ashes en el doll.
Use the dove on the doll.=Usa la dove en el doll.
Return to the dwarf encampment on the lower level.=Vuelve al campamento enano del nivel inferior.
Pick up a bucket in the large dwarf encampment building.=Coge un bucket en el gran edificio del campamento enano.
Pick up a tinderbox in the small dwarf encampment building.=Coge un tinderbox en el pequeño edificio del campamento enano.
Use a bucket on the brew barrel in the dwarf encampment on the south west.=Usa un bucket en el barril de brew del campamento enano al suroeste.
Use the bucket of brew on the tomb in the south east corner of the area.=Usa el bucket of brew en la tumba en la esquina sureste de la zona.
Light the tomb with a tinderbox.=Enciende la tumba con un tinderbox.
Kill Kalrag the spider. Protect From Melee can keep you safe in this fight.=Mata a Kalrag la araña. Protect From Melee puede mantenerte a salvo en este combate.
Ascend to the upper level of the cave again via the north west exit.=Sube de nuevo al nivel superior de la cueva por la salida noroeste.
Search the marked cage in the north west of the area while wearing Klank's gauntlets.=Busca en la jaula marcada del noroeste de la zona mientras llevas puestas las Klank's gauntlets.
Travel along the pathways from the north west corner of the area to the middle. Kill a disciple of Iban and take their robes.=Recorre los caminos desde la esquina noroeste de la zona hasta el centro. Mata a un disciple of Iban y coge sus túnicas.
Enter the Temple of Iban wearing monk robes. Prepare to use Iban's doll on the well, as Iban can deal lots of damage quickly.=Entra en el Temple of Iban llevando monk robes. Prepárate para usar Iban's doll en el pozo, ya que Iban puede hacer mucho daño rápidamente.
Right-click USE the doll on the well. Standing north of the well can prevent Iban from hitting.=Haz clic derecho y USA el doll en el pozo. Colocarte al norte del pozo puede impedir que Iban te golpee.
Talk to Koftik.=Habla con Koftik.
Return to King Lathas to finish the quest.=Vuelve con King Lathas para terminar la misión.
Talk to Klank to obtain his gauntlets. If you've done so before, you may need to pay 5,000gp for them.=Habla con Klank para obtener sus gauntlets. Si ya lo has hecho antes, puede que tengas que pagar 5.000gp por ellas.
3 Demons (level 91, safespottable)=3 Demons (nivel 91, se les puede hacer safe spot)
3 Paladins (level 62, safespottable)=3 Paladins (nivel 62, se les puede hacer safe spot)
Kalrag (level 89)=Kalrag (nivel 89)
Disciple of Iban (level 13)=Disciple of Iban (nivel 13)
Kalrag attacks with melee only, so Protect From Melee can keep you safe in that fight.=Kalrag solo ataca cuerpo a cuerpo, así que Protect From Melee puede mantenerte a salvo en ese combate.
The 3 Demons can be easily safespotted by staying on the connecting bridges.=Se les puede hacer safe spot fácilmente a los 3 Demons quedándote en los puentes que conectan.
Using the bow provided for combat can save inventory space.=Usar el bow que te dan para combatir puede ahorrarte espacio en el inventario.
Bring all items with you to start the quest, as leaving the dungeon will require you to restart from the beginning.=Lleva todos los objetos contigo al empezar la misión, ya que salir de la mazmorra te obligará a empezar desde el principio.
Starting out=Empezando
Descending Deeper=Descendiendo más
Cold-blooded Killing=Asesinato a sangre fría
The Witch Kardia=La bruja Kardia
Imbuing the Doll=Imbuyendo el doll
Entering the Temple=Entrando en el templo
Foggy Memories=Recuerdos borrosos
Rope, multiple in case you fail an agility check=Rope, varias por si fallas un chequeo de agility
Coins (to buy food, 75 ea)=Coins (para comprar comida, 75 cada una)
Combat Equipment=Equipo de combate
Food=Comida
Telegrab Runes=Runas de Telegrab
