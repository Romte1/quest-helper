# Spanish translations for Cold War.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Ring of Charos (a) can also be used.=También se puede usar el Ring of Charos (a).
You can get another from Noodle=Puedes conseguir otro de Noodle
Talk to Larry at the Ardougne Zoo.=Habla con Larry en el Ardougne Zoo.
Talk to Larry again.=Habla con Larry de nuevo.
Use an oak plank on the firm snow patch.=Usa un oak plank en el montón de nieve firme.
Use a spade on the bird hide to cover it in snow.=Usa una spade en el bird hide para cubrirlo de nieve.
Talk to Larry on the iceberg to enter the bird hide.=Habla con Larry en el iceberg para entrar en el bird hide.
Click the boat to return to Relleka.=Haz clic en el barco para volver a Relleka.
Talk to Larry in Relleka.=Habla con Larry en Relleka.
Travel to your POH or another POH with a Crafting table 3 or 4.=Viaja a tu POH o a otro POH con una Crafting table 3 o 4.
Craft a steel bar into a clockwork at a crafting table 3.=Fabrica un clockwork con un steel bar en una crafting table 3.
Craft a clockwork penguin at a crafting table 3 or 4.=Fabrica un clockwork penguin en una crafting table 3 o 4.
Talk to Larry back in the Ardougne Zoo.=Habla con Larry de nuevo en el Ardougne Zoo.
Talk to Larry on the iceberg.=Habla con Larry en el iceberg.
Read the mission report.=Lee el mission report.
Unequip cape and weapons and right-click Tuxedo-time Larry at the Ardougne Zoo.=Quítate la capa y las armas y haz clic derecho en Tuxedo-time Larry en el Ardougne Zoo.
Enter the penguin pen.=Entra en el cercado de los pingüinos.
Talk to the zoo penguin.=Habla con el pingüino del zoo.
Perform the correct series of emotes to the penguin.=Realiza la serie correcta de emotes al pingüino.
Talk to Larry to exit the penguin suit.=Habla con Larry para salir del penguin suit.
Talk to Larry about the mission report, then travel to the sheep farm in Lumbridge.=Habla con Larry sobre el mission report y luego viaja a la granja de ovejas de Lumbridge.
Tuxedo-time Larry in the Lumbridge sheep farm.=Usa Tuxedo-time con Larry en la granja de ovejas de Lumbridge.
Talk to the penguins disguised as a sheep in the Lumbridge sheep farm. You will need to use the same 3 emotes as the penguin from the bird hide cutscene.=Habla con los pingüinos disfrazados de oveja en la granja de ovejas de Lumbridge. Tendrás que usar los mismos 3 emotes que el pingüino de la escena del bird hide.
Return to the Ardougne Zoo penguin with either a raw cod, or wearing the ring of charos.=Vuelve con el pingüino del Ardougne Zoo con un raw cod o llevando el ring of charos.
Speak to the sheep-penguins again in the Lumbridge sheep farm.=Vuelve a hablar con los pingüinos-oveja en la granja de ovejas de Lumbridge.
Talk to Fred the Farmer without the penguin suit.=Habla con Fred the Farmer sin el penguin suit.
Steal a cowbell from a dairy cow.=Roba un cowbell de una vaca lechera.
Speak to the sheep-penguins once again in the Lumbridge sheep farm to learn about the outpost.=Habla con los pingüinos-oveja una vez más en la granja de ovejas de Lumbridge para informarte sobre el outpost.
Tell Larry about the outpost and travel back to the iceberg.=Cuéntale a Larry lo del outpost y vuelve al iceberg.
Jump in the penguin suit and talk to the KGP Agent on the north west portion of the iceberg.=Ponte el penguin suit y habla con el KGP Agent en la parte noroeste del iceberg.
Perform the 3 emotes the penguins performed in the bird hide cutscene.=Realiza los 3 emotes que hicieron los pingüinos en la escena del bird hide.
Talk to Noodle.=Habla con Noodle.
Give Noodle the swamp tar to get an ID card and a mission report.=Entrega el swamp tar a Noodle para conseguir un ID card y un mission report.
Talk to the KGP Agent again.=Habla con el KGP Agent de nuevo.
Enter the avalanche.=Entra en la avalancha.
Enter the avalanche as a penguin.=Entra en la avalancha como pingüino.
Talk to the KGP Agent in the first room to the west of the entrance.=Habla con el KGP Agent en la primera sala al oeste de la entrada.
Enter the door to the west of the KGP Agent to begin the agility course.=Entra por la puerta al oeste del KGP Agent para empezar el circuito de agilidad.
Complete the agility course.=Completa el circuito de agilidad.
Walk up to the start of the agility course.=Camina hasta el inicio del circuito de agilidad.
Avoid the ice and exit the water.=Evita el hielo y sal del agua.
Jump across the stepping stones.=Salta por las piedras de paso.
Tread-softly across the icicles.=Camina con cuidado entre los carámbanos.
Cross ice to get up the hill.=Cruza el hielo para subir la colina.
Talk to the Agility Instructor.=Habla con el Agility Instructor.
Return to Larry to tell him about the penguin army. You can quickly return to him by removing the penguin suit.=Vuelve con Larry para contarle lo del ejército de pingüinos. Puedes volver rápido con él quitándote el penguin suit.
Re-enter the outpost and talk to the KGP agent north of the entrance.=Vuelve a entrar en el outpost y habla con el KGP agent al norte de la entrada.
Talk to Ping or Pong in the room to the east.=Habla con Ping o Pong en la sala del este.
Remove the penguin suit.=Quítate el penguin suit.
Use the mahogany plank on the leather to make bongos.=Usa el mahogany plank en el leather para hacer bongos.
Return to Ping or Pong to give them the bongos and cowbells.=Vuelve con Ping o Pong para entregarles los bongos y cowbells.
Return to Ping or Pong.=Vuelve con Ping o Pong.
Open the control room doors via the control panel.=Abre las puertas de la sala de control con el panel de control.
Enter the war room and walk a few steps in to be captured.=Entra en la war room y da unos pasos para que te capturen.
Kill icelords until you are able to leave through the door to the west. May take up to 3 kills.=Mata icelords hasta que puedas salir por la puerta del oeste. Puede requerir hasta 3 muertes.
Leave through the door to the west.=Sal por la puerta del oeste.
Use the chasm to exit the cave.=Usa el abismo para salir de la cueva.
Return to Larry to finish the quest.=Vuelve con Larry para terminar la misión.
