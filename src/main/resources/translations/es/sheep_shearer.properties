# Spanish translations for Sheep Shearer.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
If you plan on collecting wool yourself=Si planeas recoger la Wool tú mismo
Talk to Fred the Farmer north of Lumbridge to start the quest. Bring 20 balls of wool to autocomplete the quest.=Habla con Fred the Farmer al norte de Lumbridge para empezar la misión. Lleva 20 balls of wool para autocompletar la misión.
Pickup the shears in Fred's house.=Recoge las Shears en la casa de Fred.
Shear sheep in the nearby field.=Esquila a las Sheep en el campo cercano.
Climb the staircase in the Lumbridge Castle to spin the wool in your inventory into balls of wool.=Sube la escalera del Lumbridge Castle para hilar la Wool de tu inventario y convertirla en balls of wool.
Spin your wool into balls.=Hila tu Wool para convertirla en balls.
Climb down the staircase.=Baja la escalera.
Bring Fred the Farmer north of Lumbridge your balls of wool (UNNOTED) to progress the quest. If you only have some of the balls needed, you can still deposit them with him.=Lleva a Fred the Farmer al norte de Lumbridge tus balls of wool (UNNOTED) para progresar la misión. Si solo tienes algunas de las balls necesarias, puedes depositarlas con él igualmente.
Bring Fred Some Wool=Lleva algo de Wool a Fred
