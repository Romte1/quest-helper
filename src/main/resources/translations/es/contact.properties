# Spanish translations for Contact.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to the High Priest in Sophanem.=Habla con el High Priest en Sophanem.
Talk to Jex in the building in north east Sophanem.=Habla con Jex en el edificio del noreste de Sophanem.
Go down the ladder east of Jex.=Baja por la escalera al este de Jex.
Go down the trapdoor.=Baja por la trampilla.
Be careful of traps, and follow the path to the south west ladder. Disarm traps where the path breaks, and use protection prayers against the monsters.=Ten cuidado con las trampas y sigue el camino hasta la escalera del suroeste. Desactiva las trampas donde el camino se corte y usa plegarias de protección contra los monstruos.
Follow the path along, and search Kaleef's corpse there.=Sigue el camino y busca en el cadáver de Kaleef.
Read the parchment=Lee el pergamino
Talk to Maisa on the west side of the chasm.=Habla con Maisa en el lado oeste del abismo.
Talk to Osman in Al Kharid.=Habla con Osman en Al Kharid.
Talk to Osman north of Sophanem.=Habla con Osman al norte de Sophanem.
Prepare to fight a level 191 Giant Scarab. Go down the ladder east of Jex.=Prepárate para luchar contra un Giant Scarab de nivel 191. Baja por la escalera al este de Jex.
Kill the Giant Scarab near the chasm. It can extinguish your light source and poison you, so be careful. Pray melee if you are meleeing it, range if you are attacking it from a distance.=Mata al Giant Scarab cerca del abismo. Puede apagar tu fuente de luz y envenenarte, así que ten cuidado. Usa la plegaria Protect from Melee si luchas cuerpo a cuerpo, o Protect from Missiles si atacas a distancia.
Pick up the Keris.=Recoge la Keris.
Talk to Osman in the chasm.=Habla con Osman en el abismo.
Report back to the High Priest in Sophanem.=Vuelve a informar al High Priest en Sophanem.
Giant Scarab (level 191)=Giant Scarab (nivel 191)
Access to Sophanem's Bank=Acceso al banco de Sophanem
Starting off=Empezando
Explore the dungeon=Explora la mazmorra
Help Osman=Ayuda a Osman
