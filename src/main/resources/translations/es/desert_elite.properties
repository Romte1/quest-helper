# Spanish translations for Desert Elite Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Steps
Enter the Pyramid plunder minigame. If you don't see a Guardian mummy exit and try a different entrance.=Entra en el minijuego Pyramid plunder. Si no ves a un Guardian mummy, sal e inténtalo por otra entrada.
Talk to the guardian mummy to start the minigame.=Habla con el guardian mummy para empezar el minijuego.
Go through each of the pyramid rooms until the final room.=Pasa por cada una de las salas de la pirámide hasta la sala final.
Loot the grand gold chest.=Saquea el grand gold chest.
Pray at the altar in Sophanem restoring at least 85 prayer points.=Reza en el altar de Sophanem restaurando al menos 85 prayer points.
Cast Ice barrage against any foe in the Desert (away from any city). You must not splash.=Lanza Ice barrage contra cualquier enemigo en el desierto (lejos de cualquier ciudad). No debes fallar el hechizo.
Cook a wild pie on the clay oven in Nardah.=Cocina un wild pie en el clay oven de Nardah.
Go to Bedabin Camp south-west of Al Kharid.=Ve al Bedabin Camp al suroeste de Al Kharid.
Fletch a dragon dart.=Haz una dragon dart.
Mount and then talk to a Kalphite Queen head in your POH. The 50k is necessary to stuff the KQ head at the taxidermist in Canifis.=Monta y luego habla con una cabeza de Kalphite Queen en tu POH. Las 50k son necesarias para disecar la cabeza de KQ en el taxidermist de Canifis.
Talk to Jarr at the Shantay pass to claim your reward!=¡Habla con Jarr en el Shantay pass para reclamar tu recompensa!

# Requirements
Combat gear=Equipo de combate
Food=Comida

# Rewards
Unlimited teleports to Nardah and the Kalphite Cave on the desert amulet=Teletransportes ilimitados a Nardah y a la Kalphite Cave con el desert amulet
The Nardah teleport on the desert amulet now takes players directly inside the Elidinis shrine=El teletransporte a Nardah del desert amulet ahora lleva a los jugadores directamente al interior del Elidinis shrine
100% protection against desert heat when the desert amulet is worn=100% de protección contra el calor del desierto cuando llevas puesto el desert amulet
Pharaoh's sceptre can hold up to 100 charges=El Pharaoh's sceptre puede almacenar hasta 100 cargas
Free pass-through of the Shantay Pass=Paso gratuito por el Shantay Pass
Access to a crevice shortcut, requiring 86 Agility, in the Kalphite Lair from the entrance to the antechamber before the Kalphite Queen boss room.=Acceso a un atajo por la grieta, que requiere 86 Agility, en la Kalphite Lair desde la entrada a la antecámara antes de la sala del jefe Kalphite Queen.

