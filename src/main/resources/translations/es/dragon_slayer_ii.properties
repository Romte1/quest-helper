Talk to Alec Kincade outside the Myths' Guild.=Habla con Alec Kincade fuera del Myths' Guild.
Talk to Dallas Jones in the Pub on Musa Point.=Habla con Dallas Jones en el pub de Musa Point.
Talk to Dallas in Elvarg's Lair.=Habla con Dallas en la guarida de Elvarg.
Use a pickaxe on the blockage in the north east of Elvarg's Lair.=Usa un pickaxe en el bloqueo del noreste de la guarida de Elvarg.
Enter the passage in the north east of Elvarg's Lair.=Entra en el pasaje del noreste de la guarida de Elvarg.
Inspect the mural.=Inspecciona el mural.
Kill the spawn.=Mata al spawn.
Investigate the mural again.=Investiga el mural de nuevo.
