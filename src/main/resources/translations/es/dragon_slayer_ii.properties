Travel to the House on the Hill on Fossil Island. The fastest way here is with the digsite pendant.=Ve a la House on the Hill en Fossil Island. La forma más rápida de llegar es con el digsite pendant.
Go down the trapdoor to the basement.=Baja por la trapdoor al sótano.
Talk to Dallas.=Habla con Dallas.
Search the stone chest in the north of the room. Whilst finding map pieces you can talk to Dallas to give him your current pieces.=Registra el cofre de piedra del norte de la sala. Mientras encuentras piezas del mapa puedes hablar con Dallas para darle las piezas que tengas.
Climb the ladder to go upstairs in the house. Talk to Dallas if you want to give him your current map pieces.=Sube la escalera para ir a la planta superior de la casa. Habla con Dallas si quieres darle las piezas del mapa que tengas.
Search the stone chest in the north of the house's top floor.=Registra el cofre de piedra del norte de la planta superior de la casa.
Leave the house down the stairs to the west.=Sal de la casa bajando las escaleras al oeste.
Search the fungi north of the stairs.=Registra los hongos al norte de las escaleras.
Search the hook briar south of the house.=Registra el hook briar al sur de la casa.
Search the mushtree east of the house.=Registra el mushtree al este de la casa.
Return to Dallas with the map pieces.=Vuelve con Dallas con las piezas del mapa.
Talk to Dallas with the map pieces.=Habla con Dallas con las piezas del mapa.
Click on the incomplete map for a puzzle to solve.=Haz clic en el mapa incompleto para resolver un puzle.
Solve the map tile puzzle.=Resuelve el puzle de piezas del mapa.
Talk to Dallas after solving the map.=Habla con Dallas después de resolver el mapa.
Talk to Jardric in the museum camp.=Habla con Jardric en el campamento del museo.
Build a rowing boat on the west coast of Fossil Island.=Construye un bote de remos en la costa oeste de Fossil Island.
Talk to Dallas near the boat.=Habla con Dallas cerca del bote.
Board the boat.=Sube al bote.
Climb up the stairs to the west.=Sube las escaleras al oeste.
Climb down the trapdoor to the south.=Baja por la trapdoor al sur.
Climb down the staircase to the north.=Baja por la escalera al norte.
Talk to Dallas in the far north of the room.=Habla con Dallas en el extremo norte de la sala.
Search the skeleton east of Dallas.=Registra el esqueleto al este de Dallas.
Read Aivas' Diary.=Lee el diario de Aivas.
Talk to Dallas again.=Habla con Dallas de nuevo.
Use a catspeak amulet (e) to locate Bob the Cat and talk to him. He's often in Catherby Archery Shop or at the Varrock Anvil.=Usa un catspeak amulet (e) para localizar a Bob the Cat y hablar con él. A menudo está en la Catherby Archery Shop o en el yunque de Varrock.
Talk to the Sphinx in Sophanem.=Habla con la Sphinx en Sophanem.
Talk to the Oneiromancer in the south east of Lunar Isle.=Habla con la Oneiromancer al sureste de Lunar Isle.
Fill the vial with water.=Llena la vial con agua.
Add a goutweed to the dream vial.=Añade un goutweed a la dream vial.
Use a hammer on an astral rune.=Usa un hammer en una astral rune.
Use a pestle and mortar on the astral rune shards.=Usa un pestle and mortar en las astral rune shards.
Add the ground astral rune to the dream vial.=Añade la ground astral rune a la dream vial.
Equip your combat equipment, food, and light the Brazier in the west of Lunar Isle's town. Be prepared for a fight. You will need melee gear, preferably a crush weapon, to fight.=Equípate el equipo de combate y la comida, y enciende el Brazier al oeste del pueblo de Lunar Isle. Prepárate para una pelea. Necesitarás equipo cuerpo a cuerpo, preferiblemente un arma contundente, para luchar.
Use the dream potion on the brazier.=Usa la dream potion en el brazier.
Talk to Bob next to the brazier to enter the dream again.=Habla con Bob junto al brazier para entrar de nuevo en el sueño.
Talk to Bob in the dream.=Habla con Bob en el sueño.
When you're ready, fight Robert.=Cuando estés listo, lucha contra Robert.
Use Protect from Missiles.=Usa Protect from Missiles.
When he shouts 'See if you can hide from this!', hide behind a pillar.=Cuando grite 'See if you can hide from this!', escóndete detrás de un pilar.
Talk to Bob next to the brazier.=Habla con Bob junto al brazier.
Talk to Amelia south west of the Shayzien Archery Store.=Habla con Amelia al suroeste de la Shayzien Archery Store.
Enter the Crypt west of Amelia.=Entra en la Crypt al oeste de Amelia.
Climb down to the bottom of the crypts.=Baja hasta el fondo de las criptas.
Solve the crypt puzzle.=Resuelve el puzle de la cripta.
Inspect the tomb for the key.=Inspecciona la tumba para conseguir la llave.
Talk to Reldo in the Varrock Castle Library.=Habla con Reldo en la biblioteca del castillo de Varrock.
Search the bookcases for the census=Registra las estanterías para encontrar el censo
Talk to Reldo again.=Habla con Reldo de nuevo.
Talk to Sarah in Port Phasmatys.=Habla con Sarah en Port Phasmatys.
Talk to Ava in Draynor Manor.=Habla con Ava en la mansión de Draynor.
Use the glassblowing pipe on a dragonstone.=Usa la glassblowing pipe en un dragonstone.
Talk to Ava again.=Habla con Ava de nuevo.
Use the locator orb in Mort Myre to locate the dig spot. Once you find the spot, dig there.=Usa el locator orb en Mort Myre para localizar el punto donde cavar. Cuando lo encuentres, cava allí.
Talk to Brundt in Rellekka.=Habla con Brundt en Rellekka.
Talk to Torfinn on the Rellekka docks to go to Ungael.=Habla con Torfinn en el muelle de Rellekka para ir a Ungael.
Defeat Vorkath. This is a hard fight, so if you're unfamiliar with it it's recommended you watch a video and read the sidebar first.=Derrota a Vorkath. Es una pelea difícil, así que si no estás familiarizado con ella se recomienda que veas un vídeo y leas primero la barra lateral.
Defeat Vorkath. This is a hard fight, so if you're unfamiliar with it it's recommended you watch a video on it first.=Derrota a Vorkath. Es una pelea difícil, así que si no estás familiarizado con ella se recomienda que veas primero un vídeo.
Protect from Magic, and drink an antifire and antivenom potion.=Usa Protect from Magic y bebe una poción antifuego y una antivípero.
When Vorkath fires a pink fireball it'll turn your prayer off.=Cuando Vorkath lance una bola de fuego rosa, te desactivará la prayer.
When Vorkath shoots an orange fireball into the air, move away from the spot you're on.=Cuando Vorkath lance una bola de fuego naranja al aire, aléjate del sitio donde estés.
When Vorkath spits acid everywhere, WALK around to avoid the fireballs he will shoot.=Cuando Vorkath escupa ácido por todas partes, CAMINA alrededor para evitar las bolas de fuego que lanzará.
When Vorkath freezes you, kill the zombified spawn that appears before it reaches you.=Cuando Vorkath te congele, mata al spawn zombificado que aparece antes de que te alcance.
Enter the cave on the north west of Ungael.=Entra en la cueva al noroeste de Ungael.
Pull the lever in the south west corner. Make sure you have run energy before doing so, as you need to run to the east room afterwards.=Baja la palanca de la esquina suroeste. Asegúrate de tener energía de carrera antes de hacerlo, ya que después tendrás que correr a la sala este.
RUN to the east room.=CORRE a la sala este.
Search the stone chest in the room for the key piece.=Registra el cofre de piedra de la sala para conseguir la pieza de la llave.
Go down the staircase in the south east of the Kharazi Jungle. MAKE SURE TO HAVE AUTO-RETALIATE OFF BEFORE ENTERING.=Baja por la escalera del sureste de la Kharazi Jungle. ASEGÚRATE DE TENER EL AUTO-RETALIATE DESACTIVADO ANTES DE ENTRAR.
Navigate to the middle of the maze, disarming any traps in the way.=Ve al centro del laberinto, desarmando cualquier trampa que encuentres por el camino.
Get to the centre of the maze.=Llega al centro del laberinto.
Enter the Ancient Caverns through the whirlpool near the Barbarian Outpost.=Entra en las Ancient Caverns por el remolino cerca del Barbarian Outpost.
Go down the stairs.=Baja las escaleras.
Go up the stairs to the Mithil Dragons.=Sube las escaleras hacia los Mithil Dragons.
Enter the Mithril Door to the west of the area.=Entra en la Mithril Door al oeste de la zona.
Cast fire wave or surge on the 3 dragon heads.=Lanza fire wave o surge sobre las 3 cabezas de dragón.
Leave the orb room.=Sal de la sala de los orbes.
Go back to the ground floor.=Vuelve a la planta baja.
Climb up the rough steps in the south west corner.=Sube los escalones irregulares de la esquina suroeste.
Forge the key on one of the anvils to the south.=Forja la llave en uno de los yunques del sur.
Unlock the grandiose door.=Desbloquea la grandiose door.
Talk to Dallas Jones to the north.=Habla con Dallas Jones al norte.
Talk to King Roald in Varrock Castle.=Habla con el King Roald en el castillo de Varrock.
Go talk to Sir Amik Varze upstairs in Falador Castle.=Ve a hablar con Sir Amik Varze arriba en el castillo de Falador.
Talk to Sir Amik Varze upstairs in Falador Castle.=Habla con Sir Amik Varze arriba en el castillo de Falador.
Talk to King Lathas/Thoros in East Ardougne castle.=Habla con el King Lathas/Thoros en el castillo de East Ardougne.
Enter the Varrock Castle dining room.=Entra en el comedor del castillo de Varrock.
Talk to Bob in Varrock Castle.=Habla con Bob en el castillo de Varrock.
Talk to Torfinn on the Rellekka docks to go to Ungael. Be prepared for a lot of fighting.=Habla con Torfinn en el muelle de Rellekka para ir a Ungael. Prepárate para luchar mucho.
Keep the boat afloat by filling leaks, putting out fires, healing warriors and repairing the masts. This is where the four inventory slots are needed.=Mantén el barco a flote tapando fugas, apagando incendios, curando guerreros y reparando los mástiles. Es aquí donde se necesitan los cuatro espacios de inventario.
Travel to the main ship, killing dragons along the way.=Viaja al barco principal matando dragones por el camino.
Kill the blue and green dragons.=Mata a los dragones azules y verdes.
Kill the black, steel, and brutal red dragon. Occasionally Galvek will shoot a fireball in the air, move to avoid it.=Mata al dragón negro, de acero y rojo brutal. De vez en cuando Galvek lanzará una bola de fuego al aire; muévete para evitarla.
Kill the metal dragons.=Mata a los dragones metálicos.
Occasionally Galvek will shoot a fireball in the air, move to avoid it.=De vez en cuando Galvek lanzará una bola de fuego al aire; muévete para evitarla.
Kill Galvek. Read the sidebar for more details.=Mata a Galvek. Lee la barra lateral para más detalles.
Kill Galvek. This is a hard fight, so it's recommended you check a video to see what you'll have to do.=Mata a Galvek. Es una pelea difícil, así que se recomienda que veas un vídeo para saber qué tendrás que hacer.
Avoid the ground-targeted fireballs.=Evita las bolas de fuego dirigidas al suelo.
The pink attack turns off prayer.=El ataque rosa desactiva la prayer.
Use Protect from Magic in phase 1, use Protect from Missiles otherwise.=Usa Protect from Magic en la fase 1 y Protect from Missiles en el resto.
Phase 1 - Fire traps appear - if you go near them you die.=Fase 1: aparecen trampas de fuego; si te acercas a ellas, mueres.
Phase 2 - Fires transparent projectile which drains stats.=Fase 2: lanza un proyectil transparente que drena estadísticas.
Phase 3 - Waves of fire appear. Go through the gap in them to avoid.=Fase 3: aparecen oleadas de fuego. Pasa por el hueco entre ellas para evitarlas.
Phase 4 - Fires a binding projectile. Avoid it by moving.=Fase 4: lanza un proyectil que te inmoviliza. Evítalo moviéndote.
Talk to Alec Kincade to become a Myth!=Habla con Alec Kincade para convertirte en un Myth!
Open the Mithril Door in the Ancient Caverns.=Abre la Mithril Door en las Ancient Caverns.
