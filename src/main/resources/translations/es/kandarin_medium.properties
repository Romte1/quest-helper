# Spanish translations for Kandarin Medium Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Complete a wave of Barbarian Assault. If it's your first time here, speak with Captain Cain for the tutorial.=Completa una oleada de Barbarian Assault. Si es tu primera vez aquí, habla con Captain Cain para ver el tutorial.
Make your way through Taverley Dungeon to the end, and climb the ladder there. If you're 70+ Agility, use one of the shortcuts near the entrance to get there quickly.=Recorre la Taverley Dungeon hasta el final y sube por la escalera. Si tienes 70+ Agility, usa uno de los atajos cerca de la entrada para llegar antes.
Plant a limpwurt seed in the Catherby Flower Patch, wait for it to grow then pick it. If you're waiting for it to grow and want to complete further tasks, use the tick box on panel.=Planta una limpwurt seed en el Catherby Flower Patch, espera a que crezca y recógela. Si estás esperando a que crezca y quieres completar otras tareas, usa la casilla del panel.
You can get this by killing the Jailer in the Black Knights Base in Taverley Dungeon and using the key he drops to enter the jail cell there to talk to Velrak for the dusty key=Puedes conseguirla matando al Jailer en la Black Knights Base de la Taverley Dungeon y usando la llave que suelta para entrar en la celda y hablar con Velrak para conseguir la dusty key.
