Enter the Troll Stronghold.=Entra en el Troll Stronghold.
Climb down the north staircase.=Baja por la escalera del norte.
Go up the stairs from the prison.=Sube las escaleras desde la prisión.
Talk to Ug in the south west room of the Troll Stronghold's first floor.=Habla con Ug en la sala suroeste del primer piso del Troll Stronghold.
Talk to Aga north of Ug.=Habla con Aga al norte de Ug.
