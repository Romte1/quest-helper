# Spanish translations for The Forsaken Tower.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Lady Vulcana Lovakengj in the south of Lovakengj.=Habla con Lady Vulcana Lovakengj en el sur de Lovakengj.
Talk to Undor at the entrance to Wintertodt. If you've never talked to Ignisia before, you'll need to talk to her first. She is just north east of Undor. You can teleport there using a Games Necklace, or run north through Arceuus.=Habla con Undor en la entrada de Wintertodt. Si nunca has hablado con Ignisia, primero tendrás que hablar con ella. Está justo al noreste de Undor. Puedes teletransportarte allí usando un Games Necklace o correr hacia el norte por Arceuus.
Enter the Forsaken Tower, west of Lovakengj.=Entra en el Forsaken Tower, al oeste de Lovakengj.
Inspect the display case in the Forsaken Tower.=Inspecciona la vitrina del Forsaken Tower.
Go down from the top floor.=Baja desde el último piso.
Go down to the ground floor.=Baja a la planta baja.
Leave the tower's basement.=Sal del sótano de la torre.
Climb down the ladder into the tower's basement.=Baja por la escalera de mano al sótano de la torre.
Inspect the power grid.=Inspecciona la red eléctrica.
Search a crate in the north eastern cell for a generator crank=Busca en una caja de la celda del noreste un generator crank
Inspect the steam generator in the south of the room=Inspecciona el generador de vapor en el sur de la sala
Solve the power puzzle.=Resuelve el puzzle de energía.
Get the hammer from the display case in the Forsaken Tower.=Coge el martillo de la vitrina del Forsaken Tower.
Return Dinh's Hammer to Undor at the entrance to Wintertodt.=Devuelve Dinh's Hammer a Undor en la entrada de Wintertodt.
Return to Lady Vulcana in south Lovakengj to finish the quest.=Vuelve a hablar con Lady Vulcana en el sur de Lovakengj para terminar la misión.
