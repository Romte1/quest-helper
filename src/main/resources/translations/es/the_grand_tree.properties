# Spanish translations for The Grand Tree.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Charlie on the top floor of the Grand Tree.=Habla con Charlie en el último piso del Grand Tree.
Return to Glough's house and search the cupboard for Glough's Journal.=Vuelve a la casa de Glough y busca en el armario el Glough's Journal.
Confront Glough about his journal.=Confronta a Glough sobre su diario.
Return to Charlie. You won't be able to enter through the main entrance, so speak to Femi outside the main gate to be snuck in, or make use of a Spirit Tree to enter the Tree Gnome Stronghold.The easiest Spirit Tree to use is the one in the Grand Exchange.=Vuelve con Charlie. No podrás entrar por la puerta principal, así que habla con Femi fuera de la puerta principal para que te cuelen, o usa un Spirit Tree para entrar en el Tree Gnome Stronghold. El Spirit Tree más fácil de usar es el del Grand Exchange.
Return to Charlie. If entering the Stronghold through the south entrance you'll need to talk to Femi there. If you didn't help them previously you'll need to pay them 1k.=Vuelve con Charlie. Si entras al Stronghold por la entrada sur tendrás que hablar con Femi allí. Si no les ayudaste antes, tendrás que pagarles 1k.
Talk to Anita in her house west of the Grand Tree.=Habla con Anita en su casa al oeste del Grand Tree.
You can get another from Narnode=Puedes conseguir otro de Narnode
You can get another from Glough's house in a chest=Puedes conseguir otro en un cofre de la casa de Glough
Travel to the Tree Gnome Stronghold.=Ve al Tree Gnome Stronghold.
Talk to King Narnode Shareen in the Grand Tree(Make sure to have two empty inventory slots to start the quest).=Habla con King Narnode Shareen en el Grand Tree (asegúrate de tener dos huecos libres en el inventario para empezar la misión).
Talk to King Narnode.=Habla con King Narnode.
Go up to Hazelmere, on the island east of Yanille. Fairy ring CLS or minigame teleport near Yanille.=Sube hasta Hazelmere, en la isla al este de Yanille. Fairy ring CLS o teleport de minijuego cerca de Yanille.
Talk to Hazelmere.=Habla con Hazelmere.
Return to King Narnode in the Grand Tree.=Vuelve con King Narnode en el Grand Tree.
Go up to Glough in the Tree Gnome Stronghold.=Sube hasta Glough en el Tree Gnome Stronghold.
Talk to Glough.=Habla con Glough.
Talk to King Narnode again in the Grand Tree.=Habla con King Narnode de nuevo en el Grand Tree.
Talk to Charlie.=Habla con Charlie.
Talk to King Narnode outside Charlie's cell.=Habla con King Narnode fuera de la celda de Charlie.
Travel with the glider to escape.=Huye en el planeador.
Enter the shipyard on Karamja.=Entra en el astillero de Karamja.
Get the Lumber order from the Foreman on the southern docks. You can either kill him or talk to him.=Consigue el Lumber order del Foreman en los muelles del sur. Puedes matarlo o hablar con él.
Go up to Glough's house again.=Sube a la casa de Glough de nuevo.
Search the chest in Glough's house.=Busca en el cofre de la casa de Glough.
Take the invasion plans to King Narnode in the Grand Tree.=Lleva los invasion plans a King Narnode en el Grand Tree.
Climb up the tree to the watchtower in Glough's house.=Sube al árbol hasta la torre de vigilancia en la casa de Glough.
Place the twigs (T). Return to King Narnode if you lost them.=Coloca los twigs (T). Vuelve con King Narnode si los perdiste.
Place the twigs (U). Return to King Narnode if you lost them.=Coloca los twigs (U). Vuelve con King Narnode si los perdiste.
Place the twigs (Z). Return to King Narnode if you lost them.=Coloca los twigs (Z). Vuelve con King Narnode si los perdiste.
Place the twigs (O). Return to King Narnode if you lost them.=Coloca los twigs (O). Vuelve con King Narnode si los perdiste.
Place the twigs to spell 'TUZO' in the watchtower in Glough's house. Return to King Narnode if you lost any.=Coloca los twigs para escribir 'TUZO' en la torre de vigilancia de la casa de Glough. Vuelve con King Narnode si perdiste alguno.
Go down the trap door. Be prepared for the fight against a Black Demon (level 172).=Baja por la trampilla. Prepárate para la pelea contra un Black Demon (nivel 172).
Talk to Glough. You can safespot the Demon from where he stands.=Habla con Glough. Puedes safespotear al Demon desde donde está.
Kill the black Demon. You can safespot from where Glough stands.=Mata al black Demon. Puedes safespotear desde donde está Glough.
Go down the trap door again.=Baja por la trampilla de nuevo.
Talk to King Narnode deeper in the cave.=Habla con King Narnode más adentro de la cueva.
Give the Daconia stone to King Narnode under the Grand Tree.=Dale la Daconia stone a King Narnode bajo el Grand Tree.
Search the roots under the Grand Tree until you find the Daconia stone. If you lose the rock, it will be in the same root again.=Busca en las raíces bajo el Grand Tree hasta encontrar la Daconia stone. Si pierdes la roca, volverá a estar en la misma raíz.
Black demon (level 172) (can be safespotted)=Black demon (nivel 172) (se puede safespotear)
Ability to use the Spirit Tree in the Tree Gnome Stronghold.=Habilidad de usar el Spirit Tree en el Tree Gnome Stronghold.
Getting started=Empezando
Hazelmere=Hazelmere
Investigation=Investigación
Karamja=Karamja
Tuzo=Tuzo
Defeat the Black Demon=Derrota al Black Demon
