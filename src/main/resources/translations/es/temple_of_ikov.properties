# Spanish translations for Temple of Ikov.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Lucien in East Ardougne, near the wall of West Ardougne in the Flying Horse Inn=Puedes conseguir otro de Lucien en East Ardougne, cerca de la muralla de West Ardougne, en el Flying Horse Inn
Talk to Lucien in the pub north of East Ardougne castle.=Habla con Lucien en el pub al norte del castillo de East Ardougne.
Get your weight below 0kg. You can get boots of lightness from the Temple of Ikov north of East Ardougne for -4.5kg.=Baja tu peso por debajo de 0 kg. Puedes conseguir las boots of lightness en el Temple of Ikov, al norte de East Ardougne, para reducir 4,5 kg.
Get your weight below 0kg.=Baja tu peso por debajo de 0 kg.
Enter the Temple of Ikov. You can get Boots of Lightness inside to get -4.5kg.=Entra en el Temple of Ikov. Dentro puedes conseguir las Boots of Lightness para reducir 4,5 kg.
Enter the Temple of Ikov north of East Ardougne.=Entra en el Temple of Ikov, al norte de East Ardougne.
Go down the west stairs to get boots of lightness.=Baja por las escaleras del oeste para conseguir las boots of lightness.
Get the boots of lightness in the north east corner.=Consigue las boots of lightness en la esquina noreste.
Go back upstairs.=Vuelve a subir.
Cross the bridge in the north room and pick up the lever whilst weighing less than 0kg.=Cruza el puente de la sala norte y recoge la lever pesando menos de 0 kg.
Use the lever on the lever bracket in the entrance room.=Usa la lever en el lever bracket de la sala de entrada.
Pull the lever.=Tira de la lever.
Enter the south gate.=Entra por la puerta sur.
Search the chests in the ice area of this room until you have at least 20 Ice Arrows or more to be safe. If using a throwable weapon (darts, knives) a single Ice Arrow is sufficient. A random chest has the arrows each time.=Busca en los cofres de la zona helada de esta sala hasta tener al menos 20 Ice Arrows o más para ir sobre seguro. Si usas un arma arrojadiza (darts, knives), basta con una sola Ice Arrow. Cada vez es un cofre aleatorio el que tiene las flechas.
Return back to the entry room when you have enough arrows.=Vuelve a la sala de entrada cuando tengas suficientes flechas.
Go into the north room, then on the north side right-click search the lever there for traps, then pull it.=Entra en la sala norte y, en el lado norte, haz clic derecho para buscar trampas en la lever y luego tira de ella.
Go into the north room, then on the north side pull the lever.=Entra en la sala norte y, en el lado norte, tira de la lever.
Try to enter the far north door. Be prepared to fight Lesarkus, who can only be hurt by ice arrows.=Intenta entrar por la puerta del extremo norte. Prepárate para luchar contra Lesarkus, a quien solo pueden dañar las ice arrows.
Kill the Fire Warrior of Lesarkus. He can only be hurt by the ice arrows.=Mata al Fire Warrior of Lesarkus. Solo pueden dañarle las ice arrows.
Go all the way north and talk to Winelda there.=Ve hasta el extremo norte y habla con Winelda.
Give Winelda 20 unnoted limpwurts.=Entrega a Winelda 20 limpwurts sin certificar.
Enter the Temple of Ikov north of East Ardougne. If you got the shiny key, get it and enter via Mcgrubber's wood west of Seers' Village.=Entra en el Temple of Ikov, al norte de East Ardougne. Si tienes la shiny key, recógela y entra por Mcgrubber's wood, al oeste de Seers' Village.
Enter the house at Mcgrubbor's wood and go down the ladder.=Entra en la casa de Mcgrubbor's wood y baja por la escalera.
Talk to Winelda in the far north of the dungeon.=Habla con Winelda en el extremo norte de la mazmorra.
Follow the path around past the skeletons and lesser demons until you find a shiny key. Pick it up.=Sigue el camino rodeando los esqueletos y los lesser demons hasta encontrar una shiny key. Recógela.
Push the wall on the north side of this area.=Empuja la pared del lado norte de esta zona.
You can now choose to either help Lucien or help the Guardians of Armadyl. To help Lucien, simply pick up the Staff of Armadyl. To help the guardians, remove the pendant of lucien and talk to one of them.=Ahora puedes elegir entre ayudar a Lucien o a los Guardians of Armadyl. Para ayudar a Lucien, simplemente recoge el Staff of Armadyl. Para ayudar a los guardianes, quítate el pendant of lucien y habla con uno de ellos.
Equip the Armadyl Pendant and defeat Lucien in the house west of the Grand Exchange.=Equipa el Armadyl Pendant y derrota a Lucien en la casa al oeste del Grand Exchange.
Bring the Staff of Armadyl to Lucien in the house west of the Grand Exchange.=Lleva el Staff of Armadyl a Lucien en la casa al oeste del Grand Exchange.
Either return to Lucien west of the Grand Exchange with the Staff of Armadyl, or kill him whilst wearing the Pendant of Armadyl.=Vuelve con Lucien, al oeste del Grand Exchange, con el Staff of Armadyl, o mátalo llevando puesto el Pendant of Armadyl.
