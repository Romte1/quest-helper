# Spanish translations for Ratcatchers.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can make this by using some weeds on a pot=Puedes hacerlo usando unas malas hierbas en un pot
You can get another from the Apothecary=Puedes conseguir otro del Apothecary
You can get another from the snake charmer=Puedes conseguir otro del snake charmer
Talk to Gertrude west of Varrock.=Habla con Gertrude al oeste de Varrock.
Go down into Varrock Sewer via the Manhole south east of Varrock Castle.=Baja a Varrock Sewer por el Manhole al sureste de Varrock Castle.
Talk to Phingspet in Varrock Sewer.=Habla con Phingspet en Varrock Sewer.
Have your cat catch 8 rats.=Haz que tu gato cace 8 ratas.
Talk to Phingspet in Varrock Sewer again.=Habla con Phingspet en Varrock Sewer de nuevo.
Talk to Jimmy Dazzler north of Ardougne Castle.=Habla con Jimmy Dazzler al norte de Ardougne Castle.
Read the directions.=Lee las directions.
Climb the trellis around the back of the mansion, avoiding the guards. You may need to deviate from the marked path depending on what the guards are doing.=Sube la trellis por la parte trasera de la mansión, evitando a los guardias. Puede que tengas que desviarte del camino marcado según lo que estén haciendo los guardias.
Climb the trellis.=Sube la trellis.
Catch the rat in the north west room with your cat.=Atrapa la rata de la sala noroeste con tu gato.
Hide in the north east room until it's safe to go to the south east room, then catch the rats there.=Escóndete en la sala noreste hasta que sea seguro ir a la sala sureste y luego atrapa allí las ratas.
Climb down the ladder.=Baja la escalera.
Catch the 3 rats down here.=Atrapa las 3 ratas de aquí abajo.
Talk to Jimmy Dazzler again.=Habla con Jimmy Dazzler de nuevo.
Talk to Hooknosed Jack in south east Varrock.  You can give Jack your vial, kwuarm, and red spiders' eggs for the rat poison=Habla con Hooknosed Jack en el sureste de Varrock. Puedes darle a Jack tu vial, kwuarm y red spiders' eggs para el rat poison
Climb up the ladder south of Jack.=Sube la escalera al sur de Jack.
Add rat poison to your cheese.=Añade rat poison a tu cheese.
Use a poisoned cheese on the rat holes.=Usa un poisoned cheese en los agujeros de rata.
Return to Jack.=Vuelve con Jack.
Talk to the Apothecary in west Varrock.=Habla con el Apothecary en el oeste de Varrock.
Talk to Jack again.=Habla con Jack de nuevo.
Use your cat on the hole in the wall. You'll need to feed it by using fish ON THE WALL whenever its health gets low.=Usa tu gato en el agujero de la pared. Tendrás que alimentarlo usando fish EN LA PARED cada vez que le baje la salud.
Use fish on the wall whenever your cat's health gets low.=Usa fish en la pared cada vez que le baje la salud a tu gato.
Travel to Keldagrim.=Viaja a Keldagrim.
Talk to Smokin' Joe in the north east of Keldagrim.=Habla con Smokin' Joe en el noreste de Keldagrim.
Use a tinderbox on the pot of weeds.=Usa un tinderbox en el pot of weeds.
Use the smouldering pot on the hole east of Joe with your cat following you and your catspeak amulet equipped.=Usa el smouldering pot en el agujero al este de Joe con tu gato siguiéndote y el catspeak amulet equipado.
Use the smouldering pot on the rat hole again.=Usa el smouldering pot en el agujero de rata de nuevo.
Talk to Smokin' Joe again.=Habla con Smokin' Joe de nuevo.
Go down the manhole near The Face.=Baja por el manhole cerca de The Face.
Talk to Felkrash in the Port Sarim Rat Pits.=Habla con Felkrash en el Port Sarim Rat Pits.
Leave the rat pits.=Sal de las rat pits.
Talk to The Face in Port Sarim again.=Habla con The Face en Port Sarim de nuevo.
Use a coin on the pot next to the Snake Charmer in Pollnivneach.=Usa una moneda en el pot junto al Snake Charmer en Pollnivneach.
Return to just outside the Port Sarim Rat Pits.=Vuelve justo a las afueras del Port Sarim Rat Pits.
Click your snake charm and play it.=Haz clic en tu snake charm y tócalo.
Return to Felkrash to finish.=Vuelve con Felkrash para terminar.
Access to the Rat Pits=Acceso a las Rat Pits
Ability to train Overgrown Cats into Wiley and Lazy Cats=Habilidad de entrenar Overgrown Cats para convertirlos en Wiley y Lazy Cats
Alternatively, rat poison could be obtained in the basement of the Clocktower south of East Ardougne. If you already have the rat poison it follows that you would not need the vial, red spiders' eggs, or kwuarm.=Como alternativa, el rat poison se puede conseguir en el sótano del Clocktower al sur de East Ardougne. Si ya tienes el rat poison, no necesitarás el vial, los red spiders' eggs ni el kwuarm.
Starting off=Empezando
Helping Jimmy=Ayudar a Jimmy
Helping Jack=Ayudar a Jack
Helping Joe=Ayudar a Joe
Helping Felkrash=Ayudar a Felkrash
Click the marked note.=Haz clic en la nota marcada.
Go to the next page.=Ve a la página siguiente.
Go to the previous page.=Ve a la página anterior.
Click the raise octave button.=Haz clic en el botón de subir octava.
Click play.=Haz clic en play.
Coins for magic carpet travel=Coins para viajar en magic carpet
Fish or more, raw or cooked=Fish o más, crudo o cocido
Mine cart access to Keldagrim from the GE=Acceso al mine cart a Keldagrim desde el GE
