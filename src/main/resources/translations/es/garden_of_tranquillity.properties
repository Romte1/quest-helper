# Spanish translations for Garden of Tranquillity.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Bottomless bucket will not work for this compost.=El bottomless bucket no sirve para este compost.
Bottomless bucket will not work for these two required composts.=El bottomless bucket no sirve para estos dos composts necesarios.
Bottomless bucket will not work for these five required composts.=El bottomless bucket no sirve para estos cinco composts necesarios.
You can grow another from a cutting from the white tree on Ice Mountain=Puedes cultivar otro a partir de un esqueje del white tree de Ice Mountain
You can get more from Lyra=Puedes conseguir más de Lyra
You can get more from Bernald=Puedes conseguir más de Bernald
You can get more from Kragen=Puedes conseguir más de Kragen
You can get more from Elstan=Puedes conseguir más de Elstan
Talk to Ellamaria east of Varrock Castle.=Habla con Ellamaria al este de Varrock Castle.
Talk to Ellamaria for a trolley.=Habla con Ellamaria para conseguir un trolley.
Talk to the Wise Old Man in Draynor Village.=Habla con el Wise Old Man en Draynor Village.
Talk to Elstan north west of Draynor Village.=Habla con Elstan al noroeste de Draynor Village.
Plant a marigold near to Elstan.=Planta un marigold cerca de Elstan.
Harvest marigolds from the Falador Allotment patches. If yours died, you'll need to grow some more there.=Cosecha marigolds de los huertos de Falador. Si los tuyos murieron, tendrás que cultivar más allí.
Give Elstan a marigold for his seeds.=Entrega un marigold a Elstan por sus semillas.
Talk to Lyra west of Port Phasmatys.=Habla con Lyra al oeste de Port Phasmatys.
Plant onions in a patch near Lyra. Plant in both for the best chance of one not dying.=Planta onions en un huerto cerca de Lyra. Planta en los dos para tener más probabilidades de que uno no muera.
Wait for your onions to finish growing. If they died you'll need to plant more in Lyra's patches.=Espera a que tus onions terminen de crecer. Si murieron, tendrás que plantar más en los huertos de Lyra.
Talk to Lyra west of Port Phasmatys again for her seeds.=Habla con Lyra al oeste de Port Phasmatys de nuevo para conseguir sus semillas.
Talk to Kragen northeast of Ardougne.=Habla con Kragen al noreste de Ardougne.
Plant cabbage seeds in the patches near Kragen. Plant in both to be safe.=Planta cabbage seeds en los huertos cerca de Kragen. Planta en los dos para asegurarte.
Wait for your cabbages to finish growing. If they died you'll need to plant more in Kragen's patches.=Espera a que tus cabbages terminen de crecer. Si murieron, tendrás que plantar más en los huertos de Kragen.
Talk to Kragen northeast of Ardougne for his seeds.=Habla con Kragen al noreste de Ardougne para conseguir sus semillas.
Talk to Dantaera north of Catherby.=Habla con Dantaera al norte de Catherby.
Use secateurs on the white tree on top of Ice Mountain.=Usa las secateurs en el white tree de la cima de Ice Mountain.
Use the shoot on a plant pot.=Usa el shoot en un plant pot.
Water the white tree shoot.=Riega el white tree shoot.
Talk to Brother Althric in the Edgeville Monastery.=Habla con Brother Althric en el Edgeville Monastery.
Use the Ring of charos(a) on the well in Edgeville.=Usa el Ring of charos(a) en el pozo de Edgeville.
Take some seeds from the red roses.=Coge algunas semillas de las red roses.
Take some seeds from the pink roses.=Coge algunas semillas de las pink roses.
Take some seeds from the white roses.=Coge algunas semillas de las white roses.
Use a fishing rod on the well in Edgeville to retrieve the ring of charos. This can take a few attempts.=Usa una fishing rod en el pozo de Edgeville para recuperar el ring of charos. Puede requerir varios intentos.
Talk to Bernald in Burthorpe.=Habla con Bernald en Burthorpe.
Use plant cure on Bernald's grapevines.=Usa plant cure en las vides de Bernald.
Talk to Alain in Taverley with your ring of charos UNEQUIPPED.=Habla con Alain en Taverley con el ring of charos SIN EQUIPAR.
Use a hammer on some essence.=Usa un hammer en algo de essence.
Use a pestle and mortar on the essence shards.=Usa un pestle and mortar en los essence shards.
Use the rune dust on some plant cure.=Usa el rune dust en algo de plant cure.
Use the enhanced plant cure on Bernald's grapevines.=Usa la enhanced plant cure en las vides de Bernald.
Talk to Bernald for his seeds.=Habla con Bernald para conseguir sus semillas.
Fill the plantpots in Ellamaria's garden with compost.=Llena los plantpots del jardín de Ellamaria con compost.
Plant the delphinum seeds.=Planta las delphinum seeds.
Plant the pink orchids in the marked plantpot.=Planta las pink orchids en el plantpot marcado.
Plant the yellow orchids in the marked plantpot.=Planta las yellow orchids en el plantpot marcado.
Plant snowdrops in the east patch.=Planta snowdrops en el huerto del este.
Plant the white tree.=Planta el white tree.
Plant the rose seeds.=Planta las rose seeds.
Plant the vine seeds.=Planta las vine seeds.
Use a trolley on the king statue outside Lumbridge Castle.=Usa un trolley en la king statue de fuera de Lumbridge Castle.
Push the trolley across the River Lum, then to the marked plinth in the garden. Right-click 'place' the statue when it's next to the plinth.=Empuja el trolley por el River Lum y luego hasta el pedestal marcado del jardín. Haz clic derecho en 'place' sobre la statue cuando esté junto al pedestal.
Use the trolley on the statue of Saradomin in Falador.=Usa el trolley en la statue de Saradomin en Falador.
Push the trolley out of Falador, then to the marked plinth in the garden. Right-click 'place' the statue when it's next to the plinth.=Empuja el trolley fuera de Falador y luego hasta el pedestal marcado del jardín. Haz clic derecho en 'place' sobre la statue cuando esté junto al pedestal.
Talk to Ellamaria once everything's finished growing.=Habla con Ellamaria cuando todo haya terminado de crecer.
Talk to King Roald in Varrock Castle, watch the cutscene, then finish the dialog with Ellamaria to finish the quest!=Habla con King Roald en Varrock Castle, mira la cinemática y luego termina el diálogo con Ellamaria para terminar la misión.
