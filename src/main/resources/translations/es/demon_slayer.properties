# Spanish translations for Demon Slayer.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Aris in her tent in Varrock Square.=Habla con Aris en su tienda en Varrock Square.
Talk to Sir Prysin in the south west corner of Varrock Castle.=Habla con Sir Prysin en la esquina suroeste de Varrock Castle.
Talk to Captain Rovin upstairs in the north west of Varrock Castle.=Habla con Captain Rovin en la planta superior al noroeste de Varrock Castle.
Go to the Varrock Castle kitchen.=Ve a la cocina de Varrock Castle.
Get a bucket from above the Varrock Castle kitchen.=Consigue un bucket encima de la cocina de Varrock Castle.
Pick up the bucket nearby.=Coge el bucket que hay cerca.
Go back down to the kitchen.=Vuelve a bajar a la cocina.
Use the bucket on the sink.=Usa el bucket en el sink.
Use the bucket of water on the drain outside the kitchen.=Usa el bucket of water en el drain que hay fuera de la cocina.
Go down into Varrock Sewer via the Manhole south east of Varrock Castle.=Baja a Varrock Sewer por el Manhole al sureste de Varrock Castle.
Pick up the Rusty Key north of the Sewer entrance.=Coge el Rusty Key al norte de la entrada del Sewer.
Bring Wizard Traiborn 25 bones in the Wizards' Tower.=Lleva 25 bones a Wizard Traiborn en el Wizards' Tower.
Bring Wizard Traiborn 25 bones in the Wizards' Tower. You don't need to bring them all at once.=Lleva 25 bones a Wizard Traiborn en el Wizards' Tower. No hace falta llevárselos todos a la vez.
Return to Sir Prysin in the south west of Varrock Castle.=Vuelve con Sir Prysin al suroeste de Varrock Castle.
Get Silverlight back from Sir Prysin in the south west of Varrock Castle.=Recupera Silverlight de Sir Prysin al suroeste de Varrock Castle.
Kill Delrith (level 27) using Silverlight at the dark wizards south of Varrock. Once defeated, you'll need to say the magic words to banish him.=Mata a Delrith (nivel 27) usando Silverlight en los dark wizards al sur de Varrock. Una vez derrotado, tendrás que decir las magic words para desterrarlo.
