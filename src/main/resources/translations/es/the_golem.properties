Enter the Uzer ruins. You can drop the Letter you just read.=Entra en las ruinas de Uzer. Puedes soltar la Letter que acabas de leer.
Pick up the strange implement in the north west corner of the ruin.=Coge la strange implement en la esquina noroeste de las ruinas.
Talk to Elissa in the north east of the Digsite.=Habla con Elissa al noreste del Digsite.
Search the bookcase in the south east corner of the Digsite Exam Centre.=Busca en la estantería de la esquina sureste del Digsite Exam Centre.
Read Varmen's notes.=Lee las Varmen's notes.
Talk to Curator Haig in the Varrock Museum. You can drop Varmen's notes.=Habla con Curator Haig en el Varrock Museum. Puedes soltar las Varmen's notes.
Pickpocket Curator Haig for the Display cabinet key.=Roba a Curator Haig para conseguir la Display cabinet key.
Go to the first floor of the Varrock Museum and right-click open the golem statue's display case.=Sube al primer piso del Varrock Museum y abre con clic derecho la vitrina de la estatua del golem.
Right-click open the golem statue's display case.=Abre con clic derecho la vitrina de la estatua del golem.
Enter the Uzer ruins.=Entra en las ruinas de Uzer.
Use the statue on the empty alcove.=Usa la estatua en el hueco vacío.
