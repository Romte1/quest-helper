# Spanish translations for The Golem.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Necklace of passage to Eagle's Eyrie=Necklace of passage a Eagle's Eyrie
If you've lost it, talk to the Curator in the Varrock museum again=Si lo has perdido, habla con el Curator en el Varrock museum de nuevo
Talk to the Golem in Uzer to start the quest.=Habla con el Golem en Uzer para empezar la misión.
Use 4 soft clay on the Golem in Uzer.=Usa 4 soft clay en el Golem en Uzer.
Use 3 soft clay on the Golem in Uzer.=Usa 3 soft clay en el Golem en Uzer.
Use 2 soft clay on the Golem in Uzer.=Usa 2 soft clay en el Golem en Uzer.
Use 1 soft clay on the Golem in Uzer.=Usa 1 soft clay en el Golem en Uzer.
Pick up the letter on the floor in Uzer and read it.=Coge la letter del suelo en Uzer y léela.
