# Spanish translations for Mountain Daughter.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
A Dramen Staff will NOT work. A pole can be obtained from the goat pen north of Hamal's tent.=Un Dramen Staff NO funcionará. Puedes conseguir un pole del corral de cabras al norte de la tienda de Hamal.
You can use most other gloves, with a few exceptions (Slayer, Mystic, Ranger, Moonclan, Lunar, Infinity, vambraces).=Puedes usar la mayoría de los otros guantes, con algunas excepciones (Slayer, Mystic, Ranger, Moonclan, Lunar, Infinity, vambraces).
You can get some mud from the mud pool south of Hamal's tent.=Puedes conseguir mud del charco de barro al sur de la tienda de Hamal.
You can get another piece by using a pickaxe on the Ancient Rock in the Mountain Camp.=Puedes conseguir otra pieza usando un pickaxe en el Ancient Rock del Mountain Camp.
You can get another guarantee from Brundt in Rellekka's longhall.=Puedes conseguir otra garantía de Brundt en el longhall de Rellekka.
You can find this corpse again in the Kendal's cave.=Puedes encontrar este cadáver de nuevo en la cueva del Kendal.
Use your rope on the boulder outside the Mountain Camp east of Rellekka.=Usa tu rope en la roca fuera del Mountain Camp, al este de Rellekka.
Return to the Mountain Camp.=Vuelve al Mountain Camp.
Speak to Hamal the Chieftain in the Mountain Camp.=Habla con Hamal the Chieftain en el Mountain Camp.
Head south of Hamal's tent and dig some mud from the mud pond.=Ve al sur de la tienda de Hamal y cava un poco de mud del estanque de barro.
Pick up the pole north of Hamal's tent.=Coge el pole al norte de la tienda de Hamal.
Use mud on the Tall Tree on the lake north of the camp, and then climb it.=Usa mud en el Tall Tree del lago al norte del campamento y luego súbelo.
Climb the Tall Tree on the lake north of the camp.=Sube al Tall Tree del lago al norte del campamento.
Use your pole or a staff on the clump of rocks.=Usa tu pole o un staff en el grupo de rocas.
Use a plank on the flat stone.=Usa un plank en la piedra plana.
Listen to the Shining Pool.=Escucha al Shining Pool.
Use a plank on the flat stone to return to shore.=Usa un plank en la piedra plana para volver a la orilla.
Speak to Jokul north of Hamal's tent.=Habla con Jokul al norte de la tienda de Hamal.
Speak to Svidi who roams in the forest east of Rellekka.=Habla con Svidi, que deambula por el bosque al este de Rellekka.
Speak to Brundt the Chieftain in the Rellekka's longhall.=Habla con Brundt the Chieftain en el longhall de Rellekka.
Use a pickaxe on the Ancient Rock in the Mountain Camp.=Usa un pickaxe en el Ancient Rock del Mountain Camp.
Return to Brundt the Chieftain in the Rellekka's longhall.=Vuelve con Brundt the Chieftain en el longhall de Rellekka.
Return to Svidi who roams in the forest east of Rellekka.=Vuelve con Svidi, que deambula por el bosque al este de Rellekka.
Go to the top of White Wolf Mountain and pick the Thorny Bushes whilst wearing gloves.=Ve a la cima de White Wolf Mountain y recoge los Thorny Bushes llevando guantes.
Eat the White Pearl.=Cómete la White Pearl.
Return to Hamal the Chieftain in the Mountain Camp.=Vuelve con Hamal the Chieftain en el Mountain Camp.
Return to the centre of the pool north of the Mountain Camp and listen to it.=Vuelve al centro del estanque al norte del Mountain Camp y escúchalo.
Attempt to jump across the flat stone WITHOUT a plank to return to the north shore.=Intenta saltar sobre la piedra plana SIN un plank para volver a la orilla norte.
Cut through the trees north east of the lake and enter the cave there. Bring combat gear.=Abre paso entre los árboles al noreste del lago y entra en la cueva de allí. Lleva equipo de combate.
Speak to the Kendal, then kill him.=Habla con el Kendal y luego mátalo.
Kill the kendal.=Mata al kendal.
Pick up the Corpse of Woman.=Coge el Corpse of Woman.
Bring the corpse to Hamal.=Lleva el cadáver a Hamal.
Collect 5 Muddy Rocks from around the camp.=Consigue 5 Muddy Rocks por el campamento.
Speak to Ragnar.=Habla con Ragnar.
Return to the centre of the lake and bury the corpse.=Vuelve al centro del lago y entierra el cadáver.
Use the Muddy rocks on the Burial Mound at the centre of the Mountain Camp's lake.=Usa las Muddy rocks en el Burial Mound del centro del lago del Mountain Camp.
