# Spanish translations for A Ruff Situation.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Not needed if you are using a costume needle.=No es necesario si usas una costume needle.
You can make another from grain and fur with a needle and thread.=Puedes hacer otro con grain y fur con una aguja e hilo.
Talk to Talia at the dog shelter south-west of the Edgeville Monastery.=Habla con Talia en el refugio de perros al suroeste de Edgeville Monastery.
Talk to Gertrude in her house west of Varrock, just south of the Cooks' Guild.=Habla con Gertrude en su casa al oeste de Varrock, justo al sur del Cooks' Guild.
Interact with the stray dog barking at a guard, just south of the western Varrock bank.=Interactúa con el stray dog que ladra a un guardia, justo al sur del banco occidental de Varrock.
Follow the stray dog to the house just west of Thessalia's Fine Clothes. If she isn't there, return to the guard just south of the western Varrock bank.=Sigue al stray dog hasta la casa justo al oeste de Thessalia's Fine Clothes. Si no está allí, vuelve con el guardia justo al sur del banco occidental de Varrock.
Interact with the stray dog again to have her pick up the puppies' scent.=Interactúa con el stray dog de nuevo para que capte el olor de los puppies.
Inspect the chewed box, the torn newspaper and the rough bedding in the dog's den. Finish the dialogue after each inspection.=Inspecciona la caja mordida, el periódico roto y la ropa de cama áspera en la guarida del perro. Termina el diálogo después de cada inspección.
Follow the stray dog from the den until a cutscene triggers north of the Cooks' Guild.=Sigue al stray dog desde la guarida hasta que se active una escena al norte del Cooks' Guild.
Interact with the stray dog to watch the cutscene.=Interactúa con el stray dog para ver la escena.
Talk to the stray dog. Dismiss any pet you have out first.=Habla con el stray dog. Primero despide a cualquier mascota que tengas fuera.
Talk to the stray dog in its den, west of the Varrock clothes shop.=Habla con el stray dog en su guarida, al oeste de la tienda de ropa de Varrock.
Talk to Picklenose south-west of the Cooks' Guild with the stray dog following you.=Habla con Picklenose al suroeste del Cooks' Guild con el stray dog siguiéndote.
Use the grain on the fur to make a stuffed dog.=Usa el grain en la fur para hacer un stuffed dog.
Talk to the stray dog next to the goblins south-west of the Cooks' Guild.=Habla con el stray dog junto a los goblins al suroeste del Cooks' Guild.
Talk to Picklenose again to trade the stuffed dog for the puppy.=Habla con Picklenose de nuevo para cambiar el stuffed dog por el puppy.
Talk to Picklenose south-west of the cook's guild after handing him the stuffed dog.=Habla con Picklenose al suroeste del cook's guild después de darle el stuffed dog.
Pick up the stray puppy south-west of the cook's guild.=Coge el stray puppy al suroeste del cook's guild.
Talk to the stray dog south-west of the cook's guild to see if she can sniff out the last puppy.=Habla con el stray dog al suroeste del cook's guild para ver si puede olfatear al último puppy.
Interact with the stray dog and follow her until a cutscene triggers by the gap in the wall north of the Cooks' Guild.=Interactúa con el stray dog y síguela hasta que se active una escena junto al hueco del muro al norte del Cooks' Guild.
Kill both outlaws (level 22 and level 23), then watch the cutscene.=Mata a los dos outlaws (nivel 22 y nivel 23) y luego mira la escena.
Talk to the stray dog near the bandits' camp, ready to fight.=Habla con el stray dog cerca del campamento de los bandidos, listo para luchar.
Talk to the stray dog near the bandits' camp for a cutscene.=Habla con el stray dog cerca del campamento de los bandidos para ver una escena.
Pick up the puppy labrador from the den west of the Varrock apothecary.=Coge el puppy labrador de la guarida al oeste de la apothecary de Varrock.
Pick up the puppy pug from the den west of the Varrock apothecary.=Coge el puppy pug de la guarida al oeste de la apothecary de Varrock.
Pick up the puppy spaniel from the den west of the Varrock apothecary.=Coge el puppy spaniel de la guarida al oeste de la apothecary de Varrock.
Talk to the stray dog north-west of the cook's guild.=Habla con el stray dog al noroeste del cook's guild.
With the three puppies in your inventory, talk to the stray dog in the den west of the Varrock apothecary.=Con los tres puppies en el inventario, habla con el stray dog en la guarida al oeste de la apothecary de Varrock.
With the three puppies in your inventory, talk to Talia at the dog shelter south-west of the Edgeville Monastery.=Con los tres puppies en el inventario, habla con Talia en el refugio de perros al suroeste de Edgeville Monastery.
2 outlaws (level 22 and level 23)=2 outlaws (nivel 22 y nivel 23)
Access to puppies, which can be grown into dogs=Acceso a puppies, que pueden crecer hasta convertirse en perros
Starting off=Empezando
Following the stray dog=Siguiendo al stray dog
Bargaining with the goblins=Negociando con los goblins
The last puppy=El último puppy
Puppy reunion=Reencuentro con los puppies
