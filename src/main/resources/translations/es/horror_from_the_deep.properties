# Spanish translations for Horror from the Deep.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Gunnjorn in the Barbarian Agility Course=Puedes conseguir otra de Gunnjorn en el Barbarian Agility Course
Talk to Larrissa outside the Lighthouse north of the Barbarian Outpost. You can get here by Fairy Ring (alp), by jumping over the bassalt rocks from the Barbarian Outpost, or from the Fremennik Province.=Habla con Larrissa fuera del Lighthouse, al norte del Barbarian Outpost. Puedes llegar con el Fairy Ring (alp), saltando por las bassalt rocks del Barbarian Outpost o desde la Fremennik Province.
