Defeat the dagannoth.=Derrota al dagannoth.
Defeat the Dagannoth mother. She can only be hurt by air spells when white, water spells when blue, earth spells when brown, fire spells when red, melee when orange and ranged when green.=Derrota a la Dagannoth mother. Solo se le puede dañar con air spells cuando está blanca, water spells cuando está azul, earth spells cuando está marrón, fire spells cuando está roja, cuerpo a cuerpo cuando está naranja y a distancia cuando está verde.
The Dagannoth Mother will swap over time between being vulnerable to melee, ranged, and each of the 4 magic elements. You can bring multiple combat types, or just wait for her to swap to what you have brought along.=La Dagannoth Mother irá cambiando con el tiempo entre ser vulnerable al cuerpo a cuerpo, a distancia y a cada uno de los 4 elementos mágicos. Puedes llevar varios tipos de combate o simplemente esperar a que cambie al que hayas llevado.
