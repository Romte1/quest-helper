# Spanish translations for Merlin's Crystal.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to King Arthur in Camelot Castle to start.=Habla con King Arthur en Camelot Castle para empezar.
Talk to Sir Gawain about how Merlin got trapped.=Habla con Sir Gawain sobre cómo quedó atrapado Merlin.
Go upstairs to talk to Lancelot.=Sube las escaleras para hablar con Lancelot.
Talk to Sir Lancelot about getting into Morgan Le Faye's stronghold.=Habla con Sir Lancelot sobre cómo entrar en el stronghold de Morgan Le Faye.
Hide in Arhein's crate behind the Candle Maker's shop in Catherby.=Escóndete en el cajón de Arhein, detrás de la tienda del Candle Maker en Catherby.
Go up the stairs in the fortress.=Sube las escaleras de la fortaleza.
Go up another floor.=Sube otro piso.
Attack Sir Mordred down to 0hp to cause Morgan Le Faye to spawn.=Ataca a Sir Mordred hasta 0hp para que aparezca Morgan Le Faye.
Go through Morgan le Faye's dialog. IF YOU EXIT FROM THIS DIALOG YOU WILL HAVE TO FIGHT MORDRED AGAIN.=Avanza por el diálogo de Morgan le Faye. SI SALES DE ESTE DIÁLOGO TENDRÁS QUE LUCHAR CONTRA MORDRED OTRA VEZ.
Kill a Giant bat outside Keep Le Faye for some bat bones.=Mata a un Giant bat fuera de Keep Le Faye para conseguir bat bones.
Climb down from Keep Le Faye and step through the front door, then kill a Giant bat for some bat bones.=Baja de Keep Le Faye y cruza la puerta principal, luego mata a un Giant bat para conseguir bat bones.
Return to Catherby.=Vuelve a Catherby.
If you still need wax, go grab the insect repellent in a house in north Catherby. Otherwise, get your wax out.=Si aún necesitas wax, coge el insect repellent en una casa del norte de Catherby. Si no, saca tu wax.
Go grab the bucket in the bee field west of Catherby.=Coge el bucket en el campo de abejas al oeste de Catherby.
Use the insect repellent on a bee hive, then try to take some wax.=Usa el insect repellent en una bee hive y luego intenta coger wax.
Talk to the Candle Maker in Catherby twice until he gives you a black candle.=Habla dos veces con el Candle Maker en Catherby hasta que te dé una black candle.
Talk to the Lady of the Lake in Taverley.=Habla con la Lady of the Lake en Taverley.
Attempt to enter the jewelery store in Port Sarim.=Intenta entrar en la joyería de Port Sarim.
Talk to the beggar who appears and give him some bread.=Habla con el beggar que aparece y dale un poco de bread.
Check the altar in the Zamorak Temple in south east Varrock. If you've already learnt the spell, just mark this step complete in the Quest Helper sidebar.=Revisa el altar del Zamorak Temple al sureste de Varrock. Si ya has aprendido el hechizo, simplemente marca este paso como completado en la barra lateral de Quest Helper.
Enter the gates towards Camelot Castle.=Entra por las puertas hacia Camelot Castle.
Go stand in the star symbol north east of Camelot Castle.=Ve a situarte en el símbolo de estrella al noreste de Camelot Castle.
Light the Black candle with your tinderbox.=Enciende la Black candle con tu tinderbox.
Right-click drop the bat bones in the star.=Haz clic derecho y suelta las bat bones en la estrella.
Say the spell 'Snarthon Candtrick Termanto'. Be careful not to click the wrong option or you'll have to get another Black Candle.=Di el hechizo 'Snarthon Candtrick Termanto'. Ten cuidado de no hacer clic en la opción equivocada o tendrás que conseguir otra Black Candle.
Go up the ladder in the south east of Camelot castle.=Sube la escalera al sureste de Camelot castle.
Go up the next ladder.=Sube la siguiente escalera.
Smash the Giant Crystal with Excalibur equipped.=Rompe el Giant Crystal con Excalibur equipada.
Tell King Arthur you've freed Merlin.=Dile a King Arthur que has liberado a Merlin.
