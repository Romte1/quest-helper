# Spanish translations for The Fremennik Trials.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Askeladden=Puedes conseguir otra de Askeladden
Talk to Brundt in Rellekka's longhall.=Habla con Brundt en el longhall de Rellekka.
Talk to Olaf the Bard north east of the longhall.=Habla con Olaf the Bard al noreste del longhall.
Go south east of Rellekka and cut a branch from the swaying tree=Ve al sureste de Rellekka y corta una rama del árbol que se mece
Use a knife on the branch to make an unstrung lyre=Usa un knife en la rama para hacer una unstrung lyre
Talk to Lalli to the south east of Rellekka.=Habla con Lalli al sureste de Rellekka.
Return to Rellekka and talk to Askeladden for a pet rock.=Vuelve a Rellekka y habla con Askeladden para conseguir un pet rock.
Pick a potato, cabbage and onion from the field in south east Rellekka.=Coge un potato, un cabbage y una onion del campo al sureste de Rellekka.
Return to Lalli and use a onion, cabbage, potato, and pet rock on their stew. You can find the vegetables growing in the south east of Rellekka.=Vuelve con Lalli y usa una onion, un cabbage, un potato y el pet rock en su estofado. Puedes encontrar las verduras creciendo en el sureste de Rellekka.
Use a cabbage on the stew.=Usa un cabbage en el estofado.
Use a potato on the stew.=Usa un potato en el estofado.
Use your pet rock on the stew.=Usa tu pet rock en el estofado.
Talk to Lalli for golden wool.=Habla con Lalli para conseguir golden wool.
Spin the golden fleece into wool using a spinning wheel. The closest wheel is in Seers' Village.=Hila la golden fleece para hacer wool en una rueca. La rueca más cercana está en Seers' Village.
Use the golden wool on your unstrung lyre.=Usa la golden wool en tu unstrung lyre.
Bring your lyre to the Strange Altar south west of Rellekka, and use either a raw shark, raw sea turtle or raw manta ray on it.=Lleva tu lyre al Strange Altar al suroeste de Rellekka y usa en él un raw shark, raw sea turtle o raw manta ray.
Return to Rellekka and enter the longhall's stage to perform. Once on stage, play the enchanted lyre.=Vuelve a Rellekka y sube al escenario del longhall para actuar. Una vez en el escenario, toca la enchanted lyre.
Talk to Manni the Reveller in the Rellekka longhall.=Habla con Manni the Reveller en el longhall de Rellekka.
Talk to Manni the Reveller in the longhall.=Habla con Manni the Reveller en el longhall.
Get some beer. There is beer tankard in the Rellekka longhall.=Consigue beer. Hay una beer tankard en el longhall de Rellekka.
Give the Council workman on the bridge south of Rellekka going to Seer's Village a beer.=Dale una beer al Council workman del puente al sur de Rellekka que va a Seer's Village.
Buy some alcohol free beer from the Poison Salesman in the Seer's Village pub.=Compra alcohol free beer al Poison Salesman en el pub de Seer's Village.
Return to Rellekka with the strange object, a tinderbox, and low alcohol beer.=Vuelve a Rellekka con el strange object, un tinderbox y la low alcohol beer.
Use a tinderbox on the strange object then use it on the nearby pipe.=Usa un tinderbox en el strange object y luego úsalo en el tubo cercano.
Use the lit strange object on the nearby pipe!=¡Usa el lit strange object en el tubo cercano!
Pick up a keg of beer in the longhall.=Coge un keg of beer en el longhall.
Use the low alcohol beer on the keg of beer whilst in the longhall.=Usa la low alcohol beer en el keg of beer mientras estás en el longhall.
Talk to Manni the Reveller to cheat in the competition.=Habla con Manni the Reveller para hacer trampas en la competición.
Talk to Sigli south of the longhall for a hunters' talisman.=Habla con Sigli al sur del longhall para conseguir un hunters' talisman.
Use the hunter's talisman to hunt down the Draugen. It'll appear near one of the butterflies in the area.=Usa el hunter's talisman para cazar al Draugen. Aparecerá cerca de una de las mariposas de la zona.
Return the charged hunters' talisman to Sigli.=Devuelve el charged hunters' talisman a Sigli.
Talk to Sigmund the Merchant in the Rellekka market.=Habla con Sigmund the Merchant en el mercado de Rellekka.
Talk to the Sailor on the docks.=Habla con el Sailor en los muelles.
Talk to Olaf the Bard east of the longhall.=Habla con Olaf the Bard al este del longhall.
Talk to Ysra in her shop west of the market.=Habla con Ysra en su tienda al oeste del mercado.
Talk to Brundt in the longhall.=Habla con Brundt en el longhall.
Talk to Sigli south of the longhall.=Habla con Sigli al sur del longhall.
Talk to Skulgrimen north of the longhall.=Habla con Skulgrimen al norte del longhall.
Talk to the Fisherman on the pier north of the market.=Habla con el Fisherman en el muelle al norte del mercado.
Talk to Swensen the Navigator in his hut south west of the longhall.=Habla con Swensen the Navigator en su cabaña al suroeste del longhall.
Talk to Peer the Seer south west of the market.=Habla con Peer the Seer al suroeste del mercado.
Talk to Thorvald north of the longhall.=Habla con Thorvald al norte del longhall.
Talk to Thora the Barkeep in the longhall.=Habla con Thora the Barkeep en el longhall.
Talk to Askeladden south of the longhall.=Habla con Askeladden al sur del longhall.
Bring the promissory note to Thora the Barkeep in the longhall.=Lleva la promissory note a Thora the Barkeep en el longhall.
Bring the cocktail to Manni the Reveller in the longhall.=Lleva el cóctel a Manni the Reveller en el longhall.
Bring the champions token to Thorvald north of the longhall.=Lleva el champions token a Thorvald al norte del longhall.
Bring the warriors' contract to Peer the Seer south west of the market.=Lleva el warriors' contract a Peer the Seer al suroeste del mercado.
Bring the weather forecast to Swensen the Navigator in his hut south west of the longhall.=Lleva el weather forecast a Swensen the Navigator en su cabaña al suroeste del longhall.
Bring the sea fishing map to the Fisherman on the pier north of the market.=Lleva el sea fishing map al Fisherman en el muelle al norte del mercado.
Bring the unusual fish to Skulgrimen north of the longhall.=Lleva el unusual fish a Skulgrimen al norte del longhall.
Bring the custom bow string to Sigli south of the longhall.=Lleva el custom bow string a Sigli al sur del longhall.
Bring the tracking map to Brundt in the longhall.=Lleva el tracking map a Brundt en el longhall.
Bring the fiscal statement to Ysra in her shop west of the market.=Lleva el fiscal statement a Ysra en su tienda al oeste del mercado.
Bring the sturdy boots to Olaf the Bard east of the longhall.=Lleva las sturdy boots a Olaf the Bard al este del longhall.
Bring the ballad to the Sailor on the docks.=Lleva la ballad al Sailor en los muelles.
Finally, bring the exotic flower to Sigmund the Merchant in the Rellekka market.=Por último, lleva la exotic flower a Sigmund the Merchant en el mercado de Rellekka.
When you're ready to fight Koschei, go down the ladder.=Cuando estés listo para luchar contra Koschei, baja por la escalera.
Wait for Koschei the Deathless to spawn. If you brought a dramen branch you should now fletch it and equip the staff.=Espera a que aparezca Koschei the Deathless. Si trajiste un dramen branch, ahora deberías tallarlo y equipar el staff.
Fight Koschei the Deathless and 'kill' him at least 3 times. Dying to his fourth phase is a SAFE death.=Lucha contra Koschei the Deathless y 'mátalo' al menos 3 veces. Morir en su cuarta fase es una muerte SEGURA.
You must now either die (SAFE DEATH), or defeat Koschei once more. Do not leave or you'll have to fight him again.=Ahora debes morir (MUERTE SEGURA) o derrotar a Koschei una vez más. No te vayas o tendrás que luchar contra él de nuevo.
Climb down Swensen's ladder.=Baja por la escalera de Swensen.
Go through the south portal.=Pasa por el portal sur.
Go through the west portal.=Pasa por el portal oeste.
Go through the east portal.=Pasa por el portal este.
Go through the north portal.=Pasa por el portal norte.
Climb up the ladder.=Sube por la escalera.
Climb up a rope/ladder to restart the puzzle.=Sube por una cuerda o escalera para reiniciar el puzle.
Talk to Peer the Seer south west of the Rellekka market. You will need to bank all your items. Peer will offer to do this for you.=Habla con Peer the Seer al suroeste del mercado de Rellekka. Tendrás que guardar todos tus objetos en el banco. Peer se ofrecerá a hacerlo por ti.
Try to enter Peer the Seer's house after banking all your items. Peer the Seer will offer to bank everything for you.=Intenta entrar en la casa de Peer the Seer después de guardar todos tus objetos en el banco. Peer the Seer se ofrecerá a guardarlo todo por ti.
Enter the solution to Peer's door.=Introduce la solución de la puerta de Peer.
Solve Swensen's challenge.=Resuelve el desafío de Swensen.
Solve Peer's challenge.=Resuelve el desafío de Peer.
Go up the ladder.=Sube por la escalera.
Search the bookcase for a red herring. If you've already unlocked the mural, go search it instead.=Registra la estantería para encontrar un red herring. Si ya has desbloqueado el mural, ve a registrarlo en su lugar.
Use the red herring on the cooking range.=Usa el red herring en la cocina.
Study the unicorn's head.=Examina la cabeza del unicornio.
Study the bull's head.=Examina la cabeza del toro.
Search the chest in the south of the room.=Registra el cofre del sur de la sala.
Search the cupboard in the south west of the room.=Registra la alacena del suroeste de la sala.
Use the sticky red goop on the wooden disk.=Usa el sticky red goop en el wooden disk.
Open and go down the trapdoor.=Abre la trampilla y baja por ella.
Go down the trapdoor.=Baja por la trampilla.
Use the red disks on the abstract mural.=Usa los red disks en el mural abstracto.
Use the old red disk on the abstract mural.=Usa el old red disk en el mural abstracto.
Use the other red disk on the abstract mural.=Usa el otro red disk en el mural abstracto.
Go back upstairs.=Vuelve a subir.
Use the empty bucket on the tap.=Usa el empty bucket en el grifo.
Use the full bucket on the empty jug.=Usa el full bucket en el empty jug.
Empty the full jug into the drain.=Vacía el full jug en el desagüe.
Use the 2/5ths full bucket on the empty jug.=Usa el 2/5ths full bucket en el empty jug.
Use the full bucket on the 2/3rds full jug.=Usa el full bucket en el 2/3rds full jug.
Use the 4/5ths full bucket on the chest with a scale on it.=Usa el 4/5ths full bucket en el cofre con una balanza.
Use the empty vase on the tap.=Usa el empty vase en el grifo.
Use the vase lid on the filled vase=Usa la vase lid en el filled vase
Use the filled, sealed vase on the frozen table.=Usa el filled, sealed vase en la mesa congelada.
Take the lid off the vase and fill the vase.=Quita la tapa del vase y llena el vase.
Use the frozen vase on the cooking range.=Usa el frozen vase en la cocina.
Empty jug and bucket to restart.=Vacía el jug y el bucket para reiniciar.
Use the frozen key on the cooking range.=Usa la frozen key en la cocina.
Leave the Seer's house.=Sal de la casa del Seer.
Talk to Brundt in Rellekka's longhall to finish the quest.=Habla con Brundt en el longhall de Rellekka para terminar la misión.
Please open the quest's Quest Journal to sync your state.=Abre el Quest Journal de la misión para sincronizar tu estado.
If the guide at any point appears to de-sync during this quest, please try opening the quest journal to fix it.=Si en algún momento la guía parece desincronizarse durante esta misión, intenta abrir el Quest Journal para solucionarlo.
