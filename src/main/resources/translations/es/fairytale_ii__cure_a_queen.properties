# Spanish translations for Fairytale II - Cure a Queen.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Nuff's room in north west Zanaris=Puedes conseguir otro en la habitación de Nuff, al noroeste de Zanaris
Talk to Martin in the Draynor Market.=Habla con Martin en el mercado de Draynor.
Wait 5 minutes.=Espera 5 minutos.
Return to Martin in the Draynor Market.=Vuelve con Martin en el mercado de Draynor.
Search the healing certificate in Fairy Nuff's room.=Busca en el certificado de curación en la habitación de Fairy Nuff.
Right-click study the certificate.=Haz clic derecho y estudia el certificado.
Read the sign near the Cosmic Temple in the south of Zanaris.=Lee el cartel cerca del Cosmic Temple, al sur de Zanaris.
Talk to the Fairy Godfather in the Throne Room.=Habla con el Fairy Godfather en la Throne Room.
Travel to Zanaris.=Viaja a Zanaris.
While carrying Nuff's certificate, use the Fairy Rings to travel to A.I.R., D.L.R., D.J.Q. then A.J.S.=Mientras llevas el certificado de Nuff, usa los Fairy Rings para viajar a A.I.R., D.L.R., D.J.Q. y luego A.J.S.
Talk to Fairy Nuff.=Habla con Fairy Nuff.
Pickpocket the Fairy Godfather in the Zanaris Throne Room.=Roba al Fairy Godfather en la Throne Room de Zanaris.
Give Fairy Nuff the Queen's Secateurs.=Entrega los Queen's Secateurs a Fairy Nuff.
Travel to C.K.P with a Fairy Ring. Even if you've already made a magic essence (unf), you'll need to make another.=Viaja a C.K.P con un Fairy Ring. Aunque ya hayas hecho una magic essence (unf), tendrás que hacer otra.
Wait for a star flower to appear.=Espera a que aparezca una star flower.
Pick a star flower.=Coge una star flower.
Travel to D.I.R. with a Fairy Ring, ready to kill a Gorak. Goraks can hit through protection prayers.=Viaja a D.I.R. con un Fairy Ring, listo para matar a un Gorak. Los Goraks pueden golpear a través de las protection prayers.
Kill Goraks for their claws.=Mata a Goraks para conseguir sus garras.
Pickup the gorak's claws.=Recoge las garras del gorak.
Add the star flower to a vial of water.=Añade la star flower a un vial of water.
Use a pestle and mortar on the gorak claws.=Usa un pestle and mortar en las garras de gorak.
Add the gorak claw powder on the unfinished potion.=Añade el gorak claw powder a la poción sin terminar.
Use the magic essence on the fairy queen.=Usa la magic essence en la fairy queen.
Talk to the Fairy Queen.=Habla con la Fairy Queen.
At least 1 Gorak (level 145)=Al menos 1 Gorak (nivel 145)
Access to Fairy Rings.=Acceso a los Fairy Rings.
Access to Fairy Fixit's Fairy Enhancement Store.=Acceso a la tienda Fairy Enhancement de Fairy Fixit.
Starting off=Empezando
Betrayal=Traición
Making a cure=Preparando la cura


