# Spanish translations for Falador Medium Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Any Pickaxe=Cualquier pickaxe
Any Axe=Cualquier axe
Combat Gear=Equipo de combate
Any usable crossbow=Cualquier crossbow utilizable
Falador Teleports=Teleports a Falador
Go to the Chemist's in Rimmington.=Ve al Chemist's en Rimmington.
Use the tinderbox on the bullseye lantern.=Usa el tinderbox en la bullseye lantern.
Go to the Chaos Temple near the Goblin Village north of Falador.=Ve al Chaos Temple cerca del Goblin Village al norte de Falador.
Use the Telekinetic Grab Spell on the Wine of Zamorak.=Usa el Telekinetic Grab Spell en el Wine of Zamorak.
Use the crystal key to unlock the chest in Taverley=Usa la crystal key para abrir el cofre en Taverley
Use the empty sack on the hay bale to fill it. You can buy an empty sack from Sarah for 5gp.=Usa el empty sack en la hay bale para llenarlo. Puedes comprar un empty sack a Sarah por 5gp.
Use the Hay sack on the Bronze Spear.=Usa el Hay sack en la Bronze Spear.
Use the watermelon on the Hay Sack to make the Scarecrow.=Usa el watermelon en el Hay Sack para hacer el Scarecrow.
Rake any weeds in the flower patch, then plant your scarecrow.=Rastrilla las malas hierbas del flower patch y luego planta tu scarecrow.
Go to Mudskipper Point south of Port Sarim and use your fishing explosive to spawn a Mogre.=Ve a Mudskipper Point al sur de Port Sarim y usa tu fishing explosive para invocar un Mogre.
Kill the Mogre=Mata al Mogre
Climb down the manhole in Port Sarim to visit the Rat Pits.=Baja por la alcantarilla en Port Sarim para visitar las Rat Pits.
Equip your crossbow and grapple then climb the agility shortcut near the Falador Party Room.=Equipa tu ballesta y el grapple, luego sube por el atajo de agilidad cerca del Falador Party Room.
Climb down the wall to finish the task.=Baja de la muralla para completar la tarea.
Pickpocket a guard inside of Falador. If this doesn't complete, pickpocket a guard closer to the plinth.=Roba a un guard dentro de Falador. Si no se completa, roba a un guard más cerca del plinth.
Speak to Sir Tiffy Cashien to purchase a set of Initiate Armor for 20,000 Coins for a full set.=Habla con Sir Tiffy Cashien para comprar un conjunto completo de Initiate Armor por 20.000 Coins.
Equip your Initiate armor and pray at the Altar of Guthix in Taverley=Equipa tu Initiate armor y reza en el Altar of Guthix en Taverley
Go to the Crafting Guild west of Falador. You will need to equip a brown apron to enter.=Ve al Crafting Guild al oeste de Falador. Necesitarás equipar un brown apron para entrar.
Mine a gold ore.=Mina un gold ore.
Go to the Dwarven Mines.=Ve a las Dwarven Mines.
Squeeze through the crevice in the Dwarven Mines=Pasa por la grieta en las Dwarven Mines
Go to Taverley, north west of Falador.=Ve a Taverley, al noroeste de Falador.
Chop a Willow Tree while within Taverley.=Tala un Willow Tree estando en Taverley.
Use your tinderbox on the Willow Logs.=Usa tu tinderbox en los Willow Logs.
Use Sarah's Loom in the Falador Farm to make a basket.=Usa el Loom de Sarah en la Falador Farm para hacer un basket.
Use the Teleport to Falador spell to teleport to Falador=Usa el hechizo Teleport to Falador para teletransportarte a Falador
