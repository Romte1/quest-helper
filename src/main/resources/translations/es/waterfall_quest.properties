# Spanish translations for Waterfall Quest.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Golrie under the Tree Gnome Village=Puedes conseguir otra de Golrie bajo Tree Gnome Village
You can get another from the chest in Glarial's tomb=Puedes conseguir otro del cofre de Glarial's tomb
Talk to Almera on top of Baxtorian Falls, south of Barbarian Outpost.=Habla con Almera en lo alto de Baxtorian Falls, al sur de Barbarian Outpost.
Board the log raft west of Almera.=Sube a la balsa de troncos al oeste de Almera.
Talk to Hudon.=Habla con Hudon.
Use a rope on the rock to the south.=Usa una Rope en la roca al sur.
Use a rope on the dead tree.=Usa una Rope en el árbol muerto.
Get in the barrel.=Métete en el barril.
Go up the stairs in the house south of Almera's house.=Sube por las escaleras de la casa al sur de la casa de Almera.
Search the south east bookcase.=Busca en la estantería del sureste.
Read the book.=Lee el libro.
Go to the centre of the Tree Gnome Village and go down the ladder at the entrance.=Ve al centro de Tree Gnome Village y baja por la escalera de la entrada.
Search the off-coloured crate in the east room.=Busca en la caja de color distinto de la sala este.
Go through the gate in the west room.=Pasa por la puerta de la sala oeste.
Talk to Golrie.=Habla con Golrie.
Bank everything besides the pebble and some food. Then use Glarial's pebble on Glarial's Tombstone east of Baxtorian Falls.=Guarda en el banco todo excepto la pebble y algo de comida. Después usa Glarial's pebble en Glarial's Tombstone al este de Baxtorian Falls.
Search the chest in the western room for Glarial's amulet.=Busca en el cofre de la sala oeste Glarial's amulet.
Search Glarial's Tomb in the south room for Glarial's urn.=Busca en Glarial's Tomb, en la sala sur, Glarial's urn.
Leave Glarial's Tomb and get 6 air, water, and earth runes, a rope, glarial's amulet, glarial's urn, and some food.=Sal de Glarial's Tomb y consigue 6 Air runes, 6 Water runes, 6 Earth runes, una Rope, Glarial's amulet, Glarial's urn y algo de comida.
Equip Glarial's amulet.=Equipa Glarial's amulet.
Enter the falls with Glarial's amulet equipped.=Entra en las cascadas con Glarial's amulet equipado.
Search the crate in the east room for a key.=Busca en la caja de la sala este una Key.
Enter the west room with the key.=Entra en la sala oeste con la Key.
Use 1 earth, water and air rune on each of the 6 pillars in the room. Afterwards, use Glarial's amulet on the statue of Glarial.=Usa 1 Earth rune, 1 Water rune y 1 Air rune en cada uno de los 6 pilares de la sala. Después, usa Glarial's amulet en la estatua de Glarial.
Use Glarial's amulet on the Statue of Glarial=Usa Glarial's amulet en la Statue of Glarial
DO NOT LEFT-CLICK THE CHALICE! Use Glarial's urn on the Chalice to finish the quest.=¡NO HAGAS CLIC IZQUIERDO EN EL CHALICE! Usa Glarial's urn en el Chalice para terminar la misión.
Able to survive enemies up to level 86 attacking you=Capaz de sobrevivir a enemigos de hasta nivel 86 que te ataquen
Starting off=Empezando
Investigate=Investiga
Get Glarial's Pebble=Consigue la Glarial's pebble
Loot Glarial's tomb=Saquea Glarial's tomb
Put Glarial to rest=Da descanso a Glarial
