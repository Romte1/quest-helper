# Spanish translations for Western Provinces Easy Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Complete a lap of the Gnome Agility Course.=Completa una vuelta al Gnome Agility Course.
Enter the Gnome Stronghold.=Entra en el Gnome Stronghold.
Fletch an oak shortbow in the Gnome Stronghold.=Talla un oak shortbow en el Gnome Stronghold.
Enter Brimstail's cave.=Entra en la cueva de Brimstail.
Have Brimstail teleport you to the Essence mine=Haz que Brimstail te teletransporte a la Essence mine
Kill a terrorbird in the terrorbird enclosure.=Mata un terrorbird en el recinto de los terrorbird.
Score a goal in a Gnome Ball match. Talk to the Referee to start the match.=Marca un gol en un partido de Gnome Ball. Habla con el Referee para empezar el partido.
Collect a swamp toad at the Gnome Stronghold.=Consigue una swamp toad en el Gnome Stronghold.
Mine some iron ore near Piscatoris.=Mina un poco de iron ore cerca de Piscatoris.
Catch a copper longtail.=Pesca un copper longtail.
Claim any Chompy bird hat from Rantz. Kill chompy birds until you have 30 kills. \n \nYou can check your kill count by right-clicking 'Check Kills' on an ogre bow.=Reclama cualquier sombrero de Chompy bird a Rantz. Mata Chompy birds hasta tener 30 muertes. \n \nPuedes consultar tu número de muertes haciendo clic derecho en 'Check Kills' con un ogre bow.
Teleport to Pest Control using the minigame teleport.=Teletranspórtate a Pest Control usando el teletransporte del minijuego.
Talk to the squire in Port Sarim to travel to the Void Knights' Outpost. Alternatively, use the pest control minigame teleport.=Habla con el squire en Port Sarim para viajar al Void Knights' Outpost. Como alternativa, usa el teletransporte del minijuego de Pest Control.
Complete a novice game of Pest Control.=Completa una partida de Pest Control en nivel novato.
Talk to the Elder gnome child in Gnome Stronghold to claim your reward!=Habla con el Elder gnome child en Gnome Stronghold para reclamar tu recompensa.
