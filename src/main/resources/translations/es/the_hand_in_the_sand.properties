# Spanish translations for The Hand in the Sand.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Betty=Puedes conseguir otra de Betty
You can get another from Betty in Port Sarim=Puedes conseguir otro de Betty en Port Sarim
You can get another from Bert=Puedes conseguir otro de Bert
You can get another by searching Sandy's desk=Puedes conseguir otra buscando en el escritorio de Sandy
You can get another from Zavistic Rarve in Yanille=Puedes conseguir otro de Zavistic Rarve en Yanille
You can get more by pickpocketing Sandy in Brimhaven=Puedes conseguir más robando a Sandy en Brimhaven
You can get another from Mazion on Entrana=Puedes conseguir otra de Mazion en Entrana
Talk to Bert in west Yanille.=Habla con Bert en el oeste de Yanille.
Give the Guard Captain in the pub south of Bert a beer. You can buy one for 2gp from the pub.=Entrega una beer al Guard Captain del pub al sur de Bert. Puedes comprar una por 2gp en el pub.
Ring the bell outside the Wizards' Guild in Yanille. Talk to Zavistic Rarve when he appears.=Toca la campana fuera del Wizards' Guild en Yanille. Habla con Zavistic Rarve cuando aparezca.
Return to Bert in west Yanille.=Vuelve con Bert en el oeste de Yanille.
Travel to Brimhaven, then enter Sandy's building south of the restaurant. Search Sandy's desk for Sandy's rota.=Viaja a Brimhaven y entra en el edificio de Sandy al sur del restaurante. Busca en el escritorio de Sandy para conseguir la Sandy's rota.
Pickpocket Sandy for some sand.=Roba a Sandy para conseguir sand.
Return to Bert in west Yanille with the rota and sand.=Vuelve con Bert en el oeste de Yanille con la rota y la sand.
Talk to Zavistic Rarve again to get teleported to Port Sarim.=Habla con Zavistic Rarve de nuevo para que te teletransporte a Port Sarim.
Travel to Port Sarim, and talk to Betty in the magic shop.=Viaja a Port Sarim y habla con Betty en la tienda de magia.
Use redberries on the bottled water.=Usa redberries en el bottled water.
Use whiteberries on the red bottled water=Usa whiteberries en el red bottled water
Use the pink dye on a lantern lens.=Usa el pink dye en un lantern lens.
Talk to Betty with the pink lens.=Habla con Betty con el pink lens.
Stand in Betty's doorway and use the rose-tinted lens on the counter.=Colócate en la puerta de Betty y usa el rose-tinted lens en el mostrador.
Talk to Betty again.=Habla con Betty de nuevo.
Talk to Sandy in Brimhaven again with the truth serum. Select distractions until one works.=Habla con Sandy en Brimhaven de nuevo con el truth serum. Selecciona distracciones hasta que una funcione.
Use the truth serum on Sandy's coffee mug.=Usa el truth serum en la taza de café de Sandy.
Activate the magical orb next to Sandy.=Activa el magical orb junto a Sandy.
Ask Sandy all questions available with the Magical orb (a) in your inventory.=Haz a Sandy todas las preguntas disponibles con el Magical orb (a) en tu inventario.
Return to the Wizards' Guild in Yanille and ring the bell outside. Talk to Zavistic Rarve when he appears.=Vuelve al Wizards' Guild en Yanille y toca la campana de fuera. Habla con Zavistic Rarve cuando aparezca.
Give Zavistic Rarve 5 earth runes and a bucket of sand.=Entrega a Zavistic Rarve 5 earth runes y un bucket of sand.
Travel to Entrana (bank all combat gear), and talk to Mazion at the sand pit.=Viaja a Entrana (guarda todo el equipo de combate en el banco) y habla con Mazion en el arenal.
Return to the Wizards' Guild in Yanille and ring the bell outside. Talk to Zavistic Rarve when he appears to finish the quest.=Vuelve al Wizards' Guild en Yanille y toca la campana de fuera. Habla con Zavistic Rarve cuando aparezca para terminar la misión.
Daily sand from Bert in Yanille.=Sand diaria de Bert en Yanille.
Access to the Wizards Guild rune store.=Acceso a la tienda de runas del Wizards Guild.
Starting off=Empezando
Investigating=Investigando
Making a truth serum=Haciendo un truth serum
Uncover the truth=Descubre la verdad
Finishing off=Terminando
