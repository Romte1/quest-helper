# Spanish translations for Defender of Varrock.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Requirements and tooltips
Combat gear and food=Equipo de combate y comida
Mind Altar or Lassar teleport tablet or spell=Tableta o hechizo de teletransporte a Mind Altar o Lassar
Teleport to the Lumberyard=Teletransporte al Lumberyard
You can get another from Rovin upstairs in Varrock Castle=Puedes conseguir otro de Rovin en la planta de arriba de Varrock Castle

# Steps
Talk to Elias White in the Jolly Boar Inn north-east of Varrock.=Habla con Elias White en el Jolly Boar Inn, al noreste de Varrock.
Inspect the plant north of the pub.=Inspecciona la planta al norte del pub.
Inspect the small rocks to the west.=Inspecciona las rocas pequeñas al oeste.
Follow the path to the south and inspect the plant south west of the Jolly Boar Inn.=Sigue el camino hacia el sur e inspecciona la planta al suroeste del Jolly Boar Inn.
Continue south-east of the Saradomin statue, and inspect the bush there.=Continúa al sureste de la estatua de Saradomin e inspecciona el arbusto de allí.
Search the bush next to the gate to the east, by the gate to Silvarea.=Busca en el arbusto junto a la puerta del este, junto a la puerta de Silvarea.
Inspect the small bush further to the east.=Inspecciona el arbusto pequeño más al este.
Enter the trapdoor to the north, near to the wilderness ditch.=Entra por la trampilla del norte, cerca de la zanja del wilderness.
Talk to Elias in the dungeon.=Habla con Elias en la mazmorra.
Look over the balcony to the north.=Asómate al balcón del norte.
Pick up 3 bottles nearby.=Coge 3 botellas cercanas.
Kill armoured zombies and fill the 3 bottles with the clouds they leave behind.=Mata armoured zombies y llena las 3 botellas con las nubes que dejan.
Collect the red mist in a bottle.=Recoge la niebla roja en una botella.
Go through the gate, and finish the cutscene with Arrav. If you skip it, try re-entering the gate.=Cruza la puerta y termina la cinemática con Arrav. Si te la saltas, intenta volver a entrar por la puerta.
Kill armoured zombies and fill 3 the bottles with the clouds they leave behind.=Mata armoured zombies y llena las 3 botellas con las nubes que dejan.
Kill zombies to fill 3 bottles with mist again, and continue deeper into the dungeon.=Mata zombies para llenar 3 botellas de niebla de nuevo y continúa más adentro de la mazmorra.
Look over the balcony facing over the zombie army.=Asómate al balcón que da al ejército de zombies.
Report back to Elias White in the Varrock Palace.=Vuelve a informar a Elias White en el Varrock Palace.
Talk to Captain Rovin upstairs in the north west of Varrock Castle.=Habla con Captain Rovin en la planta de arriba del noroeste de Varrock Castle.
Enter Camdozaal, west of Ice Mountain.=Entra en Camdozaal, al oeste de Ice Mountain.
Talk to Ramarno to the north by the sacred forge.=Habla con Ramarno al norte, junto a la sacred forge.
Mine a barronite deposit.=Mina un barronite deposit.
Kill chaos golems in the eastern cavern for a chaos core.=Mata chaos golems en la caverna este para conseguir un chaos core.
Use a chaos core on a barronite deposit.=Usa un chaos core en un barronite deposit.
Use the imbued barronite on the sacred forge.=Usa el imbued barronite en la sacred forge.
Talk to Reldo in the Varrock Castle library.=Habla con Reldo en la biblioteca de Varrock Castle.
Go to the bottom floor and talk to Reldo in the castle library.=Ve a la planta baja y habla con Reldo en la biblioteca del castillo.
Search the scrolls in the north-east of the library.=Busca entre los pergaminos del noreste de la biblioteca.
Read the list of elders.=Lee la lista de ancianos.
Read the Varrock Census.=Lee el censo de Varrock.
Talk to King Roald.=Habla con King Roald.
Talk to Aeonisig Raispher next to King Roald.=Habla con Aeonisig Raispher junto a King Roald.
Talk to Sir Prysin in the south west corner of Varrock Castle.=Habla con Sir Prysin en la esquina suroeste de Varrock Castle.
Talk to Romeo in Varrock Square.=Habla con Romeo en Varrock Square.
Talk to Romeo in Varrock Square=Habla con Romeo en Varrock Square
Talk to Horvik north-east of Varrock Square.=Habla con Horvik al noreste de Varrock Square.
Talk to Curator Haig in the Varrock Museum.=Habla con Curator Haig en el Varrock Museum.
Talk to Dimintheis in the south-east of Varrock.=Habla con Dimintheis en el sureste de Varrock.
Talk to Captain Rovin upstairs in the north west of Varrock Castle to finish the quest.=Habla con Captain Rovin en la planta de arriba del noroeste de Varrock Castle para terminar la misión.

