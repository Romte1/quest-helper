# Spanish translations for Wilderness Hard Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Cast one of the 3 god spells against another player in the Wilderness. Splashing will not count.=Lanza uno de los 3 god spells contra otro jugador en el Wilderness. Los splash no cuentan.
Enter to the Edgeville dungeon.=Entra en la mazmorra de Edgeville.
Climb the ladder that leads to the Obelisk of Air.=Sube la escalera que lleva al Obelisk of Air.
Cast charge air orb on the Obelisk of Air.=Lanza Charge Air Orb en el Obelisk of Air.
Kill the Chaos Elemental.=Mata al Chaos Elemental.
Set a trap and catch a Black salamander in the Wilderness.=Coloca una trampa y pesca una Black salamander en el Wilderness.
Kill a Lava dragon and bury the bones on Lava Dragon Isle.=Mata un Lava dragon y entierra los huesos en Lava Dragon Isle.
Bury the dragon bones=Entierra los huesos de dragón
Fish a raw lava eel in the Lava Maze.=Pesca una raw lava eel en el Lava Maze.
Smith an Adamant scimitar in the Resource Area.=Forja una Adamant scimitar en el Resource Area.
Enter the Wilderness Resource Area.=Entra en el Wilderness Resource Area.
Enter the Wilderness God Wars Dungeon.=Entra en la Wilderness God Wars Dungeon.
Use the crevice to enter the Wilderness God Wars Dungeon. The Strength entrance is to the West.=Usa la grieta para entrar en la Wilderness God Wars Dungeon. La entrada de Strength está al oeste.
Kill a Spiritual Warrior in the Wilderness God Wars Dungeon.=Mata un Spiritual Warrior en la Wilderness God Wars Dungeon.
Kill Crazy archaeologist, Chaos Fanatic, and Scorpia. You must complete this task fully before continuing the other tasks.=Mata al Crazy archaeologist, al Chaos Fanatic y a Scorpia. Debes completar esta tarea del todo antes de continuar con las demás.
Take the agility shortcut from Trollheim to the Wilderness.=Toma el atajo de agilidad de Trollheim al Wilderness.
