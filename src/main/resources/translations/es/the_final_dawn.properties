Try to open the door to the north. Be ready for the final boss!=Intenta abrir la puerta del norte. Prepárate para el boss final!
Approach Augur Metzli, ready for a fight.=Acércate a Augur Metzli, listo para luchar.
Defeat Metzli. Read the sidebar for more details.=Derrota a Metzli. Lee la barra lateral para más detalles.
Defeat Metzli.\n\nStart with Protect from Missiles.\n\nUse the gaps in the wave attacks to dodge the walls as they approach. \n\nIf circles appear, stand where they appeared.\n\nEvery time a teleporter appears to jump over a wave, the boss will switch attack styles alternating between mage and ranged. \n\nThe boss will enter an enrage phase, it is much easier to range but melee is still possible. \n\nAttack the boss and then immediately click on the next teleporter to avoid taking damage.=Derrota a Metzli.\n\nEmpieza con Protect from Missiles.\n\nUsa los huecos de las oleadas de ataques para esquivar las paredes según se acercan.\n\nSi aparecen círculos, colócate donde aparecieron.\n\nCada vez que aparezca un teleporter para saltar una oleada, el boss cambiará de estilo de ataque alternando entre mage y ranged.\n\nEl boss entrará en una fase de enrage; es mucho más fácil a distancia, pero melee sigue siendo posible.\n\nAtaca al boss y luego haz clic inmediatamente en el siguiente teleporter para evitar recibir daño.
