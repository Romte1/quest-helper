Search the urns in the area for some essence.=Busca en las urnas del área algo de essence.
Inspect the statue in the middle of the room.=Inspecciona la estatua del centro de la sala.
Look at the pillar in the middle of the room. The first word indicates where to tell Itzla to stand, and the second word where you craft the essence.1 is the north-east altar, and incrementing numbers rotate clockwise. The words mean the following numbers: \n    Oma \= 2\n    Naui \= 4\n    Kuli \= 5\n    Chaki \= 6\n    Koma \= 7\n    Ueai \= 8\n    Makti \= 10=Observa el pilar en el centro de la sala. La primera palabra indica dónde decirle a Itzla que se coloque, y la segunda dónde fabricas la essence.1 es el altar noreste, y los números siguientes rotan en sentido horario. Las palabras significan los siguientes números: \n    Oma = 2\n    Naui = 4\n    Kuli = 5\n    Chaki = 6\n    Koma = 7\n    Ueai = 8\n    Makti = 10
