Food=Comida
Talk to Servius in the Sunrise Palace in Civitas illa Fortis to start the quest.=Habla con Servius en el Sunrise Palace de Civitas illa Fortis para empezar la misión.
Use the pendant of ates  to the Twilight Temple, or go there via Quetzal.=Usa el pendant of ates  para llegar al Twilight Temple, o ve allí en Quetzal.
Take a quetzal to the Salvager Overlook and run south to the Twilight Temple.=Toma un quetzal al Salvager Overlook y corre hacia el sur hasta el Twilight Temple.
Search the chest in the south of the Tower of Ascension south of Salvager Overlook for some emissary robes.=Busca en el cofre del sur del Tower of Ascension, al sur de Salvager Overlook, unas emissary robes.
Enter the temple south-east of Salvager Overlook.=Entra en el templo al sureste de Salvager Overlook.
Go down the stairs in the temple. The passphrase is 'Final' and 'Dawn'.=Baja las escaleras del templo. La passphrase es 'Final' y 'Dawn'.
Go down the stairs in the temple. You'll need to guess the password.=Baja las escaleras del templo. Tendrás que adivinar la contraseña.
Enter the far eastern room. Avoid the patrolling guard.=Entra en la sala del extremo este. Evita al guardia que patrulla.
Search the bed in the south room.=Busca en la cama de la sala sur.
