Go back to Civitas illa Fortis.Climb up the stairs to the top of the Sunrise Palace to talk to the queen.=Vuelve a Civitas illa Fortis. Sube las escaleras hasta lo alto del Sunrise Palace para hablar con la reina.
Climb up the stairs to the top of the Sunrise Palace to talk to the queen.=Sube las escaleras hasta lo alto del Sunrise Palace para hablar con la reina.
