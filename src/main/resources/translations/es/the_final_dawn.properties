Search the old tools for a knife blade. Avoid the lines of fire by having Itzla go on the north platform to remove dark flames, and the south one for light flames.=Busca en las old tools una knife blade. Evita las líneas de fuego haciendo que Itzla vaya a la plataforma norte para eliminar las llamas oscuras, y a la sur para las llamas claras.
