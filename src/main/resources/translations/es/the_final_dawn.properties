# Spanish translations for The Final Dawn.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Have Itzla move between both the north and south platforms to see how many braziers are lit around the room total. Put that many into the statue.=Haz que Itzla se mueva entre las plataformas norte y sur para ver cuántos braseros hay encendidos en total en la sala. Pon esa cantidad en la estatua.
Any type of bone or raw meat=Cualquier tipo de hueso o carne cruda
Ranged/Magic Combat gear=Equipo de combate a distancia o mágico
Combat weapon=Arma de combate
