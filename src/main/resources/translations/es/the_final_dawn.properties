Move-Itzla to the platform north of him by clicking on it to see which torches around the room light up.=Mueve a Itzla a la plataforma al norte de él haciendo clic en ella para ver qué antorchas de la sala se encienden.
Move-Itzla to the platform south of him by clicking on it to see which torches around the room light up.=Mueve a Itzla a la plataforma al sur de él haciendo clic en ella para ver qué antorchas de la sala se encienden.
