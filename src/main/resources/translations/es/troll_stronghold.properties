# Spanish translations for Troll Stronghold.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Denulth in Burthorpe.=Habla con Denulth en Burthorpe.
Get some climbing boots or 12 coins, and prepare for fighting Dad and the Troll General. Both can be safe spotted by ranged/mage.=Consigue unas climbing boots o 12 coins y prepárate para luchar contra Dad y el Troll General. A ambos se les puede safespotear con ranged/mage.
Follow the path west of Burthorpe, then go along the path going south.=Sigue el camino al oeste de Burthorpe y luego el camino que va hacia el sur.
Follow the path west of Burthorpe, then go along the path going south. Buy some climbing boots from Tenzing in his hut here.=Sigue el camino al oeste de Burthorpe y luego el camino que va hacia el sur. Compra unas climbing boots a Tenzing en su cabaña de aquí.
Climb over the stile north of Tenzing.=Sube el stile al norte de Tenzing.
Follow the path until you reach some rocks. Climb over them.=Sigue el camino hasta llegar a unas rocas. Sube por ellas.
Follow the path from here east until you enter the arena.=Sigue el camino desde aquí hacia el este hasta entrar en la arena.
Fight Dad until he gives up. You can safe spot him from the gate you entered through.=Lucha contra Dad hasta que se rinda. Puedes safespotearlo desde la puerta por la que entraste.
Leave the arena and continue through the cave to the north.=Sal de la arena y continúa por la cueva hacia el norte.
Enter the cave entrance.=Entra en la entrada de la cueva.
Leave through cave's north exit.=Sal por la salida norte de la cueva.
Follow the path around Trollheim until you reach the Stronghold's entrance. Be wary of thrower trolls on the path, you'll want to use Protect from Ranged.=Sigue el camino alrededor de Trollheim hasta llegar a la entrada del Stronghold. Ten cuidado con los thrower trolls del camino, querrás usar Protect from Ranged.
They can be avoided by taking the agility shortcuts across the mountain.=Se pueden evitar usando los atajos de agility por la montaña.
Enter the west rooms and kill any of the Troll Generals for a prison key.=Entra en las salas del oeste y mata a cualquiera de los Troll Generals para conseguir una prison key.
Pick up the prison key.=Recoge la prison key.
Climb down the north staircase.=Baja por la escalera del norte.
Enter the prison door.=Entra por la puerta de la prisión.
Go back up the stairs.=Vuelve a subir las escaleras.
Climb down the stairs to the prison.=Baja las escaleras hacia la prisión.
Pickpocket or kill Twig for a cell key.=Roba o mata a Twig para conseguir una cell key.
Pickpocket or kill Berry for a cell key.=Roba o mata a Berry para conseguir una cell key.
Kill Twig for a cell key.=Mata a Twig para conseguir una cell key.
Kill Berry for a cell key.=Mata a Berry para conseguir una cell key.
Pickup the key.=Recoge la llave.
Unlock Godric's cell.=Abre la celda de Godric.
Unlock Eadgar's cell.=Abre la celda de Eadgar.
Talk to Dunstan in north east Burthorpe to finish the quest.=Habla con Dunstan al noreste de Burthorpe para terminar la misión.
Dad (level 101) (safespottable)=Dad (nivel 101) (se puede safespotear)
Troll General (level 113) (safespottable)=Troll General (nivel 113) (se puede safespotear)
Ability to make Law Runes=Habilidad de fabricar Law Runes
Access to Trollheim and the Troll Stronghold=Acceso a Trollheim y al Troll Stronghold
Access to the God Wars Dungeon=Acceso a la God Wars Dungeon
Starting off=Empezando
Reach the Stronghold=Llegar al Stronghold
Free the prisoners=Libera a los prisioneros
