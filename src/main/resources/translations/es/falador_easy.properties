# Spanish translations for Falador Easy Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Any Pickaxe=Cualquier pickaxe
A range or mage attack to kill a Duck (Level 1)=Un ataque de ranged o mage para matar un Duck (nivel 1)
Multiple teleports to Falador=Múltiples teleports a Falador
A Teleport to the Mind Altar=Un teleport al Mind Altar
Explorers Ring (2) or above.=Explorers Ring (2) o superior.
Use the bucket on the Waterpump outside the Hairdressers in west Falador.=Usa el cubo en el Waterpump frente a la peluquería en el oeste de Falador.
Visit the hairdresser in west Falador for a well deserved shave.=Visita al peluquero en el oeste de Falador para un merecido afeitado.
Climb over the Crumbled Wall west of the West Falador Bank.=Trepa por el Crumbled Wall al oeste del West Falador Bank.
Kill a Duck (Level 1) in the Falador Park=Mata un Duck (nivel 1) en el Falador Park
Enter the Dwarven Mines, you can get there quickly by going down the stairs near the Party Room.=Entra en las Dwarven Mines; puedes llegar rápido bajando las escaleras cerca del Party Room.
Go through the Cave entrance to the Motherlode Mines.=Pasa por la entrada de la cueva a las Motherlode Mines.
Repair a broken strut on the Waterwheel in the Motherlode mine. It may take a few minutes for it to break.=Repara un soporte roto en la Waterwheel de la Motherlode mine. Puede tardar unos minutos en romperse.
Climb the ladder in The White Knights Castle!=¡Sube la escalera en The White Knights Castle!
Speak to Sir Renitee to find out your family crest.=Habla con Sir Renitee para descubrir tu family crest.
Trade Sarah in the Farming Shop south of Falador and browse her goods.=Comercia con Sarah en la Farming Shop al sur de Falador y echa un vistazo a sus productos.
Deposit all your combat gear and talk to the Monk of Entrana in Port Sarim to take the boat.=Deposita todo tu equipo de combate y habla con el Monk of Entrana en Port Sarim para tomar el barco.
Climb up the ladder in the Port Sarim Jail to speak to the Security Guard.=Sube la escalera de la Port Sarim Jail para hablar con el Security Guard.
Speak to the Security Guard in the Port Sarim Jail to get a Security Book.=Habla con el Security Guard en la Port Sarim Jail para conseguir un Security Book.
Get a pickaxe in Rimmington if you do not have one.=Consigue un pickaxe en Rimmington si no tienes uno.
Go down the ladder south of Port Sarim. Be prepared for ice giants and ice warriors to attack you.=Baja la escalera al sur de Port Sarim. Prepárate para que te ataquen ice giants e ice warriors.
Mine a blurite ore in the eastern cavern.=Mina un blurite ore en la caverna oriental.
Smelt the blurite ore into a blurite bar.=Funde el blurite ore para obtener un blurite bar.
Smith the blurite bar into blurite limbs on Doric's Anvil, north of Falador.=Forja el blurite bar para hacer blurite limbs en Doric's Anvil, al norte de Falador.
Use the mind talisman on the Mysterious Ruins to access the Mind Altar.=Usa el mind talisman en las Mysterious Ruins para acceder al Mind Altar.
Use the mind talisman on the Altar=Usa el mind talisman en el Altar
Congratulations! Talk to Sir Rebral in the courtyard of The White Knight Castle to claim your reward!=¡Enhorabuena! ¡Habla con Sir Rebral en el patio de The White Knight Castle para reclamar tu recompensa!
Tight-gap shortcut to the Chaos Temple from Burthorpe.=Atajo de tight-gap al Chaos Temple desde Burthorpe.
Fill Water Bucket=Llena el cubo de agua
Get A Haircut=Córtate el pelo
Climb West Wall=Trepa por la muralla oeste
Kill The Duck=Mata el Duck
Motherlode Repairs=Reparaciones en Motherlode
Sarah's Farming Shop=Farming Shop de Sarah
To the Holy Land!=¡A la Tierra Santa!
Get A Security Book=Consigue un Security Book
Blurite Limbs=Blurite Limbs
Mind Tiara=Mind Tiara
Family Crest=Family Crest
Finishing off=Para terminar
