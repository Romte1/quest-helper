# Spanish translations for Mourning's End Part I.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Can be bought during quest for 6gp=Se puede comprar durante la misión por 6gp
Obtained during quest.=Se obtiene durante la misión.
You can get this by using a barrel from Port Tyras on the Poison Waste=Puedes conseguir esto usando un barrel de Port Tyras en el Poison Waste
Toad crunchies (can be Premade t'd crunch)=Toad crunchies (también sirve Premade t'd crunch)
You can get another from Elena=Puedes conseguir otro de Elena
You'll have to make more if you've lost it=Tendrás que hacer más si lo has perdido
Teleport to the Outpost. Necklace of passage (The Outpost [2])=Teletranspórtate al Outpost. Necklace of passage (The Outpost [2])
Teleport to Taverley. Taverley Teleport, Games necklace (Burthorpe. [1])=Teletranspórtate a Taverley. Taverley Teleport, Games necklace (Burthorpe. [1])
Lletya teleport. Teleport crystal=Teletransporte a Lletya. Teleport crystal
Barrel of coal tar + 10-20 coal, or a barrel of naphtha=Barrel of coal tar + 10-20 coal, o un barrel de naphtha
Talk to Islwyn in Isafdar. If he's not at the marked location, try hopping worlds to find him here.=Habla con Islwyn en Isafdar. Si no está en el lugar marcado, prueba a cambiar de mundo para encontrarlo aquí.
Talk to Arianwyn in Lletya.=Habla con Arianwyn en Lletya.
Kill a mourner travelling through the Arandar pass. This is more easily accessed from the north entrance. You'll need 7 free inventory spaces.=Mata a un mourner que viaje por el Arandar pass. Se accede más fácilmente desde la entrada norte. Necesitarás 7 espacios libres en el inventario.
Pick up everything the mourner dropped.=Recoge todo lo que haya soltado el mourner.
Search Tegid's laundry basket in south Taverley for some soap.=Busca en el cesto de la colada de Tegid al sur de Taverley para encontrar soap.
Use the soap on the bloody mourner top=Usa el soap en el bloody mourner top
Teleport to Lletya using a crystal teleport seed and talk to Oronwen to have them repair your trousers. Buy dyes here if you still need them.=Teletranspórtate a Lletya con un crystal teleport seed y habla con Oronwen para que te repare los pantalones. Compra dyes aquí si aún los necesitas.
Equip the full mourners outfit and enter the Mourners' Headquarters in West Ardougne.=Equipa el conjunto completo de mourners y entra en el Mourners' Headquarters en West Ardougne.
Go down the trapdoor in the north west corner of the HQ.=Baja por la trapdoor de la esquina noroeste del HQ.
Talk to Essyllt in the south room.=Habla con Essyllt en la sala sur.
Talk to the gnome on a rack.=Habla con el gnome en el potro.
Use a feather on the gnome with toad crunchies in your inventory.=Usa una feather en el gnome con toad crunchies en el inventario.
Talk to the gnome again with the required items.=Habla con el gnome de nuevo con los objetos necesarios.
Right-click release the gnome with the items.=Haz clic derecho en el gnome para soltarlo con los objetos.
Give the gnome a magic log, some soft leather and some toad crunchies.=Dale al gnome un magic log, algo de soft leather y unos toad crunchies.
Ask the gnome about ammo.=Pregúntale al gnome por la munición.
Add a green toad to the fixed device.=Añade un green toad al fixed device.
Add a red toad to the fixed device.=Añade un red toad al fixed device.
Add a yellow toad to the fixed device.=Añade un yellow toad al fixed device.
Add a blue toad to the fixed device.=Añade un blue toad al fixed device.
Wield the fixed device and select Aim and Fire from your combat options to fire at a green sheep north of Ardougne.=Empuña el fixed device y selecciona Aim and Fire en tus opciones de combate para disparar a una green sheep al norte de Ardougne.
Wield the fixed device and select Aim and Fire from your combat options to fire at a shoot the red toad at a red sheep north of Ardougne.=Empuña el fixed device y selecciona Aim and Fire en tus opciones de combate para dispararle el red toad a una red sheep al norte de Ardougne.
Wield the fixed device and select Aim and Fire from your combat options to fire at a yellow sheep north of Ardougne.=Empuña el fixed device y selecciona Aim and Fire en tus opciones de combate para disparar a una yellow sheep al norte de Ardougne.
Wield the fixed device and select Aim and Fire from your combat options to fire at a blue sheep north of Ardougne.=Empuña el fixed device y selecciona Aim and Fire en tus opciones de combate para disparar a una blue sheep al norte de Ardougne.
Dye each colour of sheep north of Ardougne by using the dyed toads on the fixed device and select Aim and Fire from your combat options to fire.=Tiñe a cada color de sheep al norte de Ardougne usando los toads teñidos en el fixed device y seleccionando Aim and Fire en tus opciones de combate para disparar.
Pick up a rotten apple from north-west of the Mourner HQ.=Coge un rotten apple al noroeste del Mourner HQ.
Talk to Elena in north-west of East Ardougne.=Habla con Elena al noroeste de East Ardougne.
Pick up a barrel from the Orchard north of Ardougne.=Coge un barrel del huerto al norte de Ardougne.
Use the barrel on a rotten apple pile.=Usa el barrel en un montón de rotten apples.
Use the rotten apples on the apple press.=Usa los rotten apples en el lagar.
To do this, rotate the 'Tar regulator' wheel twice. Wait until the 'Pressure' indicator is in the green, then rotate the 'Pressure valve' regulator clockwise once.=Para ello, gira dos veces la rueda 'Tar regulator'. Espera a que el indicador 'Pressure' esté en verde y luego gira el regulador 'Pressure valve' una vez en el sentido de las agujas del reloj.
Now all you need to do is occasionally click the 'Add coal' text to add coal, to push the 'Heat' into the green. Be careful to do this slowly so as to not hit the orange heat and ruin the tar.=Ahora solo tienes que hacer clic de vez en cuando en el texto 'Add coal' para añadir coal y llevar el 'Heat' al verde. Hazlo despacio para no llegar al calor naranja y arruinar el tar.
Use a barrel of naptha on the apple barrel.=Usa un barrel de naptha en el apple barrel.
Use the sieve on the naphtha apple mix=Usa el sieve en el naphtha apple mix
Use the toxic powder on the food store in the room north west of West Ardougne's town centre.=Usa el toxic powder en el almacén de comida de la sala al noroeste del centro de West Ardougne.
Use the toxic powder on the food store in the church south of West Ardougne's town centre.=Usa el toxic powder en el almacén de comida de la iglesia al sur del centro de West Ardougne.
Return to Essyllt in the Mourner HQ basement.=Vuelve con Essyllt en el sótano del Mourner HQ.
Return to Arianwyn in Lletya.=Vuelve con Arianwyn en Lletya.
Mourner (level 11) (will decrease all combat skills to 20, including Hitpoints)=Mourner (nivel 11) (reducirá todas las habilidades de combate a 20, incluidos los Hitpoints)
Access to the Mourner HQ=Acceso al Mourner HQ
Starting off=Empezando
Get Mourner's outfit=Consigue el conjunto de Mourner
Clean Mourner top=Limpia el Mourner top
Repair Mourner trousers=Repara los Mourner trousers
Infiltrate the Mourners=Infíltrate entre los Mourners
Dye the sheep=Tiñe las ovejas
Poison the citizens=Envenena a los ciudadanos
Report back to Arianwyn=Informa a Arianwyn
You need to make some dyed toads. Go to Feldip Hills (AKS), use a dye on your empty bellows, then use the bellows to inflate a toad. Get at least one toad of each colour.=Tienes que hacer unos toads teñidos. Ve a Feldip Hills (AKS), usa un dye en tus empty bellows y luego usa los bellows para inflar un toad. Consigue al menos un toad de cada color.
Make some Naphtha. Grab another barrel, fill it on the swamp south of the elven lands, then refine it on the fractionalising still at the Chemist in Rimmington with 10-20 coal.=Prepara Naphtha. Coge otro barrel, llénalo en el pantano al sur de las tierras élficas y refínalo en el fractionalising still del Chemist en Rimmington con 10-20 coal.
Cook the toxic naphtha on a range. DO NOT USE IT ON A FIRE, and MAKE SURE TO HAVE TWO FREE INVENTORY SPACES.=Cocina el toxic naphtha en un range. NO LO USES EN UN FUEGO y ASEGÚRATE DE TENER DOS ESPACIOS LIBRES EN EL INVENTARIO.
