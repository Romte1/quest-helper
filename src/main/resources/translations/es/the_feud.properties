# Spanish translations for The Feud.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Ali Morrisane in Al Kharid to start the quest.=Habla con Ali Morrisane en Al Kharid para empezar la misión.
Buy a Kharidian Headpiece and a Fake Beard to create a disguise.=Compra un Kharidian Headpiece y una Fake Beard para crear un disfraz.
Create a disguise by using the Kharidian Headpiece on the Fake Beard.=Crea un disfraz usando el Kharidian Headpiece en la Fake Beard.
Go through Shantay Pass.=Entra en Shantay Pass.
Buy a shantay pass from Shantay.=Compra un shantay pass a Shantay.
Talk to the rug merchant and travel to Pollnivneach via magic carpet.=Habla con el rug merchant y viaja a Pollnivneach en alfombra mágica.
Buy 3 beers from the bartender and use them on Drunken Ali to get him to explain where his son is. Talk with him between beers=Compra 3 beers al camarero y úsalas en Drunken Ali para que te explique dónde está su hijo. Habla con él entre cerveza y cerveza
Talk to a Menaphite Thug to figure out how their dispute started with the bandits.=Habla con un Menaphite Thug para averiguar cómo empezó su disputa con los bandits.
Talk to a bandit to figure out their issues with the Menaphites.=Habla con un bandit para averiguar sus problemas con los Menaphites.
Talk to Ali the Camel Man to try and get two camels to solve the dispute=Habla con Ali the Camel Man para intentar conseguir dos camellos y resolver la disputa
Tell the bandits that the Menaphites have agreed to return the camel.=Diles a los bandits que los Menaphites han aceptado devolver el camello.
Tell the Menaphites that the bandits have agreed to return the camel.=Diles a los Menaphites que los bandits han aceptado devolver el camello.
Talk to Ali the Operator to get a job from him.=Habla con Ali the Operator para conseguir un trabajo.
Pickpocket a villager.=Roba a un villager.
Lure a villager then talk to a street urchin and get them to distract a villager, once he has them distracted pickpocket them from behind.=Atrae a un villager, luego habla con un street urchin y haz que distraiga a un villager; cuando lo tenga distraído, róbale por detrás.
Talk to Ali the Operator to get a blackjack.=Habla con Ali the Operator para conseguir un blackjack.
Equip your oak blackjack in your inventory.=Equipa tu oak blackjack desde el inventario.
Lure a villager to secluded place or an empty building, knock them out and then pickpocket them.=Atrae a un villager a un lugar apartado o a un edificio vacío, noquéalo y luego róbale.
Talk to Ali the Operator to get the second job.=Habla con Ali the Operator para conseguir el segundo trabajo.
Hide behind the cactus=Escóndete detrás del cactus
Open the door.=Abre la puerta.
Go up the stairs.=Sube las escaleras.
Search the painting to reveal the safe. Enter the code 1, 1, 2, 3, 5, 8.=Busca en el cuadro para revelar la caja fuerte. Introduce el código 1, 1, 2, 3, 5, 8.
Go down the stairs.=Baja las escaleras.
Give Ali the Operator the jewels to get your final task from him.=Entrega las joyas a Ali the Operator para recibir su última tarea.
Talk to a Menaphite member to find the traitor.=Habla con un miembro Menaphite para encontrar al traidor.
Talk to Ali and tell him you have found the traitor.=Habla con Ali y dile que has encontrado al traidor.
Talk to Ali the Barman to find out where Traitorous Ali is.=Habla con Ali the Barman para averiguar dónde está Traitorous Ali.
Talk to Ali the Hag to ask her to make some poison for you.=Habla con Ali the Hag para pedirle que te prepare un veneno.
Use coins on the snake charmer's money pot to get a snake charm and a snake basket.=Usa monedas en el pot de dinero del snake charmer para conseguir un snake charm y un snake basket.
Use the Snake Charm on a snake to capture it.=Usa el Snake Charm en una serpiente para capturarla.
Give the snake to Ali the Hag.=Entrega la serpiente a Ali the Hag.
Talk to Ali the Kebab Salesman to get a special sauce to use.=Habla con Ali the Kebab Salesman para conseguir una salsa especial.
Pick up a bucket to grab the dung=Coge un bucket para recoger el dung
Use the bucket on the dung.=Usa el bucket en el dung.
Talk to Ali the Hag and give her the dung.=Habla con Ali the Hag y entrégale el dung.
Use the poison on the beer glass to kill Traitorous Ali.=Usa el veneno en el vaso de cerveza para matar a Traitorous Ali.
Talk to Ali the Operator and tell him he is dead.=Habla con Ali the Operator y dile que está muerto.
Kill the Menaphite Thug. You can safespot him inside the tent by using a chair, if he's not spawned then talk to the Menaphite Leader again.=Mata al Menaphite Thug. Puedes hacer safespot dentro de la tienda usando una silla; si no ha aparecido, habla con el Menaphite Leader de nuevo.
Talk to the Menaphite Leader and prepare for a fight against a tough guy. You can safespot him inside the tent by using a chair.=Habla con el Menaphite Leader y prepárate para luchar contra un tipo duro. Puedes hacer safespot dentro de la tienda usando una silla.
Talk to a villager and they will be angry you broke the balance of power.=Habla con un villager y se enfadará porque has roto el equilibrio de poder.
Talk to the Bandit Leader and be prepared to fight a Bandit Champion. You can safe spot him with the stool.=Habla con el Bandit Leader y prepárate para luchar contra un Bandit Champion. Puedes hacer safespot con el stool.
Talk to a villager and they will be angry still.=Habla con un villager y seguirá enfadado.
Talk to Ali the Mayor and get your due congratulations.=Habla con Ali the Mayor y recibe tus merecidas felicitaciones.
Talk to  Ali Morrisane in Al Kharid to finish the quest.=Habla con Ali Morrisane en Al Kharid para terminar la misión.
Bandit Champion (level 70) - Safespottable=Bandit Champion (nivel 70) - se puede safespotear
Tough Guy (level 75) - Safespottable=Tough Guy (nivel 75) - se puede safespotear
Ability to blackjack.=Habilidad de usar blackjack.
Access to the Rogue Trader minigame=Acceso al minigame Rogue Trader
Starting out=Empezando
Find the beef between the two factions=Encuentra el conflicto entre las dos facciones
First job=Primer trabajo
Second job=Segundo trabajo
