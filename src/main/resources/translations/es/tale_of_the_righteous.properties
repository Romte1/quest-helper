# Spanish translations for Tale of the Righteous.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Phileas Rimor in Shayzien.=Habla con Phileas Rimor en Shayzien.
Bring a melee weapon, ranged weapon, and runes for magic attacks and talk to Archeio in the Arceuus Library.=Lleva un arma cuerpo a cuerpo, un arma a distancia y runas para ataques mágicos, y habla con Archeio en la Arceuus Library.
Talk to Pagida in the Library Historical Archive.=Habla con Pagida en el Library Historical Archive.
Push the Strange Device all the way to the west.=Empuja el Strange Device hasta el extremo oeste.
Push the Strange Device all the way to the east.=Empuja el Strange Device hasta el extremo este.
Solve the crystal puzzle.=Resuelve el puzzle de cristal.
Attack the Strange Device with magic from the north side.=Ataca al Strange Device con magia desde el lado norte.
Attack the Strange Device with ranged from the south side.=Ataca al Strange Device a distancia desde el lado sur.
Attack the Strange Device with melee from the south side.=Ataca al Strange Device cuerpo a cuerpo desde el lado sur.
Investigate the skeleton in the north cell.=Investiga el esqueleto en la celda del norte.
Report back to Phileas Rimor in Shayzien.=Vuelve a informar a Phileas Rimor en Shayzien.
Talk to Shiro upstairs in the War Tent located on the west side of the Shayzien Encampment.=Habla con Shiro en la planta de arriba de la War Tent situada al oeste del Shayzien Encampment.
Travel to Mount Quidamortem and talk to Historian Duffy.=Viaja a Mount Quidamortem y habla con Historian Duffy.
Use a rope on the crevice west side of Quidamortem.=Usa una rope en la grieta al oeste de Quidamortem.
Enter the crevice west side of Quidamortem, ready to fight a corrupted lizardman (level 46).=Entra en la grieta al oeste de Quidamortem, preparado para luchar contra un corrupted lizardman (nivel 46).
Mine the rockfall.=Mina el desprendimiento de rocas.
Push the boulder further along the path.=Empuja la roca más adelante por el camino.
Attempt to enter the magic gate to the south room. You will need to kill the corrupted lizardman who appears.=Intenta entrar en la puerta mágica de la sala sur. Tendrás que matar al corrupted lizardman que aparece.
Kill the corrupt lizardman.=Mata al corrupt lizardman.
Inspect the Unstable Altar in the south room.=Inspecciona el Unstable Altar en la sala sur.
Leave the cavern. You can hop worlds to appear back at the entrance.=Sal de la caverna. Puedes cambiar de mundo para aparecer de nuevo en la entrada.
Return to Historian Duffy.=Vuelve a hablar con Historian Duffy.
Enter the crevice west side of Quidamortem again.=Entra de nuevo en la grieta al oeste de Quidamortem.
Talk to Historian Duffy near the Unstable Altar.=Habla con Historian Duffy cerca del Unstable Altar.
Talk to Gnosi near the Unstable Altar.=Habla con Gnosi cerca del Unstable Altar.
Return to Shiro upstairs in the War Tent located on the west side of the Shayzien Encampment.=Vuelve a hablar con Shiro en la planta de arriba de la War Tent situada al oeste del Shayzien Encampment.
Return to Phileas Rimor's house in Shayzien.=Vuelve a la casa de Phileas Rimor en Shayzien.
Return to Shiro upstairs in the War Tent in west Shayzien to complete the quest.=Vuelve a hablar con Shiro en la planta de arriba de la War Tent, en el oeste de Shayzien, para completar la misión.
