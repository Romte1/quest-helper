# Spanish translations for Ardougne Easy Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Steps
View Aleck's Hunter Emporium in Yanille.=Visita Aleck's Hunter Emporium en Yanille.
Have Tindel Marchant identify a rusty sword for you. Note: there is about a 1% chance this fails and you'll need another sword and more coins.=Pide a Tindel Marchant que te identifique una rusty sword. Nota: hay alrededor de un 1% de probabilidad de que falle y necesitarás otra espada y más monedas.
Go out fishing on the Fishing Trawler.=Sal a pescar en el Fishing Trawler.
Check what pets you have insured with Probita in East Ardougne (right-click her to Check).=Revisa qué mascotas tienes aseguradas con Probita en East Ardougne (haz clic derecho sobre ella y elige Check).
Use the altar in East Ardougne's church (requires less than full Prayer points).=Usa el altar de la iglesia de East Ardougne (requiere no tener los Prayer points al máximo).
Sell silk to the Silk trader in East Ardougne for 60 coins each.=Vende silk al Silk trader de East Ardougne por 60 monedas cada uno.
Steal a cake from the East Ardougne market stalls.=Roba un cake de los puestos del mercado de East Ardougne.
Have Wizard Cromperty teleport you to the Rune essence mine.=Pide a Wizard Cromperty que te teletransporte a la Rune essence mine.
Use the Ardougne lever to teleport to the Wilderness (you may pull the lever there to return). This will take you to DEEP Wilderness, bank anything you aren't willing to lose.=Usa la palanca de Ardougne para teletransportarte a la Wilderness (puedes tirar de la palanca de allí para volver). Esto te llevará a lo más profundo de la Wilderness; guarda en el banco todo lo que no estés dispuesto a perder.
Click the lever to return to Ardougne.=Haz clic en la palanca para volver a Ardougne.
Enter the Combat Training Camp north of West Ardougne.=Entra en el Combat Training Camp al norte de West Ardougne.
Talk to Two-pints in the Flying Horse Inn at East Ardougne to claim your reward!=¡Habla con Two-pints en el Flying Horse Inn de East Ardougne para reclamar tu recompensa!

# Rewards
Unlimited teleports to the Ardougne Monastery with the Ardougne cloak 1=Teletransportes ilimitados al Ardougne Monastery con el Ardougne cloak 1
Double death runes (200) when trading in cats to civilians=El doble de death runes (200) al entregar gatos a civiles
10% increased chance to successfully steal from stalls in Ardougne=10% más de probabilidad de robar con éxito en los puestos de Ardougne
Jubster and Frogeel drops will be noted at the Tower of Life=Los drops de Jubster y Frogeel se anotarán en el Tower of Life

