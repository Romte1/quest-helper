# Spanish translations for Death on the Isle.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
2 unlosable fights=2 peleas que no puedes perder
Accuse Adala of the crime, ready for a fight you cannot lose.=Acusa a Adala del crimen, preparado para una pelea que no puedes perder.
Attack Clodius.=Ataca a Clodius.
Check on the man in the south-eastern part of the cellar.=Comprueba cómo está el hombre en la parte sureste del sótano.
Climb down the loose rocks in your way to the guards outside the theatre.=Baja por las loose rocks que te bloquean el camino hacia los guardias fuera del teatro.
Climb down the staircase.=Baja por las escaleras.
Climb the Loose rocks south-east of the villa on your way to the theatre.=Sube por las Loose rocks al sureste de la villa de camino al teatro.
Climb up the stairs of the theatre cellar.=Sube por las escaleras del sótano del teatro.
Confront Naiatli, attacking her when she runs away. When Clodius appears, attack him instead.=Haz frente a Naiatli y atácala cuando huya. Cuando aparezca Clodius, atácalo a él.
Continue talking to Patzi=Sigue hablando con Patzi
Enter the cellar again to begin your investigation.=Entra de nuevo en el sótano para comenzar tu investigación.
Enter the cellar.=Entra en el sótano.
Enter the house north of Patzi through the window to steal a butler's uniform. If the Wandering Guard bothers you, wait until he steps away before entering.=Entra en la casa al norte de Patzi por la ventana para robar un uniforme de mayordomo. Si el Wandering Guard te molesta, espera a que se aleje antes de entrar.
Enter the theatre through the backstage entrance.=Entra en el teatro por la entrada del backstage.
Equip the Butler's uniform pieces and talk to the Head Butler up the stone stairs and to the south.=Equípate las piezas del uniforme de mayordomo y habla con el Head Butler subiendo las escaleras de piedra hacia el sur.
Explain your innocence to the guards Stradius and Hutza.=Explica tu inocencia a los guardias Stradius y Hutza.
Fight Adala. You cannot lose this fight.=Lucha contra Adala. No puedes perder esta pelea.
Getting the right fit=Conseguir el atuendo adecuado
Head inside the villa and talk to Patzi.=Entra en la villa y habla con Patzi.
Inside Villa Lucens=Dentro de Villa Lucens
Inspect the Drinking flask in your inventory.=Inspecciona el Drinking flask en tu inventario.
Inspect the Shipping contract in your inventory.=Inspecciona el Shipping contract en tu inventario.
Inspect the Threatening note in your inventory.=Inspecciona la Threatening note en tu inventario.
Inspect the Wine labels in your inventory.=Inspecciona las Wine labels en tu inventario.
Interrogate Constantinius.=Interroga a Constantinius.
Interrogate Cozyac.=Interroga a Cozyac.
Interrogate Patzi and Adala.=Interroga a Patzi y Adala.
Interrogate Pavo.=Interroga a Pavo.
Interrogate Xocotla.=Interroga a Xocotla.
Introduce yourself to Constantinius.=Preséntate a Constantinius.
Introduce yourself to Cozyac.=Preséntate a Cozyac.
Introduce yourself to Pavo.=Preséntate a Pavo.
Introduce yourself to Xocotla.=Preséntate a Xocotla.
Investigate Livius in the east room.=Investiga a Livius en la sala este.
Investigate the Antique wine in the southern part of the cellar.=Investiga el Antique wine en la parte sur del sótano.
Investigate the Broken pottery in the east room.=Investiga la Broken pottery en la sala este.
Investigate the Broken stool in the south room.=Investiga el Broken stool en la sala sur.
Investigate the Jug by the entrance stairs.=Investiga el Jug junto a las escaleras de entrada.
Investigate the Small box in the south room.=Investiga la Small box en la sala sur.
Investigate the Wine storage in the east room.=Investiga el Wine storage en la sala este.
Kill Naiatli.=Mata a Naiatli.
Leave the cellar.=Sal del sótano.
Leave the house with the butler's uniform.=Sal de la casa con el uniforme de mayordomo.
Pickpocket Adala until you find Wine labels.=Roba a Adala con carterismo hasta encontrar Wine labels.
Pickpocket Cozyac until you find a threatening note.=Roba a Cozyac con carterismo hasta encontrar una threatening note.
Pickpocket Pavo until you find a drinking flask.=Roba a Pavo con carterismo hasta encontrar un drinking flask.
Pickpocket Xocotla until you find a shipping contract.=Roba a Xocotla con carterismo hasta encontrar un shipping contract.
Playing detective=Jugando al detective
Report back to Stradius near the theatre and accuse Naiatli.=Vuelve con Stradius cerca del teatro y acusa a Naiatli.
Return to Patzi after stealing the butler's uniform.=Vuelve con Patzi después de robar el uniforme de mayordomo.
Return to Patzi with the information you've gathered.=Vuelve con Patzi con la información que has reunido.
Return to the guards with the information you've found so far.=Vuelve con los guardias con la información que has encontrado hasta ahora.
Return to the guards with the stolen items.=Vuelve con los guardias con los objetos robados.
Search the bookshelf on the west wall.=Busca en la estantería de la pared oeste.
Search the costume rack to the north.=Busca en el perchero de disfraces al norte.
Search the crate next to the stairs.=Busca en la caja junto a las escaleras.
Steal the butler's uniform from the wardrobe.=Roba el uniforme de mayordomo del armario.
Talk to Adala to get her confession.=Habla con Adala para conseguir su confesión.
Talk to Naiatli.=Habla con Naiatli.
Talk to Patzi at the entrance to Villa Lucens on the island of Aldarin to start the quest.=Habla con Patzi en la entrada de Villa Lucens, en la isla de Aldarin, para empezar la misión.
Talk to Stradius and Hutza to finish the quest.=Habla con Stradius y Hutza para terminar la misión.
Talk to Stradius at the backstage of the theatre.=Habla con Stradius en el backstage del teatro.
Talk to Stradius to enter the theatre.=Habla con Stradius para entrar en el teatro.
Talk to the Costumer about what you found.=Habla con el Costumer sobre lo que has encontrado.
Talk to the Costumer in the theatre cellar.=Habla con el Costumer en el sótano del teatro.
Talk to the Head Butler outside the at the entrance to Villa Lucens on the island of Aldarin.=Habla con el Head Butler en la entrada de Villa Lucens, en la isla de Aldarin.
Talk to the guards about Adala.=Habla con los guardias sobre Adala.
Talk to the guards to tell them you're ready to make an accusation.=Habla con los guardias para decirles que estás listo para hacer una acusación.
The ability to unlock the North Aldarin teleport destination via the pendant of ates=La habilidad de desbloquear el destino de teletransporte North Aldarin mediante el pendant of ates
The ability to use a Costume Needle (obtainable by speaking to the Costumer)=La habilidad de usar una Costume Needle (obtenible hablando con el Costumer)
The show must go on=El espectáculo debe continuar
