Enter the Security Stronghold.=Entra en el Security Stronghold.
Kill Minotaurs until you receive a right skull half.=Mata Minotaurs hasta recibir una right skull half.
Go to the 2nd floor of the stronghold.=Ve al 2.º piso del stronghold.
Kill Flesh crawlers until you receive a bottom of sceptre.=Mata Flesh crawlers hasta recibir un bottom of sceptre.
Go to the 3rd floor of the stronghold.=Ve al 3.er piso del stronghold.
Kill Catablepons until you receive a top of sceptre.=Mata Catablepons hasta recibir un top of sceptre.
Go to the 4th floor of the stronghold.=Ve al 4.º piso del stronghold.
Kill Ankous until you receive a left skull half.=Mata Ankous hasta recibir una left skull half.
Use both skull halves together.=Usa ambas skull halves juntas.
Use the sceptre pieces together.=Usa las piezas del sceptre juntas.
Use the runed sceptre and strange skull together.=Usa el runed sceptre y el strange skull juntos.
Right-click on the Skull sceptre and select 'Invoke' to teleport to the stronghold.=Haz clic derecho en el Skull sceptre y selecciona 'Invoke' para teletransportarte al stronghold.
Have Asyff make a spottier cape.=Pide a Asyff que haga una spottier cape.
