# Spanish translations for In Aid of the Myreque.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can give this to Ivan just before accompanying him through the swamp to make him stronger=Puedes dárselo a Ivan justo antes de acompañarlo por el pantano para hacerlo más fuerte
You can get another by asking Aurel what you should do now=Puedes conseguir otra preguntándole a Aurel qué deberías hacer ahora
You can get another from Drezel=Puedes conseguir otra de Drezel
Talk to Veliaf Hurtz.=Habla con Veliaf Hurtz.
Enter the trapdoor behind the Canifis Pub.=Entra por la trampilla detrás del Canifis Pub.
Enter the cave on the east side.=Entra en la cueva del lado este.
Leave the cave.=Sal de la cueva.
Leave through the doors to the south.=Sal por las puertas del sur.
Cross the bridge to the south.=Cruza el puente hacia el sur.
Board the boat to the south to Mort'ton.=Sube al barco del sur hacia Mort'ton.
Place some food in the nearby chest.=Coloca algo de comida en el cofre cercano.
Talk to Razvan in Burgh de Rott.=Habla con Razvan en Burgh de Rott.
Use a pickaxe on the rubble in the building south of Razvan.=Usa un pickaxe en los escombros del edificio al sur de Razvan.
Enter the trapdoor.=Entra por la trampilla.
Mine all the rubble in the room, and then clean it up with a spade. You'll need an empty bucket when using the spade. You can empty the buckets outside on the rubble pile.=Mina todos los escombros de la sala y luego límpialos con una spade. Necesitarás un bucket vacío al usar la spade. Puedes vaciar los buckets fuera, en el montón de escombros.
Leave the basement.=Sal del sótano.
Talk to Aurel in north east Burgh de Rott.=Habla con Aurel en el noreste de Burgh de Rott.
Go to the roof of Aurel's shop.=Ve al tejado de la tienda de Aurel.
Repair the broken roof.=Repara el tejado roto.
Climb back down the ladder.=Baja de nuevo por la escalera.
Repair the shop's wall.=Repara la pared de la tienda.
Talk to Aurel again.=Habla con Aurel de nuevo.
Return to Aurel with the filled crate.=Vuelve con Aurel con la crate llena.
Repair the bank booth.=Repara el bank booth.
Repair the bank's outside wall.=Repara la pared exterior del banco.
Talk to Cornelius and ask him to be the banker.=Habla con Cornelius y pídele que sea el banquero.
Talk to Razvan.=Habla con Razvan.
Repair the furnace in the south east of Burgh de Rott. You can use the bank you just made to get items out.=Repara el horno del sureste de Burgh de Rott. Puedes usar el banco que acabas de hacer para sacar objetos.
Add coal to the furnace.=Añade coal al horno.
Light the furnace.=Enciende el horno.
Talk to Gadderanks in the shop.=Habla con Gadderanks en la tienda.
Talk to a juvinate in the shop.=Habla con un juvinate en la tienda.
Talk to Wiskit in the shop. Be prepared to fight the vampyres and Gadderanks.=Habla con Wiskit en la tienda. Prepárate para luchar contra los vampyres y Gadderanks.
Defeat Gadderanks and the juvinates.=Derrota a Gadderanks y a los juvinates.
Talk to Gadderanks.=Habla con Gadderanks.
Talk to Veliaf in Burgh de Rott.=Habla con Veliaf en Burgh de Rott.
Kill the juvenates.=Mata a los juvenates.
Talk to Drezel under the Paterdomus Temple.=Habla con Drezel bajo el Paterdomus Temple.
Use the key on the keyhole near Drezel.=Usa la llave en la cerradura cerca de Drezel.
Enter the library.=Entra en la biblioteca.
Search the bookcases for 'The Sleeping Seven' book.=Busca en las estanterías el libro 'The Sleeping Seven'.
Read 'The Sleeping Seven'.=Lee 'The Sleeping Seven'.
Use a hammer on the boarded up cave.=Usa un hammer en la cueva tapiada.
Enter the cave.=Entra en la cueva.
Use a piece of soft clay on the coffin.=Usa un trozo de soft clay en el ataúd.
Make a silvthrill rod at any furnace.=Fabrica un silvthrill rod en cualquier horno.
Cast Lvl-1 enchant on the rod.=Lanza Lvl-1 enchant sobre el rod.
Enter the Myreque Hideout under the Canifis Pub and talk to Veliaf to start.=Entra en el Myreque Hideout bajo el Canifis Pub y habla con Veliaf para empezar.
Travel to Burgh de Rott, south of Mort'ton, and talk to Florin at the entrance.=Viaja a Burgh de Rott, al sur de Mort'ton, y habla con Florin en la entrada.
Return the Myreque Hideout under the Canifis Pub and talk to Veliaf there. Bank any followers before going.=Vuelve al Myreque Hideout bajo el Canifis Pub y habla allí con Veliaf. Guarda en el banco a cualquier seguidor antes de ir.
Talk to Polmafi in the Myreque Hideout.=Habla con Polmafi en el Myreque Hideout.
Talk to Ivan in the Myreque Hideout to temple trek with him. The long route has 4 level 50 Juvinates and the short route has 2 level 75 Juvinates. You can give him a steel med helm / chainbody / platelegs, and salmon to help him survive.=Habla con Ivan en el Myreque Hideout para hacer el temple trek con él. La ruta larga tiene 4 Juvinates de nivel 50 y la ruta corta tiene 2 Juvinates de nivel 75. Puedes darle un steel med helm / chainbody / platelegs y salmon para ayudarle a sobrevivir.
Enter the trapdoor behind the Canifis pub.=Entra por la trampilla detrás del Canifis pub.
Go use the Silvthrill rod on the well in Paterdomus.=Ve a usar el Silvthrill rod en el pozo de Paterdomus.
Bring the rod to Veliaf in the Burgh de Rott pub's basement to finish the quest.=Lleva el rod a Veliaf en el sótano del pub de Burgh de Rott para terminar la misión.
