# Spanish translations for Morytania Easy Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Tannable hide=Piel curtible
Created by combining a bronze spear, watermelon, and hay sack (empty sack filled at a hay bale, nearest is North-West of Lumbridge)=Se crea combinando una bronze spear, una watermelon y una hay sack (empty sack llenada en un hay bale, el más cercano está al noroeste de Lumbridge)
Can be reclaimed by talking to Drezel in the dungeon below Paterdomus=Puedes recuperarla hablando con Drezel en la mazmorra bajo Paterdomus
Combat gear=Equipo de combate
Food=Comida
Ear protection=Protección auditiva
Kill a ghoul in Morytania.=Mata un ghoul en Morytania.
Enter the Mort Myre Swamp.=Entra en el Mort Myre Swamp.
Craft a snelm in Morytania. Note: Do not be in the swamp when completing this task=Fabrica un snelm en Morytania. Nota: No estés en el pantano al completar esta tarea
Enter the grotto tree in Mort Myre Swamp.=Entra en el árbol de la gruta en Mort Myre Swamp.
Pray at the altar.=Reza en el altar.
Kill a banshee.=Mata una banshee.
Kill any attackable NPC in Canifis with the wolfbane dagger.=Mata cualquier NPC atacable en Canifis con la wolfbane dagger.
Get a slayer task from Mazchna.=Consigue una tarea de Slayer de Mazchna.
Tan a hide using Sbott's services.=Curte una piel usando los servicios de Sbott.
Use the empty sack on the hay bale to fill it, you can buy an empty sack from Sarah for 1gp.=Usa la empty sack en el hay bale para llenarla, puedes comprar una empty sack a Sarah por 1 gp.
Use the Hay sack on the Bronze Spear.=Usa la Hay sack en la Bronze Spear.
Use the watermelon on the Hay Sack to make the Scarecrow.=Usa la watermelon en la Hay Sack para hacer el Scarecrow.
Place a scarecrow at the Morytania flower patch, West of Port Phasmatys.=Coloca un scarecrow en el huerto de flores de Morytania, al oeste de Port Phasmatys.
Head upstairs above the ectofuntus to grind some bones into bonemeal.=Sube arriba del ectofuntus para moler unos bones y hacer bonemeal.
Head downstairs at the ectofuntus to gather some slime.=Baja en el ectofuntus para recoger slime.
Keep heading down and use your bucket on the slime. Afterwards head back up.=Sigue bajando y usa tu bucket en el slime. Después vuelve a subir.
Use your bones on the loader and grind them to make bonemeal. Afterwards head back down.=Usa tus bones en el loader y muélelos para hacer bonemeal. Después vuelve a bajar.
Worship the ectofuntus.=Adora el ectofuntus.
Cook a thin snail in Port Phasmatys.=Cocina un thin snail en Port Phasmatys.
Talk to Le-Sabre near Canifis to claim your reward!=Habla con Le-Sabre cerca de Canifis para reclamar tu recompensa.
