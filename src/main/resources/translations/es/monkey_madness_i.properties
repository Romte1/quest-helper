# Spanish translations for Monkey Madness I.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from King Narnode=Puedes conseguir otro de King Narnode
Obtainable during quest=Se puede conseguir durante la misión
If you've lost this you'll need to make another by bringing Zooknock some monkey dentures, an m'amulet mould and a gold bar=Si lo has perdido, tendrás que hacer otro llevándole a Zooknock unas monkey dentures, un M'amulet mould y un gold bar
You can pick some from the trees near the monkey child=Puedes coger algunas de los árboles que hay cerca del monkey child
You can get another from the monkey child=Puedes conseguir otro del monkey child
You can get another from Waymottin next to Zooknock=Puedes conseguir otro de Waymottin, junto a Zooknock
Kill a gorilla in the temple on Ape Atoll=Mata a un gorilla en el templo de Ape Atoll
Kill a zombie monkey in the tunnel to Zooknock or under the temple for these=Mata a un zombie monkey en el túnel hacia Zooknock o bajo el templo para conseguirlas
Talk to King Narnode Shareen in the Tree Gnome Stronghold.=Habla con King Narnode Shareen en el Tree Gnome Stronghold.
Enter the shipyard on Karamja.=Entra en el astillero de Karamja.
Travel to the Shipyard on Karamja.=Ve al astillero de Karamja.
Fly with Captain Errdo to Gandius.=Vuela con Captain Errdo a Gandius.
Talk to G.L.O. Caranock in the shipyard.=Habla con G.L.O. Caranock en el astillero.
Return to King Narnode Shareen in the Tree Gnome Stronghold.=Vuelve con King Narnode Shareen en el Tree Gnome Stronghold.
Talk to Daero on the 1st floor of the Tree Gnome Stronghold.=Habla con Daero en la primera planta del Tree Gnome Stronghold.
Talk to Daero on the 1st floor of the Tree Gnome Stronghold. Make sure to go through all of the Chat Options until you're given a 'Leave...' option.=Habla con Daero en la primera planta del Tree Gnome Stronghold. Asegúrate de pasar por todas las opciones de chat hasta que te aparezca la opción 'Leave...'.
Talk to Daero in the hangar.=Habla con Daero en el hangar.
Operate the reinitialisation panel and solve the puzzle.=Usa el panel de reinicialización y resuelve el puzzle.
Talk to Daero in the hangar again.=Habla con Daero en el hangar de nuevo.
Talk to Waydar.=Habla con Waydar.
Talk to Lumdo.=Habla con Lumdo.
Talk to Waydar on Crash Island.=Habla con Waydar en Crash Island.
Talk to Lumdo again.=Habla con Lumdo de nuevo.
Head west and enter the valley going north WITH PROTECT FROM RANGED ON. Be wary of poison and taking damage.=Ve al oeste y entra en el valle hacia el norte CON PROTECT FROM RANGED ACTIVADO. Ten cuidado con el veneno y con el daño.
Wait for the gorilla guard to start going away from the prison cell, then sneak out and go to the north side of the prison.=Espera a que el gorilla guard se aleje de la celda y luego escóndete para salir y ve al lado norte de la prisión.
Stick to the east edge of the town, and make your way to Garkor to the south east.=Mantente en el borde este del pueblo y dirígete a Garkor, al sureste.
Head west and enter the large open building via the south door. DO NOT STAND ON THE LIGHT FLOOR IN THE BUILDING.=Ve al oeste y entra en el gran edificio abierto por la puerta sur. NO TE QUEDES DE PIE EN EL SUELO ILUMINADO DEL EDIFICIO.
DO NOT WALK ON THE LIGHT FLOOR. Search the stacked crates for monkey dentures.=NO CAMINES SOBRE EL SUELO ILUMINADO. Registra las cajas apiladas para encontrar las monkey dentures.
Search the crate in the south east corner and go down into the cavern.=Registra la caja de la esquina sureste y baja a la caverna.
Search the crate in the north west of the room for a M'amulet mould.=Registra la caja del noroeste de la sala para encontrar un M'amulet mould.
Teleport out to prepare for a dangerous portion. You'll want energy/stamina potions, food and prayer potions.=Teletranspórtate fuera para preparar una parte peligrosa. Necesitarás energy/stamina potions, food y prayer potions.
Get food, antipoison, energy / stamina / prayer potions, and return to Ape Atoll.=Consigue food, antipoison, energy / stamina / prayer potions y vuelve a Ape Atoll.
Travel with Daero on the 1st floor of the Tree Gnome Stronghold.=Viaja con Daero en la primera planta del Tree Gnome Stronghold.
Travel with Waydar.=Viaja con Waydar.
Travel with Lumdo.=Viaja con Lumdo.
Enter the dungeon in south Ape Atoll.=Entra en la mazmorra del sur de Ape Atoll.
Talk to Zooknock in the north east of the dungeon.=Habla con Zooknock en el noreste de la mazmorra.
Use the monkey dentures on Zooknock in the north east of the dungeon. If you've already done so, open the quest journal to re-sync your current state.=Usa las monkey dentures en Zooknock, en el noreste de la mazmorra. Si ya lo has hecho, abre el diario de misiones para resincronizar tu estado actual.
Use the m'amulet mould on Zooknock in the north east of the dungeon. If you've already done so, open the quest journal to re-sync your current state.=Usa el M'amulet mould en Zooknock, en el noreste de la mazmorra. Si ya lo has hecho, abre el diario de misiones para resincronizar tu estado actual.
Use the gold bar on Zooknock in the north east of the dungeon. If you've already done so, open the quest journal to re-sync your current state.=Usa el gold bar en Zooknock, en el noreste de la mazmorra. Si ya lo has hecho, abre el diario de misiones para resincronizar tu estado actual.
Teleport out to prepare to make the amulet. You'll want some food, prayer potions, antipoisons, the mould and the enchanted bar.=Teletranspórtate fuera para preparar la creación del amulet. Necesitarás algo de food, prayer potions, antipoisons, el mould y el enchanted bar.
Get food, antipoison, prayer potions, and return to Ape Atoll.=Consigue food, antipoison, prayer potions y vuelve a Ape Atoll.
Wait for the gorilla guard to start going away from the prison cell, then sneak out and go to the north side of the prison. Afterwards, head into the temple's basement.=Espera a que el gorilla guard se aleje de la celda y luego escóndete para salir y ve al lado norte de la prisión. Después, entra en el sótano del templo.
Use the enchanted bar on the wall of flame.=Usa el enchanted bar en la pared de llamas.
Climb the rope out. If you plan on doing Recipe for Disaster, also kill a Zombie Monkey for its bones whilst here, and a gorilla upstairs.=Sube por la cuerda para salir. Si tienes pensado hacer Recipe for Disaster, aprovecha para matar a un Zombie Monkey y conseguir sus bones, y a un gorilla en la planta de arriba.
Use the ball of wool on the unstrung amulet.=Usa la ball of wool en el unstrung amulet.
Go to the north west of the island and talk to the monkey child there a few times. Eventually you'll give him 5 bananas, and he'll give you a monkey talisman.=Ve al noroeste de la isla y habla varias veces con el monkey child que hay allí. Al final le darás 5 bananas y él te dará un monkey talisman.
Make sure to avoid the monkey's aunt near him otherwise she'll call the guards on you.=Asegúrate de evitar a la tía del monkey que está cerca de él; si no, llamará a los guards.
Talk to the monkey child again.=Habla con el monkey child de nuevo.
Give the monkey child 5 bananas.=Da 5 bananas al monkey child.
Wait for the aunt to make another round, then talk to the monkey child for the talisman.=Espera a que la tía vuelva a pasar y luego habla con el monkey child para conseguir el talisman.
Teleport out to prepare to make the talisman. You'll want some food, prayer potions, and antipoisons.=Teletranspórtate fuera para preparar la creación del talisman. Necesitarás algo de food, prayer potions y antipoisons.
If you want to make talismans for Recipe for Disaster, talk to the monkey child a few more times for 4 talismans, and make sure you have bones of a zombie / ninja / gorilla.=Si quieres crear talismans para Recipe for Disaster, habla con el monkey child unas cuantas veces más para conseguir 4 talismans y asegúrate de tener bones de zombie / ninja / gorilla.
This section will help you get ready for Recipe for Disaster. If you aren't interested in this, tick the box for this section in the sidebar to skip it.=Esta sección te ayudará a prepararte para Recipe for Disaster. Si no te interesa, marca la casilla de esta sección en la barra lateral para saltártela.
Talk to the monkey child until you have 4 talismans. Tell him you lost it, and he will cry until the aunt comes back around (make sure to hide!). Talk to him again for another.=Habla con el monkey child hasta tener 4 talismans. Dile que lo has perdido y se pondrá a llorar hasta que la tía vuelva a pasar (¡asegúrate de esconderte!). Habla con él de nuevo para conseguir otro.
Enter into the temple's basement to kill a zombie monkey for their bones.=Entra en el sótano del templo para matar a un zombie monkey y conseguir sus bones.
Kill a zombie monkey for their bones.=Mata a un zombie monkey para conseguir sus bones.
Kill a gorilla in the temple for their bones. If they can attack you they will heal on hit, so it's recommended to safespot or flinch one.=Mata a un gorilla en el templo para conseguir sus bones. Si pueden atacarte, se curarán al golpearte, así que se recomienda hacer safespot o flinchear a uno.
Kill a monkey archer for their bones.=Mata a un monkey archer para conseguir sus bones.
Use the monkey talisman on Zooknock in the north east of the dungeon. If you've already done so, open the quest journal to re-sync your current state.=Usa el monkey talisman en Zooknock, en el noreste de la mazmorra. Si ya lo has hecho, abre el diario de misiones para resincronizar tu estado actual.
Use the monkey bones on Zooknock in the north east of the dungeon. If you've already done so, open the quest journal to re-sync your current state.=Usa las monkey bones en Zooknock, en el noreste de la mazmorra. Si ya lo has hecho, abre el diario de misiones para resincronizar tu estado actual.
Talk to Zooknock in the north east of the dungeon for the talisman.=Habla con Zooknock en el noreste de la mazmorra para conseguir el talisman.
If you want to make a zombie, ninja and gorilla greegree for RFD talk to and give Zooknock the bones/talismans. Once you're done, teleport away for the next step.=Si quieres crear greegree de zombie, ninja y gorilla para RFD, habla con Zooknock y dale las bones/talismans. Cuando termines, teletranspórtate fuera para el siguiente paso.
Talk to the Monkey Minder in the Ardougne Zoo whilst wielding the Karamjan monkey greegree.=Habla con el Monkey Minder del Ardougne Zoo mientras empuñas la Karamjan monkey greegree.
Talk to a monkey in the pen.=Habla con un monkey del corral.
UNEQUIP the greegree, then talk to the Monkey Minder again to leave.=DESEQUIPA la greegree y luego habla con el Monkey Minder de nuevo para salir.
WALK/RUN to Daero to return to Ape Atoll. If you teleport, you'll have to start again.=CAMINA/CORRE hasta Daero para volver a Ape Atoll. Si te teletransportas, tendrás que empezar de nuevo.
Talk to a guard outside the building in the south east of Marim. If you already have, open the quest guide to resync.=Habla con un guard a las afueras del edificio del sureste de Marim. Si ya lo has hecho, abre la guía de misiones para resincronizar.
EQUIP THE GREEGREE and enter the gate to Marim. The monkeys will not attack you if you're holding it.=EQUIPA LA GREEGREE y entra por la puerta de Marim. Los monkeys no te atacarán si la llevas.
Talk to Kruk in the north west of the island.=Habla con Kruk en el noroeste de la isla.
Talk to Garkor.=Habla con Garkor.
Talk to Awowogei twice.=Habla con Awowogei dos veces.
Prepare to fight the Jungle Demon. Once you're ready, equip the 10th squad sigil.=Prepárate para luchar contra el Jungle Demon. Cuando estés listo, equipa el 10th squad sigil.
Kill the Jungle Demon. Use Protect from Magic and keep your distance to kill it safely.=Mata al Jungle Demon. Usa Protect from Magic y mantén la distancia para matarlo de forma segura.
Jungle Demon (level 195)=Jungle Demon (nivel 195)
Ability to purchase and wield the Dragon Scimitar.=Habilidad de comprar y empuñar la Dragon Scimitar.
Full access to Ape Atoll.=Acceso completo a Ape Atoll.
Starting off=Empezando
