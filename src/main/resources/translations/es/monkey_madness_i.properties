Defeat the demon=Derrota al demon
Tree Gnome Stronghold teleport via Spirit Tree (2), Gnome Glider (Ta Quir Priw), or Grand Seed Pod=Teletranspórtate al Tree Gnome Stronghold con Spirit Tree (2), Gnome Glider (Ta Quir Priw) o Grand Seed Pod
Any teleport to leave Ape Atoll=Cualquier teleport para salir de Ape Atoll
Combat gear, food and potions=Equipo de combate, comida y pociones
Any talisman=Cualquier talisman
Food=Comida
