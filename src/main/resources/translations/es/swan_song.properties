Talk to Herman Carnos outside the Fishing Colony.=Habla con Herman Carnos a las afueras de la Fishing Colony.
Talk to the Wise Old Man in Draynor Village.=Habla con el Wise Old Man en Draynor Village.
Talk to the Wise Old Man outside the Fishing Colony. Be prepared to fight sea trolls.=Habla con el Wise Old Man a las afueras de la Fishing Colony. Prepárate para luchar contra los sea trolls.
