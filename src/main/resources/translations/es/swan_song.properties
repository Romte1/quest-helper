# Spanish translations for Swan Song.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Obtainable during the quest, just pick up bones when killing the sea trolls.=Obtenible durante la misión; simplemente recoge bones al matar a los sea trolls.
You can make one from wet clay on a potter's wheel=Puedes hacer uno con wet clay en un torno de alfarero
You can get one from Arnold=Puedes conseguir una de Arnold
Franklin will give you one=Franklin te dará uno
Malignius will give you one=Malignius te dará uno
