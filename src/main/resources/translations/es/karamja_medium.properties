# Spanish translations for Karamja Medium Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Pay Cap'n Izzy No Beard 200 coins and enter the Agility Arena in Brimhaven.=Paga 200 coins a Cap'n Izzy No Beard y entra en la Agility Arena de Brimhaven.
Talk to Murcaily in the east of Tai Bwo Wannai to start up the cleanup, then chop the light jungle and repair the rotten fences until 100% favour. Make sure you dig up any gout tuber and mine any gem rocks that may appear.=Habla con Murcaily al este de Tai Bwo Wannai para empezar la limpieza, luego tala la light jungle y repara las vallas podridas hasta alcanzar el 100% de favor. Asegúrate de desenterrar cualquier gout tuber y minar cualquier gem rock que aparezca.
Make a spider on stick by using a spider carcass on an arrow shaft.=Haz una spider on stick usando una spider carcass en un arrow shaft.
Chop a teak tree down either in the Hardwood Grove in Tai Bwo Wannai or in the Kharazi Jungle (requires Legends' Quest started).=Tala un teak tree en el Hardwood Grove de Tai Bwo Wannai o en la Kharazi Jungle (requiere haber empezado Legends' Quest).
Chop a mahogany tree down either in the Hardwood Grove in Tai Bwo Wannai or in the Kharazi Jungle (requires Legends' Quest started).=Tala un mahogany tree en el Hardwood Grove de Tai Bwo Wannai o en la Kharazi Jungle (requiere haber empezado Legends' Quest).
Grow a fruit tree in the Brimhaven patch. If you're waiting for it to grow and want to complete further tasks, use the tick box on panel.=Planta un fruit tree en el bancal de Brimhaven. Si estás esperando a que crezca y quieres completar otras tareas, usa la casilla del panel.
Place logs over a pit north of Cairn Isle, and poke a graahk with a teasing stick. Jump over the pits until the graahk falls in and loot it.=Coloca logs sobre un foso al norte de Cairn Isle y pincha a un graahk con una teasing stick. Salta los fosos hasta que el graahk caiga dentro y saquéalo.
A fruit tree sapling you can plant, preferably Palm Tree for the Elite diary=Un fruit tree sapling que puedas plantar, preferiblemente Palm Tree para el diario Elite
Raw karambwanji, or a small fishing net to catch some=Raw karambwanji, o una small fishing net para pescarlos
Tag a marked pillar.=Marca un pilar marcado.
Enter the Karamja Volcano.=Entra en el Karamja Volcano.
Return back through the shortcut.=Vuelve por el atajo.
Travel on the cart north of Brimhaven.=Viaja en el carro al norte de Brimhaven.
Cook a spider on a stick on a fire/range.=Cocina una spider on a stick en un fuego o range.
Charter the Lady of the Waves from south of Cairn Isle to Port Khazard.=Fleta la Lady of the Waves desde el sur de Cairn Isle hasta Port Khazard.
Using your small fishing net, catch some raw karambwanji just south of Tai Bwo Wannai, or buy some from the GE.=Con tu small fishing net, pesca algunos raw karambwanji justo al sur de Tai Bwo Wannai, o cómpralos en el GE.
Fish a karambwan from the north east coast of Karamja.=Pesca un karambwan en la costa noreste de Karamja.
Get a gem machete from Safta Doc. If you want to make a red topaz one, you'll need 1200 trading sticks.=Consigue un gem machete de Safta Doc. Si quieres uno de red topaz, necesitarás 1200 trading sticks.
Fly on a Gnome Glider to Karamja.=Vuela en un Gnome Glider a Karamja.
Enter Brimhaven Dungeon.=Entra en la Brimhaven Dungeon.
Chop the vines nearby.=Corta las lianas cercanas.
Cross the lava to the west of the entrance.=Cruza la lava al oeste de la entrada.
Climb up to the top floor of the Brimhaven Dungeon.=Sube al piso superior de la Brimhaven Dungeon.
Travel with the charter ship in the Shipyard. Musa Point is the cheapest destination.=Viaja en el charter ship del Shipyard. Musa Point es el destino más barato.
Mine gem rocks until you get a red topaz.=Mina gem rocks hasta conseguir un red topaz.
Climb the rope to Crandor Isle.=Sube por la cuerda a Crandor Isle.
Talk to Pirate Jackie the Fruit in Brimhaven to claim your reward!=Habla con Pirate Jackie the Fruit en Brimhaven para reclamar tu recompensa.
You can get one killing a spider during Tai Bwo Wannai Cleanup=Puedes conseguir una matando una araña durante el Tai Bwo Wannai Cleanup
This can be obtained rarely during Tai Bwo Wannai Cleanup. Have a spade to dig it up=Se obtiene raramente durante el Tai Bwo Wannai Cleanup. Lleva una spade para desenterrarlo
You can buy one from the hunter shop in Yanille=Puedes comprar una en la tienda de caza de Yanille
You can get these from villagers when doing Tai Bwo Wannai Cleanup=Puedes conseguirlos de los aldeanos durante el Tai Bwo Wannai Cleanup
You can bring a jade or red topaz instead for a machete if you also bring more trading sticks=Puedes llevar un jade o un red topaz en su lugar para conseguir un machete si además llevas más trading sticks
You can get one by using a spider carcass on an arrow shaft=Puedes conseguir una usando una spider carcass en un arrow shaft
Increased Agility Experience when redeeming Agility tickets when wearing Karamja gloves=Más experiencia de Agility al canjear Agility tickets llevando los Karamja gloves
10% increased Agility experience earned from Brimhaven Agility Arena when wearing Karamja gloves=10% más de experiencia de Agility en la Brimhaven Agility Arena llevando los Karamja gloves
