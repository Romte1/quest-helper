# Spanish translations for Desert Hard Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Steps
Use the rope on the entrance and enter the Kalphite Hive.=Usa la rope en la entrada y entra en la Kalphite Hive.
Climb down the tunnel entrance that leads to the Kalphite Queen and kill her.=Baja por la entrada del túnel que lleva a la Kalphite Queen y mátala.
Climb on the basket and complete a lap of the Pollnivneach Rooftop course.=Sube a la basket y completa una vuelta al circuito de los tejados de Pollnivneach.
Knockout and pickpocket a Menaphite thug.=Noquea y roba a un Menaphite thug.
Refill an empty waterskin using the Lunar spell Humidify in the Desert (You must be losing health or water from the heat).=Rellena una waterskin vacía usando el hechizo Lunar Humidify en el desierto (debes estar perdiendo salud o agua por el calor).
Go down the Smokey well.=Baja por el Smokey well.
Kill a Dust devil with a slayer helm equipped.=Mata a un Dust devil con un slayer helm equipado.
Enter the Jaldraocht Pyramid.=Entra en la Jaldraocht Pyramid.
Pray at the altar.=Reza en el altar.
Mine granite in the mine south of the Bandit Camp.=Mina granite en la mina al sur del Bandit Camp.
Climb the staircase in the Nardah Mayor's house.=Sube las escaleras de la casa del Mayor de Nardah.
Burn yew logs on the balcony.=Quema yew logs en el balcón.
Make a Mithril platebody in Nardah.=Fabrica una Mithril platebody en Nardah.
Climb down the ladder to enter the Sophanem Dungeon.=Baja por la escalera para entrar en la Sophanem Dungeon.
Climb down the ladder again.=Baja por la escalera de nuevo.
Kill a Locust rider with keris.=Mata a un Locust rider con keris.
Talk to Jarr at the Shantay pass to claim your reward!=¡Habla con Jarr en el Shantay pass para reclamar tu recompensa!

# Requirements
Combat gear=Equipo de combate
Any pickaxe=Cualquier pickaxe
Light source=Una fuente de luz
Food=Comida
Nardah teleport=Teletransporte a Nardah

# Combat requirements
Kill a Dust devil (lvl 93), Locust rider (lvl 98), Kalphite Queen (lvl 333)=Mata a un Dust devil (nivel 93), un Locust rider (nivel 98) y a la Kalphite Queen (nivel 333)

# Rewards
Pharaoh's sceptre can hold up to 50 charges=El Pharaoh's sceptre puede almacenar hasta 50 cargas
Unlocked the ability to toggle the Camulet teleport location between the inside and outside of Enakhra's Temple=Desbloqueas la posibilidad de alternar el destino del teletransporte del Camulet entre el interior y el exterior del Enakhra's Temple
All carpet rides are free=Todos los viajes en Magic Carpet son gratis
Zahur will create unfinished potions for 200 coins per potion from a vial of water and a clean herb. Items can be noted or unnoted=Zahur creará potions sin terminar por 200 monedas cada una a partir de un vial of water y una clean herb. Los objetos pueden estar anotados o no
Zahur will now clean noted grimy herbs for 200 coins each=Zahur ahora limpiará grimy herbs anotadas por 200 monedas cada una
Ropes placed at both the Kalphite Lair entrance and the Kalphite Queen tunnel entrance become permanent=Las ropes colocadas en la entrada de la Kalphite Lair y en la entrada del túnel de la Kalphite Queen se vuelven permanentes
Increased experience on the Pollnivneach Rooftop Course=Más experiencia en el Pollnivneach Rooftop Course

