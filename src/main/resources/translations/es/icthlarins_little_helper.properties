# Spanish translations for Icthlarin's Little Helper.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get this by using a knife on an evergreen tree with a bucket in your inventory=Puedes conseguirlo usando un cuchillo en un árbol de hoja perenne con un bucket en el inventario
You can get another from the Sphinx=Puedes conseguir otro de la Sphinx
You can get another from the Carpenter in Sophanem=Puedes conseguir otro del Carpenter en Sophanem
Click the highlighted boxes to turn the squares to solve the puzzle.=Haz clic en las casillas resaltadas para girar los cuadrados y resolver el puzzle.
Talk to the Wanderer west of the Agility Pyramid.=Habla con la Wanderer al oeste de la Agility Pyramid.
Talk to the Wanderer again with the required items.=Habla con la Wanderer de nuevo con los objetos necesarios.
Enter the rock west of the Agility Pyramid to re-enter Sophanem.=Entra en la roca al oeste de la Agility Pyramid para volver a entrar en Sophanem.
Enter the pyramid in the south of Sophanem.=Entra en la pirámide al sur de Sophanem.
Follow the path until you reach a pit, and jump it. Move using the minimap to avoid all the traps.=Sigue el camino hasta llegar a un pozo y sáltalo. Muévete con el minimapa para evitar todas las trampas.
Attempt to open the western door.=Intenta abrir la puerta oeste.
Solve the door puzzle.=Resuelve el puzzle de la puerta.
Talk to the Sphinx in Sophanem with your cat, and answer its riddle with '9.'.=Habla con la Sphinx en Sophanem con tu gato y responde a su acertijo con '9.'.
Talk to the High Priest in the south west of Sophanem.=Habla con el High Priest al suroeste de Sophanem.
Follow the path again until you reach a pit, and jump it. Move using the minimap to avoid all the traps.=Sigue el camino de nuevo hasta llegar a un pozo y sáltalo. Muévete con el minimapa para evitar todas las trampas.
Attempt to pick up the Crondis Canopic Jar, and kill Apparition (level 75) when they appear. They will attack with magic.=Intenta coger el Crondis Canopic Jar y mata a Apparition (nivel 75) cuando aparezca. Atacará con magia.
Attempt to pick up the Scarabas Canopic Jar, and kill Apparition (level 75) when they appear. They will attack with melee.=Intenta coger el Scarabas Canopic Jar y mata a Apparition (nivel 75) cuando aparezca. Atacará con melé.
Attempt to pick up the Apmeken Canopic Jar, and kill Apparition (level 75) when they appear. They will attack with magic.=Intenta coger el Apmeken Canopic Jar y mata a Apparition (nivel 75) cuando aparezca. Atacará con magia.
Attempt to pick up the Het Canopic Jar, and kill Apparition (level 81) when they appear. They will attack with melee.=Intenta coger el Het Canopic Jar y mata a Apparition (nivel 81) cuando aparezca. Atacará con melé.
Try picking up the canopic jars in the north west room until a level 75-81 enemy spawns. Kill them. You can safespot them on the central table.=Intenta coger los canopic jars de la sala noroeste hasta que aparezca un enemigo de nivel 75-81. Mátalo. Puedes hacer safespot con la mesa central.
Pick up the Crondis Canopic Jar.=Coge el Crondis Canopic Jar.
Pick up the Scarabas Canopic Jar.=Coge el Scarabas Canopic Jar.
Pick up the Apmeken Canopic Jar.=Coge el Apmeken Canopic Jar.
Pick up the Het Canopic Jar.=Coge el Het Canopic Jar.
Try picking up the canopic jars in the north west room again.=Intenta coger los canopic jars de la sala noroeste de nuevo.
Jump back over the pit with the jar.=Salta de vuelta sobre el pozo con el canopic jar.
Jump back over to the north side of the pit. Move using the minimap to avoid all the traps inside the pyramid.=Salta de vuelta al lado norte del pozo. Muévete con el minimapa para evitar todas las trampas dentro de la pirámide.
Drop the canopic jar in the spot you took it from.=Suelta el canopic jar en el lugar de donde lo cogiste.
Solve the door puzzle again.=Resuelve el puzzle de la puerta de nuevo.
Leave the pyramid and return to the High Priest.=Sal de la pirámide y vuelve con el High Priest.
Return to the High Priest in the south west of Sophanem.=Vuelve con el High Priest al suroeste de Sophanem.
Talk to the Embalmer just south of the High Priest.=Habla con el Embalmer justo al sur del High Priest.
Talk to the Embalmer again just south of the High Priest.=Habla con el Embalmer de nuevo justo al sur del High Priest.
Fill up a bucket with salt water from the lake north of Sophanem, or buy a bag of salt from a Slayer Master.=Llena un bucket con agua salada del lago al norte de Sophanem, o compra una bag of salt a un Slayer Master.
Use the bucket of saltwater on the suntrap in the south east of Sophenam.=Usa el bucket of saltwater en el suntrap al sureste de Sophenam.
Talk to the Carpenter in the east of Sophanem until he gives you the holy symbol.=Habla con el Carpenter al este de Sophanem hasta que te dé el holy symbol.
Talk to the Carpenter again in the east of Sophanem.=Habla con el Carpenter de nuevo al este de Sophanem.
Talk to the Carpenter again in the east of Sophanem once more.=Habla con el Carpenter una vez más al este de Sophanem.
Get some linen. You can buy some from Raetul in east Sophanem for 30 coins.=Consigue linen. Puedes comprar en Raetul, al este de Sophanem, por 30 monedas.
Enter the rock west of the Agility Pyramid to re-enter Sophanem. Make sure to bring the items you need.=Entra en la roca al oeste de la Agility Pyramid para volver a entrar en Sophanem. Asegúrate de llevar los objetos que necesitas.
Enter the east room.=Entra en la sala este.
Use the unholy symbol on a sarcophagus.=Usa el unholy symbol en un sarcophagus.
Leave the east room.=Sal de la sala este.
Jump over the pit.=Salta sobre el pozo.
Enter the east room again.=Entra en la sala este de nuevo.
Kill the possessed priest. Pray protect from magic against the priest.=Mata al possessed priest. Usa Protect from Magic contra el priest.
Talk to the High Priest in the north east room of the pyramid.=Habla con el High Priest en la sala noreste de la pirámide.
Open the door of the pyramid in the south of Sophanem to watch a cutscene.=Abre la puerta de la pirámide al sur de Sophanem para ver una escena.
Leave the pyramid and witness a cutscene at the exit.=Sal de la pirámide y presencia una escena en la salida.
Return to the High Priest in the south west of Sophanem to finish the quest.=Vuelve con el High Priest al suroeste de Sophanem para terminar la misión.
Level 75 or 81 guardian=Guardián de nivel 75 o 81
Possessed priest (level 91)=Possessed priest (nivel 91)
Access to the city of Sophanem.=Acceso a la ciudad de Sophanem.
Ability to take carpet rides from Pollnivneach to Sophanem and Menaphos.=Habilidad de viajar en alfombra voladora de Pollnivneach a Sophanem y Menaphos.
Starting off=Empezando
Remembering=Recordando
Returning the jar=Devolviendo el canopic jar
Prepare the ritual=Preparando el ritual
Save the ritual=Salvando el ritual
Waterskin(4), bring a few to avoid drinking it=Waterskin(4); lleva varias para no tener que beberla
Coins or more for various payments=Coins o más para los distintos pagos
Bag of Salt from a Slayer Master, or an empty bucket to get some=Bag of Salt de un Slayer Master, o un bucket vacío para conseguir algo
1 x Linen or 30 coins to buy some=1 x Linen o 30 coins para comprarlo
Combat equipment=Equipo de combate
Food=Comida
