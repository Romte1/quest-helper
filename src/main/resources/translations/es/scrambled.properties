# Spanish translations for Scrambled.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Alan in Tal Teok Temple, north of Tal Teklan, to start the quest.=Habla con Alan en Tal Teok Temple, al norte de Tal Teklan, para empezar la misión.
Inspect the egg in front of you.=Inspecciona el huevo que tienes delante.
Head south into Tal Teklan and talk to King in the pub.=Dirígete al sur, a Tal Teklan, y habla con King en el pub.
Get an empty bowl from the pub, will need it later. If it's not there, hop worlds or wait for it to spawn again.=Consigue un cuenco vacío en el pub, lo necesitarás más tarde. Si no está, cambia de mundo o espera a que vuelva a aparecer.
Talk to Acatzin inside the Tal Teklan pub.=Habla con Acatzin dentro del pub de Tal Teklan.
Talk to the Blacksmith west of the Tal Teklan pub.=Habla con el Blacksmith al oeste del pub de Tal Teklan.
Get the hammer from the table. If it's not there, hop worlds or wait for it to spawn again.=Coge el martillo de la mesa. Si no está, cambia de mundo o espera a que vuelva a aparecer.
Get some nails from the blacksmith's workbench, we'll need them later.=Coge algunos clavos del banco de trabajo del herrero, los necesitaremos más tarde.
Get the Saw from the house to the south, we'll need it later. If it's not there, hop worlds or wait for it to spawn again.=Coge la Saw de la casa al sur, la necesitaremos más tarde. Si no está, cambia de mundo o espera a que vuelva a aparecer.
Fix the whetstone.=Arregla la piedra de afilar.
Talk to the Blacksmith again after fixing the whetstone to receive a damaged axe.=Habla con el Blacksmith de nuevo tras arreglar la piedra de afilar para recibir un hacha dañada.
Repair the axe on the whetstone.=Repara el hacha en la piedra de afilar.
Return the repaired axe to Acatzin in the Tel Teklan pub.=Devuelve el hacha reparada a Acatzin en el pub de Tel Teklan.
Talk to Kauayotl at the east entrance of Tal Teklan.=Habla con Kauayotl en la entrada este de Tal Teklan.
Talk to Kauayotl again after repairing his cart.=Habla con Kauayotl de nuevo tras reparar su carro.
Repair Kauayotl's cart.=Repara el carro de Kauayotl.
Go south-west of Kauayotl and pick up two planks from besides the lake. If it's not there, hop worlds or wait for it to spawn again.=Ve al suroeste de Kauayotl y coge dos tablones junto al lago. Si no están, cambia de mundo o espera a que vuelvan a aparecer.
Pick the damiana bush at the east entrance of Tal Teklan for some damiana leaves, we'll need these later.=Recoge del arbusto de damiana en la entrada este de Tal Teklan unas hojas de damiana, las necesitaremos más tarde.
Talk to Nezketi in the Tal Teklan temple.=Habla con Nezketi en el templo de Tal Teklan.
Fill your empty bowl with water at the water pump near the eastern entrance of Tal Teklan.=Llena tu cuenco vacío con agua en la bomba de agua cerca de la entrada este de Tal Teklan.
Mix damiana leaves with your bowl of water.=Mezcla las hojas de damiana con tu cuenco de agua.
Use your bowl of damiana water on the stove in the east part of Tal Teklan to boil it.=Usa tu cuenco de agua de damiana en el fogón de la parte este de Tal Teklan para hervirla.
Pour the damiana tea from your bowl into the empty cup=Vierte el té de damiana de tu cuenco en el vaso vacío
Return to Nezketi in the Tal Teklan temple and give him the cup of damiana tea.=Vuelve con Nezketi en el templo de Tal Teklan y entrégale el vaso de té de damiana.
Return to the temple north of Tal Teklan and speak with one of King's men.=Vuelve al templo al norte de Tal Teklan y habla con uno de los hombres de King.
Search the Eggs to get a Large egg.=Busca en los Eggs para conseguir un Large egg.
Kill the large chicken.=Mata a la gran gallina.
Fetch the Large egg from the chicken coop south of the large temple. Be ready to fight a level 17 chicken.=Consigue el Large egg del gallinero al sur del gran templo. Prepárate para luchar contra una gallina de nivel 17.
Step across the log balance towards the dragon cave.=Cruza el tronco hacia la cueva del dragón.
Search the Eggs in the dragon cave.=Busca en los Eggs de la cueva del dragón.
Fight the red dragon. You can safespot it by standing south-east of the Eggs.=Lucha contra el dragón rojo. Puedes atacarlo sin recibir daño si te colocas al sureste de los Eggs.
Search the Eggs in the south-east of the dragon cave to collect your Dragon egg.=Busca en los Eggs del sureste de la cueva del dragón para recoger tu Dragon egg.
Fetch the Dragon egg from the dragon cave south-east of the large temple, across the river. Be ready to fight a Red dragon.=Consigue el Dragon egg en la cueva del dragón al sureste del gran templo, cruzando el río. Prepárate para luchar contra un dragón rojo.
Exit the dragon's cave.=Sal de la cueva del dragón.
Fight the Jaguar. You can safespot it by standing just north east of the camp.=Lucha contra el Jaguar. Puedes atacarlo sin recibir daño si te colocas justo al noreste del campamento.
Search the Eggs at the camp, east of the dragon age, and collect your Jaguar egg.=Busca en los Eggs del campamento, al este de la dragon age, y recoge tu Jaguar egg.
Fetch the Jaguar egg from the tent, east of the dragon cave. Be ready to fight a level 88 jaguar.=Consigue el Jaguar egg de la tienda, al este de la cueva del dragón. Prepárate para luchar contra un jaguar de nivel 88.
Return to the temple north of Tal Teklan with the egg replacements and speak with one of "King"'s men.=Vuelve al templo al norte de Tal Teklan con los huevos de repuesto y habla con uno de los hombres de "King".
Give Kauayotl the Dragon egg.=Entrega el Dragon egg a Kauayotl.
Give Nezketi the Jaguar egg.=Entrega el Jaguar egg a Nezketi.
Give Acatzin the Large egg.=Entrega el Large egg a Acatzin.
Give the eggs to King's men at the Tal Teok Temple, north of Tal Teklan.=Entrega los huevos a los hombres de King en el Tal Teok Temple, al norte de Tal Teklan.
Return to the large temple north of Tal Teklan and talk with one of King's men to evaluate the Humphrey Dumphrey alternatives.=Vuelve al gran templo al norte de Tal Teklan y habla con uno de los hombres de King para evaluar las alternativas de Humphrey Dumphrey.
Talk to one of King's men to figure out how to solve the broken-egg conundrum.=Habla con uno de los hombres de King para averiguar cómo resolver el enigma del huevo roto.
Inspect the egg.=Inspecciona el huevo.
Put Lumpty Mumpty back together again.=Recompón a Lumpty Mumpty.
Talk to one of King's men to finish the quest.=Habla con uno de los hombres de King para terminar la misión.
