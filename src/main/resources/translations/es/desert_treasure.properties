# Spanish translations for Desert Treasure.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

Magic logs (can be noted)=Magic logs (pueden ir en notas)
Steel bar (can be noted)=Steel bar (puede ir en notas)
Molten glass (can be noted)=Molten glass (puede ir en notas)
Use a pestle and mortar on a garlic to make powder=Usa un pestle and mortar en un garlic para hacer polvo
Bring Dunstan in Burthorpe climbing boots and an iron bar to make these=Lleva a Dunstan en Burthorpe climbing boots y una iron bar para fabricarlas
Facemask (or other face covering)=Facemask (u otra cobertura facial)
Slayer mask and gas mask can also be used.=También se pueden usar slayer mask y gas mask.
You can get another from the Archaeologist in the Bedabin Camp=Puedes conseguir otra del Archaeologist en el Bedabin Camp
You can get another from the Archaeological expert in the Exam Centre=Puedes conseguir otra del Archaeological expert en el Exam Centre
You can get another from the room you killed Fareed in inside the Smoke Dungeon=Puedes conseguir otro en la sala donde mataste a Fareed dentro del Smoke Dungeon
You can get another from the east room of the Shadow Dungeon=Puedes conseguir otro en la sala este del Shadow Dungeon
You can get another from the Troll Child north of Trollheim=Puedes conseguir otro del Troll Child al norte de Trollheim
You can get another from Malak in Canifis=Puedes conseguir otro de Malak en Canifis
to be able to wield a weapon against Fareed if not using water spells with runes only=para poder empuñar un arma contra Fareed si no usas solo water spells con runas
Water spells or melee gear=Water spells o equipo de melee
You can get another from the chest in the south of the Bandit Camp=Puedes conseguir otra del cofre al sur del Bandit Camp
You can get another from Rasolo south of Baxtorian Falls=Puedes conseguir otro de Rasolo al sur de Baxtorian Falls
Decent combat gear=Equipo de combate decente
Teleport to Canifis. Fairy Ring (CKS), Fenkenstrain's teleport=Teletransporte a Canifis. Fairy Ring (CKS), teletransporte de Fenkenstrain
Teleport to Bedabin Camp. Fairy Ring (BIQ), Camulet=Teletransporte al Bedabin Camp. Fairy Ring (BIQ), Camulet
Teleport to Pollnivneach. Pollnivneach house teleport=Teletransporte a Pollnivneach. Teletransporte de casa de Pollnivneach
Teleport to the Waterfall. Skills necklace (Fishing Guild [1]), Games necklace (Barbarian Outpost [2])=Teletransporte a la Waterfall. Skills necklace (Fishing Guild [1]), Games necklace (Barbarian Outpost [2])
Teleport to Bandit Camp (desert). Fairy Ring (BIQ), Camulet=Teletransporte al Bandit Camp (desierto). Fairy Ring (BIQ), Camulet
Teleport to Draynor Village. Amulet of Glory (Draynor Village [3]), Draynor Manor Teleport=Teletransporte a Draynor Village. Amulet of Glory (Draynor Village [3]), Draynor Manor Teleport
Teleport to Trollheim. Trollheim teleport, Ghommal's hilt (any tier)=Teletransporte a Trollheim. Trollheim teleport, Ghommal's hilt (cualquier nivel)
Teleport to Jaldraocht Pyramid. Camulet, Pollnivneach house teleport=Teletransporte a la Jaldraocht Pyramid. Camulet, teletransporte de casa de Pollnivneach
WARNING - IMPORTANT NOTE: At any point a Diamond of Azzanadra is in your inventory, a level 95 Stranger may appear and attack you with a poisoned dragon dagger.\n\nTalk to the Archaeologist in the Bedabin Camp. You can use the flying carpet service from the Shantay Pass to get here.=ADVERTENCIA - NOTA IMPORTANTE: En cualquier momento en que un Diamond of Azzanadra esté en tu inventario, puede aparecer un Stranger de nivel 95 y atacarte con una poisoned dragon dagger.\n\nHabla con el Archaeologist en el Bedabin Camp. Puedes usar el servicio de alfombra voladora desde el Shantay Pass para llegar.
Talk to the Terry Balando in the Exam Centre found south-east of Varrock, directly south of the Digsite.=Habla con Terry Balando en el Exam Centre, al sureste de Varrock, justo al sur del Digsite.
Talk to the Terry Balando again.=Habla con Terry Balando de nuevo.
Bring the translation to the Archaeologist in the Bedabin Camp.=Lleva la translation al Archaeologist en el Bedabin Camp.
Talk to the Archaeologist again.=Habla con el Archaeologist de nuevo.
Unequip any god-related items you have on, or else you'll be attacked by bandits. Go buy a drink from the pub in the Bandit Camp, then talk to the Bartender again.=Quítate cualquier objeto relacionado con dioses, o los bandidos te atacarán. Ve a comprar una bebida al pub del Bandit Camp y luego habla con el Bartender de nuevo.
Talk to the bartender in the Bandit Camp again.=Habla con el bartender del Bandit Camp de nuevo.
Talk to Eblis in the east of the Bandit Camp.=Habla con Eblis en el este del Bandit Camp.
Use the items on Eblis in the east of the Bandit Camp. Items can be noted.=Usa los objetos en Eblis, en el este del Bandit Camp. Los objetos pueden ir en notas.
Talk to Eblis at the mirrors south east of the Bandit Camp.=Habla con Eblis en los espejos al sureste del Bandit Camp.
Enter the smokey well west of Pollnivneach. You'll need to run a lot, so bring energy/stamina potions if you can.=Entra en el pozo humeante al oeste de Pollnivneach. Tendrás que correr mucho, así que lleva pociones de energía/stamina si puedes.
Light all the torches in the corners of the dungeon. This is timed, so try to do it as fast as possible. Start with the north east torch, and work your way to the south west.=Enciende todas las antorchas de las esquinas de la mazmorra. Tiene tiempo límite, así que intenta hacerlo lo más rápido posible. Empieza por la antorcha del noreste y ve hacia el suroeste.
Light all the torches in the corners of the dungeon.=Enciende todas las antorchas de las esquinas de la mazmorra.
Open the chest in the middle of the dungeon.=Abre el cofre en el centro de la mazmorra.
Use the warm key on the gate in the east of the dungeon. Be prepared to fight Fareed. If you aren't wearing ice gloves he'll unequip your weapon.=Usa la warm key en la puerta del este de la mazmorra. Prepárate para luchar contra Fareed. Si no llevas ice gloves, te quitará el arma.
Enter the gate in the east of the dungeon. Be prepared to fight Fareed. If you aren't wearing ice gloves he'll unequip your weapon.=Entra por la puerta del este de la mazmorra. Prepárate para luchar contra Fareed. Si no llevas ice gloves, te quitará el arma.
Kill Fareed. Either use melee with ice gloves, or water spells. Recall that the mysterious stranger can appear and attack you whilst you're holding the diamond.=Mata a Fareed. Usa melee con ice gloves o water spells. Recuerda que el mysterious stranger puede aparecer y atacarte mientras llevas el diamante.
Talk to Rasolo south of Baxtorian Falls.=Habla con Rasolo al sur de Baxtorian Falls.
Bring antipoison, food, and as many lockpicks as you can to the Bandit Camp, and try opening the chest in the south of the Bandit Camp. Keep trying until you succeed.=Lleva antipoison, comida y tantos lockpicks como puedas al Bandit Camp e intenta abrir el cofre al sur del Bandit Camp. Sigue intentándolo hasta que lo consigas.
Talk to Malak in the pub in Canifis.=Habla con Malak en el pub de Canifis.
Ask Malek in the pub in Canifis how to kill Dessous.=Pregunta a Malek en el pub de Canifis cómo matar a Dessous.
Return the cross to Rasolo south of Baxtorian Falls.=Devuelve la cross a Rasolo al sur de Baxtorian Falls.
Equip the Ring of Visibility, then go down the ladder in the area east of Rasolo. It's recommended you bring combat gear to safe spot Damis.=Equípate la Ring of Visibility y baja por la escalera de la zona al este de Rasolo. Se recomienda llevar equipo de combate para hacer safespot a Damis.
Go to the far eastern room of the dungeon, and wait for Damis to spawn.=Ve a la sala más al este de la mazmorra y espera a que aparezca Damis.
Kill both phases of Damis. You can safespot him by attacking a bat and keeping the bat between the two of you.=Mata las dos fases de Damis. Puedes hacerle safespot atacando a un murciélago y manteniéndolo entre vosotros dos.
Pick up the shadow diamond. Recall that the mysterious stranger can appear and attack you whilst you're holding the diamond.=Coge el shadow diamond. Recuerda que el mysterious stranger puede aparecer y atacarte mientras llevas el diamante.
Bring a silver bar to Ruantun in Draynor Sewer.=Lleva una silver bar a Ruantun en Draynor Sewer.
Travel to Entrana with the silver pot and have the High Priest enchant it.=Viaja a Entrana con la silver pot y pide al High Priest que la encante.
Bring the blessed pot to Malak in the pub in Canifis. He'll bite you for a small bit of damage.=Lleva la blessed pot a Malak en el pub de Canifis. Te morderá y te hará un poco de daño.
Use the spice on the blessed pot.=Usa la spice en la blessed pot.
Add the garlic powder to the blessed pot.=Añade el garlic powder a la blessed pot.
Use the blessed pot on the vampyre tomb in the graveyard south east of Canifis. Be prepared to fight Dessous.=Usa la blessed pot en la tumba vampyre del cementerio al sureste de Canifis. Prepárate para luchar contra Dessous.
Kill Dessous.=Mata a Dessous.
Return to Malak in Canifis to get the Blood Diamond. Recall that the mysterious stranger can appear and attack you whilst you're holding the diamond.=Vuelve con Malak en Canifis para conseguir el Blood Diamond. Recuerda que el mysterious stranger puede aparecer y atacarte mientras llevas el diamante.
Use a cake on the Troll Child north of Trollheim.=Usa un cake en el Troll Child al norte de Trollheim.
Talk to the Troll Child north of Trollheim.=Habla con el Troll Child al norte de Trollheim.
Enter the ice gate east of the troll child. Make sure you're prepared for combat, and your stats to be continually drained.=Entra por la ice gate al este del troll child. Asegúrate de estar preparado para el combate y de que tus stats se irán drenando continuamente.
Kill 5 ice trolls.=Mata a 5 ice trolls.
Continue along the path through the cave to the east.=Continúa por el camino a través de la cueva hacia el este.
Continue along the path until you find Kamil. Kill him with fire spells. Get into melee distance and protect from melee.=Continúa por el camino hasta encontrar a Kamil. Mátalo con fire spells. Ponte a distancia de melee y usa protect from melee.
Equip the spiked boots, then continue along the path until you reach an ice ledge. Climb up it.=Equípate las spiked boots y continúa por el camino hasta llegar a una cornisa de hielo. Sube por ella.
Follow the Ice Path up to the top and enter the gate there.=Sigue el Ice Path hasta arriba y entra por la puerta que hay allí.
Break the ice surrounding the trolls at the end of the path. Fire spells are effective for this.=Rompe el hielo que rodea a los trolls al final del camino. Los fire spells son efectivos para esto.
Talk to the troll parents at the end of the Ice Path.=Habla con los padres troll al final del Ice Path.
Talk to the Troll Child north of Trollheim to get the ice diamond. Recall that the mysterious stranger can appear and attack you whilst you're holding the diamond.=Habla con el Troll Child al norte de Trollheim para conseguir el ice diamond. Recuerda que el mysterious stranger puede aparecer y atacarte mientras llevas el diamante.
Place all the diamonds in the obelisks around the pyramid south east of the Bandit Camp. Note a mysterious stranger can appear and attack you whilst you're holding the diamonds.=Coloca todos los diamantes en los obeliscos alrededor de la pirámide al sureste del Bandit Camp. Ten en cuenta que un mysterious stranger puede aparecer y atacarte mientras llevas los diamantes.
Bring any energy/stamina potions you have, some food, and enter the pyramid south east of the Bandit Camp.=Lleva las pociones de energía/stamina que tengas y algo de comida, y entra en la pirámide al sureste del Bandit Camp.
Go down to the bottom of the pyramid. You may randomly fall out of the pyramid as you traverse it and need to start again.=Baja hasta el fondo de la pirámide. Puede que caigas aleatoriamente de la pirámide mientras la recorres y tengas que empezar de nuevo.
Go down to the bottom of the pyramid.=Baja hasta el fondo de la pirámide.
Enter the central room of the bottom floor.=Entra en la sala central de la planta inferior.
Talk to Azzanadra to finish the quest!=¡Habla con Azzanadra para terminar la misión!
