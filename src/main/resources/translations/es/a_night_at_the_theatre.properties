# Spanish translations for A Night at the Theatre.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Requirements and tooltips
Combat gear=Equipo de combate
Food=Comida
Access to fairy rings=Acceso a los fairy rings
Morytania legs 2+ work as well.=Morytania legs 2+ también sirven.
You can obtain another one from the coffin in the crypt.=Puedes conseguir otra del ataúd de la cripta.
You can obtain another from the skeleton in the spider cave south of Port Phasmatys.=Puedes conseguir otra del esqueleto de la cueva de arañas al sur de Port Phasmatys.
You can get more from Daer Krand in the Sisterhood Sanctuary=Puedes conseguir más de Daer Krand en la Sisterhood Sanctuary
You can obtain more from the egg sac in the spider cave south of Port Phasmatys.=Puedes conseguir más del egg sac de la cueva de arañas al sur de Port Phasmatys.
You can chop some more from the hespori east of the Nature Grotto in the Mort Myre Swamp.=Puedes talar más del hespori al este del Nature Grotto en el Mort Myre Swamp.

# Steps
Not yet Implemented=Aún no implementado
Speak with the Mysterious Stranger in Ver Sinhaza.=Habla con el Mysterious Stranger en Ver Sinhaza.
Enter the crypts north east of the Mysterious Stranger.=Entra en las criptas al noreste del Mysterious Stranger.
Kill a vyrewatch for a key. You must have your flail equipped in order to damage the vyrewatches.=Mata a un vyrewatch para conseguir una llave. Debes llevar el flail equipado para poder dañar a los vyrewatches.
Pick up the crypt key=Coge la crypt key
Unlock the crypt gate with the key.=Abre la puerta de la cripta con la llave.
Search the coffin.=Registra el ataúd.
Return to the Mysterious Stranger with Ranis' head.=Vuelve con el Mysterious Stranger con la Ranis' head.
Speak to the Mysterious Stranger some more.=Habla un poco más con el Mysterious Stranger.
Enter the spider cave south of Port Phasmatys.=Entra en la cueva de arañas al sur de Port Phasmatys.
Search the skeleton found near the Egg Sac at the end of the cave.=Busca en el esqueleto que hay junto al Egg Sac al final de la cueva.
Read the Sticky note.=Lee la Sticky note.
Exit the spider cave via the way you came in.=Sal de la cueva de arañas por donde entraste.
Speak with Daer Krand found in the north east corner of the main room of the Sisterhood Sanctuary in Slepe.=Habla con Daer Krand, en la esquina noreste de la sala principal de la Sisterhood Sanctuary en Slepe.
Return to the spider cave south of Port Phasmatys then use the Sulphuric acid on the Egg sac at the end of the cave.=Vuelve a la cueva de arañas al sur de Port Phasmatys y usa la Sulphuric acid en el Egg sac al final de la cueva.
Return to the spider cave south of Port Phasmatys then use the Sulphuric acid on the Egg sac at the end of the cave. Use the Drakan's Medallion Slepe tele to exit the Sisterhood Sanctuary quickly.=Vuelve a la cueva de arañas al sur de Port Phasmatys y usa la Sulphuric acid en el Egg sac al final de la cueva. Usa el tele de Drakan's Medallion a Slepe para salir rápido de la Sisterhood Sanctuary.
Return to the spider cave south of Port Phasmatys then use the Sulphuric acid on the Egg sac at the end of the cave. You do not need to kill the spiders which appear.=Vuelve a la cueva de arañas al sur de Port Phasmatys y usa la Sulphuric acid en el Egg sac al final de la cueva. No necesitas matar a las arañas que aparecen.
Speak with the Mysterious Stranger in Ver Sinhaza again with the spider eggs retrieved from the Egg sac. Use the Drakan's Medallion tele to get to Ver Sinhaza quickly.=Habla con el Mysterious Stranger en Ver Sinhaza de nuevo con los huevos de araña sacados del Egg sac. Usa el tele de Drakan's Medallion para llegar rápido a Ver Sinhaza.
Watch cutscenes.=Mira las cinemáticas.
Speak with the Mysterious Stranger in Ver Sinhaza and watch the cutscenes.=Habla con el Mysterious Stranger en Ver Sinhaza y mira las cinemáticas.
Go to the Nature Grotto in the Mort Myre Swamp and speak with the Nature Spirit inside. Use fairy ring BIP (with 50 agility) to get there quickly.=Ve al Nature Grotto en el Mort Myre Swamp y habla con el Nature Spirit de su interior. Usa el fairy ring BIP (con 50 de agility) para llegar rápido.
Go to the island directly east of the Nature Grotto. Be prepared to fight Hespori. The fight is similar to what you would expect from the Hespori fight in the Farming Guild. Activate Hespori when ready.=Ve a la isla directamente al este del Nature Grotto. Prepárate para luchar contra Hespori. La lucha es similar a la de Hespori en el Farming Guild. Activa a Hespori cuando estés listo.
Fight Hespori.=Lucha contra Hespori.
Chop Hespori to obtain Hespori bark.=Tala a Hespori para conseguir Hespori bark.
Speak with the Mysterious Stranger in Ver Sinhaza again with the Hespori bark. Use the Drakan's Medallion tele to get to Ver Sinhaza quickly.=Habla con el Mysterious Stranger en Ver Sinhaza de nuevo con la Hespori bark. Usa el tele de Drakan's Medallion para llegar rápido a Ver Sinhaza.
Complete the Theatre of Blood.=Completa el Theatre of Blood.
Speak with the Mysterious Stranger in Ver Sinhaza and watch the cutscenes to finish the quest.=Habla con el Mysterious Stranger en Ver Sinhaza y mira las cinemáticas para terminar la misión.

