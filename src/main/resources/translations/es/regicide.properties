Charter Ship near the Tyras Camp for 50gp.=Charter Ship cerca de Tyras Camp por 50gp.
You can cook it on a fire which spawns in the clearing east of Port Tyras.=Puedes cocinarlo en un fuego que aparece en el claro al este de Port Tyras.
No amount specified. Bring as many doses as you feel comfortable bringing.=No se especifica cantidad. Lleva tantas dosis como te sientas cómodo llevando.
This is, most likely, not needed if you have 70+ Agility. Bring more if you have lower Agility.=Lo más probable es que no lo necesites si tienes 70+ Agility. Lleva más si tienes menos Agility.
You can get another from Lord Iorwerth=Puedes conseguir otro de Lord Iorwerth
You can get another from Lord Iorwerth. You can return to the elven lands through Arandar now=Puedes conseguir otro de Lord Iorwerth. Ahora puedes volver a las tierras élficas por Arandar
Go to the second floor of Ardougne Castle.=Ve al segundo piso de Ardougne Castle.
Talk to King Lathas.=Habla con King Lathas.
Enter the Underground Pass.=Entra en el Underground Pass.
Climb-over rockslide.=Trepa por el desprendimiento.
Talk to Koftik inside the cave.=Habla con Koftik dentro de la cueva.
Search the abandoned equipment for an oily cloth.=Busca en el equipo abandonado un oily cloth.
Use the oily cloth on an arrow.=Usa el oily cloth en una arrow.
Light the fire arrow.=Enciende la fire arrow.
Walk to the room north of Koftik.=Camina hasta la sala al norte de Koftik.
Wield a lit arrow and shoot the guide-rope.=Equipa una lit arrow y dispara a la guide-rope.
Pick up the plank in the north room.=Coge el plank de la sala norte.
Swing across the pit with a rope.=Cruza el pozo columpiándote con una rope.
Climb-over rockslide=Trepa por el desprendimiento
Cross the grid by trial and error. The correct path is the same as it was during Underground Pass.=Cruza la rejilla por prueba y error. El camino correcto es el mismo que en Underground Pass.
Pull the lever to raise the gate.=Tira de la palanca para subir la puerta.
Either disable or walk past the traps.=Desactiva las trampas o esquívalas.
Climb down the well.=Baja por el pozo.
Navigate the maze, or use the shortcut to the south with 50 Thieving.=Recorre el laberinto o usa el atajo del sur con 50 Thieving.
Pick the lock to enter the cell.=Forcejea la cerradura para entrar en la celda.
Dig the loose mud.=Cava en el barro suelto.
Cross the ledge.=Cruza la cornisa.
Enter the pipe to the next section.=Entra en el tubo a la siguiente sección.
Enter the tunnel.=Entra en el túnel.
Open the door at the end of the path.=Abre la puerta al final del camino.
Return up to Iban's Cavern.=Vuelve arriba a Iban's Cavern.
Enter the central area from the north east corner of the area.=Entra en la zona central desde la esquina noreste de la zona.
Enter the well.=Entra en el pozo.
Leave the cave.=Sal de la cueva.
Talk to Idris.=Habla con Idris.
Follow the path along and hop over the leaves.=Sigue el camino y salta por encima de las hojas.
Head west, and cross the sticks there. To do so without failing, stand next to them and spam-click it until you cross it.=Ve al oeste y cruza los palos de allí. Para hacerlo sin fallar, colócate junto a ellos y haz clic repetidamente hasta cruzarlos.
Go north, and jump over the leaves.=Ve al norte y salta por encima de las hojas.
Cross the log to the north to the Iorwerth Camp.=Cruza el tronco hacia el norte hasta el Iorwerth Camp.
Cross the log from the camp.=Cruza el tronco desde el campamento.
Go south, and jump over the leaves.=Ve al sur y salta por encima de las hojas.
Kill the guard.=Mata al guardia.
Cross the tripwire to the north. It may poison you if you fail it.=Cruza el cable trampa hacia el norte. Puede envenenarte si fallas.
Go through the dense forest north then to the west, and fight the guard there.=Atraviesa el bosque denso hacia el norte y luego hacia el oeste, y lucha contra el guardia de allí.
Enter the Tyras Camp.=Entra en el Tyras Camp.
Take 2 barrels from the Tyras Camp.=Coge 2 barrels del Tyras Camp.
Return back out the camp, to the east, then south to the traps and cross them.=Vuelve a salir del campamento, hacia el este, y luego al sur hasta las trampas y crúzalas.
Fill the barrels from the waste to the south.=Llena los barrels con los residuos del sur.
Pick up some sulphur.=Coge un poco de sulphur.
Read the big book of bangs.=Lee el big book of bangs.
Use some limestone on a furnace whilst wearing gloves.=Usa limestone en un horno llevando guantes puestos.
Use a pestle and mortar on the quicklime with a pot in your inventory.=Usa un pestle and mortar en la quicklime con un pot en el inventario.
Use a pestle and mortar on some sulphur.=Usa un pestle and mortar en un poco de sulphur.
Talk to the Chemist in Rimmington.=Habla con el Chemist en Rimmington.
Use a barrel of coal on the still outside the Chemist's house.=Usa un barrel of coal en el alambique fuera de la casa del Chemist.
Operate the still. To properly distill the barrel:=Acciona el alambique. Para destilar correctamente el barrel:
1. Turn the tar regulator valve all the way to the right.=1. Gira la válvula reguladora del tar completamente a la derecha.
2. Wait until the pressure is in the green, then turn the pressure valve to the middle.=2. Espera a que la presión esté en verde y luego gira la válvula de presión al centro.
3. Add 2 coal, and then 1 additional coal whenever the heat gauge falls below the green zone until the tar is distilled.=3. Añade 2 coal y luego 1 coal adicional cada vez que el indicador de calor caiga por debajo de la zona verde hasta que el tar se haya destilado.
Make another barrel of naphtha for Mourning's End if you'd like, then add the quicklime to the naphtha.=Si quieres, prepara otro barrel of naphtha para Mourning's End y luego añade la quicklime al naphtha.
Add the ground sulphur to the naphtha mix.=Añade el ground sulphur a la naphtha mix.
Use the cloth on the barrel bomb.=Usa la cloth en el barrel bomb.
Use the barrel bomb on the catapult.=Usa el barrel bomb en la catapulta.
Go to the east, then south to the traps and cross them.=Ve al este y luego al sur hasta las trampas y crúzalas.
Talk to Arianwyn outside Ardougne Castle.=Habla con Arianwyn a las afueras de Ardougne Castle.
Traverse the Underground Pass.=Recorre el Underground Pass.
WAIT OUTSIDE AROUND the cave entrance for Idris to appear and talk to her (If Idris does not appear in the couple minutes enter and exit the cave). Afterwards, Go talk to Lord Iorwerth in the north west of the elven forest.=ESPERA FUERA, ALREDEDOR de la entrada de la cueva, a que aparezca Idris y habla con ella (si Idris no aparece en un par de minutos, entra y sal de la cueva). Después, ve a hablar con Lord Iorwerth en el noroeste del bosque élfico.
Return to Lord Iorwerth in the north west of the elven forest.=Vuelve con Lord Iorwerth en el noroeste del bosque élfico.
Go talk to the Elven Tracker in the south of the forest.=Ve a hablar con el Elven Tracker en el sur del bosque.
Return to the Elven Tracker in the south of the forest.=Vuelve con el Elven Tracker en el sur del bosque.
Click the tracks near the Tracker.=Haz clic en las huellas cerca del Tracker.
Talk to the Elven Tracker again.=Habla con el Elven Tracker de nuevo.
Climb through the dense forest near the Tracker, and defeat the guard you find. This requires 56 Agility.=Atraviesa el bosque denso cerca del Tracker y derrota al guardia que encuentres. Requiere 56 Agility.
Fill some barrels with tar, pick up some sulphur there, and then return to Lord Iorwerth.=Llena unos barrels con tar, coge sulphur de allí y luego vuelve con Lord Iorwerth.
Ask Iorwerth about quicklime.=Pregúntale a Iorwerth por la quicklime.
Ask Iorwerth about naphtha.=Pregúntale a Iorwerth por el naphtha.
Ask Iorwerth about sulphur.=Pregúntale a Iorwerth por el sulphur.
Ask Iorwerth about a barrel.=Pregúntale a Iorwerth por un barrel.
Ask Iorwerth about a fuse.=Pregúntale a Iorwerth por una fuse.
Ask Iorwerth about all the parts needed for the barrel bomb.=Pregúntale a Iorwerth por todas las piezas necesarias para el barrel bomb.
Traverse the Underground Pass again.=Recorre el Underground Pass de nuevo.
Go give a cooked rabbit to the guard north of the Tyras Camp.=Ve a darle un cooked rabbit al guardia al norte del Tyras Camp.
Use the barrel bomb on the catapult north of the Tyras Camp.=Usa el barrel bomb en la catapulta al norte del Tyras Camp.
Report back to Lord Iorwerth.=Vuelve a informar a Lord Iorwerth.
Report back to King Lathas to finish the quest.=Vuelve a informar a King Lathas para terminar la misión.
