# Spanish translations for Regicide.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Bring extras as you can fail=Lleva de más, ya que puedes fallar
You can grab a bucket from the southwest corner of the large dwarf encampment building.=Puedes coger un bucket de la esquina suroeste del gran edificio del campamento enano.
You can get another by searching the equipment by the fireplace beside Koftik.=Puedes conseguir otro registrando el equipo junto a la chimenea al lado de Koftik.
You can mine some in the mine north of the Digsite=Puedes minar algo en la mina al norte del Digsite
Made on a loom with 4 balls of wool.=Se hace en un telar con 4 balls of wool.
There is a loom available at the Falador Farm=Hay un telar disponible en Falador Farm
'Go to wiki..' to see valid options for handling Quicklime=Usa 'Go to wiki..' para ver las opciones válidas para manejar Quicklime
