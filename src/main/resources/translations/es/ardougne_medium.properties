# Spanish translations for Ardougne Medium Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.

# Steps
Enter the unicorn pen in Ardougne Zoo using Fairy rings (BIS).=Entra en el recinto de los unicornios del Ardougne Zoo usando los Fairy rings (BIS).
Visit the island east of the Necromancer Tower (AIR).=Visita la isla al este del Necromancer Tower (AIR).
Grapple up Yanille's south wall.=Sube por el muro sur de Yanille usando el grapple.
Jump off the opposite side!=¡Salta por el lado opuesto!
Fill a bucket with sand using Bert's sand pit.=Llena un bucket de arena usando el arenero de Bert.
Claim buckets of sand from Bert in Yanille.=Reclama buckets of sand de Bert en Yanille.
Use a nearby Hot Air Ballon to travel to Castle Wars.=Usa un Hot Air Ballon cercano para viajar a Castle Wars.
Speak with a monk to travel to Entrana.=Habla con un monje para viajar a Entrana.
Speak with Augustine and travel to Castle Wars.=Habla con Augustine y viaja a Castle Wars.
Cast Teleport to Ardougne spell.=Lanza el hechizo Teleport to Ardougne.
Enter the basement of the Tower of Life.=Entra en el sótano del Tower of Life.
Activate the Symbol of Life and kill the Swordchick.=Activa el Symbol of Life y mata al Swordchick.
Enter the Cave.=Entra en la cueva.
Pickup the Cave nightshade.=Recoge la Cave nightshade.
Talk to Jeb or Holgart to travel to the Fishing Platform.=Habla con Jeb o Holgart para viajar a la Fishing Platform.
Catch any fish on the Fishing Platform.=Pesca cualquier pez en la Fishing Platform.
Pickpocket the master farmer north of East Ardougne.=Roba al master farmer al norte de East Ardougne.
Talk to the Dark mage in West Ardougne to upgrade your staff.=Habla con el Dark mage en West Ardougne para mejorar tu bastón.
Equip Iban's staff (u).=Equipa la Iban's staff (u).
Plant and harvest the strawberries from the north Ardougne allotment. If you're waiting for it to grow and want to complete further tasks, use the tick box on panel.=Planta y cosecha las strawberries del allotment del norte de Ardougne. Si estás esperando a que crezcan y quieres completar otras tareas, usa la casilla del panel.
Talk to Two-pints in the Flying Horse Inn at East Ardougne to claim your reward!=¡Habla con Two-pints en el Flying Horse Inn de East Ardougne para reclamar tu recompensa!

