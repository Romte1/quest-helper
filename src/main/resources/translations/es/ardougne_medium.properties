# Rewards
Three daily teleports to Ardougne farm patch with the Ardougne cloak 2=Tres teletransportes diarios al huerto de Ardougne con el Ardougne cloak 2
100 free noted pure essence every day from Wizard Cromperty=100 pure essence anotadas gratis cada día de Wizard Cromperty
Unicow, Newtroost, and Spidine drops will be noted at the Tower of Life=Los drops de Unicow, Newtroost y Spidine se anotarán en el Tower of Life
10% increased chance to pickpocket in Ardougne (even if the cloak is not equipped or in inventory)=10% más de probabilidad de robar en Ardougne (aunque el cloak no esté equipado ni en el inventario)
Ability to toggle the Ring of life teleport to Ardougne=Puedes alternar el teletransporte del Ring of life a Ardougne
Receive additional runes when crafting essence at the Ourania Altar=Recibe runas adicionales al fabricar essence en el Ourania Altar

