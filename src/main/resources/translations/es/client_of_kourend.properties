# Spanish translations for Client of Kourend.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Can be purchased from Gerrant's Fishy Business in Port Sarim.=Se puede comprar en Gerrant's Fishy Business en Port Sarim.
For travel with the Lovakengj Minecart Network.=Para viajar con la Lovakengj Minecart Network.
Talk to Veos on the Port Piscarilius docks. You can travel to him by talking to Veos in Port Sarim.=Habla con Veos en los muelles de Port Piscarilius. Puedes viajar hasta él hablando con Veos en Port Sarim.
Use a feather on the Enchanted Scroll.=Usa una feather en el Enchanted Scroll.
Talk to Leenz in Port Piscarilius general store.=Habla con Leenz en la tienda general de Port Piscarilius.
Talk to Horace in the Hosidius general store. You can take the Lovakengj Minecart Network to Hosidius South.=Habla con Horace en la tienda general de Hosidius. Puedes usar la Lovakengj Minecart Network para ir a Hosidius South.
Talk to Jennifer in Shayzien general store. You can run west towards the bank and use the Lovakengj Minecart Network to Shayzien East.=Habla con Jennifer en la tienda general de Shayzien. Puedes correr al oeste hacia el banco y usar la Lovakengj Minecart Network para ir a Shayzien East.
Talk to Munty in Lovakengj general store. You can run south towards Kingstown and use the Lovakengj Minecart Network to Lovakengj.=Habla con Munty en la tienda general de Lovakengj. Puedes correr al sur hacia Kingstown y usar la Lovakengj Minecart Network para ir a Lovakengj.
Talk to Regath in Arceuus general store.=Habla con Regath en la tienda general de Arceuus.
Return to Veos on Piscarilius docks.=Vuelve con Veos en los muelles de Piscarilius.
Activate the mysterious orb at the Dark Altar. You can either run there through Arceuus, teleport to Wintertodt with the Games Necklace and run south, teleport straight there on the Arceuus spellbook, or use the Lovakengj Minecart Network to travel to Arceuus.=Activa el mysterious orb en el Dark Altar. Puedes correr hasta allí a través de Arceuus, teletransportarte a Wintertodt con el Games Necklace y correr al sur, teletransportarte directamente allí con el Arceuus spellbook, o usar la Lovakengj Minecart Network para viajar a Arceuus.
Return to Veos on Piscarilius docks. You can take the Lovakengj Minecart Network from Arceuus to Port Piscarilius and run south-east.=Vuelve con Veos en los muelles de Piscarilius. Puedes usar la Lovakengj Minecart Network desde Arceuus hasta Port Piscarilius y correr al sureste.
Ability to use the Kourend Castle Teleport spell=Habilidad de usar el hechizo Kourend Castle Teleport
Starting off=Empezando
Learn about Kourend=Aprende sobre Kourend
The Dark Altar=El Dark Altar
