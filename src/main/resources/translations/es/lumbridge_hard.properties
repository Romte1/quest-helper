# Spanish translations for Lumbridge & Draynor Hard Diary.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Pray at the altar at the Emir's Arena with smite active.=Reza en el altar de Emir's Arena con Smite activo.
Enter the Al Kharid palace.=Entra en el palacio de Al Kharid.
Cast bones to peaches.=Lanza bones to peaches.
Unlock bones to peaches from the Mage Training Arena.=Desbloquea bones to peaches en la Mage Training Arena.
Use the canoe station in lumbridge to make a Waka and travel to Edgeville.=Usa la estación de canoas de Lumbridge para hacer un Waka y viaja a Edgeville.
Smelt a Diamond Amulet (u), at the furnace in Lumbridge.=Funde un Diamond Amulet (u) en la fragua de Lumbridge.
String the diamond amulet.=Encuerda el diamond amulet.
Enchant the strung diamond amulet.=Encanta el diamond amulet encordado.
Move to the Lumbridge furnace.=Ve a la fragua de Lumbridge.
Climb down the trapdoor in the Lumbridge Castle.=Baja por la trampilla de Lumbridge Castle.
Light your mining helmet.=Enciende tu mining helmet.
Purchase the barrows gloves from the bank chest. Right click and select 'Buy-items'.=Compra los barrows gloves en el bank chest. Haz clic derecho y selecciona 'Buy-items'.
Talk to Juna to start collecting tears. You MUST collect 100 or more and only have one try a week.=Habla con Juna para empezar a recoger lágrimas. DEBES recoger 100 o más y solo tienes un intento por semana.
Go through the doors to Dorgesh-Kaan.=Cruza las puertas a Dorgesh-Kaan.
Climb the stairs to the second level of Dorgesh-Kaan.=Sube las escaleras al segundo nivel de Dorgesh-Kaan.
Enter the Dorgesh-Kaan train station.=Entra en la estación de tren de Dorgesh-Kaan.
Board the train and wait for it to leave.=Sube al tren y espera a que se ponga en marcha.
Squeeze-through the jutting wall.=Pasa por el hueco de la pared sobresaliente.
Enter the cosmic altar.=Entra en el cosmic altar.
Craft 56 cosmic runes.=Fabrica 56 cosmic runes.
Go to Zanaris through the shed in Lumbridge swamp or any fairy ring in the world if you've partially completed Fairytale II.=Ve a Zanaris por el cobertizo del pantano de Lumbridge o por cualquier fairy ring del mundo si has completado parcialmente Fairytale II.
Grow and pick some belladonna from the Draynor Manor farming patch. If you're waiting for it to grow and want to complete further tasks, use the tick box on panel.=Cultiva y recoge belladonna en la parcela de Draynor Manor. Si estás esperando a que crezca y quieres completar otras tareas, usa la casilla del panel.
Talk to Hatius Cosaintus in Lumbridge to claim your reward!=Habla con Hatius Cosaintus en Lumbridge para reclamar tu recompensa.
Cosmic Talisman/Tiara, Catalytic Talisman/Tiara, RC-skill cape or via Abyss=Cosmic Talisman/Tiara, Catalytic Talisman/Tiara, capa de Runecraft o por el Abyss
