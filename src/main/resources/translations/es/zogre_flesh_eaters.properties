# Spanish translations for Zogre Flesh Eaters.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
To help prevent disease and restore stats.=Para ayudar a prevenir la enfermedad y restaurar las estadísticas.
You can get another from Zavistic Rarve=Puedes conseguir otra de Zavistic Rarve
You can get another by searching the stand where you fought Slash Bash=Puedes conseguir otro buscando en el estante donde luchaste contra Slash Bash
Talk to Grish south of Castle Wars.=Habla con Grish al sur de Castle Wars.
Talk to the guard east of Grish.=Habla con el guardia al este de Grish.
Climb over the barricade east of Grish.=Trepa por encima de la barricada al este de Grish.
Climb down the stairs to the east.=Baja las escaleras al este.
Search the skeleton in the north west corner of this area.=Busca en el esqueleto de la esquina noroeste de esta zona.
Kill the zombie which appeared, and pick up the ruined backpack that appeared.=Mata al zombie que ha aparecido y coge el ruined backpack que aparezca.
Open the backpack for a knife and a dragon inn tankard.=Abre el backpack para conseguir un knife y un dragon inn tankard.
Search the broken lecturn in the north west corner of the tombs.=Busca en el atril roto de la esquina noroeste de las tumbas.
Search the ogre coffin next to the skeleton.=Busca en el ataúd de ogro junto al esqueleto.
Use a knife on the ogre coffin next to the skeleton.=Usa un knife en el ataúd de ogro junto al esqueleto.
Search the coffin next to the skeleton again. It may take a few attempts to open.=Busca de nuevo en el ataúd junto al esqueleto. Puede que necesites varios intentos para abrirlo.
Search the coffin for a black prism.=Busca en el ataúd para conseguir un black prism.
Talk to Zavistic Rarve at the Yanille Wizards' Guild. If you don't have 66 Magic, ring the bell outside the guild.=Habla con Zavistic Rarve en el Yanille Wizards' Guild. Si no tienes 66 de Magic, toca la campana de fuera del guild.
Go upstairs and talk to Sithik in the house north of the Wizards' Guild.=Sube las escaleras y habla con Sithik en la casa al norte del Wizards' Guild.
Talk to Sithik Ints in the bed to the west.=Habla con Sithik Ints en la cama al oeste.
Search Sithik's wardrobe.=Busca en el armario de Sithik.
Search Sithik's cupboard.=Busca en la alacena de Sithik.
Search Sithik's drawers for more papyrus.=Busca en los cajones de Sithik para conseguir más papyrus.
The portrait drawn is wrong. Drop it and try drawing him again.=El retrato dibujado es incorrecto. Suéltalo e intenta dibujarlo de nuevo.
Use the papyrus on Sithik Ints.=Usa el papyrus en Sithik Ints.
Travel to the Dragon Inn in Yanille and use the dragon inn tankard on the bartender.=Ve al Dragon Inn de Yanille y usa el dragon inn tankard en el cantinero.
Use the portrait on the bartender.=Usa el portrait en el cantinero.
Bring the books and signed portrait to Zavistic Rarve at the Yanille Wizards' Guild. If you don't have 66 Magic, ring the bell outside the guild.=Lleva los books y el signed portrait a Zavistic Rarve en el Yanille Wizards' Guild. Si no tienes 66 de Magic, toca la campana de fuera del guild.
Use the strange potion on the cup of tea next to Sithik.=Usa la strange potion en el cup of tea que está junto a Sithik.
Leave Sithik Int's house.=Sal de la casa de Sithik Int.
Go upstairs to Sithik again.=Sube las escaleras para ver a Sithik de nuevo.
Talk to the transformed Sithik Ints for answers.=Habla con Sithik Ints transformado para obtener respuestas.
Talk to Grish south of Castle Wars. Be prepared to fight Slash Bash. You'll need to use either brutal arrows or the Crumble Undead spell.=Habla con Grish al sur de Castle Wars. Prepárate para luchar contra Slash Bash. Necesitarás usar brutal arrows o el hechizo Crumble Undead.
Talk to Grish south of Castle Wars again to learn how to make composite ogre bows.=Habla con Grish al sur de Castle Wars de nuevo para aprender a fabricar composite ogre bows.
Climb over the barricade east of Grish, prepared to fight Slash Bash.=Trepa por encima de la barricada al este de Grish, preparado para luchar contra Slash Bash.
Go down the stairs to the boss.=Baja las escaleras hasta el jefe.
Enter the doors at the west side of the area.=Entra por las puertas del lado oeste de la zona.
Search the stand in the north east corner, and kill Slash Bash when he spawns.=Busca en el estante de la esquina noreste y mata a Slash Bash cuando aparezca.
Pick up the ogre artefact.=Coge el ogre artefact.
Return to Grish with the ogre artefact.=Vuelve con Grish con el ogre artefact.
Slash Bash (level 111)=Slash Bash (nivel 111)
Zombie (level 39)=Zombie (nivel 39)
Ability to make Relicym's balm=Habilidad de fabricar Relicym's balm
Ability to fletch Comp Ogre Bows and Brutal Arrows=Habilidad de fabricar Comp Ogre Bows y Brutal Arrows
Ability to wear Inoculation Bracelets=Habilidad de llevar Inoculation Bracelets
Starting off=Empezando
Investigating=Investigando
Discover the truth=Descubre la verdad
Help the ogres=Ayuda a los ogros
