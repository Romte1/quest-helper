# Spanish translations for Legends' Quest.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to one of the guards outside the Legends' Guild.=Habla con uno de los guardias de fuera del Legends' Guild.
Talk to Radimus Erkle inside the Legends' Guild's grounds.=Habla con Radimus Erkle dentro del recinto del Legends' Guild.
Travel to the Kharazi Jungle in south Karamja. You'll need to cut through some trees and bushes to enter. Bring everything from the section's item requirements.=Viaja a la Kharazi Jungle en el sur de Karamja. Tendrás que abrirte paso entre árboles y arbustos para entrar. Lleva todo lo que indica la sección de objetos requeridos.
Stand in the west of the Kharazi Jungle and right-click complete the Radimus note.=Colócate en el oeste de la Kharazi Jungle y haz clic derecho para completar la Radimus note.
Stand in the middle of the Kharazi Jungle and right-click complete the Radimus note.=Colócate en el centro de la Kharazi Jungle y haz clic derecho para completar la Radimus note.
Stand in the east of the Kharazi Jungle and right-click complete the Radimus note.=Colócate en el este de la Kharazi Jungle y haz clic derecho para completar la Radimus note.
Use the Radimus notes on a Jungle Forester outside the Kharazi Jungle. Whilst in the jungle, consider grabbing a Vanilla Pod from a Vanilla plant in the south west of the Kharazi.=Usa las Radimus notes en un Jungle Forester fuera de la Kharazi Jungle. Ya en la jungla, considera coger una Vanilla Pod de una planta de vanilla en el suroeste de la Kharazi.
Re-enter the Kharazi Jungle. You'll need to cut through some trees and bushes to enter.=Vuelve a entrar en la Kharazi Jungle. Tendrás que abrirte paso entre árboles y arbustos.
Swing the bullroarer until Gujuo appears.=Agita el bullroarer hasta que aparezca Gujuo.
Talk to Gujuo.=Habla con Gujuo.
Search and then enter the Mossy Rocks in the north west of the Kharazi.=Busca en las Mossy Rocks del noroeste de la Kharazi y entra en ellas.
Right-click investigate the fire wall.=Haz clic derecho para investigar el muro de fuego.
Leave the cave back to the surface.=Sal de la cueva y vuelve a la superficie.
Swing the Bullroarer until Gujuo appears.=Agita el Bullroarer hasta que aparezca Gujuo.
Talk to Gujuo about pure water and the vessel needed for it.=Habla con Gujuo sobre el agua pura y el recipiente que necesitas.
Search the bookcase and slide past it.=Busca en la estantería y deslízate a través de ella.
Right-click search the gate.=Haz clic derecho para buscar en la puerta.
Smash through the boulders and enter the gate at the end of the corridor.=Rompe los pedruscos y entra por la puerta al final del pasillo.
Follow the cave around until you reach a marked wall. Right-click search it. Kill a Deathwing for the Karamja Achievement Diary whilst you're here.=Sigue la cueva hasta llegar a un muro marcado. Búscalo con clic derecho. De paso, mata un Deathwing para el Karamja Achievement Diary.
Use a Soul Rune on the marked wall.=Usa una Soul Rune en el muro marcado.
Use a Mind Rune on the marked wall.=Usa una Mind Rune en el muro marcado.
Use a Earth Rune on the marked wall.=Usa una Earth Rune en el muro marcado.
Use a Law Rune on the marked wall.=Usa una Law Rune en el muro marcado.
Use another Law Rune on the marked wall.=Usa otra Law Rune en el muro marcado.
Use a sapphire on the south-east carved rock. If you have already, search it instead.=Usa un sapphire en la roca tallada del sureste. Si ya lo has hecho, búscala en su lugar.
Use a emerald on the west carved rock. If you have already, search it instead.=Usa un emerald en la roca tallada del oeste. Si ya lo has hecho, búscala en su lugar.
Use a ruby on the south-west carved rock. If you have already, search it instead.=Usa un ruby en la roca tallada del suroeste. Si ya lo has hecho, búscala en su lugar.
Use a diamond on the south carved rock. If you have already, search it instead.=Usa un diamond en la roca tallada del sur. Si ya lo has hecho, búscala en su lugar.
Use an opal on the far west carved rock. If you have already, search it instead.=Usa un opal en la roca tallada del extremo oeste. Si ya lo has hecho, búscala en su lugar.
Use a jade on the north-east carved rock. If you have already, search it instead.=Usa un jade en la roca tallada del noreste. Si ya lo has hecho, búscala en su lugar.
Use a topaz on the east carved rock. If you have already, search it instead.=Usa un topaz en la roca tallada del este. Si ya lo has hecho, búscala en su lugar.
Wait for the binding book to appear.=Espera a que aparezca el binding book.
Pick up the binding book=Recoge el binding book
Travel to an anvil and make a gold bowl.=Ve a un yunque y haz un gold bowl.
Return to the Kharazi Jungle with your gold bowl, and be prepared for a fight.=Vuelve a la Kharazi Jungle con tu gold bowl y prepárate para luchar.
Talk to Gujuo to bless the gold bowl.=Habla con Gujuo para bendecir el gold bowl.
Use a machete on the tall reeds next the Kharazi's water pool.=Usa un machete en los juncos altos junto a la charca de la Kharazi.
Use the reed on the water pool.=Usa el reed en la charca.
Use the golden bowl on the wall of fire.=Usa el golden bowl en el muro de fuego.
Use the binding book on Ungadulu.=Usa el binding book en Ungadulu.
Fight Nezikchened.=Lucha contra Nezikchened.
Touch the wall of fire to pass it.=Toca el muro de fuego para cruzarlo.
Right-click talk to Ungadulu.=Habla con Ungadulu con clic derecho.
Use the blessed bowl of water on the yommi seeds.=Usa el cuenco de agua bendecida en las yommi seeds.
Plant the seeds in fertile soil.=Planta las semillas en tierra fértil.
Talk to Gujuo about what's happened to the water pool.=Habla con Gujuo sobre lo que le ha pasado a la charca.
Return to the Kharazi Jungle with your Bullroarer, and be prepared for some fights.=Vuelve a la Kharazi Jungle con tu Bullroarer y prepárate para varios combates.
Return to the Kharazi Jungle and be prepared for some fights.=Vuelve a la Kharazi Jungle y prepárate para varios combates.
Add ardrigal and snake weed to a vial of water to make a bravery potion.=Añade ardrigal y snake weed a un vial of water para hacer una bravery potion.
Add snake weed to the ardigal mixture.=Añade snake weed a la mezcla de ardrigal.
Add ardrigal to the snakeweed mixture.=Añade ardrigal a la mezcla de snakeweed.
Follow the cave around until you reach a marked wall. Use it.=Sigue la cueva hasta llegar a un muro marcado. Úsalo.
Use a rope on the winch. If you've already done so, search it instead.=Usa una rope en el torno. Si ya lo has hecho, búscalo en su lugar.
Drink the bravery potion, then climb down the winch.=Bebe la bravery potion y luego baja por el torno.
Climb down the winch.=Baja por el torno.
Follow the path down, and kill each of the 3 skeletons (Irvig, San, and Ranalph) for crystal pieces. Use them on the furnace in the north east of the area.=Sigue el camino hacia abajo y mata a los 3 esqueletos (Irvig, San y Ranalph) para conseguir trozos de cristal. Úsalos en el horno del noreste de la zona.
Use the crystal heart on the mossy rock in the centre of the area.=Usa el crystal heart en la roca cubierta de musgo del centro de la zona.
Use the heart on the recess next to the barrier to the south.=Usa el heart en el hueco junto a la barrera del sur.
Enter the south room and attempt to push one of the boulders to the west.=Entra en la sala sur e intenta empujar uno de los pedruscos hacia el oeste.
Talk to Echned Zekin.=Habla con Echned Zekin.
If you wish to keep Viyeldi alive, teleport out now, and you'll be guided to get the holy force. Otherwise, attempt to pick up the wizard hat near the rope down and kill Viyeldi with the dark dagger. If he doesn't appear, you'll need to talk to Ungadulu for a holy force spell.=Si quieres mantener vivo a Viyeldi, teletranspórtate ahora y se te guiará para conseguir el holy force. Si no, intenta recoger el wizard hat junto a la cuerda e mata a Viyeldi con la dark dagger. Si no aparece, tendrás que hablar con Ungadulu para conseguir el hechizo holy force.
Use the dark dagger on Ungadulu for the holy force.=Usa la dark dagger en Ungadulu para conseguir el holy force.
Cast a charge orb spell on the ancient gate.=Lanza un hechizo de carga de orbe en la puerta antigua.
Return to Echned in the south room with the holy force. Be prepared for a fight with Nezikchened again.=Vuelve con Echned en la sala sur con el holy force. Prepárate para luchar otra vez contra Nezikchened.
Kill Viyeldi.=Mata a Viyeldi.
Return to Echned in the south room with the dagger. Be prepared for a fight with Nezikchened again.=Vuelve con Echned en la sala sur con la daga. Prepárate para luchar otra vez contra Nezikchened.
Use the glowing dagger on Echned Zekin.=Usa la glowing dagger en Echned Zekin.
Cast holy force.=Lanza holy force.
Defeat Nezikchened.=Derrota a Nezikchened.
Push one of the boulders in the south room.=Empuja uno de los pedruscos de la sala sur.
Use the blessed bowl on the sacred water.=Usa el cuenco bendecido en el agua sagrada.
Return to the surface. Teleporting out will evaporate the water but the pool above ground is restored and can be used.=Vuelve a la superficie. Teletransportarte fuera evaporará el agua, pero la charca de la superficie queda restaurada y se puede usar.
Use the golden bowl on the sapling.=Usa el golden bowl en el árbol joven.
Use your axe on the adult yommi tree.=Usa tu hacha en el yommi tree adulto.
Use your axe on the felled yommi tree.=Usa tu hacha en el yommi tree talado.
Use your axe once more on the tree.=Usa tu hacha una vez más en el árbol.
Pick up the totem pole.=Recoge el totem pole.
Put Protect from Melee on, and use the new totem on one of the corrupted totems. If you investigated the totem accidentally, wait for a few seconds before trying again.=Activa Protect from Melee y usa el nuevo totem en uno de los totems corruptos. Si investigaste el totem por accidente, espera unos segundos antes de intentarlo de nuevo.
Kill Ranalph.=Mata a Ranalph.
Kill Irvig.=Mata a Irvig.
Kill San.=Mata a San.
Use the new totem on one of the corrupted totems.=Usa el nuevo totem en uno de los totems corruptos.
Talk to Gujuo for a gilded totem.=Habla con Gujuo para conseguir un gilded totem.
