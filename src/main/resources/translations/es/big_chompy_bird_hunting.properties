# Spanish translations for Big Chompy Bird Hunting.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can kill wolves (level 64) around Feldip for bones=Puedes matar wolves (nivel 64) alrededor de Feldip para conseguir bones
You can get more from the chest in Rantz's cave=Puedes conseguir más del cofre en la cueva de Rantz
Talk to Rantz in the east of Feldip Hills.=Habla con Rantz en el este de Feldip Hills.
Get some achey tree logs near Rantz.=Consigue algunos achey tree logs cerca de Rantz.
Use your knife on the achey logs to make arrow shafts.=Usa tu knife en los achey logs para hacer arrow shafts.
Use the feathers on the arrow shafts.=Usa las feathers en los arrow shafts.
Use a chisel on some wolf bones.=Usa un chisel en unos wolf bones.
Add the bone arrow tips to the flighted ogre arrows.=Añade las bone arrow tips a las flighted ogre arrows.
Use at least 6 ogre arrows on Rantz.=Usa al menos 6 ogre arrows en Rantz.
Ask Rantz all the available questions.=Pregunta a Rantz todas las preguntas disponibles.
Enter Rantz's cave.=Entra en la cueva de Rantz.
Open the chest in the cave for some ogre bellows.=Abre el cofre de la cueva para conseguir unas ogre bellows.
Leave the cave.=Sal de la cueva.
Fill the bellows on swamp bubbles.=Llena las bellows en las swamp bubbles.
Inflate 3 toads near the swamp.=Infla 3 toads cerca del pantano.
Bring the toads to Rantz.=Lleva las toads a Rantz.
Drop the bloated toad in the clearing south of Rantz.=Suelta la bloated toad en el claro al sur de Rantz.
Wait for a chompy to spawn. If the frog despawns, you'll need to place another one in the clearing south of Rantz.=Espera a que aparezca un chompy. Si la rana desaparece, tendrás que colocar otra en el claro al sur de Rantz.
Talk to Rantz again for an ogre bow.=Habla con Rantz de nuevo para conseguir un ogre bow.
Drop another bloated toad in the clearing south of Rantz, and wait for a chompy to come.=Suelta otra bloated toad en el claro al sur de Rantz y espera a que venga un chompy.
Kill the chompy. You can only hurt it with an ogre bow + ogre arrows.=Mata al chompy. Solo puedes dañarlo con un ogre bow + ogre arrows.
Pluck the chompy.=Despluma al chompy.
Talk to Fycie.=Habla con Fycie.
Talk to Bugs.=Habla con Bugs.
Pick a potato south east of Rantz.=Coge una potato al sureste de Rantz.
Pick an onion from west of Rantz.=Coge una onion al oeste de Rantz.
Get a tomato from west of Rantz.=Consigue un tomato al oeste de Rantz.
Get some equa leaves from south east of Rantz.=Consigue unas equa leaves al sureste de Rantz.
Get some doogle leaves from west of Rantz.=Consigue unas doogle leaves al oeste de Rantz.
Get some cabbage from west of Rantz.=Consigue una cabbage al oeste de Rantz.
Collect the ingredients Rantz and his children want for the chompy.=Reúne los ingredientes que Rantz y sus hijos quieren para el chompy.
Cook the chompy on Rantz's spit-roast.=Cocina el chompy en el spit-roast de Rantz.
Bring Rantz the seasoned chompy to finish the quest.=Lleva a Rantz el seasoned chompy para terminar la misión.
The ability to fletch Ogre Arrows.=La capacidad de fabricar Ogre Arrows.
The ability to hunt and cook Chompy Birds.=La capacidad de cazar y cocinar Chompy Birds.
Getting Rantz Arrows=Consiguiendo las flechas de Rantz
Making Bloated Toads=Haciendo Bloated Toads
Hunting Chompy=Cazando Chompy
Cooking Chompy=Cocinando Chompy
Ogre arrow shafts (make more for later)=Ogre arrow shafts (haz más para después)
Any axe=Cualquier axe
