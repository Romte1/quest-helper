# Spanish translations for Watchtower.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Go to the top floor of the Watchtower north of Yanille and talk to the Watchtower Wizard.=Ve al piso superior de la Watchtower al norte de Yanille y habla con el Watchtower Wizard.
Search the bushes north of the Watchtower.=Busca en los arbustos al norte de la Watchtower.
Return to the Watchtower Wizard with the fingernails.=Vuelve con el Watchtower Wizard con las fingernails.
Please open the Watchtower quest journal to sync your state.=Abre el diario de la misión Watchtower para sincronizar tu estado.
Talk to Og north west of Yanille.=Habla con Og al noroeste de Yanille.
Use your rope on a branch to swing to the island west of Yanille.=Usa tu rope en una rama para saltar a la isla al oeste de Yanille.
Talk to Grew on the island west of Yanille.=Habla con Grew en la isla al oeste de Yanille.
Leave Grew's island.=Sal de la isla de Grew.
Enter the hole south of Gu'Tanoth.=Entra en el agujero al sur de Gu'Tanoth.
Kill Gorad and pick up his tooth.=Mata a Gorad y coge su tooth.
Talk to Toban on the island east of Gu'Tanoth.=Habla con Toban en la isla al este de Gu'Tanoth.
Give Toban some dragon bones on the island east of Gu'Tanoth.=Entrega unos dragon bones a Toban en la isla al este de Gu'Tanoth.
Open the chest on the island east of Gu'Tanoth using Toban's Key.=Abre el cofre en la isla al este de Gu'Tanoth usando la Toban's Key.
Return to Og with his stolen gold north west of Yanille.=Vuelve con Og con su stolen gold al noroeste de Yanille.
Return to Grew with Gorad's teeth on the island west of Yanille.=Vuelve con Grew con los teeth de Gorad en la isla al oeste de Yanille.
Return to the Watchtower Wizard with the relic pieces.=Vuelve con el Watchtower Wizard con las relic pieces.
Talk to the Ogre Guard at the entrance of Gu'Tanoth and give them the ogre relic.=Habla con el Ogre Guard en la entrada de Gu'Tanoth y dale el ogre relic.
Steal a rock cake from Gu'Tanoth's market.=Roba un rock cake del mercado de Gu'Tanoth.
Talk to an Ogre Guard next to the battlement.=Habla con un Ogre Guard junto al battlement.
Attempt to cross the battlement again with a rock cake.=Intenta cruzar el battlement de nuevo con un rock cake.
Jump over the broken bridge.=Salta el puente roto.
Talk to the City Guard.=Habla con el City Guard.
Talk to the City Guard again.=Habla con el City Guard de nuevo.
Enter the skavid cave entrance in east Gu'Tanoth.=Entra en la entrada de la cueva skavid en el este de Gu'Tanoth.
Talk to the scared skavid.=Habla con el scared skavid.
Talk to four other skavids in their caves.=Habla con otros cuatro skavids en sus cuevas.
Talk to the skavid.=Habla con el skavid.
Go talk to the mad skavid.=Ve a hablar con el mad skavid.
Try to go through the gate to the south east cave of Gu'Tanoth. Give the guard a gold bar and go through.=Intenta pasar por la puerta a la cueva al sureste de Gu'Tanoth. Dale un gold bar al guardia y pasa.
Enter the mad skavid's cave.=Entra en la cueva del mad skavid.
Talk to the mad skavid.=Habla con el mad skavid.
Pick up 2 cave nightshade. You can world hop to get a second one.=Coge 2 cave nightshade. Puedes cambiar de mundo para conseguir una segunda.
Use a nightshade on an Enclave Guard in the Gu'Tanoth market.=Usa una nightshade en un Enclave Guard en el mercado de Gu'Tanoth.
Leave the mad skavid's cave.=Sal de la cueva del mad skavid.
Leave the enclave and return to the Watchtower Wizard.=Sal del enclave y vuelve con el Watchtower Wizard.
Return to the Watchtower Wizard.=Vuelve con el Watchtower Wizard.
Use some jangerberries on a guam potion (unf)=Usa unas jangerberries en una guam potion (unf)
Use a pestle and mortar on some bat bones.=Usa un pestle and mortar en unos bat bones.
Use the ground bat bones on the potion=Usa los ground bat bones en la potion
Return to the Watchtower Wizard with the potion.=Vuelve con el Watchtower Wizard con la potion.
Use a nightshade on an Enclave Guard in the Gu'Tanoth market to enter the enclave again.=Usa una nightshade en un Enclave Guard en el mercado de Gu'Tanoth para entrar en el enclave de nuevo.
Use the magic ogre potion on all the ogre shamans.=Usa la magic ogre potion en todos los ogre shamans.
Mine the Rock of Dalgorth in the enclave.=Mina la Rock of Dalgorth en el enclave.
Leave the enclave and return to the Watchtower Wizard with the crystals.=Sal del enclave y vuelve con el Watchtower Wizard con los crystals.
Return to the Watchtower Wizard with the crystals.=Vuelve con el Watchtower Wizard con los crystals.
Use the crystals on the pillars.=Usa los crystals en los pilares.
Pull the lever to finish the quest.=Tira de la palanca para terminar la misión.
Obtained during the quest=Se obtiene durante la misión
