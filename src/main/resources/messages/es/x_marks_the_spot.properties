# Spanish translations for X Marks the Spot.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Can be bought from the Lumbridge General Store.=Puedes comprarlo en la Lumbridge General Store.
Talk to Veos in The Sheared Ram pub in Lumbridge to start the quest.=Habla con Veos en The Sheared Ram pub en Lumbridge para empezar la misión.
Dig north of Bob's Brilliant Axes, on the west side of the plant against the wall of his house.=Cava al norte de Bob's Brilliant Axes, al lado oeste de la planta contra la pared de su casa.
Dig behind Lumbridge Castle, just outside the kitchen door.=Cava detrás de Lumbridge Castle, justo fuera de la puerta de la cocina.
Dig north-west of the Draynor Village jail, just by the wheat farm.=Cava al noroeste de la Draynor Village jail, junto a la wheat farm.
Dig just inside the pig pen in the Draynor Market.=Cava justo dentro del pig pen en el Draynor Market.
Talk to Veos directly south of the Rusty Anchor Inn in Port Sarim to finish the quest.=Habla con Veos justo al sur de Rusty Anchor Inn en Port Sarim para terminar la misión.
Dig just inside the pig pen in the Draynor Market to get the Ancient casket back.=Cava justo dentro del pig pen en el Draynor Market para recuperar el Ancient casket.
Speak to Veos=Habla con Veos
Solve the clue scroll=Resuelve el clue scroll
Bring the casket to Veos=Lleva el casket a Veos
