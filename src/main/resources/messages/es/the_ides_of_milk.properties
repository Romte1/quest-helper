# Spanish translations for The Ides of Milk.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
You can get another from Cassius=Puedes conseguir otro de Cassius
Speak to Cassius by the pond north-west of Lumbridge to start the quest.=Habla con Cassius junto al estanque al noroeste de Lumbridge para empezar la misión.
Speak to Gillie Groats at the cow field east of Lumbridge.=Habla con Gillie Groats en el campo de vacas al este de Lumbridge.
Speak to Seth Groats at his farmhouse east of the River Lum.=Habla con Seth Groats en su granja al este del River Lum.
Search the shelves in Seth's farmhouse for 'The groats principles'.=Busca en las estanterías de la granja de Seth 'The groats principles'.
Return to Cassius with the book.=Lleva el libro a Cassius.
Talk to Cassius.=Habla con Cassius.
Drink the milk sample near Cassius.=Bebe la milk sample cerca de Cassius.
Talk to Cassius after drinking the milk sample.=Habla con Cassius después de beber la milk sample.
Speak to Duke Horacio on the first floor of Lumbridge Castle.=Habla con Duke Horacio en el primer piso de Lumbridge Castle.
Speak to Gillie Groats at the cow field.=Habla con Gillie Groats en el campo de vacas.
Drink the milk sample near Gillie.=Bebe la milk sample cerca de Gillie.
Talk to Gillie Groats after drinking the milk sample.=Habla con Gillie Groats después de beber la milk sample.
Open the bull pen gate in the north-east corner of the cow field to fight the Bull (level 30).=Abre la puerta del corral del toro en la esquina noreste del campo de vacas para luchar contra el Bull (nivel 30).
Kill the Bull (level 30). Protect from Melee blocks his basic attacks (max hit 3). Dodge his ground slam ('snorts') and charge ('growls') by walking through him. Special attacks can hit over 15.=Mata al Bull (nivel 30). Protect from Melee bloquea sus ataques básicos (máx. 3). Esquiva su golpe de tierra ('snorts') y su embestida ('growls') caminando a través de él. Sus ataques especiales pueden superar los 15.
Speak to Gillie Groats after defeating the Bull.=Habla con Gillie Groats después de derrotar al Bull.
Return to Cassius to complete the quest. You can then speak to Gillie Groats for a cow bell amulet and magic lamp (1,000 XP combat/Prayer).=Regresa con Cassius para completar la misión. Después puedes hablar con Gillie Groats para obtener un cow bell amulet y una magic lamp (1,000 XP de combat/Prayer).
