# Spanish translations for Shield of Arrav - Black Arm Gang.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Talk to Reldo in the Varrock Castle library.=Habla con Reldo en la biblioteca del Varrock Castle.
Search the marked bookcase for a book, then read it.=Busca un libro en el librero marcado y léelo.
Talk to Reldo again.=Habla con Reldo de nuevo.
To start the quest as the Black Arm Gang, talk to Charlie the Tramp in south Varrock to start.=Para empezar la misión como Black Arm Gang, habla con Charlie the Tramp al sur de Varrock.
Talk to Katrine down the alley to the west.=Habla con Katrine en el callejón al oeste.
Get the weapon storeroom key from another player.  If you cannot trade, have them use the key on you to drop it at your feet.=Consigue la weapon storeroom key a otro jugador. Si no puedes intercambiar, pídele que use la key sobre ti para dejarla a tus pies.
Go up the ladder in south east Varrock to the Phoenix Weapon Storeroom.=Sube por la escalera al sureste de Varrock hasta el Phoenix Weapon Storeroom.
Kill the Weaponsmaster, or have someone else kill him.=Mata al Weaponsmaster, o pide a alguien más que lo mate.
Pick up TWO phoenix crossbows=Coge DOS phoenix crossbows
Go back down from the storeroom.=Baja de nuevo del storeroom.
Return to Katrine with the crossbows.=Regresa con Katrine llevando las crossbows.
Go up the stairs in the Black Arm Gang base.=Sube las escaleras en la base de la Black Arm Gang.
Search the cupboard for half of the Shield of Arrav.=Busca en el armario la mitad del Shield of Arrav.
Go back downstairs.=Baja de nuevo.
Trade one of your certificate halves for the other half with another player. If you cannot trade, use the certificate on them to drop it at their feet. They can do the same for you.=Intercambia una de tus certificate halves por la otra mitad con otro jugador. Si no puedes intercambiar, usa la certificate sobre él para dejarla a sus pies. Él puede hacer lo mismo por ti.
Use the two certificate halves together to create the certificate.=Combina las dos certificate halves para crear la certificate.
Talk to Curator Haig in the Varrock Museum.=Habla con Curator Haig en el Varrock Museum.
Talk to King Roald in Varrock Castle to finish the quest.=Habla con King Roald en el Varrock Castle para terminar la misión.
Start quest=Empezar la misión
Get the phoenix crossbows=Consigue las phoenix crossbows
Return the shield=Devuelve el escudo
Weaponsmaster (level 23), or a friend to kill him for you=Weaponsmaster (nivel 23), o un amigo que lo mate por ti
You can also do this quest by joining the Phoenix Gang, which instead requires you to kill Jonny the beard (level 2).=También puedes hacer esta misión uniéndote a la Phoenix Gang, que en su lugar requiere que mates a Jonny the beard (nivel 2).
Once you're accepted into one of the gangs, you CANNOT change gang.=Una vez que te acepten en una de las bandas, NO PUEDES cambiar de banda.
This quest requires you to swap items with another player who's in the other gang, so it's recommended to either find a friend to help you, or you can use the friend's chat 'OSRS SOA' and find someone to help there.=Esta misión requiere intercambiar objetos con otro jugador que esté en la otra banda, así que se recomienda encontrar un amigo que te ayude, o usar el friend's chat 'OSRS SOA' y buscar a alguien que te ayude allí.
