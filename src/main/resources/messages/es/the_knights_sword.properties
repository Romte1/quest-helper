# Spanish translations for The Knight's Sword.
# Key = the exact English string in the code; value = translation.
# Never translate quest names, game entity names (items, NPCs, locations) or dialog choices.
Purchasable from the grand exchange, or for ironmen: 10 cooking to cook one, or 32 cooking and a chef's hat to buy one from the Cooks' Guild.=Comprable en el grand exchange, o para ironmen: 10 de cooking para cocinar uno, o 32 de cooking y un chef's hat para comprar uno en la Cooks' Guild.
Talk to the Squire in Falador Castle's courtyard.=Habla con el Squire en el patio del Falador Castle.
Talk to Reldo in Varrock Castle's library.=Habla con Reldo en la biblioteca del Varrock Castle.
Talk to Thurgo south of Port Sarim and give him a redberry pie.=Habla con Thurgo al sur de Port Sarim y entrégale un redberry pie.
Talk to Thurgo again.=Habla con Thurgo de nuevo.
Climb up the east ladder in Falador Castle.=Sube la escalera de mano del este en Falador Castle.
Go up the staircase west of the ladder on the 1st floor.=Sube la escalera que está en el primer piso, al oeste de la escalera de mano.
Search the cupboard in the room south of the staircase. You'll need Sir Vyvin to be in the other room.=Busca en el cupboard de la habitación al sur de la escalera. Necesitarás que Sir Vyvin esté en la otra habitación.
Bring Thurgo the portrait.=Lleva el portrait a Thurgo.
Go down the ladder south of Port Sarim. Be prepared for ice giants and ice warriors to attack you.=Baja la escalera al sur de Port Sarim. Prepárate para que los ice giants y los ice warriors te ataquen.
Mine a blurite ore in the eastern cavern.=Mina un blurite ore en la caverna del este.
Return to Thurgo with a blurite ore and two iron bars.=Regresa con Thurgo con un blurite ore y dos iron bars.
Return to the Squire with the sword to finish the quest.=Regresa con el Squire con la espada para terminar la misión.
Able to survive attacks from Ice Warriors (level 57) and Ice Giants (level 53)=Capaz de sobrevivir a los ataques de los Ice Warriors (nivel 57) y los Ice Giants (nivel 53)
You can make progress towards the Falador Easy Diary task by mining an additional Blurite ore and smelting another Blurite bar, it will be required for smithing Blurite limbs.=Puedes avanzar en la tarea del Falador Easy Diary minando un Blurite ore adicional y fundiendo otra Blurite bar, será necesaria para forjar Blurite limbs.
The ability to smelt Blurite ore.=La habilidad de fundir Blurite ore.
The ability to smith Blurite bars.=La habilidad de forjar Blurite bars.
Starting off=Empezando
Finding an Imcando=Buscando a un Imcando
Find the portrait=Encuentra el portrait
Making the sword=Forjando la espada
Return the sword=Devuelve la espada
