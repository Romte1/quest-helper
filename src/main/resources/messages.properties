# Quest Helper - English messages (messages.properties)
#
# This file is optional for quests: the "English-as-key" pattern means the
# English text lives in the CODE - translationService.t("Get a bucket").
# If t() finds no entry anywhere it returns the input text itself (English),
# never an ugly internal key. Entries here are only needed as English
# fallbacks for UI label keys shared across languages.
#
# Format: everything before the first '=' is the key, the rest is the value.
# Blank lines and lines starting with '#' or '!' are ignored. Spaces in keys
# do NOT need escaping.
#
# Translation rules (see TranslationService javadoc):
#   - Quest names are never translated.
#   - Game entity names (items, NPCs, locations) stay in English.
#   - Dialog choices and requirement checks that match live game text are
#     never translated.
